<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Reflejos · Arcade Perdido</title>
<meta name="theme-color" content="#2b8a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=84fed7f189"></script>
<script src="common.js?v=90ef83b653"></script>
<script>
(function () {
  const { ri, rand, clamp, pick } = Arcade;
  const FAKES = [['#fab005', '🟡'], ['#1c7ed6', '🔵'], ['#7048e8', '🟣'], ['#fd7e14', '🟠']];

  function nextRound(g) {
    const s = g.s; s.phase = 'wait'; s.t = rand(1.2, 3.8); s.fakes = []; const L = g.lv;
    if (L >= 3) { const n = ri(0, Math.min(3, Math.floor(L / 3))); for (let i = 0; i < n; i++) s.fakes.push({ at: rand(0.4, s.t - 0.3), dur: rand(0.15, 0.35), f: pick(FAKES.slice(0, 1 + Math.floor(L / 4))) }); }
    s.clock = 0;
  }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Toca cuando se ponga roja', deco: ['🟥', '🟩', '⏱️', '⚡', '👆', '🟡'], font: 'wide', bg: ['#40c057', '#2b8a3e'],
    music: { mode: 'minor', bpm: 100, wave: 'sine', style: 'chill', root: 55 }, voice: { wave: 'sine', mul: 1.2, echo: 0.2 },
    en: { title: 'Reflexes', tag: 'Tap when it turns red', help: 'The screen is green: <b>wait</b>. When it turns <b>red</b> 🟥, tap as fast as you can. Tapping before it turns red, or on a different colour, costs a life. Each level is 5 rounds and your <b>average time</b> must beat the target. Later, other colours flash to trick you.', tvHelp: 'OK when it turns red.', dict: { 'Espera…': 'Wait…', '¡AHORA!': 'NOW!', '¡Demasiado pronto!': 'Too soon!', 'Objetivo: ': 'Target: ', 'Media: ': 'Average: ', 'Toca para empezar': 'Tap to start', 'Ronda ': 'Round ' } },
    tvHelp: 'OK cuando se ponga roja.',
    id: 'reflejos', title: 'Reflejos', emoji: '🟥', color: '#e03131', origin: 'Click when Red',
    help: 'La pantalla está verde: <b>espera</b>. Cuando se ponga <b>roja</b> 🟥, toca lo más rápido que puedas. Si tocas antes de tiempo o en otro color, pierdes una vida. Cada nivel son 5 rondas y tu <b>tiempo medio</b> debe bajar del objetivo. Más adelante aparecen otros colores para engañarte.',
    lives: 3, levels: 0, cap: 25,
    setup(g) { g.s = { phase: 'idle', times: [], round: 0, target: Math.round(clamp(520 - g.lv * 12, 300, 520)) }; },
    down(g) {
      const s = g.s;
      if (s.phase === 'idle' || s.phase === 'result') { if (s.times.length >= 5) return; nextRound(g); Arcade.sfx.tick(); return; }
      if (s.phase === 'wait') { s.phase = 'result'; s.last = null; g.message(Arcade.T('¡Demasiado pronto!', 'Too soon!'), 1); Arcade.sfx.bad(); g.die(); return; }
      if (s.phase === 'go') {
        const ms = Math.round((performance.now() - s.goAt)); s.times.push(ms); s.last = ms; s.phase = 'result'; Arcade.sfx.coin();
        g.addScore(Math.max(10, 600 - ms) * g.lv / 10 | 0, g.W / 2, g.H / 2 + 60);
        if (s.times.length >= 5) {
          const avg = s.times.reduce((a, b) => a + b, 0) / s.times.length; s.avg = Math.round(avg);
          if (avg <= s.target) { g.confetti(60); setTimeout(() => { if (g.state === 'play') g.win(avg <= s.target * 0.8 ? 3 : avg <= s.target * 0.9 ? 2 : 1); }, 900); }
          else { g.message(Arcade.T('Media: ', 'Average: ') + s.avg + ' ms', 1.3); setTimeout(() => { if (g.state === 'play' && g.die()) Arcade.current.def.setup(g); }, 1400); }
        }
      }
    },
    key(g, k, d) { if (d && k === ' ') this.down(g); },
    update(g, dt) {
      const s = g.s;
      if (s.phase === 'wait') { s.clock += dt; s.fake = s.fakes.find((f) => s.clock >= f.at && s.clock < f.at + f.dur); if (s.clock >= s.t) { s.phase = 'go'; s.goAt = performance.now(); Arcade.tone(880, 0.12, 'square', 0.08); } }
      else s.fake = null;
      if (s.phase === 'go' && performance.now() - s.goAt > 1500) { s.phase = 'result'; s.times.push(1500); s.last = 1500; }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      let col = '#2b8a3e', big = '', sub = '';
      if (s.phase === 'idle') { col = '#343a40'; big = '👆'; sub = 'Toca para empezar'; }
      else if (s.phase === 'wait') { col = s.fake ? s.fake.f[0] : '#2b8a3e'; big = s.fake ? s.fake.f[1] : '⏳'; sub = 'Espera…'; }
      else if (s.phase === 'go') { col = '#e03131'; big = '⚡'; sub = '¡AHORA!'; }
      else { col = '#1864ab'; big = s.last ? '⏱️' : '❌'; sub = s.last ? s.last + ' ms' : ''; }
      ctx.fillStyle = col; ctx.fillRect(0, 0, W, H);
      Arcade.emoji(ctx, big, W / 2, H * 0.42, Math.min(W, H) * 0.25);
      Arcade.txt(ctx, sub, W / 2, H * 0.6, Math.min(48, W / 8), '#fff', 'center', 900);
      if (s.phase === 'result' && s.times.length < 5) Arcade.txt(ctx, 'Toca para empezar', W / 2, H * 0.68, 16, 'rgba(255,255,255,.8)', 'center', 800);
      Arcade.txt(ctx, 'Ronda ' + Math.min(5, s.times.length + (s.phase === 'wait' || s.phase === 'go' ? 1 : 0)) + '/5   ·   ' + 'Objetivo: ' + s.target + ' ms', W / 2, g.top + 22, 15, '#fff', 'center', 900);
      for (let i = 0; i < 5; i++) { const t = s.times[i]; ctx.fillStyle = t == null ? 'rgba(255,255,255,.25)' : t <= s.target ? '#69db7c' : '#ffa8a8'; Arcade.rr(ctx, W / 2 - 110 + i * 46, H - 70, 40, 30, 8); ctx.fill(); if (t != null) Arcade.txt(ctx, String(t), W / 2 - 90 + i * 46, H - 55, 11, '#212529', 'center', 900); }
    },
  });
})();
</script>
</body>
</html>
