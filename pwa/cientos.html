<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cientos · Arcade Perdido</title>
<meta name="theme-color" content="#202233">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=84fed7f189"></script>
<script src="common.js?v=57054bbc85"></script>
<script>
(function () {
  const { rand, clamp, pick } = Arcade;
  const FACES = ['😶', '🙂', '😊', '😄', '😁', '🤩'];
  const COLS = ['#ff6b6b', '#4dabf7', '#ffd43b', '#69db7c', '#da77f2', '#ff922b', '#3bc9db'];

  function area(g) { return { x0: 8, y0: g.top + 44, x1: g.W - 8, y1: g.bot - 8 }; }
  function build(g) {
    const s = g.s, L = g.lv, A = area(g), u = s.u;
    s.balls = []; s.spikes = [];
    const n = clamp(3 + Math.floor(L / 2), 3, 10), sp = (40 + L * 6) * u;
    const add = (arr, o) => {
      for (let t = 0; t < 200; t++) {
        const r = o.r, x = rand(A.x0 + r, A.x1 - r), y = rand(A.y0 + r, A.y1 - r);
        if ([...s.balls, ...s.spikes].every((b) => Math.hypot(b.x - x, b.y - y) > b.r + r + 10)) { const a = rand(0, 6.28); arr.push({ ...o, x, y, vx: Math.cos(a) * sp * rand(0.6, 1.2), vy: Math.sin(a) * sp * rand(0.6, 1.2) }); return; }
      }
    };
    for (let i = 0; i < n; i++) add(s.balls, { r: 16 * u, v: 0, c: COLS[i % COLS.length], pop: 0 });
    const ns = L >= 4 ? Math.min(Math.floor((L - 2) / 2), 4) : 0;
    for (let i = 0; i < ns; i++) add(s.spikes, { r: 15 * u, rot: 0 });
    s.hold = null; s.total = 0;
  }
  const total = (s) => s.balls.reduce((a, b) => a + b.v, 0);
  function fail(g, b) {
    const s = g.s; s.hold = null; g.shake(0.25, 6); Arcade.sfx.hit(); g.flash('#ff6b6b', 0.15);
    g.burst(b.x, b.y, { n: 14, color: b.c, speed: 200, size: 4 });
    b.v = 0; b.r = 16 * s.u; b.pop = 1;
    g.message(Arcade.T('¡Choque!', 'Crash!'), 0.9);
    g.die();
  }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tv: false, tag: 'Haz crecer los círculos hasta 100', deco: ['💯', '🔴', '🔵', '🟡', '🟢', '🟣'], font: 'round', bg: ['#33365a', '#202233'],
    music: { mode: 'lydian', bpm: 92, wave: 'sine', style: 'chill', root: 60 }, voice: { wave: 'sine', mul: 1.3, echo: 0.4 },
    en: { title: 'Hundreds', tag: 'Grow the circles up to 100', help: '<b>Hold</b> a circle to make it grow: its number goes up. If a circle <b>touches anything while growing</b> it crashes, goes back to 0 and you lose a life. When it is not growing, it just bounces. Add up <b>100</b> between all of them to finish the level. Later the circles speed up and spiky mines 🌵 appear.', dict: { '¡Choque!': 'Crash!', '¡Cien!': 'A hundred!' } },
    id: 'cientos', title: 'Cientos', emoji: '💯', color: '#ff6b6b', origin: 'Hundreds (Semi Secret, 2013)',
    help: '<b>Mantén pulsado</b> un círculo para que crezca: su número sube. Si un círculo <b>toca algo mientras crece</b>, choca, vuelve a 0 y pierdes una vida. Cuando no crece, solo rebota. Suma <b>100</b> entre todos para completar el nivel. Más adelante los círculos van más rápido y aparecen minas con pinchos 🌵.',
    lives: 3, levels: 0, cap: 20,
    demo(g) {
      const s = g.s; if (s.done || s.hold) return { wait: 0.3 };
      const A = area(g), all = [...s.balls, ...s.spikes]; let best = null;
      for (const b of s.balls) { let gap = Math.min(b.x - b.r - A.x0, A.x1 - b.x - b.r, b.y - b.r - A.y0, A.y1 - b.y - b.r);
        for (const o of all) if (o !== b) gap = Math.min(gap, Math.hypot(o.x - b.x, o.y - b.y) - o.r - b.r);
        if (!best || gap > best.gap) best = { gap, b }; }
      if (!best || best.gap < 14) return { wait: 0.25 };
      const dur = Math.max(0.2, Math.min(1.4, (best.gap - 10) / (60 * s.u)));
      return { hold: [best.b.x, best.b.y], dur, say: Arcade.T('Mantén un círculo para que crezca… sin que toque nada', 'Hold a circle to grow it… without touching anything') };
    },
    setup(g) { g.s = { u: clamp(Math.min(g.W, g.bot - g.top) / 420, 0.7, 1.6) }; build(g); },
    layout(g) { if (g.s.balls) { const A = area(g); for (const b of [...g.s.balls, ...g.s.spikes]) { b.x = clamp(b.x, A.x0 + b.r, A.x1 - b.r); b.y = clamp(b.y, A.y0 + b.r, A.y1 - b.r); } } },
    down(g, p) {
      const s = g.s; if (s.done) return;
      let best = null, bd = 1e9;
      for (const b of s.balls) { const d = Math.hypot(b.x - p.x, b.y - p.y) - b.r; if (d < 18 && d < bd) { bd = d; best = b; } }
      if (best) { s.hold = best; Arcade.tone(400, 0.05, 'sine', 0.06); }
    },
    up(g) { g.s.hold = null; },
    update(g, dt) {
      const s = g.s, A = area(g), all = [...s.balls, ...s.spikes];
      const h = s.hold;
      if (h && !s.done) {
        h.r += dt * 34 * s.u; const nv = Math.floor((h.r - 16 * s.u) / (2.2 * s.u));
        if (nv > h.v) { h.v = nv; if (h.v % 2 === 0) Arcade.tone(300 + total(s) * 6, 0.04, 'sine', 0.04); }
        h.vx *= Math.pow(0.2, dt); h.vy *= Math.pow(0.2, dt);
      }
      for (const b of all) {
        b.x += b.vx * dt; b.y += b.vy * dt; if (b.rot != null) b.rot += dt * 2; b.pop = Math.max(0, (b.pop || 0) - dt * 3);
        if (b.x - b.r < A.x0) { b.x = A.x0 + b.r; b.vx = Math.abs(b.vx); if (b === h) return fail(g, b); }
        if (b.x + b.r > A.x1) { b.x = A.x1 - b.r; b.vx = -Math.abs(b.vx); if (b === h) return fail(g, b); }
        if (b.y - b.r < A.y0) { b.y = A.y0 + b.r; b.vy = Math.abs(b.vy); if (b === h) return fail(g, b); }
        if (b.y + b.r > A.y1) { b.y = A.y1 - b.r; b.vy = -Math.abs(b.vy); if (b === h) return fail(g, b); }
      }
      for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
        const a = all[i], b = all[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
        if (d >= m || d === 0) continue;
        if (a === h || b === h) return fail(g, h);
        const nx = dx / d, ny = dy / d, ov = (m - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        const ma = a.r * a.r, mb = b.r * b.r, rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) { const imp = -2 * rv / (1 / ma + 1 / mb); a.vx -= imp * nx / ma; a.vy -= imp * ny / ma; b.vx += imp * nx / mb; b.vy += imp * ny / mb; }
      }
      // velocidad mínima para que nada se quede quieto
      const minV = (30 + g.lv * 5) * s.u;
      for (const b of all) { if (b === h) continue; const v = Math.hypot(b.vx, b.vy); if (v < minV) { const k = v > 1 ? minV / v : 0; if (k) { b.vx *= 1 + (k - 1) * dt * 2; b.vy *= 1 + (k - 1) * dt * 2; } else { b.vx = minV; } } if (v > minV * 4) { b.vx *= 0.98; b.vy *= 0.98; } }
      const t = total(s);
      if (t >= 100 && !s.done) {
        s.done = true; s.hold = null; Arcade.sfx.win(); g.confetti(60); g.message(Arcade.T('¡Cien!', 'A hundred!'), 1);
        const big = Math.max(...s.balls.map((b) => b.v));
        g.addScore((100 + (t - 100) * 5) * g.lv, g.W / 2, g.H / 2);
        setTimeout(() => { if (g.state === 'play') g.win(g.lives >= 3 ? 3 : g.lives === 2 ? 2 : 1); }, 900);
      }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      const t = s.balls ? total(s) : 0;
      ctx.fillStyle = s.hold ? '#26283d' : '#202233'; ctx.fillRect(0, 0, W, H);
      if (!s.balls) return;
      const A = area(g);
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2; Arcade.rr(ctx, A.x0, A.y0, A.x1 - A.x0, A.y1 - A.y0, 10); ctx.stroke();
      // número total de fondo
      ctx.save(); ctx.globalAlpha = 0.1; Arcade.txt(ctx, String(t), W / 2, (A.y0 + A.y1) / 2, Math.min(W, A.y1 - A.y0) * 0.5, '#fff', 'center', 900); ctx.restore();
      for (const sp of s.spikes) {
        ctx.fillStyle = '#495057'; ctx.beginPath();
        for (let k = 0; k < 16; k++) { const a = sp.rot + k * Math.PI / 8, r = k % 2 ? sp.r * 0.7 : sp.r * 1.15; ctx.lineTo(sp.x + Math.cos(a) * r, sp.y + Math.sin(a) * r); }
        ctx.fill(); Arcade.emoji(ctx, '🌵', sp.x, sp.y, sp.r * 1.1);
      }
      for (const b of s.balls) {
        const grow = b === s.hold, r = b.r * (1 + b.pop * 0.2);
        ctx.fillStyle = b.v ? b.c : '#495057';
        if (grow) { ctx.shadowColor = b.c; ctx.shadowBlur = 20; }
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();
        if (r > 26 * s.u) Arcade.emoji(ctx, FACES[clamp(Math.floor(b.v / 8), 0, FACES.length - 1)], b.x, b.y - r * 0.28, Math.min(r * 0.6, 60));
        Arcade.txt(ctx, String(b.v), b.x, b.y + (r > 26 * s.u ? r * 0.3 : 0), clamp(r * 0.6, 12, 60), '#fff', 'center', 900);
      }
      // barra de progreso
      const bw = Math.min(W - 40, 400), bx = (W - bw) / 2, by = g.top + 18;
      ctx.fillStyle = 'rgba(255,255,255,.12)'; Arcade.rr(ctx, bx, by, bw, 12, 6); ctx.fill();
      const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0); gr.addColorStop(0, '#ff6b6b'); gr.addColorStop(0.5, '#ffd43b'); gr.addColorStop(1, '#69db7c');
      ctx.fillStyle = gr; Arcade.rr(ctx, bx, by, bw * clamp(t / 100, 0, 1), 12, 6); ctx.fill();
      Arcade.txt(ctx, t + ' / 100', W / 2, by + 26, 13, '#dee2e6', 'center', 800);
    },
  });
})();
</script>
</body>
</html>
