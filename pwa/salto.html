<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Salto · Arcade Perdido</title>
<meta name="theme-color" content="#1a0b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css">
</head>
<body class="game">
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { ri, rand, clamp, pick } = Arcade;
  const FACES = ['😎', '😆', '🤖', '👾', '😺', '🐸'];
  const GRAV = 50, JUMP = 15, PAD = 21;

  function genLevel(L, speed) {
    const obs = [], len = clamp(70 + L * 10, 70, 240);
    let x = 12;
    const pats = [
      () => { obs.push({ t: 'spike', x, y: 0 }); return 1; },
      () => { obs.push({ t: 'spike', x, y: 0 }, { t: 'spike', x: x + 1, y: 0 }); return 2; },
      () => { obs.push({ t: 'block', x, y: 0, w: 1, h: 1 }); return 1; },
      () => { obs.push({ t: 'block', x, y: 0, w: 3, h: 1 }, { t: 'coin', x: x + 1.5, y: 2.5 }); return 3; },
      () => { obs.push({ t: 'block', x, y: 0, w: 2, h: 1 }, { t: 'block', x: x + 3, y: 0, w: 2, h: 2 }); return 5; },
    ];
    if (L >= 2) pats.push(() => { obs.push({ t: 'spike', x, y: 0 }, { t: 'spike', x: x + 1, y: 0 }, { t: 'spike', x: x + 2, y: 0 }); return 3; });
    if (L >= 2) pats.push(() => { obs.push({ t: 'block', x, y: 0, w: 5, h: 1 }, { t: 'spike', x: x + 3, y: 1 }); return 5; });
    if (L >= 3) pats.push(() => { obs.push({ t: 'pad', x, y: 0 }); for (let k = 1; k <= 5; k++) obs.push({ t: 'spike', x: x + k, y: 0 }); obs.push({ t: 'coin', x: x + 3, y: 4 }); return 6; });
    if (L >= 4) pats.push(() => { obs.push({ t: 'block', x, y: 0, w: 2, h: 1 }, { t: 'block', x: x + 2, y: 0, w: 2, h: 2 }, { t: 'block', x: x + 4, y: 0, w: 3, h: 3 }, { t: 'spike', x: x + 7, y: 0 }, { t: 'spike', x: x + 8, y: 0 }); return 9; });
    if (L >= 5) pats.push(() => { obs.push({ t: 'block', x, y: 0.95, w: 3, h: 0.45 }, { t: 'spike', x: x + 1, y: 0 }, { t: 'spike', x: x + 2, y: 0 }, { t: 'spike', x: x + 3, y: 0 }, { t: 'spike', x: x + 4, y: 0 }); return 5; });
    if (L >= 6) pats.push(() => { obs.push({ t: 'spike', x, y: 0 }, { t: 'block', x: x + 3.5, y: 0, w: 1, h: 1 }, { t: 'spike', x: x + 4.5, y: 0 }); return 6; });
    const gapMin = speed * 0.64, gapMax = speed * Math.max(0.8, 1.3 - L * 0.03);
    while (x < len) {
      const used = pick(pats)();
      if (Math.random() < 0.3) obs.push({ t: 'coin', x: x + used + 1, y: rand(1, 2.5) });
      x += used + rand(gapMin, gapMax);
    }
    return { obs, len: x + 6 };
  }
  function geo(g) { const s = g.s; s.T = clamp((g.bot - g.top) / 9, 26, 56); s.gy = g.bot - (g.bot - g.top) * 0.22; s.px = g.W * 0.25; }
  function respawn(g) {
    const s = g.s; s.x = 0; s.y = 0; s.vy = 0; s.rot = 0; s.ground = true; s.dead = 0; s.coinsTaken = new Set(); s.trail = [];
  }
  function die(g) {
    const s = g.s; if (s.dead) return;
    s.dead = 1; s.deaths++; s.best = Math.max(s.best, s.x / s.len);
    const sx = s.px, sy = s.gy - (s.y + 0.5) * s.T;
    g.burst(sx, sy, { n: 22, color: s.col, speed: 260, size: 5 }); g.shake(0.3, 8); Arcade.sfx.hit();
    g.message(Math.floor(s.x / s.len * 100) + '%', 0.8);
    setTimeout(() => { if (g.state === 'play' && g.die()) respawn(g); }, 800);
  }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Salta al ritmo', deco: ['🟪', '🔺', '⬛', '⭐', '🏁', '⚡'], font: 'impact', bg: ['#3d1a6e', '#1a0b2e'],
    music: { mode: 'minor', bpm: 140, wave: 'square', style: 'arcade', root: 57 }, voice: { wave: 'square', mul: 1, echo: 0.2 },
    ambient: { e: ['✨'], n: 10, vy: 0, vx: -60, sway: 0, twinkle: 1, alpha: 0.3, size: [6, 12] },
    en: { title: 'Leap', tag: 'Jump to the beat', help: 'The cube runs on its own. <b>Tap</b> to jump, or <b>hold</b> to keep jumping every time it lands. Avoid the <b>spikes</b> 🔺, you can land on top of the blocks but not crash into their side. Yellow <b>pads</b> launch you higher. Reach the 🏁 to finish the level; if you crash, you start the level again and lose a life.', tvHelp: 'OK to jump (hold it to keep jumping).', dict: { 'Intento ': 'Attempt ', 'Mejor: ': 'Best: ' } },
    tvHelp: 'OK para saltar (mantenlo para seguir saltando).',
    id: 'salto', title: 'Salto', emoji: '🟪', color: '#b197fc', origin: 'Geometry Dash (RobTop)',
    help: 'El cubo corre solo. <b>Toca</b> para saltar o <b>mantén</b> para saltar cada vez que aterrice. Esquiva los <b>pinchos</b> 🔺; puedes aterrizar encima de los bloques pero no chocar de lado. Las <b>plataformas amarillas</b> te lanzan más alto. Llega a la 🏁 para pasar de nivel; si chocas, repites el nivel y pierdes una vida.',
    lives: 3, levels: 0, cap: 20,
    setup(g) {
      const speed = clamp(7 + g.lv * 0.12, 7, 9.5), lv = genLevel(g.lv, speed);
      g.s = { obs: lv.obs, len: lv.len, deaths: 0, best: 0, hue: (g.level * 47) % 360, face: FACES[(g.level - 1) % FACES.length], coins: 0 };
      g.s.col = `hsl(${g.s.hue},90%,60%)`; g.s.speed = speed;
      geo(g); respawn(g);
    },
    layout(g) { if (g.s.obs) geo(g); },
    down(g) { g.s.hold = true; },
    up(g) { g.s.hold = false; },
    key(g, k, d) { if (k === ' ' || k === 'ArrowUp') g.s.hold = d; },
    update(g, dt) {
      const s = g.s; if (s.dead || s.won) return;
      const steps = 4, h = dt / steps;
      for (let i = 0; i < steps; i++) {
        if (s.hold && s.ground) { s.vy = JUMP; s.ground = false; Arcade.tone(500, 0.05, 'square', 0.04, 200); }
        const px0 = s.x, py0 = s.y;
        s.x += s.speed * h; s.vy -= GRAV * h; s.y += s.vy * h;
        let onGround = false;
        if (s.y <= 0) { s.y = 0; s.vy = 0; onGround = true; }
        const P = { x0: s.x + 0.08, x1: s.x + 0.92, y0: s.y, y1: s.y + 0.84 };
        for (const o of s.obs) {
          if (o.x > s.x + 2 || o.x + (o.w || 1) < s.x - 1) continue;
          if (o.t === 'block') {
            if (P.x1 > o.x && P.x0 < o.x + o.w && P.y1 > o.y && P.y0 < o.y + o.h) {
              if (py0 >= o.y + o.h - 0.25 && s.vy <= 0) { s.y = o.y + o.h; s.vy = 0; onGround = true; }
              else if (s.vy > 0 && py0 + 0.84 <= o.y + 0.2) { s.y = o.y - 0.84; s.vy = 0; }
              else return die(g);
            }
          } else if (o.t === 'spike') {
            if (P.x1 > o.x + 0.3 && P.x0 < o.x + 0.7 && P.y0 < o.y + 0.55 && P.y1 > o.y) return die(g);
          } else if (o.t === 'pad') {
            if (P.x1 > o.x && P.x0 < o.x + 1 && P.y0 < o.y + 0.3) { s.vy = PAD; s.ground = false; onGround = false; Arcade.sfx.up(); g.ring(s.px + 0.5 * s.T, s.gy, '#ffd43b', s.T); }
          } else if (o.t === 'coin' && !s.coinsTaken.has(o)) {
            if (Math.abs(o.x - (s.x + 0.5)) < 0.7 && Math.abs(o.y - (s.y + 0.45)) < 0.8) { s.coinsTaken.add(o); s.coins++; Arcade.sfx.coin(); g.addScore(25 * g.lv, s.px + 0.5 * s.T, s.gy - (o.y + 1) * s.T); }
          }
        }
        // ¿sigue apoyado sobre un bloque?
        if (!onGround && s.vy <= 0 && s.ground) {
          const sup = s.obs.some((o) => o.t === 'block' && P.x1 > o.x && P.x0 < o.x + o.w && Math.abs(s.y - (o.y + o.h)) < 0.02);
          if (sup) onGround = true;
        }
        s.ground = onGround;
      }
      if (s.ground) s.rot = Math.round(s.rot / (Math.PI / 2)) * (Math.PI / 2); else s.rot += dt * 7.5;
      s.trail.push(s.y); if (s.trail.length > 10) s.trail.shift();
      if (Math.floor(s.x) % 10 === 0 && Math.floor(s.x) !== s.lastScore) { s.lastScore = Math.floor(s.x); g.addScore(g.lv); }
      if (s.x >= s.len) {
        s.won = true; Arcade.sfx.win(); g.confetti(80); g.flash('#fff', 0.2);
        g.addScore(300 * g.lv, g.W / 2, g.H / 2);
        setTimeout(() => { if (g.state === 'play') g.win(s.deaths === 0 ? 3 : s.deaths === 1 ? 2 : 1); }, 900);
      }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      if (!s.obs) return;
      const hue = s.hue, T = s.T, cam = s.x * T - s.px;
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, `hsl(${hue},60%,22%)`); bg.addColorStop(1, `hsl(${(hue + 30) % 360},70%,10%)`);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      // cuadrados de fondo en paralaje
      ctx.strokeStyle = `hsla(${hue},80%,70%,.12)`; ctx.lineWidth = 2;
      for (let i = 0; i < 12; i++) { const sz = 40 + (i * 37) % 70, x = ((i * 157 - cam * 0.3) % (W + 200) + W + 200) % (W + 200) - 100, y = g.top + (i * 89) % Math.max(50, s.gy - g.top - 80); ctx.strokeRect(x, y, sz, sz); }
      // suelo
      const gr = ctx.createLinearGradient(0, s.gy, 0, H); gr.addColorStop(0, `hsl(${hue},70%,35%)`); gr.addColorStop(1, `hsl(${hue},70%,12%)`);
      ctx.fillStyle = gr; ctx.fillRect(0, s.gy, W, H - s.gy);
      ctx.strokeStyle = `hsl(${hue},90%,75%)`; ctx.lineWidth = 3; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(0, s.gy); ctx.lineTo(W, s.gy); ctx.stroke(); ctx.shadowBlur = 0;
      ctx.strokeStyle = `hsla(${hue},80%,70%,.2)`; ctx.lineWidth = 1;
      for (let x = -((cam) % T); x < W; x += T) { ctx.beginPath(); ctx.moveTo(x, s.gy); ctx.lineTo(x, H); ctx.stroke(); }
      const X = (tx) => tx * T - cam, Y = (ty) => s.gy - ty * T;
      for (const o of s.obs) {
        const x = X(o.x); if (x > W + 3 * T || x + (o.w || 1) * T < -T) continue;
        if (o.t === 'block') {
          ctx.fillStyle = `hsl(${(hue + 180) % 360},40%,14%)`; ctx.fillRect(x, Y(o.y + o.h), o.w * T, o.h * T);
          ctx.strokeStyle = `hsl(${(hue + 180) % 360},90%,70%)`; ctx.lineWidth = 2; ctx.strokeRect(x + 1, Y(o.y + o.h) + 1, o.w * T - 2, o.h * T - 2);
        } else if (o.t === 'spike') {
          ctx.fillStyle = '#111'; ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x + 2, Y(o.y)); ctx.lineTo(x + T / 2, Y(o.y + 0.9)); ctx.lineTo(x + T - 2, Y(o.y)); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else if (o.t === 'pad') {
          ctx.fillStyle = '#ffd43b'; ctx.shadowColor = '#ffd43b'; ctx.shadowBlur = 14; ctx.beginPath(); ctx.ellipse(x + T / 2, Y(o.y) - 3, T * 0.42, 5, 0, Math.PI, 0); ctx.fill(); ctx.shadowBlur = 0;
        } else if (o.t === 'coin' && !s.coinsTaken.has(o)) {
          Arcade.emoji(ctx, '⭐', X(o.x), Y(o.y) + Math.sin(g.rt * 4 + o.x) * 4, T * 0.6, { sx: Math.abs(Math.cos(g.rt * 3 + o.x)) * 0.8 + 0.2 });
        }
      }
      Arcade.emoji(ctx, '🏁', X(s.len), s.gy - T * 0.8, T * 1.6);
      // jugador
      if (!s.dead) {
        s.trail.forEach((ty, i) => { ctx.fillStyle = `hsla(${hue},90%,65%,${i / s.trail.length * 0.3})`; const sz = T * 0.84 * (i / s.trail.length); ctx.fillRect(s.px - (s.trail.length - i) * T * 0.18 + (T * 0.84 - sz) / 2, Y(ty) - T * 0.84 + (T * 0.84 - sz) / 2, sz, sz); });
        const cx = s.px + T * 0.5, cy = Y(s.y) - T * 0.42, sz = T * 0.84;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(s.rot);
        ctx.fillStyle = s.col; ctx.shadowColor = s.col; ctx.shadowBlur = 16; ctx.fillRect(-sz / 2, -sz / 2, sz, sz); ctx.shadowBlur = 0;
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-sz / 2 + 2, -sz / 2 + 2, sz - 4, sz - 4);
        ctx.restore();
        Arcade.emoji(ctx, s.face, cx, cy, sz * 0.7, { rot: s.rot });
      }
      // progreso
      const bw = Math.min(W - 60, 360), bx = (W - bw) / 2, by = g.top + 14, pr = clamp(s.x / s.len, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,.15)'; Arcade.rr(ctx, bx, by, bw, 10, 5); ctx.fill();
      ctx.fillStyle = s.col; Arcade.rr(ctx, bx, by, bw * pr, 10, 5); ctx.fill();
      if (s.best > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(bx + bw * s.best - 1, by - 3, 2, 16); }
      Arcade.txt(ctx, Math.floor(pr * 100) + '%   ·   ' + 'Intento ' + (s.deaths + 1), W / 2, by + 26, 13, '#e5dbff', 'center', 800);
    },
  });
})();
</script>
</body>
</html>
