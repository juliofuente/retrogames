<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    decks: 2,
    tab: {"build":"alt","move":"one","empty":"any"},
    supermove: true,
    planHint: true, demoBudget: 1500,
    piles: (lv) => P.mk([['found', 8], ['cell', 6 + (lv < 6 ? 1 : 0)], ['tab', 10]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"even":true}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, {}),
    status: P.autoStatus,
    felt: ["#c2255c","#5c0f2c"], back: ["#5f3dc4","#2b1580"], backEmoji: '🗽',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Carta libre con dos barajas', deco: ["🃏","🗽","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#c2255c","#5c0f2c"],
    music: { mode: 'lydian', bpm: 84, wave: 'sine', style: 'chill', root: 58 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Double FreeCell', tag: 'FreeCell with two decks', help: 'FreeCell with two decks: ten columns, six cells and eight foundations. Played with <b>two decks</b>. Build the <b>8 foundations</b> from A to K, one per suit. On the table, a card goes on another <b>one rank higher</b> in the <b>other colour</b>. Move <b>one card at a time</b>, although you can shift several in a row if you have free spaces to help. Any card can go into an empty space. You have <b>6 cells</b>, each holding one card. In the first levels you get one extra cell. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'cartalibredoble', title: 'Carta libre doble', emoji: '🗽', color: '#f783ac', origin: 'Double FreeCell (Thomas Warfield)',
    help: 'Carta libre con dos barajas: diez columnas, seis celdas y ocho bases. Se juega con <b>dos barajas</b>. Completa las <b>8 bases</b> del A a la K, una por palo. En la mesa, una carta va sobre otra de <b>un número más</b> y de <b>color distinto</b>. Se mueve <b>una carta cada vez</b>, aunque puedes pasar varias seguidas si tienes huecos libres para ayudarte. Cualquier carta puede ir a un hueco vacío. Tienes <b>6 celdas</b> para guardar una carta en cada una. En los primeros niveles tienes una celda más. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
</body>
</html>
