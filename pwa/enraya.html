<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>En raya · Arcade Perdido</title>
<meta name="theme-color" content="#f1e3c6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">

</head>
<body class="game">
<script src="config.js?v=84fed7f189"></script>
<script src="common.js?v=98a53d21cb"></script>
<script>
(function () {
  const { ri, rand, clamp, pick } = Arcade;
  const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
  const PAIRS = [['❌', '⭕'], ['🐱', '🐶'], ['🌞', '🌙'], ['🍎', '🍐'], ['🔥', '💧']];

  function cfg(L) { if (L === 1) return [3, 3, 0.45]; if (L === 2) return [3, 3, 0.15]; if (L === 3) return [5, 4, 0.35]; if (L === 4) return [6, 4, 0.2]; return [clamp(7 + Math.floor((L - 5) / 2), 7, 13), 5, clamp(0.35 - (L - 5) * 0.03, 0, 0.35)]; }
  function geo(g) { const s = g.s, Ha = g.bot - g.top - 80; s.cs = Math.min((g.W - 20) / s.n, Ha / s.n, 110); s.ox = (g.W - s.cs * s.n) / 2; s.oy = g.top + 70 + (Ha - s.cs * s.n) / 2; }
  const at = (s, x, y) => (x >= 0 && y >= 0 && x < s.n && y < s.n ? s.b[y * s.n + x] : -1);
  function line(s, x, y, who) {
    for (const [dx, dy] of DIRS) {
      const cells = [[x, y]];
      for (let k = 1; at(s, x + dx * k, y + dy * k) === who; k++) cells.push([x + dx * k, y + dy * k]);
      for (let k = 1; at(s, x - dx * k, y - dy * k) === who; k++) cells.push([x - dx * k, y - dy * k]);
      if (cells.length >= s.k) return cells;
    }
    return null;
  }
  function evalCell(s, x, y, who) {
    let sc = 0;
    for (const [dx, dy] of DIRS) {
      let n = 1, open = 0, k;
      for (k = 1; at(s, x + dx * k, y + dy * k) === who; k++) n++; if (at(s, x + dx * k, y + dy * k) === 0) open++;
      for (k = 1; at(s, x - dx * k, y - dy * k) === who; k++) n++; if (at(s, x - dx * k, y - dy * k) === 0) open++;
      const need = s.k;
      if (n >= need) sc += 1e6; else if (n === need - 1) sc += open === 2 ? 5e4 : open === 1 ? 3e3 : 0; else if (n === need - 2) sc += open === 2 ? 2e3 : open === 1 ? 150 : 0; else if (n === need - 3) sc += open === 2 ? 120 : open ? 12 : 0; else sc += open;
    }
    return sc;
  }
  function minimax(s, who, depth) {
    // tablero 3x3: búsqueda completa
    let best = who === 2 ? -9 : 9, mv = -1;
    for (let i = 0; i < 9; i++) if (!s.b[i]) {
      s.b[i] = who; const x = i % 3, y = (i / 3) | 0;
      let v; if (line(s, x, y, who)) v = who === 2 ? 10 - depth : depth - 10; else if (s.b.every(Boolean)) v = 0; else v = minimax(s, 3 - who, depth + 1)[0];
      s.b[i] = 0;
      if ((who === 2 && v > best) || (who === 1 && v < best)) { best = v; mv = i; }
    }
    return [best, mv];
  }
  function aiMove(g) {
    const s = g.s;
    if (Math.random() < s.noise) { const empt = []; s.b.forEach((v, i) => { if (!v) { const x = i % s.n, y = (i / s.n) | 0; if (s.n === 3 || near(s, x, y)) empt.push(i); } }); if (empt.length) return pick(empt); }
    if (s.n === 3) return minimax(s, 2, 0)[1];
    let best = -1, bs = -1;
    for (let i = 0; i < s.b.length; i++) if (!s.b[i]) {
      const x = i % s.n, y = (i / s.n) | 0; if (!near(s, x, y)) continue;
      const v = evalCell(s, x, y, 2) * 1.15 + evalCell(s, x, y, 1) + rand(0, 3);
      if (v > bs) { bs = v; best = i; }
    }
    return best >= 0 ? best : Math.floor(s.b.length / 2);
  }
  function near(s, x, y) { for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (at(s, x + dx, y + dy) > 0) return true; return s.b.every((v) => !v); }
  function place(g, i, who) {
    const s = g.s; s.b[i] = who; s.pop[i] = 1; s.last = i;
    Arcade.tone(who === 1 ? 520 : 330, 0.07, 'triangle', 0.07);
    const x = i % s.n, y = (i / s.n) | 0, w = line(s, x, y, who);
    if (w) {
      s.done = true; s.winLine = w;
      if (who === 1) { g.addScore(200 * g.lv, g.W / 2, g.H / 2); g.confetti(60); setTimeout(() => { if (g.state === 'play') g.win(s.moves <= s.k + 2 ? 3 : s.moves <= s.k * 2 + 2 ? 2 : 1); }, 1000); }
      else { g.message(Arcade.T('Gana la máquina', 'The machine wins'), 1.3); setTimeout(() => { if (g.state === 'play' && g.die()) Arcade.current.def.setup(g); }, 1500); }
      return true;
    }
    if (s.b.every(Boolean)) { s.done = true; g.message(Arcade.T('Empate: otra vez', 'Draw: again'), 1.2); setTimeout(() => { if (g.state === 'play') Arcade.current.def.setup(g); }, 1400); return true; }
    return false;
  }
  function playerAt(g, i) {
    const s = g.s; if (s.done || s.turn !== 1 || s.b[i]) return;
    s.moves++; if (place(g, i, 1)) return;
    s.turn = 2; s.think = rand(0.35, 0.7);
  }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Tres, cuatro, cinco en línea', deco: ['❌', '⭕', '🐱', '🐶', '🌞', '🌙'], font: 'comic', bg: ['#fff8e6', '#f1e3c6'],
    music: { mode: 'major', bpm: 96, wave: 'triangle', style: 'chill', root: 62 }, voice: { wave: 'triangle', mul: 1.2, echo: 0.3 },
    en: { title: 'In a Row', tag: 'Three, four, five in a line', help: 'Play against the machine taking turns: <b>tap</b> an empty square to place your piece. Make a line (horizontal, vertical or diagonal) before it does. It starts as noughts and crosses (3 in a row on 3×3), then 4 in a row and finally <b>gomoku</b>: 5 in a row on bigger and bigger boards against a smarter machine. A draw replays the level.', tvHelp: 'D-pad to the square · OK to place.', dict: { 'Tu turno': 'Your turn', 'Pensando…': 'Thinking…', 'en raya': 'in a row', 'Gana la máquina': 'The machine wins', 'Empate: otra vez': 'Draw: again' } },
    tvHelp: 'Cruceta hasta la casilla · OK para colocar.',
    tv: { mode: 'tap', targets: (g) => { const s = g.s, o = []; if (!s.b) return o; s.b.forEach((v, i) => { if (!v) o.push({ x: s.ox + (i % s.n) * s.cs, y: s.oy + Math.floor(i / s.n) * s.cs, w: s.cs, h: s.cs }); }); return o; } },
    id: 'enraya', title: 'En raya', emoji: '❌', color: '#e8590c', origin: 'Tic Tac Toe / Renju',
    help: 'Juegas contra la máquina por turnos: <b>toca</b> una casilla vacía para poner tu ficha. Haz una línea (horizontal, vertical o diagonal) antes que ella. Empieza como el tres en raya (3×3), luego cuatro en raya y al final <b>gomoku</b>: 5 en raya en tableros cada vez más grandes contra una máquina más lista. El empate repite el nivel.',
    lives: 3, levels: 0, cap: 20,
    demo(g) {
      const s = g.s; if (s.done || s.turn !== 1) return { wait: 0.3 };
      let best = -1;
      if (s.n === 3) { let bs = 9; for (let i = 0; i < 9; i++) if (!s.b[i]) { s.b[i] = 1; const x = i % 3, y = (i / 3) | 0; const v = line(s, x, y, 1) ? -10 : s.b.every(Boolean) ? 0 : minimax(s, 2, 1)[0]; s.b[i] = 0; if (v < bs) { bs = v; best = i; } } }
      else { let bs = -1; for (let i = 0; i < s.b.length; i++) if (!s.b[i]) { const x = i % s.n, y = (i / s.n) | 0; if (!near(s, x, y)) continue; const v = evalCell(s, x, y, 1) * 1.2 + evalCell(s, x, y, 2) + Math.random(); if (v > bs) { bs = v; best = i; } } }
      if (best < 0) best = Math.floor(s.b.length / 2);
      return { tap: [s.ox + (best % s.n + 0.5) * s.cs, s.oy + (Math.floor(best / s.n) + 0.5) * s.cs], after: 0.5, say: Arcade.T('Haz una línea antes que la máquina', 'Make a line before the machine does') };
    },
    setup(g) {
      const [n, k, noise] = cfg(g.lv);
      g.s = { n, k, noise, b: new Array(n * n).fill(0), pop: new Array(n * n).fill(0), turn: 1, moves: 0, done: false, think: 0, pair: PAIRS[(g.level - 1) % PAIRS.length], winLine: null, last: -1 };
      geo(g);
      if (g.level % 2 === 0 && n > 3) { g.s.turn = 2; g.s.think = 0.6; } // a veces empieza la máquina
    },
    layout(g) { if (g.s.b) geo(g); },
    tap(g, p) { const s = g.s, c = Math.floor((p.x - s.ox) / s.cs), r = Math.floor((p.y - s.oy) / s.cs); if (c >= 0 && r >= 0 && c < s.n && r < s.n) playerAt(g, r * s.n + c); },
    update(g, dt) {
      const s = g.s; for (let i = 0; i < s.pop.length; i++) s.pop[i] = Math.max(0, s.pop[i] - dt * 4);
      if (s.turn === 2 && !s.done) { s.think -= dt; if (s.think <= 0) { const m = aiMove(g); if (!place(g, m, 2)) s.turn = 1; } }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      ctx.fillStyle = '#f1e3c6'; ctx.fillRect(0, 0, W, H);
      if (!s.b) return;
      const cs = s.cs, n = s.n, wood = s.n > 3;
      ctx.fillStyle = wood ? '#dcb36a' : '#fff'; Arcade.rr(ctx, s.ox - 8, s.oy - 8, cs * n + 16, cs * n + 16, 14); ctx.fill();
      ctx.strokeStyle = wood ? '#6b4a1e' : '#adb5bd'; ctx.lineWidth = wood ? 1.5 : 4; ctx.lineCap = 'round';
      if (wood) { for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.moveTo(s.ox + cs / 2, s.oy + (i + 0.5) * cs); ctx.lineTo(s.ox + (n - 0.5) * cs, s.oy + (i + 0.5) * cs); ctx.stroke(); ctx.beginPath(); ctx.moveTo(s.ox + (i + 0.5) * cs, s.oy + cs / 2); ctx.lineTo(s.ox + (i + 0.5) * cs, s.oy + (n - 0.5) * cs); ctx.stroke(); } }
      else { for (let i = 1; i < n; i++) { ctx.beginPath(); ctx.moveTo(s.ox + i * cs, s.oy + 10); ctx.lineTo(s.ox + i * cs, s.oy + n * cs - 10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(s.ox + 10, s.oy + i * cs); ctx.lineTo(s.ox + n * cs - 10, s.oy + i * cs); ctx.stroke(); } }
      ctx.lineCap = 'butt';
      s.b.forEach((v, i) => {
        if (!v) return; const x = s.ox + (i % n + 0.5) * cs, y = s.oy + (Math.floor(i / n) + 0.5) * cs;
        if (i === s.last) { ctx.fillStyle = 'rgba(255,212,59,.45)'; ctx.beginPath(); ctx.arc(x, y, cs * 0.46, 0, 6.3); ctx.fill(); }
        Arcade.emoji(ctx, s.pair[v - 1], x, y, cs * 0.78 * (1 + s.pop[i] * 0.4));
      });
      if (s.winLine) { const pts = s.winLine.map(([x, y]) => [s.ox + (x + 0.5) * cs, s.oy + (y + 0.5) * cs]).sort((a, b) => a[0] - b[0] || a[1] - b[1]); ctx.strokeStyle = 'rgba(224,49,49,.75)'; ctx.lineWidth = Math.max(5, cs * 0.12); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(...pts[0]); ctx.lineTo(...pts[pts.length - 1]); ctx.stroke(); ctx.lineCap = 'butt'; }
      Arcade.emoji(ctx, s.pair[0], W / 2 - 90, g.top + 32, 30, { alpha: s.turn === 1 ? 1 : 0.35 });
      Arcade.emoji(ctx, s.pair[1], W / 2 + 90, g.top + 32, 30, { alpha: s.turn === 2 ? 1 : 0.35 });
      Arcade.txt(ctx, s.done ? s.k + ' en raya' : s.turn === 1 ? 'Tu turno' : 'Pensando…', W / 2, g.top + 32, 17, '#6b4a1e', 'center', 900);
    },
  });
})();
</script>
</body>
</html>
