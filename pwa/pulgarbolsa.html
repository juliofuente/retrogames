<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    tab: {"build":"notsuit","move":"seq","empty":"any"},
    stock: { to: 'waste', n: 1, redeals: Infinity },
    piles: (lv) => P.mk([['stock', 1], ['waste', 1], ['found', 4], ['tab', 7]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"ds":["U","DU","DDU","DDDU","DDDDU","DDDDDU","DDDDDDU"]}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, {}),
    status: P.autoStatus,
    felt: ["#862e9c","#3a0f47"], back: ["#212529","#000000"], backEmoji: '👍',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Cualquier palo menos el suyo', deco: ["🃏","👍","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#862e9c","#3a0f47"],
    music: { mode: 'lydian', bpm: 91, wave: 'sine', style: 'chill', root: 55 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Thumb and Pouch', tag: 'Any suit but its own', help: 'An easier Klondike: a card can go on any other one rank higher, as long as it is a different suit. Build the <b>4 foundations</b> from A to K, one per suit. On the table, a card goes on another <b>one rank higher</b> of a <b>different suit</b>. You can move cards together if they are already in order. Any card can go into an empty space. Tap the stock to draw cards one at a time and turn it over as often as you like. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'pulgarbolsa', title: 'Pulgar y bolsa', emoji: '👍', color: '#b197fc', origin: 'Thumb and Pouch',
    help: 'Un Klondike más fácil: una carta puede ir sobre cualquier otra de un número más, siempre que sea de otro palo. Completa las <b>4 bases</b> del A a la K, una por palo. En la mesa, una carta va sobre otra de <b>un número más</b> de un <b>palo distinto</b> al suyo. Puedes mover juntas las cartas que ya estén en orden. Cualquier carta puede ir a un hueco vacío. Toca el mazo para sacar cartas de una en una y dale la vuelta las veces que quieras. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
