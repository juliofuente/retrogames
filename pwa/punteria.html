<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Puntería · Arcade Perdido</title>
<meta name="theme-color" content="#0f2027">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=a2ee08541b"></script>
<script src="common.js?v=16b4670bbf"></script>
<script>
(function () {
  const { ri, rand, clamp, pick } = Arcade;
  const PAL = [['#0f2027', '#2c5364'], ['#41295a', '#2f0743'], ['#134e5e', '#71b280'], ['#c94b4b', '#4b134f'], ['#1f4037', '#99f2c8']];

  function geo(g) { const s = g.s; s.by = g.bot - 90; s.ty = g.top + (g.bot - g.top) * 0.28; }
  function newTarget(g) {
    const s = g.s, L = g.lv, W = g.W;
    const mode = L < 3 ? 0 : ri(0, Math.min(2, Math.floor(L / 3)));
    s.t = { mode, x: rand(60, W - 60), y: s.ty + rand(-20, 40), ph: rand(0, 6), sp: rand(1, 1.5) + Math.min(L, 20) * 0.1, amp: rand(W * 0.25, W * 0.4), r: Math.max(16, 26 - L * 0.4) };
    s.bars = []; if (L >= 4) { const n = Math.min(1 + Math.floor((L - 4) / 4), 3); for (let i = 0; i < n; i++) s.bars.push({ y: s.ty + (s.by - s.ty) * (0.35 + i * 0.2), w: rand(70, 120), ph: rand(0, 6), sp: rand(1, 2) * (i % 2 ? -1 : 1) }); }
  }
  const tpos = (g) => { const s = g.s, t = s.t, W = g.W; if (t.mode === 0) return [W / 2 + Math.sin(t.ph) * t.amp, t.y]; if (t.mode === 1) return [W / 2 + Math.cos(t.ph) * t.amp * 0.6, t.y + Math.sin(t.ph) * 60]; return [W / 2 + Math.sin(t.ph) * t.amp, t.y + Math.sin(t.ph * 2) * 50]; };
  const barX = (g, b) => g.W / 2 + Math.sin(b.ph) * (g.W / 2 - b.w / 2);
  function fire(g) { const s = g.s; if (s.shot || s.done) return; s.shot = { x: s.bx, y: s.by, vy: -1100 }; Arcade.tone(600, 0.05, 'square', 0.05, 300); }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Un disparo, un blanco que no para', deco: ['🎯', '⚪', '🔴', '✨', '💫', '🔵'], font: 'wide', bg: ['#2c5364', '#0f2027'],
    music: { mode: 'minor', bpm: 120, wave: 'triangle', style: 'arcade', root: 57 }, voice: { wave: 'triangle', mul: 1.1, echo: 0.3 },
    en: { title: 'Aim', tag: 'One shot, a target that never stops', help: 'Your dot waits at the bottom and the target moves non-stop above. <b>Tap</b> to fire your dot straight up: hit the target to score. If you miss, you lose a life. Later the target traces curves and bars cross in the way. Hit the target the number of times each level asks for.', tvHelp: 'OK to fire.', dict: { 'Aciertos: ': 'Hits: ' } },
    tvHelp: 'OK para disparar.',
    id: 'punteria', title: 'Puntería', emoji: '🎯', color: '#4dabf7', origin: 'Boom Dots / Click when Red',
    help: 'Tu punto espera abajo y el blanco se mueve sin parar arriba. <b>Toca</b> para disparar tu punto hacia arriba: acierta en el blanco para sumar. Si fallas, pierdes una vida. Luego el blanco hace curvas y se cruzan barras por medio. Acierta las veces que pide cada nivel.',
    lives: 3, levels: 0, cap: 25,
    setup(g) { g.s = { hits: 0, need: 8 + Math.min(g.lv, 25), combo: 0, pal: PAL[(g.level - 1) % PAL.length] }; geo(g); g.s.bx = g.W / 2; newTarget(g); },
    layout(g) { if (g.s.t) { geo(g); g.s.bx = g.W / 2; } },
    down(g) { fire(g); },
    key(g, k, d) { if (d && (k === ' ' || k === 'ArrowUp')) fire(g); },
    update(g, dt) {
      const s = g.s; s.t.ph += s.t.sp * dt; for (const b of s.bars) b.ph += b.sp * dt;
      const sh = s.shot; if (!sh) return;
      sh.y += sh.vy * dt;
      for (const b of s.bars) if (Math.abs(sh.y - b.y) < 8 && Math.abs(sh.x - barX(g, b)) < b.w / 2 + 6) { s.shot = null; s.combo = 0; Arcade.sfx.bad(); g.burst(sh.x, sh.y, { n: 10, color: '#fff', speed: 120, size: 3 }); if (g.die()) {} return; }
      const [tx, ty] = tpos(g);
      if (Math.hypot(sh.x - tx, sh.y - ty) < s.t.r + 10) {
        s.shot = null; s.hits++; s.combo++; const perfect = Math.abs(sh.x - tx) < 6;
        g.addScore((perfect ? 3 : 1) * 10 * g.lv * Math.min(5, s.combo), tx, ty - 30); if (perfect) g.float('PERFECT', tx, ty - 60, '#ffd43b', 22);
        g.burst(tx, ty, { n: 20, color: ['#fff', '#4dabf7', '#ffd43b'], speed: 220, size: 4 }); g.ring(tx, ty, '#fff', 60); Arcade.sfx.coin(); g.shake(0.1, 3);
        if (s.hits >= s.need) { s.done = true; g.confetti(60); setTimeout(() => { if (g.state === 'play') g.win(); }, 500); } else newTarget(g);
        return;
      }
      if (sh.y < g.top) { s.shot = null; s.combo = 0; Arcade.sfx.bad(); g.die(); }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, s.pal[1]); bg.addColorStop(1, s.pal[0]);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (!s.t) return;
      const [tx, ty] = tpos(g);
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2; ctx.beginPath(); for (let k = 0; k <= 60; k++) { const save = s.t.ph; s.t.ph = save + (k - 30) * 0.08; const [x, y] = tpos(g); s.t.ph = save; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
      for (const b of s.bars) { const x = barX(g, b); ctx.fillStyle = '#ff6b6b'; Arcade.rr(ctx, x - b.w / 2, b.y - 5, b.w, 10, 5); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(tx, ty, s.t.r, 0, 6.3); ctx.fill(); ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(tx, ty, s.t.r * 0.6, 0, 6.3); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(tx, ty, s.t.r * 0.25, 0, 6.3); ctx.fill();
      ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.moveTo(s.bx, s.by); ctx.lineTo(s.bx, g.top); ctx.stroke(); ctx.setLineDash([]);
      const by = s.shot ? s.shot.y : s.by; ctx.fillStyle = '#4dabf7'; ctx.shadowColor = '#4dabf7'; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(s.bx, by, 12, 0, 6.3); ctx.fill(); ctx.shadowBlur = 0;
      if (!s.shot) { ctx.fillStyle = 'rgba(77,171,247,.3)'; ctx.beginPath(); ctx.arc(s.bx, s.by, 18 + Math.sin(g.rt * 5) * 3, 0, 6.3); ctx.fill(); }
      Arcade.txt(ctx, 'Aciertos: ' + s.hits + '/' + s.need, W / 2, g.top + 20, 15, '#fff', 'center', 900);
      if (s.combo > 1) Arcade.txt(ctx, '🔥 x' + Math.min(5, s.combo), W / 2, g.top + 42, 14, '#ffd43b', 'center', 900);
    },
  });
})();
</script>
</body>
</html>
