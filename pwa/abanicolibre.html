<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    tab: {"build":"suit","move":"one","empty":"K"},
    piles: (lv) => P.mk([['found', 4], ['cell', 2 + (lv < 6 ? 1 : 0)], ['tab', 18, { fan: 'right' }]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"ds":["UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","U"]}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, { fans: true }),
    status: P.autoStatus,
    felt: ["#c2255c","#5c0f2c"], back: ["#0c8599","#064652"], backEmoji: '🌬️',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Abanico con dos celdas', deco: ["🃏","🌬️","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#c2255c","#5c0f2c"],
    music: { mode: 'minor', bpm: 76, wave: 'sine', style: 'chill', root: 58 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'FreeFan', tag: 'Fan with two cells', help: 'Fan with two cells to park cards: much easier. Build the <b>4 foundations</b> from A to K, one per suit. On the table, a card goes on another <b>one rank higher</b> of the <b>same suit</b>. Move <b>one card at a time</b>. An empty space only takes a K. You have <b>2 cells</b>, each holding one card. In the first levels you get one extra cell. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'abanicolibre', title: 'Abanico libre', emoji: '🌬️', color: '#f783ac', origin: 'FreeFan (Gregg Seelhoff)',
    help: 'El Abanico con dos celdas para guardar cartas: mucho más fácil. Completa las <b>4 bases</b> del A a la K, una por palo. En la mesa, una carta va sobre otra de <b>un número más</b> y del <b>mismo palo</b>. Se mueve <b>una carta cada vez</b>. Un hueco vacío solo admite una K. Tienes <b>2 celdas</b> para guardar una carta en cada una. En los primeros niveles tienes una celda más. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
</body>
</html>
