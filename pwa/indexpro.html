<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcade Pro · Clásicos de móvil con emojis</title>
<meta name="description" content="Juegos de móvil modernos (Stack, 2048, Suika, Stick Hero…) rehechos en HTML5 con emojis, animaciones y niveles.">
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade Perdido">
<link rel="stylesheet" href="common.css?v=0557e36461">
<script src="config.js?v=22c3c7c43a"></script>
<script>if (arcadeEsTV()) location.replace('indextv.html' + (location.search ? location.search + '&' : '?') + 'sec=pro');</script>
</head>
<body class="home pro">
<style>body.pro{--bg1:#123a5a;--bg2:#0d1b2a;--accent:#4dd4ff}body.pro .brand h1{background:linear-gradient(90deg,#4dd4ff,#b197fc,#ff6b9d);-webkit-background-clip:text;background-clip:text;color:transparent}.chip.link{text-decoration:none}</style>
<div class="wrap">
  <header class="brand" id="hdr"><div class="logo">✨</div><h1>Arcade Pro</h1></header>
  <p class="tagline" data-i="tagline">Los éxitos de móvil que Emanuele Feronato recrea en Phaser, hechos aquí desde cero con JavaScript y emojis, con animaciones y niveles sin fin.</p>
  <div class="search"><input type="search" id="q" placeholder="🔎 Buscar juego…" aria-label="Buscar" autocomplete="off" enterkeyhint="search"></div>
  <div class="bar" id="filters">
    <button class="chip on" data-f="" data-i="all">Todos</button>
    <button class="chip" data-f="Tocar" data-i="tap">👆 Tocar</button>
    <button class="chip" data-f="Arrastrar" data-i="drag">✋ Arrastrar</button>
    <button class="chip" data-f="Deslizar" data-i="swipe">↔️ Deslizar</button>
    <button class="chip" data-f="Mantener" data-i="hold">✊ Mantener</button>
    <a class="chip link" href="index.html" id="other" data-i="other">🕹️ Arcade Perdido</a>
    <button class="chip" id="tvmode" style="display:none" data-i="tv">📺 Modo TV</button>
    <button class="chip" id="lang" style="display:none"></button>
    <button class="chip" id="install" data-i="install">📲 Instalar</button>
  </div>
  <main class="grid" id="grid"></main>
  <p class="foot" id="foot"></p>
</div>
<script src="games.js?v=5ddd2ca7e4"></script>
<script>
(function () {
  const get = (k, d) => { try { const v = localStorage.getItem('arc_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const grid = document.getElementById('grid');
  const EN = arcadeIdioma() === 'en';
  document.documentElement.lang = EN ? 'en' : 'es';
  const TX = { tagline: 'The mobile hits Emanuele Feronato recreates in Phaser, built here from scratch with JavaScript and emojis, with animations and endless levels.', all: 'All', tap: '👆 Tap', drag: '✋ Drag', swipe: '↔️ Swipe', hold: '✊ Hold', other: '🕹️ Arcade Perdido', tv: '📺 TV mode', install: '📲 Install' };
  if (EN) { document.querySelectorAll('[data-i]').forEach(e => { if (TX[e.dataset.i]) e.textContent = TX[e.dataset.i]; }); document.title = 'Arcade Pro · Mobile hits with emojis'; }
  const loc = (g, k) => (EN && g.en && g.en[k]) || g[k];
  if ((ARCADE_CONFIG.idioma || 'auto') === 'auto') {
    const lb = document.getElementById('lang'); lb.style.display = 'inline-flex'; lb.textContent = EN ? '🇪🇸 Español' : '🇬🇧 English';
    lb.addEventListener('click', () => { const nl = EN ? 'es' : 'en'; arcadeElegirIdioma(nl); location.search = '?lang=' + nl; });
  }
  { const o = document.getElementById('other'); o.href = 'index.html?lang=' + (EN ? 'en' : 'es');
  }
  const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const hay = (g) => norm([g.title, g.tag, g.desc, g.origin, g.ctrl, g.en && g.en.title, g.en && g.en.tag, g.en && g.en.desc].join(' '));
  let curF = '', curQ = '';
  function card(g, other) {
    const best = get('best_' + g.id, 0), done = get('done_' + g.id, false);
    const a = document.createElement('a');
    a.className = 'gc'; a.href = g.file + '?lang=' + (EN ? 'en' : 'es'); a.style.setProperty('--c', g.color);
    a.innerHTML = `${other ? `<span class="new" style="background:#9775fa">${other}</span>` : best ? '' : `<span class="new">${EN ? 'NEW' : 'NUEVO'}</span>`}
      <div class="em">${g.emoji}</div><h3>${loc(g, 'title')}</h3><div class="or">${g.origin}</div>
      <p>${loc(g, 'desc')}</p>
      <div class="ft"><span>${loc(g, 'ctrl')}</span><span>${done ? '🏆 ' : '⭐ '}${best}</span></div>`;
    return a;
  }
  function render(filter) {
    if (filter !== undefined) curF = filter;
    const words = norm(curQ).split(/\s+/).filter(Boolean);
    const ok = (g) => (!curF || g.ctrl.indexOf(curF) === 0) && words.every((w) => hay(g).indexOf(w) >= 0);
    grid.innerHTML = '';
    const mine = GAMES_PRO.filter(ok);
    mine.forEach((g) => grid.appendChild(card(g)));
    // con búsqueda, también enseña los de la otra colección
    const others = words.length ? (window.GAMES || []).filter(ok) : [];
    others.forEach((g) => grid.appendChild(card(g, '🕹️ Arcade Perdido')));
    if (!mine.length && !others.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = EN ? 'No games found. Try another word (e.g. Tetris, Zuma, 2048).' : 'No hay juegos con eso. Prueba otra palabra (por ejemplo: Tetris, Zuma, 2048).'; grid.appendChild(p); }
  }
  const qi = document.getElementById('q');
  if (EN) { qi.placeholder = '🔎 Search games…'; qi.setAttribute('aria-label', 'Search'); }
  try { const u = new URLSearchParams(location.search).get('q'); if (u) { qi.value = u; curQ = u; } } catch (_) {}
  qi.addEventListener('input', () => { curQ = qi.value; render(); });
  qi.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const f = grid.querySelector('a.gc'); if (f && qi.value.trim()) location.href = f.href; } });
  render();
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
    render(b.dataset.f);
  });
  document.getElementById('foot').innerHTML = GAMES_PRO.length + (EN ? ' games · v' : ' juegos · v') + ARCADE_VERSION + (EN ? '<br>Works offline once loaded.' : '<br>Funciona sin conexión una vez cargado.');

  // Cambio a modo TV (solo si la configuración lo permite)
  if (ARCADE_CONFIG.modo === 'seleccionable') {
    const tb = document.getElementById('tvmode'); tb.style.display = 'inline-flex';
    tb.addEventListener('click', () => { arcadeElegirTV(true); location.href = 'indextv.html?sec=pro'; });
  }
  // Instalación como app
  let deferred = null;
  const ib = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; ib.style.display = 'inline-flex'; });
  ib.addEventListener('click', async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; ib.style.display = 'none'; }
    else alert(EN ? 'On iPhone: tap Share and then “Add to Home Screen”.' : 'En iPhone: pulsa Compartir y luego «Añadir a pantalla de inicio».');
  });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
  if (ios) ib.style.display = 'inline-flex';
  window.addEventListener('pageshow', () => render(document.querySelector('[data-f].on').dataset.f));
  try { /* PWA desactivada (v2.8.1): quita el service worker y las cachés viejas */ if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {}); if (window.caches) caches.keys().then((ks) => ks.filter((k) => /^arcade-perdido-/.test(k)).forEach((k) => caches.delete(k))).catch(() => {}); } catch (e) {}
})();
</script>
</body>
</html>
