<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    tab: {"build":"suit","move":"one","empty":"any","updown":true},
    planHint: true, demoBudget: 1500,
    piles: (lv) => P.mk([['found', 4], ['tab', 10, { fan: 'right' }]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"ds":["UUUUUU","UUUUUU","UUUUU","UUUUU","UUUUU","UUUUU","UUUUU","UUUUU","UUUUU","UUUUU"]}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, { rows: true }),
    status: P.autoStatus,
    felt: ["#495057","#16191c"], back: ["#2b8a3e","#0b4a1c"], backEmoji: '🏰',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Arriba o abajo, del mismo palo', deco: ["🃏","🏰","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#495057","#16191c"],
    music: { mode: 'dorian', bpm: 92, wave: 'sine', style: 'chill', root: 58 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Fortress', tag: 'Up or down, same suit', help: 'The ancestor of the Castle: ten rows where you build up or down in the same suit. Build the <b>4 foundations</b> from A to K, one per suit. On the table, a card goes on another <b>one rank higher or lower</b> of the <b>same suit</b>. Move <b>one card at a time</b>. Any card can go into an empty space. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'fortin', title: 'Fortín', emoji: '🏰', color: '#adb5bd', origin: 'Fortress',
    help: 'El antepasado del Castillo: diez filas en las que se sube o se baja, del mismo palo. Completa las <b>4 bases</b> del A a la K, una por palo. En la mesa, una carta va sobre otra de <b>un número más o uno menos</b> y del <b>mismo palo</b>. Se mueve <b>una carta cada vez</b>. Cualquier carta puede ir a un hueco vacío. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
