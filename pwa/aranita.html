<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Arañita · Arcade Perdido</title>
<meta name="theme-color" content="#1c0f45">
<meta name="apple-mobile-web-app-capable" content="yes">

<body class="game">
<script src="config.js?v=84fed7f189"></script>
<script src="common.js?v=6a1142aea4"></script>
<script src="cartas.js?v=ae2088dc63"></script>
<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
      found: { mode: 'run' }, stock: { to: 'tab' }, planHint: true, demoBudget: 3000,
      tab: { build: 'any', move: 'run', empty: 'any' },
      piles: () => P.mk([['stock', 1], ['found', 4], ['tab', 7]]),
      init(lv) { this.stock.needAll = lv >= 10; },
      deal(st, D, deck0, lv) { const ns = lv < 6 ? 1 : lv < 12 ? 2 : 4, deck = deck0.map((c) => { const s = (c / 13) | 0, r = c % 13; return ns === 4 ? c : (s >> (ns === 1 ? 0 : 1)) * 52 + (ns === 1 ? 0 : s % 2) * 13 + r; }); const t = P.of(D, 'tab'); let k = 0; t.forEach((i, c) => { for (let n = 0; n < c; n++) st.p[i].push(P.down(deck[k++])); st.p[i].push(deck[k++]); }); while (k < 52) st.p[P.of(D, 'stock')[0]].push(P.down(deck[k++])); },
      place(g, s, D, y0) { const c = P.cols(g, 7); s.cw = c.cw; D.forEach((d) => { if (d.k === 'stock') { d.x = c.x(0); d.y = y0; } if (d.k === 'found') { d.x = c.x(3 + d.n); d.y = y0; } if (d.k === 'tab') { d.x = c.x(d.n); d.y = y0 + c.cw * 1.4 + 14; } }); },
      status: (st, D) => Arcade.T('Escaleras: ', 'Runs: ') + (st.runs || 0) + '/4 · ' + Arcade.T('Mazo: ', 'Stock: ') + st.p[P.of(D, 'stock')[0]].length,
      demoSay: Arcade.T('Junta escaleras del mismo palo', 'Gather same-suit runs'),      felt: ["#5f3dc4","#1c0f45"], back: ["#862e9c","#45115a"], backEmoji: '🕸️',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'La Araña con una sola baraja', deco: ["🃏","🕸️","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#5f3dc4","#1c0f45"],
    music: { mode: 'lydian', bpm: 89, wave: 'sine', style: 'chill', root: 58 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Spiderette', tag: 'Spider with a single deck', help: 'Spider in small, with <b>a single deck</b> and seven columns like classic solitaire. Make <b>runs from K down to A in the same suit</b>: each one you complete goes up to the foundations by itself. A card goes on another <b>one rank higher, any suit</b>, but you can only move several together if they are in the <b>same suit</b>. Any card can go to an empty column. Tap the stock to deal one card to each column; from level 10 you cannot deal with empty columns. Until level 6 all cards are one suit, and until level 12, two. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Escaleras: ': 'Runs: ', 'Mazo: ': 'Stock: ', 'Toca una carta y va sola a su sitio': 'Tap a card and it goes to its place' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'aranita', title: 'Arañita', emoji: '🕸️', color: '#e599f7', origin: 'Spiderette',
    help: 'La Araña en pequeño, con <b>una sola baraja</b> y siete columnas como el solitario clásico. Forma <b>escaleras de la K al A del mismo palo</b>: cada una que completes sube sola a las bases. Una carta va sobre otra de <b>un número más, de cualquier palo</b>, pero solo puedes mover varias juntas si son del <b>mismo palo</b>. Cualquier carta puede ir a una columna vacía. Toca el mazo para repartir una carta a cada columna; desde el nivel 10 no se puede repartir con columnas vacías. Hasta el nivel 6 todas las cartas son de un palo, y hasta el 12, de dos. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
</body>
</html>
