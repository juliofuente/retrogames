<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    tab: {"build":"suit","move":"one","empty":"K"},
    piles: (lv) => P.mk([['found', 4], ['tab', 18, { fan: 'right' }]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"ds":["UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","UUU","U"]}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, { fans: true }),
    status: P.autoStatus,
    felt: ["#1b8a4c","#0a3d24"], back: ["#862e9c","#45115a"], backEmoji: '🪭',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Dieciocho abanicos y huecos para la K', deco: ["🃏","🪭","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#1b8a4c","#0a3d24"],
    music: { mode: 'major', bpm: 81, wave: 'sine', style: 'chill', root: 58 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Fan', tag: 'Eighteen fans and spaces for kings', help: 'The original Fan: eighteen fans of three cards, all face up. Build the <b>4 foundations</b> from A to K, one per suit. On the table, a card goes on another <b>one rank higher</b> of the <b>same suit</b>. Move <b>one card at a time</b>. An empty space only takes a K. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'abanico', title: 'Abanico', emoji: '🪭', color: '#ff6b6b', origin: 'Fan',
    help: 'El Abanico original: dieciocho abanicos de tres cartas, todos a la vista. Completa las <b>4 bases</b> del A a la K, una por palo. En la mesa, una carta va sobre otra de <b>un número más</b> y del <b>mismo palo</b>. Se mueve <b>una carta cada vez</b>. Un hueco vacío solo admite una K. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
