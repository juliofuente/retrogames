      Arcade.txt(ctx, 'Pips: ' + pip(s.a) + ' · ' + pip(s.b) + '   Fuera: ' + s.a[0] + ' · ' + s.b[0], W / 2, g.top + 42, 12, '#e8b16a', 'center', 700);
    },
  });
