<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    decks: 2,
    tab: {"build":"any","move":"run","empty":"any"},
    stock: { to: 'waste', n: 3, redeals: 1 },
    init(lv) { this.stock.redeals = 1 + (lv < 6 ? 1 : 0); },
    piles: (lv) => P.mk([['stock', 1], ['waste', 1], ['found', 8], ['tab', 10]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"ds":["U","DU","DDU","DDDU","DDDDU","DDDDDU","DDDDDDU","DDDDDDDU","DDDDDDDDU","DDDDDDDDDU"]}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, {}),
    status: P.autoStatus,
    felt: ["#a61e4d","#3d0a1d"], back: ["#862e9c","#45115a"], backEmoji: '💃',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Klondike y Araña con dos barajas', deco: ["🃏","💃","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#a61e4d","#3d0a1d"],
    music: { mode: 'major', bpm: 87, wave: 'sine', style: 'chill', root: 55 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Lady Jane', tag: 'Klondike meets Spider, two decks', help: 'Two decks in ten columns: build down in any suit, but only same-suit runs move together. Played with <b>two decks</b>. Build the <b>8 foundations</b> from A to K, one per suit. On the table, a card goes on another <b>one rank higher</b> of <b>any suit</b>. Only <b>same-suit runs</b> move together. Any card can go into an empty space. Tap the stock to draw cards three at a time; you can turn it over once. In the first levels you get one more pass through the stock. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'ladyjane', title: 'Lady Jane', emoji: '💃', color: '#ff8787', origin: 'Lady Jane (Thomas Warfield)',
    help: 'Dos barajas en diez columnas: se baja de cualquier palo, pero solo se mueven juntas las escaleras del mismo palo. Se juega con <b>dos barajas</b>. Completa las <b>8 bases</b> del A a la K, una por palo. En la mesa, una carta va sobre otra de <b>un número más</b> de <b>cualquier palo</b>. Solo se mueven juntas las <b>escaleras del mismo palo</b>. Cualquier carta puede ir a un hueco vacío. Toca el mazo para sacar cartas de tres en tres; puedes darle la vuelta una vez. En los primeros niveles puedes darle una vuelta más al mazo. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
</body>
</html>
