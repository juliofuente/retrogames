<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Senet · Arcade Perdido</title>
<meta name="theme-color" content="#2b2008">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css">
</head>
<body class="game">
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { rand, clamp, pick } = Arcade;
  // Senet egipcio (reglas de Kendall, simplificadas). Casillas 1..30 en zigzag; 31 = fuera.
  const cfg = (L) => ({ n: L <= 5 ? 3 : 5, noise: clamp(0.5 - L * 0.025, 0.12, 0.5) });
  const SAFE = new Set([26, 28, 29, 30]);
  function throwSticks() { let light = 0; const sticks = []; for (let k = 0; k < 4; k++) { const l = Math.random() < 0.5; sticks.push(l); if (l) light++; } return { roll: light || 5, sticks }; }
  const at = (s, sq) => (s.p1.includes(sq) ? 1 : s.p2.includes(sq) ? 2 : 0);
  function target(s, who, from, r) {
    const mine = who === 1 ? s.p1 : s.p2;
    if (from === 28 && r === 3) return 31; if (from === 29 && r === 2) return 31; if (from === 30 && r === 1) return 31; if (from === 26 && r === 5) return 31;
    const to = from + r; if (to > 30) return -1;
    if (from < 26 && to > 26) return -1; // hay que parar en la casa de la felicidad
    if (mine.includes(to)) return -1;
    // no se puede saltar por encima de 3 rivales seguidos
    let run = 0; for (let q = from + 1; q < to; q++) { if (at(s, q) === 3 - who) { run++; if (run >= 3) return -1; } else run = 0; }
    const occ = at(s, to);
    if (occ === 3 - who) { if (SAFE.has(to)) return -1; if (at(s, to - 1) === 3 - who || at(s, to + 1) === 3 - who) return -1; }
    return to;
  }
  function moves(s, who, r) { const mine = who === 1 ? s.p1 : s.p2, out = []; for (const f of mine) { if (f > 30) continue; const t = target(s, who, f, r); if (t > 0) out.push({ from: f, to: t }); } return out; }
  function apply(s0, who, m) {
    const s = { p1: s0.p1.slice(), p2: s0.p2.slice() }, mine = who === 1 ? s.p1 : s.p2, theirs = who === 1 ? s.p2 : s.p1;
    const k = mine.indexOf(m.from); let to = m.to, swap = false, water = false;
    const ti = theirs.indexOf(to); if (ti >= 0 && to <= 30) { theirs[ti] = m.from; swap = true; }
    if (to === 27) { water = true; to = 15; while (at(s, to) && to > 1) to--; }
    mine[k] = to; return { s, swap, water, to };
  }
  function score(s, who) { // para who
    const me = who === 1 ? s.p1 : s.p2, op = who === 1 ? s.p2 : s.p1; let v = 0;
    for (const p of me) v += p > 30 ? 40 : p + (p >= 26 ? 3 : 0);
    for (const p of op) v -= p > 30 ? 40 : p + (p >= 26 ? 3 : 0);
    for (const p of me) if (p <= 30 && !SAFE.has(p) && !(me.includes(p - 1) || me.includes(p + 1))) { let threat = 0; for (const q of op) if (q < p && p - q <= 5) threat++; v -= threat * 1.2; }
    return v;
  }
  function choose(s, who, r, noise) {
    const ms = moves(s, who, r); if (!ms.length) return null; if (noise && Math.random() < noise) return pick(ms);
    let best = null, bv = -1e9; for (const m of ms) { const a = apply(s, who, m), v = score(a.s, who) + Math.random() * 0.2; if (v > bv) { bv = v; best = m; } } return best;
  }
  // —— geometría: 10 × 3 casillas, girado en vertical ——
  function geo(g) {
    const s = g.s, top = g.top + 70, Ha = g.bot - top - 110; s.port = Math.min((g.W - 30) / 3, Ha / 10) > Math.min((g.W - 30) / 10, Ha / 3);
    if (s.port) { s.U = Math.min((g.W - 30) / 3, Ha / 10, 90); s.ox = (g.W - s.U * 3) / 2; s.oy = top + (Ha - s.U * 10) / 2; }
    else { s.U = Math.min((g.W - 30) / 10, Ha / 3, 90); s.ox = (g.W - s.U * 10) / 2; s.oy = top + (Ha - s.U * 3) / 2; }
    s.sticksY = s.oy + (s.port ? s.U * 10 : s.U * 3) + 48;
  }
  function cellCR(sq) { const r = Math.floor((sq - 1) / 10), k = (sq - 1) % 10; return [r === 1 ? 9 - k : k, r]; }
  function SQ(s, sq) { // centro de una casilla (o de la salida)
    if (sq > 30) return s.port ? [s.ox + s.U * 3.4, s.oy + s.U * 9.5] : [s.ox + s.U * 10.4, s.oy + s.U * 2.5];
    const [c, r] = cellCR(sq); return s.port ? [s.ox + (2 - r + 0.5) * s.U, s.oy + (c + 0.5) * s.U] : [s.ox + (c + 0.5) * s.U, s.oy + (r + 0.5) * s.U];
  }
  function hitSq(s, x, y) { for (let q = 1; q <= 30; q++) { const [cx, cy] = SQ(s, q); if (Math.abs(x - cx) < s.U / 2 && Math.abs(y - cy) < s.U / 2) return q; } return -1; }
  function pawn(ctx, x, y, r, who) {
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(x + 2, y + r * 0.9, r * 0.9, r * 0.3, 0, 0, 6.3); ctx.fill();
    const c = who === 1 ? ['#fff3bf', '#f2c94c', '#9c6b00'] : ['#a5d8ff', '#1c4f8a', '#0a1f3a'];
    const gr = ctx.createLinearGradient(x - r, 0, x + r, 0); gr.addColorStop(0, c[2]); gr.addColorStop(0.4, c[1]); gr.addColorStop(0.7, c[0]); gr.addColorStop(1, c[2]); ctx.fillStyle = gr;
    if (who === 1) { ctx.beginPath(); ctx.moveTo(x - r * 0.8, y + r * 0.9); ctx.lineTo(x - r * 0.3, y - r * 0.6); ctx.lineTo(x + r * 0.3, y - r * 0.6); ctx.lineTo(x + r * 0.8, y + r * 0.9); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(x, y - r * 0.7, r * 0.42, 0, 6.3); ctx.fill(); }
    else { ctx.fillRect(x - r * 0.75, y - r * 0.8, r * 1.5, r * 1.7); ctx.fillStyle = c[0]; ctx.beginPath(); ctx.ellipse(x, y - r * 0.8, r * 0.75, r * 0.25, 0, 0, 6.3); ctx.fill(); ctx.fillStyle = c[2]; ctx.fillRect(x - r * 0.75, y - r * 0.1, r * 1.5, r * 0.18); }
  }
  // —— turnos ——
  function startTurn(g, who) { const s = g.s; s.turn = who; s.th = throwSticks(); s.thT = 0; s.phase = 'throw'; for (let k = 0; k < 4; k++) setTimeout(() => Arcade.tone(500 + Math.random() * 300, 0.04, 'square', 0.03), k * 80); }
  function thrown(g) {
    const s = g.s, who = s.turn, r = s.th.roll, ms = moves(s, who, r);
    if (!ms.length) { g.message(who === 1 ? Arcade.T('No puedes mover', 'You can\'t move') : Arcade.T('La máquina no puede mover', 'The machine can\'t move'), 0.9); s.phase = 'wait'; s.wait = 1; s.next = (r === 1 || r === 4 || r === 5) ? who : 3 - who; return; }
    if (who === 1) s.phase = 'play'; else { s.phase = "ai"; s.wait = 0.3; }
  }
  function doMove(g, who, m) { const s = g.s; s.anim = { who, m, t: 0 }; s.phase = 'anim'; Arcade.tone(who === 1 ? 520 : 360, 0.06, 'triangle', 0.06); }
  function moved(g) {
    const s = g.s, a = s.anim; s.anim = null; const r = apply(s, a.who, a.m); s.p1 = r.s.p1; s.p2 = r.s.p2;
    const [x, y] = SQ(s, Math.min(a.m.to, 31));
    if (r.swap) { Arcade.sfx.pop(); g.burst(x, y, { n: 12, color: ['#ffd43b', '#1c4f8a'], speed: 160 }); if (a.who === 1) g.addScore(40, x, y); }
    if (r.water) { g.burst(x, y, { n: 16, color: ['#4dabf7', '#a5d8ff'], speed: 140 }); Arcade.tone(200, 0.3, 'sine', 0.06, -120); g.message(Arcade.T('¡Al agua! Vuelve a la casilla 15', 'Into the water! Back to square 15'), 1); }
    if (a.m.to > 30) { g.ring(x, y, '#ffd43b', s.U * 0.6, 4); Arcade.sfx.up(); if (a.who === 1) g.addScore(100 * Math.max(1, Math.round(g.lv / 2)), x, y); }
    else if (a.who === 1) g.addScore(5 * (a.m.to - a.m.from), x, y);
    if (s.p1.every((p) => p > 30)) { s.done = true; g.confetti(90); g.addScore(500 * g.lv, g.W / 2, g.H / 2); const left = s.p2.filter((p) => p <= 30).length, st = left >= s.n ? 3 : left >= Math.ceil(s.n / 2) ? 2 : 1; setTimeout(() => { if (g.state === 'play') g.win(st); }, 1400); return; }
    if (s.p2.every((p) => p > 30)) { s.done = true; g.message(Arcade.T('La máquina sacó todas sus piezas', 'The machine got all its pieces out'), 1.5); setTimeout(() => { if (g.state === 'play' && g.die()) Arcade.current.def.setup(g); }, 1900); return; }
    const again = s.th.roll === 1 || s.th.roll === 4 || s.th.roll === 5; if (again) g.float(Arcade.T('¡Otra tirada!', 'Throw again!'), g.W / 2, s.sticksY - 30, '#ffd43b', 16);
    s.phase = "wait"; s.wait = 0.3; s.next = again ? a.who : 3 - a.who;
  }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'El juego de los faraones', deco: ['☀️', '🐍', '🏺', '🌊', '🏆', '🧠'], font: 'serif', bg: ['#4a3810', '#2b2008'],
    music: { mode: 'phryg', bpm: 80, wave: 'triangle', style: 'chill', root: 50 }, voice: { wave: 'sine', mul: 1, echo: 0.45 },
    /*EN*/ en: { title: 'Senet', tag: 'The game of the pharaohs', help: 'Ancient Egypt\'s board game. Get all your gold pieces off the board before the machine\'s blue ones. The path zigzags across the 30 squares. The <b>4 sticks</b> are thrown for you: each light side counts 1 (none counts 5); with <b>1, 4 or 5</b> you throw again. <b>Tap</b> the piece you want to move. If you land on a lone enemy piece, you <b>swap places</b>; two in a row protect each other and three block the way. Everyone must stop on the <b>House of Happiness</b> ☀ (26); the <b>water</b> 🌊 (27) sends you back to 15. To get out, use the exact throw: 3 from III, 2 from II, 1 from I, or 5 from ☀.', tvHelp: 'D-pad to a lit piece · OK.', dict: { 'Tu turno': 'Your turn', 'Toca una pieza': 'Tap a piece', 'Turno de la máquina': 'Machine\'s turn', 'Fuera: ': 'Out: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una pieza iluminada · OK.',
    tv: { mode: 'tap', targets: (g) => { const s = g.s; if (!s.p1 || s.phase !== 'play') return []; return moves(s, 1, s.th.roll).map((m) => { const [x, y] = SQ(s, m.from); return { x: x - s.U / 2, y: y - s.U / 2, w: s.U, h: s.U }; }); } },
    id: 'senet', title: 'Senet', emoji: '🏺', color: '#f2c94c', origin: 'Senet (Lutanho)',
    help: 'El juego de mesa del antiguo Egipto. Saca del tablero todas tus piezas doradas antes que las azules de la máquina. El camino va en zigzag por las 30 casillas. Los <b>4 palitos</b> se tiran solos: cada cara clara cuenta 1 (ninguna cuenta 5); con <b>1, 4 o 5</b> vuelves a tirar. <b>Toca</b> la pieza que quieras mover. Si caes sobre una rival sola, os <b>cambiáis el sitio</b>; dos seguidas se protegen y tres cortan el paso. Todas tienen que parar en la <b>casa de la felicidad</b> ☀ (26); el <b>agua</b> 🌊 (27) te devuelve a la 15. Para salir hace falta la tirada justa: 3 desde III, 2 desde II, 1 desde I o 5 desde ☀.',
    lives: 3, levels: 0, cap: 20,
    /*SC*/ demo(g) {
      const s = g.s; if (s.phase !== 'play' || s.anim) return { wait: 0.3 };
      const m = choose(s, 1, s.th.roll, 0); if (!m) return { wait: 0.3 };
      return { tap: SQ(s, m.from), after: 0.5, say: s.turns++ ? null : Arcade.T('Toca la pieza que quieras mover', 'Tap the piece you want to move') };
    },
    setup(g) {
      const o = cfg(g.lv), p1 = [], p2 = []; for (let k = 0; k < o.n; k++) { p1.push(1 + k * 2); p2.push(2 + k * 2); }
      g.s = { n: o.n, p1, p2, noise: o.noise, turn: 1, phase: 'wait', wait: 0.8, next: 1, th: null, thT: 0, anim: null, done: false, turns: 0 };
      geo(g);
    },
    layout(g) { if (g.s.p1) geo(g); },
    tap(g, p) {
      const s = g.s; if (s.phase !== 'play' || s.anim) return; const q = hitSq(s, p.x, p.y); if (q < 0) return;
      const m = moves(s, 1, s.th.roll).find((m) => m.from === q); if (!m) { Arcade.sfx.bad(); return; } doMove(g, 1, m);
    },
    update(g, dt) {
      const s = g.s; if (!s.p1 || s.done) return;
      if (s.anim) { s.anim.t += dt / 0.32; if (s.anim.t >= 1) moved(g); return; }
      if (s.phase === 'throw') { s.thT += dt; if (s.thT >= 0.5) thrown(g); return; }
      if (s.phase === 'wait') { s.wait -= dt; if (s.wait <= 0) startTurn(g, s.next); return; }
      if (s.phase === 'ai') { s.wait -= dt; if (s.wait <= 0) { const m = choose(s, 2, s.th.roll, s.noise); if (m) doMove(g, 2, m); } }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#5c4614'); bg.addColorStop(1, '#1c1504'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (!s.p1) return;
      const U = s.U, bw = s.port ? U * 3 : U * 10, bh = s.port ? U * 10 : U * 3;
      ctx.fillStyle = 'rgba(0,0,0,.4)'; Arcade.rr(ctx, s.ox - 10 + 4, s.oy - 10 + 6, bw + 20, bh + 20, 10); ctx.fill();
      ctx.fillStyle = '#7a4f26'; Arcade.rr(ctx, s.ox - 10, s.oy - 10, bw + 20, bh + 20, 10); ctx.fill();
      const ms = s.phase === 'play' && !s.anim ? moves(s, 1, s.th.roll) : [], from = new Set(ms.map((m) => m.from)), to = new Set(ms.map((m) => m.to));
      for (let q = 1; q <= 30; q++) {
        const [x, y] = SQ(s, q); ctx.fillStyle = q % 2 ? '#e8cf96' : '#dcbf80'; ctx.fillRect(x - U / 2 + 1.5, y - U / 2 + 1.5, U - 3, U - 3);
        if (to.has(q)) { ctx.fillStyle = 'rgba(64,192,87,' + (0.3 + 0.2 * Math.sin(g.rt * 6)) + ')'; ctx.fillRect(x - U / 2 + 1.5, y - U / 2 + 1.5, U - 3, U - 3); }
        const sym = { 15: '☥', 26: '☀', 28: 'III', 29: 'II', 30: 'I' }[q];
        if (q === 27) { ctx.fillStyle = '#4dabf7'; ctx.fillRect(x - U / 2 + 1.5, y - U / 2 + 1.5, U - 3, U - 3); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; for (let k = -1; k <= 1; k++) { ctx.beginPath(); for (let xx = -U * 0.35; xx <= U * 0.35; xx += 3) ctx.lineTo(x + xx, y + k * U * 0.2 + Math.sin(xx * 0.3 + g.rt * 3) * 3); ctx.stroke(); } }
        else if (sym) Arcade.txt(ctx, sym, x, y, U * (sym.length > 1 ? 0.3 : 0.5), 'rgba(92,58,26,.55)', 'center', 900);
      }
      if (ms.length && to.has(31)) { const [x, y] = SQ(s, 31); ctx.fillStyle = 'rgba(64,192,87,' + (0.4 + 0.2 * Math.sin(g.rt * 6)) + ')'; ctx.beginPath(); ctx.arc(x, y, U * 0.35, 0, 6.3); ctx.fill(); }
      const r = U * 0.3, a = s.anim;
      const drawSide = (arr, who) => arr.forEach((p) => { if (p > 30) return; if (a && a.who === who && a.m.from === p) return; const [x, y] = SQ(s, p); if (who === 1 && from.has(p)) { ctx.strokeStyle = 'rgba(255,212,59,' + (0.55 + 0.3 * Math.sin(g.rt * 6)) + ')'; ctx.lineWidth = 3; ctx.strokeRect(x - U / 2 + 3, y - U / 2 + 3, U - 6, U - 6); } pawn(ctx, x, y, r, who); });
      drawSide(s.p2, 2); drawSide(s.p1, 1);
      if (a) { const [x0, y0] = SQ(s, a.m.from), [x1, y1] = SQ(s, Math.min(a.m.to, 31)), t = Math.min(1, a.t), e = t * t * (3 - 2 * t); pawn(ctx, x0 + (x1 - x0) * e, y0 + (y1 - y0) * e - Math.sin(t * Math.PI) * U * 0.5, r, a.who); }
      // piezas fuera
      const out1 = s.p1.filter((p) => p > 30).length, out2 = s.p2.filter((p) => p > 30).length;
      for (let k = 0; k < out1; k++) pawn(ctx, W / 2 - 40 - k * 18, g.top + 54, 7, 1); for (let k = 0; k < out2; k++) pawn(ctx, W / 2 + 40 + k * 18, g.top + 54, 7, 2);
      Arcade.txt(ctx, 'Fuera: ' + out1 + ' · ' + out2, W / 2, g.top + 56, 11, '#ffe8cc', 'center', 800);
      // palitos
      if (s.th) {
        const rolling = s.phase === 'throw', sw = Math.min(14, U * 0.2), sh = Math.min(52, U * 0.9);
        s.th.sticks.forEach((l, k) => { const x = W / 2 - 60 + k * 26, y = s.sticksY, light = rolling ? Math.random() < 0.5 : l; ctx.save(); ctx.translate(x, y); ctx.rotate(rolling ? Math.sin(s.thT * 30 + k) * 0.4 : (k - 1.5) * 0.06); ctx.fillStyle = 'rgba(0,0,0,.35)'; Arcade.rr(ctx, -sw / 2 + 2, -sh / 2 + 3, sw, sh, sw / 2); ctx.fill(); ctx.fillStyle = light ? '#fff3bf' : '#5c3a1a'; Arcade.rr(ctx, -sw / 2, -sh / 2, sw, sh, sw / 2); ctx.fill(); ctx.restore(); });
        if (!rolling) Arcade.txt(ctx, String(s.th.roll), W / 2 + 70, s.sticksY, 30, '#ffd43b', 'center', 900);
      }
      Arcade.txt(ctx, s.done ? '' : s.turn === 2 ? 'Turno de la máquina' : s.phase === 'play' ? 'Toca una pieza' : 'Tu turno', W / 2, g.top + 28, 16, '#fff3bf', 'center', 900);
    },
  });
})();
</script>
</body>
</html>
