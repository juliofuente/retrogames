<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mochila cohete · Arcade Perdido</title>
<meta name="theme-color" content="#2b2d42">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=84fed7f189"></script>
<script src="common.js?v=98a53d21cb"></script>
<script>
(function () {
  const { rand, ri, clamp, pick } = Arcade;
  const T = Arcade.T;

  function geo(g) {
    const s = g.s; s.k = clamp((g.bot - g.top) / 640, 0.7, 1.5);
    s.ceil = g.top + 34; s.floor = g.bot - 26 - (g.demoOn ? 34 : 0); s.px = Math.round(g.W * 0.24); s.r = 15 * s.k;
    s.G = 1500 * s.k; s.TH = 3100 * s.k; s.VM = 560 * s.k;
  }
  /* ---------- obstáculos (x en coordenadas del mundo = distancia recorrida en px) ---------- */
  function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, u = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1); return Math.hypot(px - ax - dx * u, py - ay - dy * u); }
  function zEnds(z, t) { const a = z.ang + z.rot * t, c = Math.cos(a) * z.len / 2, s2 = Math.sin(a) * z.len / 2; return [z.X - c, z.y - s2, z.X + c, z.y + s2]; }
  function spawn(g) {
    const s = g.s, L = g.lv, k = s.k, H = s.floor - s.ceil;
    while (s.nextX < s.dist + g.W * 1.6) {
      const X = s.nextX, r = Math.random();
      if (L >= 2 && r < 0.12 + L * 0.006 && !s.pendingEvent) s.events.push({ at: X - g.W * 0.9, kind: L >= 6 && Math.random() < 0.35 ? 'laser' : 'missile' }), s.pendingEvent = true;
      // zapper: largo, ángulo y a veces girando
      const len = clamp(rand(0.22, 0.38 + L * 0.008) * H, 70 * k, H * 0.5), ang = pick([0, Math.PI / 2, Math.PI / 4, -Math.PI / 4, Math.PI / 2]);
      const rot = L >= 5 && Math.random() < 0.25 + L * 0.01 ? rand(1, 1.6 + L * 0.03) * (Math.random() < 0.5 ? -1 : 1) : 0;
      const half = rot ? len / 2 : Math.abs(Math.sin(ang)) * len / 2;
      const y = rand(s.ceil + half + 4, s.floor - half - 4);
      s.zaps.push({ X, y, len, ang, rot });
      // monedas en el hueco
      if (Math.random() < 0.6) {
        const cy = y < (s.ceil + s.floor) / 2 ? rand(y + half + 40 * k, s.floor - 30 * k) : rand(s.ceil + 30 * k, y - half - 40 * k), n = ri(4, 8), shape = ri(0, 2);
        for (let i = 0; i < n; i++) s.coins.push({ X: X + (i - n / 2) * 26 * k + 180 * k, y: clamp(cy + (shape === 1 ? Math.sin(i / 1.3) * 24 * k : shape === 2 ? (i - n / 2) * 10 * k : 0), s.ceil + 12, s.floor - 12), got: false });
      }
      s.nextX += rand(260, 400) * k * clamp(1.15 - L * 0.012, 0.8, 1.15);
    }
  }
  function hazardAt(s, x, y, t, rt, margin) {   // ¿hay algo en (x de pantalla, y) dentro de t segundos? devuelve la distancia libre mínima
    let best = 1e9; const X = s.dist + s.spd * t + x - s.px + s.px;   // mundo en x de pantalla
    for (const z of s.zaps) { if (Math.abs(z.X - (s.dist + s.spd * t + x)) > z.len / 2 + 30) continue; const [ax, ay, bx, by] = zEnds(z, rt + t); best = Math.min(best, segDist(s.dist + s.spd * t + x, y, ax, ay, bx, by) - s.r - 7 * s.k); }
    for (const m of s.missiles) { const mx = m.launched ? m.x + m.vx * t : (m.t + t > m.warn ? g0.W + (m.vx) * (m.t + t - m.warn) : 1e9); if (Math.abs(mx - x) < 40 * s.k) best = Math.min(best, Math.abs(m.y - y) - s.r - 12 * s.k); }
    for (const l of s.lasers) { const on = l.t + t > l.warn - 0.15 && l.t + t < l.warn + l.on + 0.1; if (on) best = Math.min(best, Math.abs(l.y - y) - s.r - 8 * s.k); }
    void X; void margin; return best;
  }
  let g0 = null;
  function hit(g) {
    const s = g.s; if (s.inv > 0 || s.won) return;
    Arcade.sfx.bad(); g.shake && g.shake(8); g.flash && g.flash('#fff', 0.25); g.burst(s.px, s.y, { n: 18, emoji: '⚡', size: 14, speed: 220 });
    s.inv = 2; if (!g.die()) return;
    g.message(T('¡Calambrazo!', 'Zapped!'), 0.8);
  }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Mantén para volar entre los rayos', deco: ['🚀', '⚡', '🪙', '🧑‍🚀', '🔥', '⚠️'], font: 'impact', bg: ['#4a4e69', '#22223b'],
    music: { mode: 'minor', bpm: 140, wave: 'square', style: 'drive', root: 57 }, voice: { wave: 'square', mul: 1, echo: 0.2 },
    /*EN*/ en: { title: 'Jetpack Dash', tag: 'Hold to fly between the zappers', help: 'Your jetpack fires while you hold your finger on the screen and you go up. Let go and you fall. Fly through the lab without touching the electric zappers ⚡. A ⚠️ warns you a rocket is coming at that height: move out of the way. A dashed line means a laser is about to fire: leave that height. Grab the 🪙 coins. Reach the end of each level.', tvHelp: 'Hold OK to fly up.', dict: {} },
    /*TV*/ tvHelp: 'Mantén OK para subir.',
    id: 'propulsor', title: 'Mochila cohete', emoji: '🚀', color: '#ffd43b', origin: 'Jetpack Joyride (Halfbrick, 2011)', pad: false,
    help: 'Tu mochila cohete se enciende mientras mantienes el dedo en la pantalla y subes. Si lo sueltas, caes. Vuela por el laboratorio sin tocar los rayos eléctricos ⚡. Un ⚠️ avisa de que viene un cohete a esa altura: apártate. Una línea discontinua es un láser a punto de disparar: sal de esa altura. Coge las monedas 🪙. Llega al final de cada nivel.',
    lives: 3, levels: 0, cap: 20,
    /*SC*/ demo(g) {
      const s = g.s; if (!s || s.won) return { wait: 0.2 }; g0 = g;
      // planificador: prueba varias alturas objetivo, simula 1,4 s con el mismo control y se queda con la más segura
      const H = s.floor - s.ceil, cands = []; for (let i = 0; i <= 14; i++) cands.push(s.ceil + s.r + (H - 2 * s.r) * i / 14);
      let best = null;
      for (const c of cands) {
        let y = s.y, vy = s.vy, minC = 1e9, coins = 0, up = false, n = 0; const dt = 1 / 60;
        for (let t = dt; t < 1.4; t += dt) {
          if (n++ % 3 === 0) up = y - c + vy * 0.12 > 0; vy += (s.G - (up ? s.TH : 0)) * dt; vy = clamp(vy, -s.VM, s.VM); y += vy * dt;
          if (y < s.ceil + s.r) { y = s.ceil + s.r; vy = 0; } if (y > s.floor - s.r) { y = s.floor - s.r; vy = 0; }
          minC = Math.min(minC, hazardAt(s, s.px, y, t, s.rt, 0) - 6 * s.k + t * 4);
          for (const cn of s.coins) if (!cn.got && Math.abs(cn.X - (s.dist + s.spd * t + s.px)) < 14 && Math.abs(cn.y - y) < 22) coins++;
        }
        const sc = Math.min(minC, 60) + coins * 2 - Math.abs(c - s.y) * 0.02;
        if (!best || sc > best.sc) best = { sc, c };
      }
      s.aim = best.c;
      const up = s.y - best.c + s.vy * 0.12 > 0, first = !s.said; s.said = 1;
      const say = first ? T('Mantén el dedo para subir, suéltalo para bajar', 'Hold your finger to go up, let go to drop') : null;
      return up ? { hold: [g.W * 0.6, g.H * 0.55], dur: 1 / 20, after: 0, say } : { wait: 1 / 20, say };
    },
    setup(g) {
      g.s = { zaps: [], coins: [], missiles: [], lasers: [], events: [], dist: 0, nextX: 0, rt: 0, inv: 0, hold: false, won: false, fl: [] };
      geo(g); const s = g.s; s.y = s.floor - s.r; s.vy = 0; s.nextX = g.W * 1.1; s.goal = Math.round(260 + Math.min(g.lv, 30) * 26); s.spd0 = 300 * s.k * (1 + Math.min(g.lv, 25) * 0.02); s.spd = s.spd0; spawn(g);
    },
    layout(g) { if (g.s && g.s.zaps) geo(g); },
    down(g) { g.s.hold = true; },
    up(g) { g.s.hold = false; },
    key(g, k, d) { if (k === ' ' || k === 'ArrowUp') g.s.hold = d; },
    update(g, dt) {
      const s = g.s; if (!s.zaps) return; geo(g); s.rt += dt; g0 = g;
      if (s.inv > 0) s.inv -= dt;
      for (const f of s.fl) { f.x -= s.spd * dt * 0.6; f.y += f.vy * dt; f.t -= dt; } s.fl = s.fl.filter((f) => f.t > 0);
      if (s.won) { s.y = Math.min(s.floor - s.r, s.y + 200 * dt); return; }
      const m = s.dist / (30 * s.k); s.spd = s.spd0 * (1 + Math.min(m / s.goal, 1) * 0.25);
      s.dist += s.spd * dt;
      s.vy += (s.G - (s.hold ? s.TH : 0)) * dt; s.vy = clamp(s.vy, -s.VM, s.VM); s.y += s.vy * dt;
      if (s.y < s.ceil + s.r) { s.y = s.ceil + s.r; s.vy = 0; } if (s.y > s.floor - s.r) { s.y = s.floor - s.r; s.vy = 0; }
      if (s.hold) { s.fl.push({ x: s.px - 10 * s.k, y: s.y + 18 * s.k, vy: rand(150, 300), t: 0.3 }); if (Math.random() < 0.3) Arcade.noise(0.04, 0.02, 300); }
      spawn(g);
      // eventos (cohetes y láseres)
      for (const e of s.events) if (!e.done && s.dist >= e.at) {
        e.done = true; s.pendingEvent = false;
        if (e.kind === 'missile') { const n = g.lv >= 10 && Math.random() < 0.4 ? 2 : 1; for (let i = 0; i < n; i++) s.missiles.push({ y: s.y + (i ? rand(-1, 1) * 90 * s.k : 0), t: -i * 0.5, warn: 1.5, x: 0, vx: -(s.spd + 520 * s.k), launched: false, track: !i }); Arcade.tone(990, 0.08, 'square', 0.05); }
        else { const ys = [rand(s.ceil + 30, s.floor - 30)]; if (g.lv >= 12 && Math.random() < 0.5) ys.push(ys[0] < (s.ceil + s.floor) / 2 ? ys[0] + rand(120, 200) * s.k : ys[0] - rand(120, 200) * s.k); for (const y of ys) s.lasers.push({ y: clamp(y, s.ceil + 20, s.floor - 20), t: 0, warn: 1.6, on: 1.1 }); }
      }
      s.events = s.events.filter((e) => !e.done);
      for (const mi of s.missiles) {
        mi.t += dt;
        if (!mi.launched) { if (mi.track && mi.t < mi.warn - 0.5) mi.y += clamp(s.y - mi.y, -200 * dt, 200 * dt); if (mi.t >= mi.warn) { mi.launched = true; mi.x = g.W + 30; Arcade.noise(0.25, 0.08, 500); } }
        else { mi.x += mi.vx * dt; if (Math.random() < 0.6) s.fl.push({ x: mi.x + 26 * s.k, y: mi.y + rand(-4, 4), vy: rand(-30, 30), t: 0.3 }); if (s.inv <= 0 && Math.hypot(mi.x - s.px, mi.y - s.y) < s.r + 12 * s.k) { mi.x = -999; hit(g); } }
      }
      s.missiles = s.missiles.filter((mi) => !mi.launched || mi.x > -60);
      for (const l of s.lasers) { const was = l.t; l.t += dt; if (was < l.warn && l.t >= l.warn) Arcade.tone(220, 0.5, 'sawtooth', 0.05, 60); if (l.t > l.warn && l.t < l.warn + l.on && Math.abs(l.y - s.y) < s.r + 6 * s.k) hit(g); }
      s.lasers = s.lasers.filter((l) => l.t < l.warn + l.on + 0.3);
      // rayos y monedas
      const PX = s.dist + s.px;
      for (const z of s.zaps) { if (Math.abs(z.X - PX) > z.len / 2 + 30) continue; const [ax, ay, bx, by] = zEnds(z, s.rt); if (segDist(PX, s.y, ax, ay, bx, by) < s.r + 7 * s.k) hit(g); }
      for (const c of s.coins) if (!c.got && Math.abs(c.X - PX) < s.r + 8 && Math.abs(c.y - s.y) < s.r + 8) { c.got = true; g.addScore(5); Arcade.sfx.coin(); }
      s.zaps = s.zaps.filter((z) => z.X > s.dist - 200); s.coins = s.coins.filter((c) => c.X > s.dist - 50);
      const nm = Math.floor(s.dist / (30 * s.k)); if (nm > (s.lastM || 0)) { g.addScore(nm - (s.lastM || 0)); s.lastM = nm; }
      if (nm >= s.goal && !s.won) { s.won = true; s.hold = false; g.confetti(70); Arcade.sfx.win(); g.addScore(100 * g.lv, g.W / 2, g.H / 2); setTimeout(() => { if (g.state === 'play') g.win(g.lives >= 3 ? 3 : g.lives >= 2 ? 2 : 1); }, 1000); }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H; if (!s.zaps) return; const k = s.k;
      const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#2b2d42'); bg.addColorStop(1, '#14141f'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      // pared del laboratorio con ventanas (paralaje)
      const off = (s.dist * 0.4) % (220 * k);
      for (let x = -off; x < W + 220 * k; x += 220 * k) { ctx.fillStyle = 'rgba(141,153,174,.10)'; ctx.fillRect(x + 20 * k, s.ceil + 40 * k, 120 * k, (s.floor - s.ceil) * 0.4); ctx.fillStyle = 'rgba(141,153,174,.06)'; ctx.fillRect(x + 160 * k, s.ceil, 14 * k, s.floor - s.ceil); }
      ctx.fillStyle = '#8d99ae'; ctx.fillRect(0, s.ceil - 8, W, 8); ctx.fillRect(0, s.floor, W, 8);
      ctx.fillStyle = '#4a4e69'; const fo = s.dist % (40 * k); for (let x = -fo; x < W; x += 40 * k) { ctx.fillRect(x, s.floor + 8, 20 * k, H - s.floor); }
      // monedas
      for (const c of s.coins) { if (c.got) continue; const x = c.X - s.dist; if (x < -20 || x > W + 20) continue; Arcade.emoji(ctx, '🪙', x, c.y, 18 * k); }
      // rayos
      for (const z of s.zaps) {
        const [ax, ay, bx, by] = zEnds(z, s.rt), ox = -s.dist; if (Math.max(ax, bx) + ox < -30 || Math.min(ax, bx) + ox > W + 30) continue;
        ctx.strokeStyle = 'rgba(255,224,102,.35)'; ctx.lineWidth = 12 * k; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ax + ox, ay); ctx.lineTo(bx + ox, by); ctx.stroke();
        ctx.strokeStyle = '#fff3bf'; ctx.lineWidth = 2.5; ctx.beginPath(); const n = 9; for (let i = 0; i <= n; i++) { const u = i / n, j = i && i < n ? rand(-5, 5) * k : 0, nx = -(by - ay), ny = bx - ax, nl = Math.hypot(nx, ny) || 1; const x = ax + (bx - ax) * u + nx / nl * j + ox, y = ay + (by - ay) * u + ny / nl * j; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
        for (const [x, y] of [[ax, ay], [bx, by]]) { ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(x + ox, y, 9 * k, 0, 6.3); ctx.fill(); ctx.fillStyle = '#495057'; ctx.beginPath(); ctx.arc(x + ox, y, 4.5 * k, 0, 6.3); ctx.fill(); }
      }
      // láseres
      for (const l of s.lasers) {
        if (l.t < l.warn) { ctx.strokeStyle = `rgba(255,107,107,${0.4 + 0.4 * Math.sin(l.t * 20)})`; ctx.lineWidth = 2; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.moveTo(0, l.y); ctx.lineTo(W, l.y); ctx.stroke(); ctx.setLineDash([]); Arcade.emoji(ctx, '⚠️', W - 18, l.y, 18); Arcade.emoji(ctx, '⚠️', 18, l.y, 18); }
        else if (l.t < l.warn + l.on) { ctx.fillStyle = 'rgba(255,107,107,.45)'; ctx.fillRect(0, l.y - 12 * k, W, 24 * k); ctx.fillStyle = '#fff'; ctx.fillRect(0, l.y - 3 * k, W, 6 * k); }
      }
      // cohetes
      for (const mi of s.missiles) {
        if (!mi.launched) { if (Math.floor(mi.t * 8) % 2 === 0) Arcade.emoji(ctx, '⚠️', W - 22, mi.y, 26 * k); continue; }
        ctx.save(); ctx.translate(mi.x, mi.y); ctx.rotate(-Math.PI * 3 / 4); Arcade.emoji(ctx, '🚀', 0, 0, 30 * k); ctx.restore();
      }
      // fuego
      for (const f of s.fl) { ctx.globalAlpha = f.t / 0.3; ctx.fillStyle = f.t > 0.2 ? '#fff3bf' : f.t > 0.1 ? '#ffa94d' : '#e8590c'; ctx.beginPath(); ctx.arc(f.x, f.y, 5 * k * (f.t / 0.3 + 0.4), 0, 6.3); ctx.fill(); } ctx.globalAlpha = 1;
      // personaje
      if (!(s.inv > 0 && Math.floor(s.inv * 10) % 2)) {
        const tilt = clamp(s.vy / s.VM, -1, 1) * 0.25; ctx.save(); ctx.translate(s.px, s.y); ctx.rotate(tilt);
        ctx.fillStyle = '#868e96'; Arcade.rr(ctx, -20 * k, -10 * k, 12 * k, 24 * k, 4); ctx.fill(); ctx.fillStyle = '#e03131'; ctx.fillRect(-19 * k, 10 * k, 10 * k, 4 * k);
        Arcade.emoji(ctx, s.y >= s.floor - s.r - 1 && !s.hold ? '🏃' : '🧑‍🚀', 0, 0, 36 * k, { flip: true }); ctx.restore();
      }
      if (g.demoOn && s.aim) { ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(s.px + 30, s.aim); ctx.lineTo(W, s.aim); ctx.stroke(); ctx.setLineDash([]); }
      // distancia
      const m = Math.min(s.goal, Math.floor(s.dist / (30 * k))), t = m / s.goal, bw = Math.min(W - 200, 260), bx = (W - bw) / 2, by = g.top + 10;
      ctx.fillStyle = 'rgba(0,0,0,.4)'; Arcade.rr(ctx, bx, by, bw, 10, 5); ctx.fill(); ctx.fillStyle = '#ffd43b'; Arcade.rr(ctx, bx, by, bw * t, 10, 5); ctx.fill();
      Arcade.txt(ctx, m + ' m', bx - 8, by + 5, 13, '#fff', 'right', 900); Arcade.emoji(ctx, '🏁', bx + bw + 12, by + 5, 16);
    },
  });
})();
</script>
</body>
</html>
