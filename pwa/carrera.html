<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Carrera · Arcade Perdido</title>
<meta name="theme-color" content="#ffc078">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=a2ee08541b"></script>
<script src="common.js?v=16b4670bbf"></script>
<script>
(function () {
  const { ri, rand, clamp, pick } = Arcade;
  const RUNNERS = ['😀', '🦖', '🐕', '🤸', '🦌'];

  function geo(g) { const s = g.s; s.gy = g.bot - 90; s.px = g.W * 0.22; s.u = clamp((g.bot - g.top) / 600, 0.7, 1.4); }
  function spawn(g) {
    const s = g.s, L = g.lv, r = Math.random();
    if (r < 0.45) s.obs.push({ x: g.W + 40, t: 'low', e: pick(['🌵', '🪨', '🛢️', '🔥']) });
    else if (r < 0.75 && L >= 2) s.obs.push({ x: g.W + 40, t: 'high', e: pick(['🦇', '🪵', '👻']) });
    else if (r < 0.88 && L >= 4) { s.obs.push({ x: g.W + 40, t: 'low', e: '🌵' }); s.obs.push({ x: g.W + 40 + 70 * s.u, t: 'low', e: '🌵' }); }
    else s.obs.push({ x: g.W + 40, t: 'coin', e: '🪙', h: rand(30, 110) });
  }
  function jump(g) { const s = g.s; if (s.dead) return; if (s.y === 0) { s.vy = 620; s.jumps = 1; Arcade.tone(500, 0.05, 'square', 0.05, 250); } else if (s.jumps < 2) { s.vy = 520; s.jumps = 2; Arcade.tone(700, 0.05, 'square', 0.05, 250); } s.slide = 0; }
  function slide(g) { const s = g.s; if (s.dead) return; s.slide = 0.6; if (s.y > 0) s.vy = -800; Arcade.sfx.whoosh(); }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Salta lo bajo, agáchate de lo alto', deco: ['😀', '🌵', '🦇', '🪙', '🏰', '☀️'], font: 'impact', bg: ['#ffd8a8', '#ffc078'],
    music: { mode: 'mixo', bpm: 140, wave: 'square', style: 'arcade', root: 60 }, voice: { wave: 'square', mul: 1, echo: 0.2 },
    en: { title: 'Run', tag: 'Jump the low ones, duck the high ones', help: 'Your runner never stops. <b>Tap</b> to jump (tap again in the air for a double jump) and <b>swipe down</b> to slide under things. Jump over cacti and barrels and slide under bats and logs. Grab the 🪙 coins and run the distance each level asks for.', tvHelp: '▲ or OK jump · ▼ slide.', dict: {} },
    tvHelp: '▲ u OK saltar · ▼ deslizarse.',
    id: 'carrera', title: 'Carrera', emoji: '😀', color: '#ff922b', origin: 'Endless Runner / Castle Ramble / Roly Poly',
    help: 'Tu corredor no para nunca. <b>Toca</b> para saltar (vuelve a tocar en el aire para un doble salto) y <b>desliza hacia abajo</b> para agacharte. Salta cactus y barriles y agáchate bajo murciélagos y troncos. Coge las monedas 🪙 y recorre la distancia que pide cada nivel.',
    lives: 3, levels: 0, cap: 25,
    setup(g) { const L = g.lv; g.s = { obs: [], y: 0, vy: 0, jumps: 0, slide: 0, dist: 0, t: 1, sp: 300 + Math.min(L, 25) * 12, need: 800 + Math.min(L, 25) * 120, inv: 0, runner: RUNNERS[(g.level - 1) % RUNNERS.length] }; geo(g); },
    layout(g) { if (g.s.obs) geo(g); },
    tap(g) { jump(g); },
    swipe(g, d) { if (d === 'down') slide(g); else if (d === 'up') jump(g); },
    key(g, k, d) { if (!d) return; if (k === ' ' || k === 'ArrowUp') jump(g); else if (k === 'ArrowDown') slide(g); },
    update(g, dt) {
      const s = g.s; if (s.done) return;
      s.inv = Math.max(0, s.inv - dt); s.slide = Math.max(0, s.slide - dt);
      s.vy -= 1700 * dt; s.y = Math.max(0, s.y + s.vy * dt); if (s.y === 0) { s.vy = 0; s.jumps = 0; }
      const sp = s.sp * s.u; s.dist += sp * dt / 30;
      s.t -= dt; if (s.t <= 0) { s.t = rand(0.7, 1.3) * Math.max(0.6, 1 - g.lv * 0.015); spawn(g); }
      const ph = s.slide > 0 ? 24 : 50, u = s.u;
      for (const o of s.obs) {
        o.x -= sp * dt; if (o.done) continue;
        if (Math.abs(o.x - s.px) < 26 * u) {
          if (o.t === 'coin') { if (Math.abs((o.h * u) - (s.y + ph / 2)) < 40) { o.done = true; Arcade.sfx.coin(); g.addScore(10 * g.lv); } continue; }
          const hit = o.t === 'low' ? s.y < 40 * u : s.slide <= 0 && s.y < 110 * u;
          if (hit && !s.inv) { o.done = true; s.inv = 1.2; Arcade.sfx.hit(); g.shake(0.25, 6); g.burst(s.px, s.gy - 30, { n: 12, color: ['#fff', '#ffa94d'], speed: 160, size: 4 }); if (!g.die()) return; }
        }
      }
      s.obs = s.obs.filter((o) => o.x > -60);
      if (Math.floor(s.dist / 50) !== Math.floor((s.dist - sp * dt / 30) / 50)) g.addScore(g.lv);
      if (s.dist >= s.need) { s.done = true; g.confetti(60); setTimeout(() => { if (g.state === 'play') g.win(); }, 500); }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H, u = s.u;
      const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#ffa94d'); bg.addColorStop(1, '#fff4e6');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (!s.obs) return;
      Arcade.emoji(ctx, '☀️', W * 0.8, g.top + 60, 60);
      for (let k = 0; k < 2; k++) { ctx.fillStyle = k ? 'rgba(232,89,12,.25)' : 'rgba(232,89,12,.15)'; ctx.beginPath(); ctx.moveTo(0, s.gy); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, s.gy - 60 - k * 40 - Math.abs(Math.sin((x + s.dist * (4 + k * 4)) / (90 + k * 50))) * 60); ctx.lineTo(W, s.gy); ctx.fill(); }
      Arcade.emoji(ctx, '🏰', ((W + 200) - (s.dist * 2) % (W + 400)), s.gy - 60, 80, { alpha: 0.5 });
      ctx.fillStyle = '#c68642'; ctx.fillRect(0, s.gy, W, H - s.gy); ctx.fillStyle = '#8d5524'; for (let x = -(s.dist * 10) % 40; x < W; x += 40) ctx.fillRect(x, s.gy + 10, 20, 4);
      for (const o of s.obs) { if (o.done && o.t !== 'low' && o.t !== 'high') continue; const y = o.t === 'low' ? s.gy - 20 * u : o.t === 'high' ? s.gy - 80 * u : s.gy - o.h * u; Arcade.emoji(ctx, o.e, o.x, y, (o.t === 'coin' ? 24 : 40) * u, { alpha: o.done ? 0.4 : 1 }); }
      const ph = s.slide > 0 ? 0.55 : 1;
      Arcade.emoji(ctx, s.slide > 0 ? '😬' : s.y > 10 ? (s.jumps === 2 ? '🤪' : '😲') : g.face(), s.px, s.gy - s.y - 26 * u * ph, 44 * u, { sy: ph, rot: s.jumps === 2 ? -g.rt * 12 : s.slide > 0 ? -0.5 : 0, alpha: s.inv && Math.floor(g.rt * 12) % 2 ? 0.4 : 1 });
      Arcade.txt(ctx, Math.floor(s.dist) + ' / ' + s.need + ' m', W / 2, g.top + 20, 15, '#7a3b00', 'center', 900);
    },
  });
})();
</script>
</body>
</html>
