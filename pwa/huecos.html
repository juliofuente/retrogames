<body class="game">
<script src="config.js?v=84fed7f189"></script>
<script src="common.js?v=e80717317d"></script>
<script src="cartas.js?v=ae2088dc63"></script>
<script>
// @cartas
(function () {
  const P = Arcade.paciencia, { R, S } = Arcade.cartas;
  // 4 filas de 13 casillas; los ases se quitan y dejan huecos
  const COLS = 13, at = (r, c) => r * COLS + c;
  const prefix = (st, r) => { let n = 0; const s0 = st.p[at(r, 0)][0]; if (s0 == null || R(s0) !== 2) return 0; for (let c = 0; c < COLS; c++) { const x = st.p[at(r, c)][0]; if (x == null || S(x) !== S(s0) || R(x) !== c + 2) break; n++; } return n; };
  const V = {
    autoSafe: false, autoFinish: false, tapFill: true, dimBlocked: false,
    found: { mode: 'none' }, tab: { build: 'none', move: 'one', empty: 'none' },
    piles: () => { const L = []; for (let r = 0; r < 4; r++) for (let c = 0; c < COLS; c++) L.push({ k: 'grid', r, c, label: '' }); return L.concat(P.mk([['disc', 1, { hide: true }]])); },
    init(lv) { this.redeal.times = lv < 6 ? 8 : lv < 12 ? 5 : 3; },
    deal(st, D, deck) { const dc = P.of(D, 'disc')[0]; deck.forEach((c, k) => { if (R(c) === 1) st.p[dc].push(c); else st.p[k].push(c); }); },
    canDrop(st, D, from, n, to) {
      const d = D[to]; if (d.k !== 'grid') return false; if (st.p[to].length || n !== 1 || D[from].k !== 'grid') return false;
      const c = st.p[from][st.p[from].length - 1];
      if (d.c === 0) return R(c) === 2;
      const left = st.p[to - 1][0]; return left != null && S(left) === S(c) && R(c) === R(left) + 1;
    },
    score(st, D, m) {   // mejor si alarga una fila ya ordenada; nunca deshacer lo ordenado
      if (m.rdl) return -5; if (m.f == null) return null;
      const df = D[m.f], dt = D[m.t]; let s = 0;
      if (df.c < prefix(st, df.r)) s -= 200;
      if (dt.c === prefix(st, dt.r)) s += 60 + dt.c;
      return s;
    },
    redeal: { times: 3, run(st, D) { const rest = []; for (let r = 0; r < 4; r++) { const k = prefix(st, r); for (let c = k; c < COLS; c++) { const i = at(r, c); if (st.p[i].length) rest.push(st.p[i].pop()); } } for (let k = rest.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [rest[k], rest[j]] = [rest[j], rest[k]]; } for (let r = 0; r < 4; r++) { const k = prefix(st, r); for (let c = k + 1; c < COLS; c++) st.p[at(r, c)].push(rest.shift()); } st.rr = (st.rr || 0) + 1; } },
    won: (st) => [0, 1, 2, 3].every((r) => prefix(st, r) === 12),
    place(g, s, D, y0) {
      const land = g.W > g.H * 1.15, avail = g.bot - y0 - 8, cw = Math.min((g.W - 12) / (COLS + 0.6), (avail - 3 * 8) / 4 / 1.4, 78); s.cw = cw;
      const ch = cw * 1.4, gap = (g.W - 12 - COLS * cw) / (COLS - 1), x0 = 6, y1 = y0 + Math.max(0, (avail - 4 * ch - 3 * 8) / (land ? 2 : 3));
      D.forEach((d) => { if (d.k === 'grid') { d.x = x0 + d.c * (cw + Math.max(1, gap)); d.y = y1 + d.r * (ch + 8); } if (d.k === 'disc') { d.x = -999; d.y = -999; } });
    },
    status: (st) => Arcade.T('Ordenadas: ', 'In order: ') + [0, 1, 2, 3].reduce((a, r) => a + prefix(st, r), 0) + '/48 · ' + Arcade.T('Barajados: ', 'Shuffles: ') + (st.rr || 0),
    tutorial: (g, all) => [
      { piles: all('grid'), t: Arcade.T('🎯 Objetivo: dejar cada fila ordenada del 2 a la K, todas del mismo palo. Los ases se han quitado y han dejado huecos.', '🎯 Goal: leave every row in order from 2 to K, all of one suit. The aces have been removed and left gaps.') },
      { piles: all('grid').filter((i) => !g.s.st.p[i].length), t: Arcade.T('Los huecos: solo se llenan con la carta del mismo palo y un número más que la de su izquierda (tras un 7♥, el 8♥). En el primer sitio de una fila, solo un 2. Detrás de una K no cabe nada. Toca un hueco y se llena solo.', 'The gaps: they can only be filled with the card of the same suit and one rank higher than the one on their left (after a 7♥, the 8♥). In the first spot of a row, only a 2. Nothing fits after a K. Tap a gap and it fills itself.') },
    ],
    felt: ['#45306b', '#2a1b3d'], back: ['#cc5de8', '#862e9c'], backEmoji: '🔀',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Ordena cada fila del 2 a la K', deco: ['🃏', '♠️', '♥️', '♦️', '♣️', '🔀'], font: 'serif', bg: ['#45306b', '#2a1b3d'],
    music: { mode: 'lydian', bpm: 84, wave: 'sine', style: 'chill', root: 62 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Gaps', tag: 'Sort every row from 2 to K', help: 'Montana solitaire. The aces are removed and leave <b>gaps</b>. A gap can only be filled by the card <b>of the same suit and one rank higher</b> than the one on its left (after a 7♥, only the 8♥); in the first spot of a row, only a <b>2</b>. <b>Tap a gap</b> (or the card you want to move) and it moves by itself. Leave each row in order from 2 to K of a single suit. If you get stuck, press 🔀: the cards already in order stay put and the rest are shuffled (8 times in the first levels, then 5 and from level 12, 3). 💡 gives a hint, ↩️ undoes and 📖 opens the tutorial.', tvHelp: 'D-pad to a gap or a card · OK to move it.', dict: { 'Ordenadas: ': 'In order: ', 'Barajados: ': 'Shuffles: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta un hueco o una carta · OK para moverla.',
    id: 'huecos', title: 'Huecos', emoji: '🔀', color: '#cc5de8', origin: 'Montana / Gaps / Gap Hop (Lutanho)',
    help: 'El solitario Montana. Se quitan los ases y quedan <b>huecos</b>. Un hueco solo se puede llenar con la carta <b>del mismo palo y un número más</b> que la de su izquierda (tras un 7♥, solo el 8♥); en el primer sitio de una fila, solo un <b>2</b>. <b>Toca un hueco</b> (o la carta que quieres mover) y se coloca sola. Deja cada fila ordenada del 2 a la K de un mismo palo. Si te atascas, pulsa 🔀: las cartas que ya están en orden se quedan y las demás se barajan (8 veces en los primeros niveles, luego 5 y desde el nivel 12, 3). 💡 te da una pista, ↩️ deshace y 📖 abre el tutorial.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
</body>
</html>
