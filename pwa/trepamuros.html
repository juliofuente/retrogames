<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Trepamuros · Arcade Perdido</title>
<meta name="theme-color" content="#2f3e46">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=c6b9a5638f"></script>
<script src="common.js?v=457f6ee8db"></script>
<script>
(function () {
  const { ri, rand, clamp, pick } = Arcade;
  const HEROES = ['😀'];

  function geo(g) { const s = g.s; s.ww = Math.min(60, g.W * 0.14); s.xl = s.ww + 20; s.xr = g.W - s.ww - 20; s.py = g.top + (g.bot - g.top) * 0.62; }
  function gen(s, upto, L) {
    while (s.genY < upto) {
      const side = ri(0, 1), len = rand(60, 120 + L * 4);
      s.spikes.push({ side, y0: s.genY, y1: s.genY + len });
      if (L >= 3 && Math.random() < 0.3) s.birds.push({ y: s.genY + len + 80, x: null, dir: Math.random() < 0.5 ? 1 : -1, sp: rand(80, 140) });
      if (Math.random() < 0.5) s.coins.push({ side: 1 - side, y: s.genY + len / 2 });
      s.genY += len + rand(150, 260) - Math.min(L, 20) * 4;
    }
  }
  function jump(g) { const s = g.s; if (s.air || s.dead) return; s.air = true; s.t = 0; s.from = s.side; s.side = 1 - s.side; Arcade.tone(500, 0.05, 'triangle', 0.05, 300); }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'De pared a pared hacia arriba', deco: ['😀', '🧱', '🔺', '🪙', '🦇', '⬆️'], font: 'round', bg: ['#52796f', '#2f3e46'],
    music: { mode: 'dorian', bpm: 126, wave: 'triangle', style: 'arcade', root: 60 }, voice: { wave: 'triangle', mul: 1.1, echo: 0.2 },
    en: { title: 'Wall Climber', tag: 'Wall to wall, upwards', help: 'The panda climbs a wall by itself. <b>Tap</b> to jump to the opposite wall. Jump before you reach the 🔺 spikes on your side and avoid the bats that cross the gap. Grab the 🪙 coins. Climb the height each level asks for.', tvHelp: 'OK to jump.', dict: { 'Altura: ': 'Height: ' } },
    tvHelp: 'OK para saltar.',
    id: 'trepamuros', title: 'Trepamuros', emoji: '😀', color: '#84a98c', origin: 'Dashy Panda / Dash N Blast',
    help: 'El panda trepa solo por una pared. <b>Toca</b> para saltar a la pared contraria. Salta antes de llegar a los pinchos 🔺 de tu lado y esquiva los murciélagos que cruzan el hueco. Coge las monedas 🪙. Sube la altura que pide cada nivel.',
    lives: 3, levels: 0, cap: 25,
    setup(g) { const L = g.lv; g.s = { h: 0, side: 0, air: false, t: 0, spikes: [], birds: [], coins: [], genY: 300, sp: 170 + Math.min(L, 25) * 6, need: 2500 + Math.min(L, 25) * 300, hero: HEROES[(g.level - 1) % HEROES.length], inv: 0 }; geo(g); gen(g.s, 1500, L); },
    layout(g) { if (g.s.spikes) geo(g); },
    down(g) { jump(g); },
    key(g, k, d) { if (d && (k === ' ' || k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp')) jump(g); },
    update(g, dt) {
      const s = g.s; if (s.done) return;
      s.inv = Math.max(0, s.inv - dt);
      if (s.dead) { s.dead -= dt; if (s.dead <= 0) { s.dead = 0; if (g.die()) { s.inv = 1.5; s.spikes = s.spikes.filter((k) => k.y1 < s.h - 50 || k.y0 > s.h + 220); } } return; }
      s.h += s.sp * dt; gen(s, s.h + 1500, g.lv);
      if (s.air) { s.t += dt / 0.28; if (s.t >= 1) { s.t = 1; s.air = false; } }
      const x = s.air ? (s.from ? s.xr : s.xl) + ((s.side ? s.xr : s.xl) - (s.from ? s.xr : s.xl)) * s.t : s.side ? s.xr : s.xl;
      s.x = x;
      if (!s.air && !s.inv) for (const k of s.spikes) if (k.side === s.side && s.h + 10 > k.y0 && s.h - 10 < k.y1) { s.dead = 0.8; Arcade.sfx.hit(); g.shake(0.25, 6); g.burst(x, s.py, { n: 14, color: ['#fff', '#000'], speed: 160, size: 4 }); return; }
      for (const b of s.birds) { if (b.x == null && b.y - s.h < 500) b.x = b.dir > 0 ? s.xl : s.xr; if (b.x != null) b.x += b.dir * b.sp * dt; if (b.x != null && !s.inv && Math.abs(b.x - x) < 26 && Math.abs(b.y - s.h) < 24) { s.dead = 0.8; Arcade.sfx.hit(); return; } if (b.x != null && (b.x < s.xl - 10 || b.x > s.xr + 10)) b.dir *= -1; }
      for (const c of s.coins) if (!c.got && c.side === s.side && !s.air && Math.abs(c.y - s.h) < 20) { c.got = true; Arcade.sfx.coin(); g.addScore(10 * g.lv); }
      s.spikes = s.spikes.filter((k) => k.y1 > s.h - 600); s.birds = s.birds.filter((b) => b.y > s.h - 600); s.coins = s.coins.filter((c) => c.y > s.h - 600);
      if (Math.floor(s.h / 100) !== Math.floor((s.h - s.sp * dt) / 100)) g.addScore(g.lv);
      if (s.h >= s.need) { s.done = true; g.confetti(60); setTimeout(() => { if (g.state === 'play') g.win(); }, 500); }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      const hue = (g.level * 37) % 360; const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, `hsl(${hue},30%,40%)`); bg.addColorStop(1, `hsl(${hue},30%,20%)`);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (!s.spikes) return;
      const Y = (wy) => s.py - (wy - s.h);
      g.scenery(['🌙', '⭐', '☁️'], 6, { alpha: 0.2, size: [24, 50] });
      // muros con ladrillos
      for (const [x0, w] of [[0, s.ww + 6], [W - s.ww - 6, s.ww + 6]]) { ctx.fillStyle = '#6c757d'; ctx.fillRect(x0, 0, w, H); ctx.fillStyle = 'rgba(0,0,0,.2)'; const off = s.h % 40; for (let y = -40; y < H + 40; y += 20) ctx.fillRect(x0, y + off, w, 2); }
      for (const k of s.spikes) {
        const ya = Y(k.y1), yb = Y(k.y0), x = k.side ? W - s.ww - 6 : s.ww + 6, dir = k.side ? -1 : 1;
        ctx.fillStyle = '#e03131'; for (let y = ya; y < yb; y += 14) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dir * 14, y + 7); ctx.lineTo(x, y + 14); ctx.fill(); }
      }
      for (const c of s.coins) if (!c.got) Arcade.emoji(ctx, '🪙', c.side ? s.xr : s.xl, Y(c.y), 22);
      for (const b of s.birds) if (b.x != null) Arcade.emojiTo(ctx, '🦇', b.x, Y(b.y), 30, b.dir, 0);
      if (!s.dead) Arcade.emoji(ctx, s.air ? (s.t < 0.3 ? '😲' : g.face()) : g.face(), s.x, s.py, 38, { rot: s.air ? (s.side ? 1 : -1) * Math.sin(s.t * Math.PI) * 0.6 : 0, alpha: s.inv && Math.floor(g.rt * 12) % 2 ? 0.4 : 1 });
      const pr = clamp(s.h / s.need, 0, 1); ctx.fillStyle = 'rgba(255,255,255,.2)'; Arcade.rr(ctx, W / 2 - 4, g.top + 30, 8, H * 0.3, 4); ctx.fill(); ctx.fillStyle = '#ffd43b'; Arcade.rr(ctx, W / 2 - 4, g.top + 30 + H * 0.3 * (1 - pr), 8, H * 0.3 * pr, 4); ctx.fill();
      Arcade.txt(ctx, 'Altura: ' + Math.floor(s.h / 10) + ' m', W / 2, g.top + 16, 14, '#fff', 'center', 900);
    },
  });
})();
</script>
</body>
</html>
