<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Órbita · Arcade Perdido</title>
<meta name="theme-color" content="#0a0f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=84fed7f189"></script>
<script src="common.js?v=e80717317d"></script>
<script>
(function () {
  const { pick, rand } = Arcade;
  const TAU = Math.PI * 2;

  function geo(g) { const s = g.s; s.d = Math.min(g.W, g.bot - g.top) / 6.2; }
  function genPath(g) {
    const s = g.s, n = 14 + Math.min(g.lv, 16) * 3, pts = [{ x: 0, y: 0 }];
    const angs = [-90, -90, -60, -120, -30, -150, 0, 180].map((a) => (a * Math.PI) / 180);
    while (pts.length < n) {
      const last = pts[pts.length - 1]; let ok = false;
      for (let t = 0; t < 30 && !ok; t++) {
        const a = pick(angs), p = { x: last.x + Math.cos(a), y: last.y + Math.sin(a) };
        if (Math.abs(p.x) > 1.8) continue;
        if (pts.slice(0, -1).every((q) => Math.hypot(q.x - p.x, q.y - p.y) > 0.95)) { pts.push(p); ok = true; }
      }
      if (!ok) pts.push({ x: last.x, y: last.y - 1 });
    }
    s.path = pts.map((p, i) => ({ x: p.x, y: p.y, gem: i > 0 && i % 5 === 0 }));
  }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Dos bolas, un camino', deco: ['🔴', '🔵', '✨', '🌌', '💠', '🏁'], font: 'round', bg: ['#141c44', '#0a0f24'],
    music: { mode: 'lydian', bpm: 120, wave: 'triangle', style: 'chill', root: 62 }, voice: { wave: 'sine', mul: 1.2, echo: 0.35 },
    ambient: { e: ['⭐', '✨'], n: 14, vy: 6, sway: 0, twinkle: 1, alpha: 0.3, size: [6, 12] },
    en: { title: 'Orbit', tag: 'Two balls, one path', help: 'One ball stays still while the other <b>orbits</b> around it. <b>Tap</b> when the spinning ball is over the next tile: it stops there and the other one starts spinning. Follow the path to the 🏁 flag. Tap when it\'s not over a tile and you fall off. 💠 gems give points.', tvHelp: 'OK when the spinning ball is over the next tile.', dict: { 'Casillas: ': 'Tiles: ', '¡Fuera!': 'Off the path!' } },
    tvHelp: 'OK cuando la bola que gira esté sobre la siguiente casilla.',
    id: 'orbita', title: 'Órbita', emoji: '🪐', color: '#5c7cfa', origin: 'Circle Path',
    help: 'Una bola está quieta y la otra <b>gira</b> a su alrededor. <b>Toca</b> cuando la que gira esté sobre la siguiente casilla: se queda ahí y empieza a girar la otra. Sigue el camino hasta la bandera 🏁. Si tocas cuando no está sobre una casilla, te caes. Las gemas 💠 dan puntos.',
    lives: 3, levels: 0, cap: 20,
    setup(g) {
      g.s = { i: 0, ang: Math.PI / 2, dir: 1, who: 0, trail: [], fall: 0 };
      const s = g.s; geo(g); genPath(g);
      s.speed = 2.6 + Math.min(g.lv, 20) * 0.13;
      s.camX = 0; s.camY = 0;
    },
    layout(g) { if (g.s.path) geo(g); },
    down(g) {
      const s = g.s; if (s.fall) return;
      const piv = s.path[s.i], ox = piv.x + Math.cos(s.ang), oy = piv.y + Math.sin(s.ang);
      let hit = -1;
      for (let k = s.i + 1; k <= Math.min(s.path.length - 1, s.i + 2); k++) if (Math.hypot(s.path[k].x - ox, s.path[k].y - oy) < 0.32) { hit = k; break; }
      if (hit < 0) {
        s.fall = 0.001; Arcade.tone(500, 0.5, 'sine', 0.1, -400); g.message(Arcade.T('¡Fuera!', 'Off the path!'), 0.9); return;
      }
      const d = Math.hypot(s.path[hit].x - ox, s.path[hit].y - oy);
      s.ang = Math.atan2(piv.y - s.path[hit].y, piv.x - s.path[hit].x);
      s.i = hit; s.who ^= 1;
      g.addScore(d < 0.1 ? 3 : 1);
      const sx = (s.path[hit].x - s.camX) * s.d + g.W / 2, sy = (s.path[hit].y - s.camY) * s.d + g.H * 0.62;
      g.ring(sx, sy, s.who ? '#ff6b6b' : '#4dabf7', s.d * 0.5);
      Arcade.tone(440 + (hit % 8) * 60, 0.08, 'triangle', 0.08);
      if (d < 0.1) g.float('PERFECT', sx, sy - 30, '#ffd43b', 16);
      if (s.path[hit].gem) { s.path[hit].gem = false; g.addScore(20, sx, sy - 10); Arcade.sfx.coin(); }
      if (hit === s.path.length - 1) { g.addScore(100 * g.lv, g.W / 2, g.H / 2); g.win(); }
    },
    key(g, k, d) { if (d && k === ' ') this.down(g); },
    update(g, dt) {
      const s = g.s;
      const piv = s.path[s.i];
      s.camX += (piv.x - s.camX) * Math.min(1, dt * 4); s.camY += (piv.y - s.camY) * Math.min(1, dt * 4);
      if (s.fall) { s.fall += dt; if (s.fall > 0.9) { s.fall = 0; if (g.die()) { /* se reanuda en la casilla actual */ } } return; }
      s.ang += s.dir * s.speed * dt;
      const ox = piv.x + Math.cos(s.ang), oy = piv.y + Math.sin(s.ang);
      s.trail.push({ x: ox, y: oy }); if (s.trail.length > 14) s.trail.shift();
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#0a0f24'); bg.addColorStop(1, '#1c2a5e');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (!s.path) return;
      const X = (x) => (x - s.camX) * s.d + W / 2, Y = (y) => (y - s.camY) * s.d + H * 0.62, d = s.d;
      ctx.strokeStyle = 'rgba(92,124,250,.25)'; ctx.lineWidth = d * 0.08; ctx.lineCap = 'round';
      ctx.beginPath(); s.path.forEach((p, i) => (i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y)))); ctx.stroke();
      s.path.forEach((p, i) => {
        const x = X(p.x), y = Y(p.y); if (y < -d || y > H + d) return;
        const done = i <= s.i;
        ctx.fillStyle = done ? 'rgba(92,124,250,.35)' : i === s.i + 1 ? 'rgba(255,212,59,.35)' : 'rgba(255,255,255,.1)';
        ctx.beginPath(); ctx.arc(x, y, d * 0.3, 0, TAU); ctx.fill();
        ctx.strokeStyle = i === s.i + 1 ? '#ffd43b' : 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke();
        if (p.gem) Arcade.emoji(ctx, '💠', x, y, d * 0.3, { rot: g.rt * 2 });
        if (i === s.path.length - 1) Arcade.emoji(ctx, '🏁', x, y - d * 0.1, d * 0.45);
      });
      const piv = s.path[s.i], px = X(piv.x), py = Y(piv.y);
      const ox = px + Math.cos(s.ang) * d, oy = py + Math.sin(s.ang) * d;
      ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(px, py, d, 0, TAU); ctx.stroke();
      s.trail.forEach((t, i) => { ctx.globalAlpha = i / s.trail.length * 0.4; ctx.fillStyle = s.who ? '#4dabf7' : '#ff6b6b'; ctx.beginPath(); ctx.arc(X(t.x), Y(t.y), d * 0.12 * (i / s.trail.length), 0, TAU); ctx.fill(); });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ox, oy); ctx.stroke();
      const sf = s.fall ? Math.max(0.1, 1 - s.fall) : 1;
      Arcade.emoji(ctx, s.who ? '🔵' : '🔴', px, py, d * 0.34);
      Arcade.emoji(ctx, s.who ? '🔴' : '🔵', ox, oy, d * 0.34 * sf);
      Arcade.txt(ctx, 'Casillas: ' + s.i + '/' + (s.path.length - 1), W / 2, g.top + 14, 15, '#dbe4ff', 'center', 900);
    },
  });
})();
</script>
</body>
</html>
