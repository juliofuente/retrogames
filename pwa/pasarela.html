<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pasarela · Arcade Perdido</title>
<meta name="theme-color" content="#0a0a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=84fed7f189"></script>
<script src="common.js?v=207858a9a6"></script>
<script>
(function () {
  const { rand, clamp, ri } = Arcade;
  const LN = 5, STEER = 5.2, VIS = 26;
  // 0 normal · 1 agujero · 2 salto · 3 freno · 4 turbo · 5 controles al revés · 6 rebote atrás
  const TC = ['#495057', null, '#339af0', '#fa5252', '#51cf66', '#66d9e8', '#9775fa'];
  const TI = [null, null, '⤴️', '🐢', '⚡', '🔄', '↩️'];

  function build(g) {
    const s = g.s, L = g.lv, n = clamp(70 + L * 7, 70, 240);
    const holeP = clamp(0.06 + L * 0.016, 0.06, 0.42), spP = clamp(0.03 + L * 0.006, 0.03, 0.16);
    const rows = [], path = []; let p = 2, hold = 0;
    for (let z = 0; z < n; z++) {
      if (z > 10 && hold-- <= 0 && Math.random() < 0.45) { p = clamp(p + (Math.random() < 0.5 ? -1 : 1), 0, LN - 1); hold = ri(2, 4); }
      path.push(p);
      const r = [];
      for (let x = 0; x < LN; x++) {
        let t = 0;
        if (z > 12 && z < n - 6) {
          const prev = rows[z - 1] ? rows[z - 1][x] : 0;
          if (Math.random() < (prev === 1 ? holeP * 2.2 : holeP)) t = 1;
          else if (Math.random() < spP) t = [2, 3, 4, 5, 6][ri(0, L < 5 ? 2 : L < 9 ? 3 : 4)];
        }
        r.push(t);
      }
      rows.push(r);
    }
    // el camino seguro nunca tiene agujeros ni rebotes, y lo que se pisa al cambiar de carril tampoco
    const safe = (z, x) => { if (rows[z] && (rows[z][x] === 1 || rows[z][x] === 6)) rows[z][x] = rows[z][x] === 6 ? 3 : 0; };
    for (let z = 0; z < n; z++) { safe(z, path[z]); if (z && path[z] !== path[z - 1]) for (let k = -2; k <= 2; k++) { safe(z + k, path[z]); safe(z + k, path[z - 1]); } }
    s.rows = rows; s.path = path; s.len = n;
    s.vb = 6.6 + Math.min(L, 25) * 0.09;
    const fac = { easy: 1.7, normal: 1.45, hard: 1.28 }[g.mode] ?? 1.45;
    s.time = Math.ceil(n / s.vb * fac + 3);
  }
  const tile = (s, z, x) => { const r = s.rows[Math.floor(z)]; if (!r) return 0; const i = Math.floor(x); return i < 0 || i >= LN ? 1 : r[i]; };
  function respawn(s) {
    const z = Math.max(0, Math.floor(s.z) - 4); s.z = z + 0.5; s.x = s.path[z] + 0.5; s.v = s.vb * 0.4; s.air = 0; s.boost = 0; s.slow = 0;
  }
  function jump(g) { const s = g.s; if (s.air > 0 || s.fall || s.done || s.jumps <= 0) return; s.jumps--; s.air = 0.62; s.airMax = 0.62; Arcade.sfx.up(); }
  function geo(g) { const s = g.s; s.hy = g.top + (g.bot - g.top) * 0.3; s.by = g.bot - 20; s.tw = Math.min(g.W * 0.92, (g.bot - g.top) * 1.25); }
  const proj = (d) => 1 / (1 + Math.max(-0.9, d) * 0.2);
  function setDir(g) { const s = g.s; let d = 0; for (const p of g.pointers.values()) d = p.x < g.W / 2 ? -1 : 1; s.tdir = d; }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Rueda por la pasarela sin caerte', deco: ['⚽', '💠', '⚡', '🐢', '🕳️', '🏁'], font: 'wide', bg: ['#1c1c4a', '#0a0a1f'],
    music: { mode: 'minor', bpm: 140, wave: 'sawtooth', style: 'drive', root: 57 }, voice: { wave: 'square', mul: 0.9, echo: 0.2 },
    ambient: { e: ['✦', '·'], n: 18, vy: 0, sway: 0, twinkle: 1, alpha: 0.3, size: [5, 10] },
    /*EN*/ en: { title: 'Skyway', tag: 'Roll along the skyway without falling', help: 'The ball rolls forward on its own along a walkway floating in space. <b>Hold</b> the left or right half of the screen to steer and <b>swipe up</b> to jump (you have a few jumps). Watch the squares: black holes make you fall, blue ones make you jump, red ones brake, green ones speed you up, cyan ones swap left and right for a while and purple ones bounce you back. Reach the 🏁 before time runs out.', tvHelp: '◀ ▶ to steer · ▲ or OK to jump.', dict: { 'Tiempo ': 'Time ', 'Saltos ': 'Jumps ', '¡Al revés!': 'Reversed!' } },
    /*TV*/ tvHelp: '◀ ▶ para girar · ▲ u OK para saltar.',
    id: 'pasarela', title: 'Pasarela', emoji: '🛸', color: '#4dabf7', origin: 'Trailblazer (Gremlin, 1986) / Tunnelball',
    help: 'La bola rueda sola hacia delante por una pasarela en el espacio. <b>Mantén</b> la mitad izquierda o derecha de la pantalla para girar y <b>desliza hacia arriba</b> para saltar (tienes pocos saltos). Ojo con las casillas: los agujeros negros te hacen caer, las azules te hacen saltar, las rojas frenan, las verdes aceleran, las celestes cambian izquierda y derecha un rato y las moradas te devuelven hacia atrás. Llega a la 🏁 antes de que se acabe el tiempo.',
    lives: 3, levels: 0, cap: 25,
    setup(g) {
      g.s = { z: 0.5, x: 2.5, v: 0, air: 0, fall: 0, inv: 0, boost: 0, slow: 0, tdir: 0, kdir: 0, jumps: 3, rot: 0, last: -1 };
      const s = g.s; geo(g); build(g); s.left = s.time;
    },
    layout(g) { if (g.s.rows) geo(g); },
    down(g) { setDir(g); },
    move(g) { setDir(g); },
    up(g) { setDir(g); },
    swipe(g, d) { if (d === 'up') { g.s.tdir = 0; jump(g); } },
    key(g, k, d) {
      const s = g.s;
      if (k === 'ArrowLeft') s.kdir = d ? -1 : s.kdir === -1 ? 0 : s.kdir;
      if (k === 'ArrowRight') s.kdir = d ? 1 : s.kdir === 1 ? 0 : s.kdir;
      if (d && (k === 'ArrowUp' || k === ' ')) jump(g);
    },
    /*SC*/ demo(g) {
      const s = g.s; if (s.fall || s.done) return { wait: 0.2 };
      const z = Math.floor(s.z), ahead = Math.min(s.len - 1, z + 1);
      // si hay un agujero justo delante en el carril y quedan saltos, salta
      if (s.air <= 0 && s.jumps > 0 && tile(s, s.z + 1.2, s.x) === 1 && tile(s, s.z + 0.4, s.x) !== 1) return { key: 'ArrowUp', dur: 0.06, after: 0 };
      let tx = s.path[ahead] + 0.5;
      if (tile(s, s.z + 1, tx) === 1) tx = s.path[z] + 0.5;
      const dx = tx - s.x; if (Math.abs(dx) < 0.12) return { wait: 0.04 };
      const dir = (dx > 0 ? 1 : -1) * (s.inv > 0 ? -1 : 1);
      return { key: dir > 0 ? 'ArrowRight' : 'ArrowLeft', dur: clamp(Math.abs(dx) / STEER, 0.04, 0.3), after: 0, say: s.z < 8 ? Arcade.T('Sigue las casillas seguras', 'Follow the safe squares') : null };
    },
    update(g, dt) {
      const s = g.s; if (!s.rows) return;
      if (s.done) { s.z += s.v * dt; return; }
      s.left -= dt;
      if (s.left <= 0) { s.left = 0; s.done = true; g.message(Arcade.T('¡Sin tiempo!', 'Out of time!'), 1.2); setTimeout(() => { if (g.state === 'play' && g.die()) Arcade.current.def.setup(g); }, 1300); return; }
      if (s.fall) { s.fall -= dt; if (s.fall <= 0) { s.fall = 0; respawn(s); } return; }
      if (s.inv > 0) s.inv -= dt; if (s.boost > 0) s.boost -= dt; if (s.slow > 0) s.slow -= dt;
      const target = s.vb * (s.boost > 0 ? 1.6 : 1) * (s.slow > 0 ? 0.5 : 1);
      s.v += clamp(target - s.v, -12 * dt, 9 * dt);
      let dir = s.kdir || s.tdir; if (s.inv > 0) dir = -dir;
      s.x += dir * STEER * dt; s.z += s.v * dt; s.rot += s.v * dt * 2.2;
      if (s.air > 0) { s.air -= dt; return; }
      const zi = Math.floor(s.z), t = tile(s, s.z, s.x), key = zi * 10 + Math.floor(s.x);
      if (t === 1) { s.fall = 1.4; s.left = Math.max(0.5, s.left - 1.5); s.tdir = 0; g.mood('scared', 1); Arcade.tone(500, 0.8, 'sine', 0.1, -420); g.message(Arcade.T('¡Al vacío! −1,5 s', 'Into the void! −1.5 s'), 1); return; }
      if (key !== s.last) {
        s.last = key;
        if (t === 2) { s.air = 0.62; s.airMax = 0.62; Arcade.sfx.up(); }
        else if (t === 3) { s.slow = 1.2; Arcade.tone(200, 0.2, 'square', 0.06, -80); }
        else if (t === 4) { s.boost = 1.4; Arcade.tone(500, 0.25, 'sawtooth', 0.05, 500); g.addScore(5 * Math.max(1, g.lv)); }
        else if (t === 5) { s.inv = 3; Arcade.tone(700, 0.3, 'triangle', 0.06, -300); g.message(Arcade.T('¡Al revés!', 'Reversed!'), 0.8); }
        else if (t === 6) { s.z = Math.max(0.5, s.z - 3); s.v = s.vb * 0.3; s.last = -1; Arcade.sfx.bad(); g.shake(0.2, 6); }
      }
      if (zi % 10 === 0 && zi > 0 && s.cp !== zi) { s.cp = zi; g.addScore(10 * Math.max(1, g.lv)); }
      if (s.z >= s.len - 2 && !s.done) { s.done = true; g.confetti(70); g.addScore(Math.round(s.left) * 20 * g.lv, g.W / 2, g.H * 0.4); setTimeout(() => { if (g.state === 'play') g.win(s.left > s.time * 0.25 ? 3 : s.left > s.time * 0.1 ? 2 : 1); }, 800); }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0a0a1f'); bg.addColorStop(0.5, '#1c1c4a'); bg.addColorStop(1, '#05050f');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (!s.rows) return;
      const zc = s.z - 1.4, hy = s.hy, by = s.by, tw = s.tw, camX = (s.x - LN / 2) * 0.55;
      const P = (d, x) => { const k = proj(d), y = hy + (by - hy) * k; return [W / 2 + ((x - LN / 2) - camX) * (tw / LN) * k, y, k]; };
      Arcade.emoji(ctx, '🪐', W * 0.8, hy - 40, 60, { alpha: 0.5 }); Arcade.emoji(ctx, '🌙', W * 0.15, hy - 70, 30, { alpha: 0.4 });
      for (let i = Math.min(s.len, Math.floor(zc) + VIS); i >= Math.max(0, Math.floor(zc)); i--) {
        const d0 = i - zc, d1 = i + 1 - zc; if (d1 < 0) continue;
        const r = s.rows[i]; if (!r) continue;
        for (let x = 0; x < LN; x++) {
          const t = r[x]; if (t === 1) continue;
          const [ax, ay] = P(d0, x), [bx] = P(d0, x + 1), [cx, cy] = P(d1, x + 1), [dx2] = P(d1, x);
          ctx.fillStyle = t === 0 ? ((i + x) % 2 ? '#495057' : '#5c636a') : TC[t];
          if (i >= s.len - 2) ctx.fillStyle = (i + x) % 2 ? '#fff' : '#212529';
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, ay); ctx.lineTo(cx, cy); ctx.lineTo(dx2, cy); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
          if (TI[t] && d0 < 14) { const [mx, my, k] = P((d0 + d1) / 2, x + 0.5); Arcade.emoji(ctx, TI[t], mx, my, Math.max(8, (tw / LN) * k * 0.45), { sy: 0.6 }); }
        }
        // canto de la pasarela
        const [lx, ly] = P(d0, 0), [rx] = P(d0, LN), [, ly1] = P(d1, 0);
        ctx.fillStyle = 'rgba(77,171,247,.35)'; ctx.fillRect(lx, ly, rx - lx, Math.max(1, (ly - ly1) * 0.25));
      }
      // bola
      const air = s.air > 0 ? Math.sin((1 - s.air / s.airMax) * Math.PI) : 0;
      const [bx, bY, bk] = P(1.4, s.x), size = (tw / LN) * bk * 0.75;
      if (!s.fall) {
        ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(bx, bY - 2, size * 0.45 * (1 - air * 0.4), size * 0.14, 0, 0, 6.3); ctx.fill();
        Arcade.emoji(ctx, '⚽', bx, bY - size * 0.5 - air * size * 1.6, size, { rot: s.rot });
        Arcade.emoji(ctx, s.inv > 0 ? '😵' : g.face(), bx + size * 0.4, bY - size * 1.05 - air * size * 1.6, size * 0.45);
      } else { const k = s.fall / 1.4; Arcade.emoji(ctx, '😱', bx, bY - size * 0.5 + (1 - k) * 180, size * k, { rot: (1 - k) * 8 }); }
      // marcadores
      const tcol = s.left < 8 ? '#ff6b6b' : '#e7f5ff';
      Arcade.txt(ctx, 'Tiempo ' + Math.ceil(s.left), W * 0.27, g.top + 42, 17, tcol, 'center', 900);
      Arcade.txt(ctx, 'Saltos ' + s.jumps, W * 0.73, g.top + 42, 17, '#a5d8ff', 'center', 900);
      const bw = W * 0.6; ctx.fillStyle = 'rgba(255,255,255,.12)'; Arcade.rr(ctx, W / 2 - bw / 2, g.top + 60, bw, 6, 3); ctx.fill();
      ctx.fillStyle = '#4dabf7'; Arcade.rr(ctx, W / 2 - bw / 2, g.top + 60, bw * clamp(s.z / s.len, 0, 1), 6, 3); ctx.fill();
      if (s.inv > 0) Arcade.txt(ctx, '🔄 ' + Math.ceil(s.inv), W / 2, g.top + 82, 16, '#66d9e8', 'center', 900);
    },
  });
})();
</script>
</body>
</html>
