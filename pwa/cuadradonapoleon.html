<meta name="theme-color" content="#5a2000">
<meta name="apple-mobile-web-app-capable" content="yes">

<body class="game">

<script src="common.js?v=6a1142aea4"></script>
<script src="cartas.js?v=ae2088dc63"></script>
<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    decks: 2,
    tab: {"build":"suit","move":"seq","empty":"any"},
    stock: { to: 'waste', n: 1, redeals: 0 },
    init(lv) { this.stock.redeals = 0 + (lv < 6 ? 1 : 0); },
    piles: (lv) => P.mk([['stock', 1], ['waste', 1], ['found', 8], ['tab', 12]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"ds":["UUUU","UUUU","UUUU","UUUU","UUUU","UUUU","UUUU","UUUU","UUUU","UUUU","UUUU","UUUU"]}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, {}),
    status: P.autoStatus,
    felt: ["#e8590c","#5a2000"], back: ["#862e9c","#45115a"], backEmoji: '🎩',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Doce columnas y escaleras', deco: ["🃏","🎩","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#e8590c","#5a2000"],
    music: { mode: 'lydian', bpm: 77, wave: 'sine', style: 'chill', root: 61 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Napoleon\'s Square', tag: 'Twelve columns and runs', help: 'An easy Forty Thieves: twelve columns of four and same-suit runs that move together. Played with <b>two decks</b>. Build the <b>8 foundations</b> from A to K, one per suit. On the table, a card goes on another <b>one rank higher</b> of the <b>same suit</b>. You can move cards together if they are already in order. Any card can go into an empty space. Tap the stock to draw cards one at a time; it goes round only once. In the first levels you get one more pass through the stock. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'cuadradonapoleon', title: 'Cuadrado de Napoleón', emoji: '🎩', color: '#ffa94d', origin: 'Napoleon\'s Square',
    help: 'Un Cuarenta ladrones fácil: doce columnas de cuatro y escaleras del mismo palo que se mueven juntas. Se juega con <b>dos barajas</b>. Completa las <b>8 bases</b> del A a la K, una por palo. En la mesa, una carta va sobre otra de <b>un número más</b> y del <b>mismo palo</b>. Puedes mover juntas las cartas que ya estén en orden. Cualquier carta puede ir a un hueco vacío. Toca el mazo para sacar cartas de una en una; se pasa una sola vez. En los primeros niveles puedes darle una vuelta más al mazo. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
</body>
</html>
