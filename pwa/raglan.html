<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    tab: {"build":"alt","move":"one","empty":"any"},
    supermove: true,
    planHint: true, demoBudget: 1500,
    piles: (lv) => P.mk([['found', 4], ['res', 6], ['tab', 9]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"ds":["UUUUUUU","UUUUUUU","UUUUUUU","UUUUUU","UUUUU","UUUU","UUU","UU","U"],"aces":true,"resOpen":6}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, {}),
    status: P.autoStatus,
    felt: ["#495057","#16191c"], back: ["#c92a2a","#7a1010"], backEmoji: '🧥',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'Rey Alberto con los ases puestos', deco: ["🃏","🧥","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#495057","#16191c"],
    music: { mode: 'dorian', bpm: 88, wave: 'sine', style: 'chill', root: 58 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Raglan', tag: 'King Albert with the aces in place', help: 'Like King Albert, but the aces are already on the foundations and the reserve has six cards. The aces are already on the <b>foundations</b>: build them up to K by suit. On the table, a card goes on another <b>one rank higher</b> in the <b>other colour</b>. Move <b>one card at a time</b>, although you can shift several in a row if you have free spaces to help. Any card can go into an empty space. The 6 <b>reserve</b> cards (at the bottom) can be played whenever you like. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'raglan', title: 'Raglan', emoji: '🧥', color: '#adb5bd', origin: 'Raglan',
    help: 'Como el Rey Alberto, pero los ases ya están en las bases y la reserva es de seis cartas. Los ases ya están en las <b>bases</b>: súbelas hasta la K por palo. En la mesa, una carta va sobre otra de <b>un número más</b> y de <b>color distinto</b>. Se mueve <b>una carta cada vez</b>, aunque puedes pasar varias seguidas si tienes huecos libres para ayudarte. Cualquier carta puede ir a un hueco vacío. Las 6 cartas de la <b>reserva</b> (abajo) se pueden jugar cuando quieras. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
