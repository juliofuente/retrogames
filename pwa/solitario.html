<head>

<meta name="theme-color" content="#0b4d2c">
<meta name="apple-mobile-web-app-capable" content="yes">

<body class="game">

<script src="common.js?v=91476f9e44"></script>
<script src="cartas.js?v=ae2088dc63"></script>
<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    tab: { build: 'alt', move: 'seq', empty: 'K' }, stock: { to: 'waste', n: 1, redeals: Infinity },
    init(lv) { this.stock.n = lv >= 12 ? 3 : 1; },
    planHint: true, demoBudget: 1500,
    piles: () => P.mk([['stock', 1], ['waste', 1], ['found', 4], ['tab', 7]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, { ds: ['U', 'DU', 'DDU', 'DDDU', 'DDDDU', 'DDDDDU', 'DDDDDDU'] }),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, {}),
    status: P.autoStatus, demoSay: Arcade.T('Bajando y alternando colores', 'Descending, alternating colours'),
    felt: ['#16a05a', '#0b4d2c'], back: ['#4263eb', '#1c3faa'], backEmoji: '🃏',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'El solitario de toda la vida', deco: ['🃏', '♠️', '♥️', '♦️', '♣️', '👑'], font: 'serif', bg: ['#117a45', '#0b4d2c'],
    music: { mode: 'major', bpm: 80, wave: 'sine', style: 'chill', root: 60 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Solitaire', tag: 'The good old solitaire', help: 'Classic solitaire (Klondike). Build the four <b>foundations</b> at the top, one per suit, from A to K. On the table, cards go in <b>descending order and alternating colours</b> (a red 6 on a black 7); only a K can go into an empty column. <b>Tap</b> a card and it moves by itself to the best place (or <b>drag</b> it wherever you like). Tap the deck to draw: one card at a time in the first levels and three at a time from level 12, and turn it over as often as you like. 💡 gives a hint, ↩️ undoes and 📖 opens the tutorial.', tvHelp: 'D-pad to a card · OK moves it to the best place.', dict: { 'Bajando y alternando colores': 'Descending, alternating colours', 'Mazo: ': 'Stock: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve a su mejor sitio.',
    id: 'solitario', title: 'Solitario', emoji: '🃏', color: '#ffd43b', origin: 'Klondike / Solitaire (Lutanho)',
    help: 'El solitario clásico (Klondike). Completa las cuatro <b>bases</b> de arriba, una por palo, del A a la K. En la mesa, las cartas van en <b>orden descendente y alternando colores</b> (un 6 rojo sobre un 7 negro); en una columna vacía solo puede ir una K. <b>Toca</b> una carta y se mueve sola a su mejor sitio (o <b>arrástrala</b> donde quieras). Toca el mazo para sacar: de una en una en los primeros niveles y de tres en tres desde el nivel 12, y dale la vuelta las veces que quieras. 💡 te da una pista, ↩️ deshace y 📖 abre el tutorial.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
</body>
</html>
