<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Supervivientes · Arcade Perdido</title>
<meta name="theme-color" content="#1a1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="game">
<script src="config.js?v=c463c71b8c"></script>
<script src="common.js?v=8bd36b43cd"></script>
<script>
(function () {
  const { ri, rand, clamp, pick, shuffle } = Arcade;
  const FOES = [{ e: '🦇', hp: 10, sp: 70, xp: 1, r: 12 }, { e: '🧟', hp: 24, sp: 45, xp: 2, r: 14 }, { e: '👻', hp: 16, sp: 85, xp: 2, r: 13 }, { e: '💀', hp: 40, sp: 55, xp: 3, r: 14 }, { e: '👹', hp: 120, sp: 40, xp: 8, r: 20 }];
  const UPS = [
    { k: 'knife', e: '🔪', es: 'Cuchillos', en: 'Knives' }, { k: 'aura', e: '🧄', es: 'Aura de ajo', en: 'Garlic aura' }, { k: 'orb', e: '🔥', es: 'Bolas de fuego', en: 'Fireballs' },
    { k: 'bolt', e: '⚡', es: 'Rayos', en: 'Lightning' }, { k: 'speed', e: '👟', es: 'Velocidad', en: 'Speed' }, { k: 'hp', e: '❤️', es: 'Vida máxima', en: 'Max health' }, { k: 'magnet', e: '🧲', es: 'Imán', en: 'Magnet' },
  ];

  function geo(g) { const s = g.s; s.cx = g.W / 2; s.cy = (g.top + g.bot) / 2; }
  function spawn(g) {
    const s = g.s, t = s.t, L = g.lv, a = rand(0, 6.28), R = Math.max(g.W, g.H) * 0.62;
    const tier = Math.min(FOES.length - 2, Math.floor(t / 25 + L / 4));
    const F = FOES[ri(0, tier)], m = 1 + L * 0.05 + t / 120;
    s.foes.push({ ...F, x: s.px + Math.cos(a) * R, y: s.py + Math.sin(a) * R, hpNow: F.hp * m, max: F.hp * m, hit: 0 });
  }
  function levelUp(g) {
    const s = g.s; s.lvl++; s.need = Math.round(s.need * 1.22 + 2);
    const opts = shuffle(UPS.filter((u) => (s.w[u.k] || 0) < 6)).slice(0, 3);
    const bw = Math.min(110, (g.W - 40) / 3), y = g.H / 2 - 60;
    s.choice = opts.map((u, i) => ({ ...u, x: g.W / 2 - (bw * 3 + 20) / 2 + i * (bw + 10), y, w: bw, h: 120 }));
    Arcade.sfx.win();
  }
  function pickUp(g, u) { const s = g.s; s.w[u.k] = (s.w[u.k] || 0) + 1; if (u.k === 'hp') { s.maxhp += 25; s.hp = Math.min(s.maxhp, s.hp + 40); } s.choice = null; Arcade.sfx.up(); }
  function hitFoe(g, f, d) { const s = g.s; f.hpNow -= d; f.hit = 0.12; if (f.hpNow <= 0 && !f.dead) { f.dead = true; s.kills++; s.gems.push({ x: f.x, y: f.y, v: f.xp }); g.addScore(f.xp * g.lv); if (Math.random() < 0.01) s.gems.push({ x: f.x + 10, y: f.y, v: 0, heal: true }); } }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Muévete, el resto es automático', deco: ['😀', '🦇', '🧟', '🔪', '🔥', '💎'], font: 'serif', bg: ['#2e1f42', '#1a1226'],
    music: { mode: 'phryg', bpm: 132, wave: 'sawtooth', style: 'arcade', root: 52 }, voice: { wave: 'square', mul: 1, echo: 0.25 },
    en: { title: 'Survivors', tag: 'Just move, the rest is automatic', help: '<b>Drag</b> your finger anywhere to move the hero; your weapons fire <b>on their own</b> at the nearest monster. Pick up the 💎 gems they drop to level up and <b>choose an upgrade</b>: knives, garlic aura, fireballs, lightning, speed… Survive until the clock reaches zero. Every level the hordes are bigger.', tvHelp: 'Arrows to move · D-pad and OK to choose upgrades.', dict: { 'Elige mejora': 'Choose an upgrade', 'Nv ': 'Lv ' } },
    tvHelp: 'Flechas para moverte · cruceta y OK para elegir mejoras.',
    tv: { mode: 'tap', targets: (g) => (g.s.choice ? g.s.choice : []) },
    id: 'supervivientes', title: 'Supervivientes', emoji: '😀', color: '#b197fc', origin: 'Vampire Survivors / BoxHead / Survival Horror',
    help: '<b>Arrastra</b> el dedo en cualquier sitio para mover al héroe; tus armas disparan <b>solas</b> al monstruo más cercano. Recoge las gemas 💎 que sueltan para subir de nivel y <b>elige una mejora</b>: cuchillos, aura de ajo, bolas de fuego, rayos, velocidad… Aguanta hasta que el reloj llegue a cero. En cada nivel las hordas son mayores.',
    lives: 3, levels: 0, cap: 25,
    setup(g) {
      const L = g.lv; g.s = { px: 0, py: 0, foes: [], gems: [], shots: [], fx: [], hp: 100, maxhp: 100, xp: 0, need: 4, lvl: 1, w: { knife: 1 }, t: 0, dur: 60 + Math.min(L, 25) * 4, spawnT: 0, kills: 0, cds: {}, face: 1 };
      geo(g);
    },
    layout(g) { if (g.s.foes) geo(g); },
    down(g, p) { const s = g.s; if (s.choice) { for (const c of s.choice) if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) return pickUp(g, c); return; } s.joy = { x: p.x, y: p.y, dx: 0, dy: 0 }; },
    move(g, p) { const s = g.s; if (!s.joy) return; let dx = p.x - s.joy.x, dy = p.y - s.joy.y; const d = Math.hypot(dx, dy); if (d > 50) { s.joy.x = p.x - dx / d * 50; s.joy.y = p.y - dy / d * 50; dx = dx / d * 50; dy = dy / d * 50; } s.joy.dx = dx / 50; s.joy.dy = dy / 50; },
    up(g) { g.s.joy = null; },
    tap(g, p) { const s = g.s; if (s.choice) for (const c of s.choice) if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) pickUp(g, c); },
    key(g, k, d) { const s = g.s; s.keys = s.keys || {}; s.keys[k] = d; },
    update(g, dt) {
      const s = g.s; if (s.choice || s.done) return;
      s.t += dt;
      let mx = 0, my = 0; if (s.joy) { mx = s.joy.dx; my = s.joy.dy; } if (s.keys) { if (s.keys.ArrowLeft) mx = -1; if (s.keys.ArrowRight) mx = 1; if (s.keys.ArrowUp) my = -1; if (s.keys.ArrowDown) my = 1; }
      const spd = 140 * (1 + (s.w.speed || 0) * 0.12); s.px += mx * spd * dt; s.py += my * spd * dt; if (mx) s.face = mx > 0 ? 1 : -1; s.moving = mx || my;
      // aparición
      s.spawnT -= dt; const rate = Math.max(0.12, 1 - s.t / 90 - g.lv * 0.025); if (s.spawnT <= 0) { s.spawnT = rate; spawn(g); if (s.t > 30 && Math.random() < 0.3) spawn(g); }
      if (Math.floor(s.t) % 60 === 59 && !s.bossT) { s.bossT = true; const F = FOES[4], m = 1 + g.lv * 0.15; s.foes.push({ ...F, x: s.px + 400, y: s.py, hpNow: F.hp * m * 3, max: F.hp * m * 3, hit: 0, boss: true }); g.message('👹', 1); } if (Math.floor(s.t) % 60 === 2) s.bossT = false;
      // enemigos
      for (const f of s.foes) {
        const dx = s.px - f.x, dy = s.py - f.y, d = Math.hypot(dx, dy) || 1; f.x += dx / d * f.sp * dt; f.y += dy / d * f.sp * dt; f.hit = Math.max(0, f.hit - dt);
        if (d < f.r + 14) { s.hp -= (f.boss ? 30 : 10) * dt; s.hurt = 0.1; }
      }
      // separación barata
      for (let i = 0; i < s.foes.length; i += 2) { const a = s.foes[i], b = s.foes[(i + 7) % s.foes.length]; if (a === b) continue; const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy); if (d < a.r + b.r && d > 0) { const k = (a.r + b.r - d) / 2; a.x += dx / d * k; a.y += dy / d * k; b.x -= dx / d * k; b.y -= dy / d * k; } }
      const near = (r) => { let best = null, bd = r * r; for (const f of s.foes) { const d = (f.x - s.px) ** 2 + (f.y - s.py) ** 2; if (d < bd) { bd = d; best = f; } } return best; };
      const cd = (k, t) => { s.cds[k] = (s.cds[k] || 0) - dt; if (s.cds[k] <= 0) { s.cds[k] = t; return true; } return false; };
      const W = s.w;
      if (W.knife && cd('knife', 0.9 / (1 + W.knife * 0.25))) { const f = near(420); if (f) for (let i = 0; i < Math.ceil(W.knife / 2); i++) { const a = Math.atan2(f.y - s.py, f.x - s.px) + (i - (Math.ceil(W.knife / 2) - 1) / 2) * 0.18; s.shots.push({ x: s.px, y: s.py, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, d: 10 + W.knife * 3, t: 1, e: '🔪', pierce: W.knife >= 4 ? 2 : 1 }); } }
      if (W.aura) { const r = 50 + W.aura * 12; if (cd('aura', 0.5)) for (const f of s.foes) if (Math.hypot(f.x - s.px, f.y - s.py) < r) hitFoe(g, f, 4 + W.aura * 3); }
      if (W.orb) { s.orbA = (s.orbA || 0) + dt * 3; const n = W.orb, r = 70; for (let i = 0; i < n; i++) { const a = s.orbA + i * 6.283 / n, ox = s.px + Math.cos(a) * r, oy = s.py + Math.sin(a) * r; for (const f of s.foes) if (Math.hypot(f.x - ox, f.y - oy) < f.r + 12 && f.hit <= 0) hitFoe(g, f, 8 + W.orb * 3); } }
      if (W.bolt && cd('bolt', 2.2 / (1 + W.bolt * 0.2))) { for (let i = 0; i < W.bolt; i++) { const f = s.foes[ri(0, s.foes.length - 1)]; if (f && Math.hypot(f.x - s.px, f.y - s.py) < 450) { hitFoe(g, f, 30 + W.bolt * 10); s.fx.push({ x: f.x, y: f.y, t: 0.25 }); Arcade.tone(1200, 0.05, 'sawtooth', 0.03, -900); } } }
      for (const sh of s.shots) { sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.t -= dt; for (const f of s.foes) if (!f.dead && Math.hypot(f.x - sh.x, f.y - sh.y) < f.r + 6) { hitFoe(g, f, sh.d); if (--sh.pierce <= 0) { sh.t = 0; break; } } }
      s.shots = s.shots.filter((x) => x.t > 0);
      const deadN = s.foes.filter((f) => f.dead).length; if (deadN) Arcade.tone(300 + Math.random() * 200, 0.03, 'square', 0.03);
      s.foes = s.foes.filter((f) => !f.dead && Math.hypot(f.x - s.px, f.y - s.py) < 1400);
      const mag = 95 + (W.magnet || 0) * 40;
      for (const gm of s.gems) { const dx = s.px - gm.x, dy = s.py - gm.y, d = Math.hypot(dx, dy); if (d < mag) { gm.x += dx / d * 300 * dt; gm.y += dy / d * 300 * dt; } if (d < 16) { gm.dead = true; if (gm.heal) s.hp = Math.min(s.maxhp, s.hp + 30); else { s.xp += gm.v; Arcade.tone(900 + s.xp * 5, 0.03, 'triangle', 0.03); } } }
      s.gems = s.gems.filter((x) => !x.dead); if (s.gems.length > 300) s.gems.splice(0, s.gems.length - 300);
      for (const f of s.fx) f.t -= dt; s.fx = s.fx.filter((f) => f.t > 0); s.hurt = Math.max(0, (s.hurt || 0) - dt);
      if (s.xp >= s.need) { s.xp -= s.need; levelUp(g); }
      if (s.hp <= 0) { s.hp = s.maxhp; s.foes = s.foes.filter((f) => Math.hypot(f.x - s.px, f.y - s.py) > 300); g.message('💔', 0.8); if (!g.die()) { s.done = true; return; } }
      if (s.t >= s.dur) { s.done = true; Arcade.sfx.win(); g.confetti(70); g.addScore(s.kills * g.lv, g.W / 2, g.H / 2); setTimeout(() => { if (g.state === 'play') g.win(); }, 700); }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      ctx.fillStyle = '#1a1226'; ctx.fillRect(0, 0, W, H);
      if (!s.foes) return;
      const ox = s.cx - s.px, oy = s.cy - s.py;
      // suelo de baldosas
      const T = 64; ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
      for (let x = ((ox % T) + T) % T; x < W; x += T) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = ((oy % T) + T) % T; y < H; y += T) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      for (let i = -6; i < 12; i++) for (let j = -6; j < 12; j++) { const wx = Math.floor((s.px - W) / 200) * 200 + i * 200, wy = Math.floor((s.py - H) / 200) * 200 + j * 200, hsh = Math.abs(Math.sin(wx * 12.9898 + wy * 78.233)) * 43758 % 1; if (hsh < 0.25) Arcade.emoji(ctx, hsh < 0.1 ? '🪦' : hsh < 0.18 ? '🌿' : '🕯️', wx + ox, wy + oy, 22, { alpha: 0.35 }); }
      if (s.w.aura) { const r = 50 + s.w.aura * 12; ctx.fillStyle = 'rgba(200,255,200,.08)'; ctx.beginPath(); ctx.arc(s.cx, s.cy, r, 0, 6.3); ctx.fill(); ctx.strokeStyle = 'rgba(200,255,200,.25)'; ctx.stroke(); }
      for (const gm of s.gems) Arcade.emoji(ctx, gm.heal ? '🍗' : gm.v >= 3 ? '💎' : '🔹', gm.x + ox, gm.y + oy, gm.heal ? 20 : 12);
      for (const f of s.foes) { Arcade.emojiTo(ctx, f.e, f.x + ox, f.y + oy, f.r * 2.2 * (f.boss ? 1.8 : 1), s.px - f.x, s.py - f.y, { mode: 'flip', alpha: f.hit > 0 ? 0.5 : 1 }); if (f.boss) { ctx.fillStyle = '#e03131'; ctx.fillRect(f.x + ox - 30, f.y + oy - 44, 60 * f.hpNow / f.max, 5); } }
      for (const sh of s.shots) Arcade.emoji(ctx, sh.e, sh.x + ox, sh.y + oy, 18, { rot: Math.atan2(sh.vy, sh.vx) + Math.PI * 0.75 });
      if (s.w.orb) for (let i = 0; i < s.w.orb; i++) { const a = (s.orbA || 0) + i * 6.283 / s.w.orb; Arcade.emoji(ctx, '🔥', s.cx + Math.cos(a) * 70, s.cy + Math.sin(a) * 70, 24); }
      for (const f of s.fx) { ctx.strokeStyle = `rgba(255,255,150,${f.t * 4})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(f.x + ox, 0); ctx.lineTo(f.x + ox + 10, (f.y + oy) / 2); ctx.lineTo(f.x + ox - 5, f.y + oy); ctx.stroke(); }
      Arcade.emojiTo(ctx, s.hurt ? '😱' : g.face(), s.cx, s.cy - (s.moving ? Math.abs(Math.sin(g.rt * 10)) * 3 : 0), 32, s.face > 0 ? 1 : -1, 0, { mode: 'flip', alpha: s.hurt ? 0.6 : 1 });
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(s.cx - 20, s.cy + 22, 40, 5); ctx.fillStyle = '#e03131'; ctx.fillRect(s.cx - 20, s.cy + 22, 40 * Math.max(0, s.hp / s.maxhp), 5);
      if (s.joy) { ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.joy.x, s.joy.y, 50, 0, 6.3); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(s.joy.x + s.joy.dx * 50, s.joy.y + s.joy.dy * 50, 18, 0, 6.3); ctx.fill(); }
      // HUD
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(0, g.top, W, 8); ctx.fillStyle = '#4dabf7'; ctx.fillRect(0, g.top, W * s.xp / s.need, 8);
      const left = Math.max(0, Math.ceil(s.dur - s.t)); Arcade.txt(ctx, '⏳ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + '   💀 ' + s.kills + '   ⭐ ' + s.lvl, W / 2, g.top + 24, 15, '#fff', 'center', 900, 'rgba(0,0,0,.5)');
      if (s.choice) {
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
        Arcade.txt(ctx, 'Elige mejora', W / 2, s.choice[0].y - 30, 24, '#ffd43b', 'center', 900);
        for (const c of s.choice) { ctx.fillStyle = '#2e1f42'; Arcade.rr(ctx, c.x, c.y, c.w, c.h, 14); ctx.fill(); ctx.strokeStyle = '#b197fc'; ctx.lineWidth = 2; ctx.stroke(); Arcade.emoji(ctx, c.e, c.x + c.w / 2, c.y + 42, 44); Arcade.txt(ctx, Arcade.T(c.es, c.en), c.x + c.w / 2, c.y + 86, Math.min(14, c.w / 7), '#fff', 'center', 800); Arcade.txt(ctx, 'Nv ' + ((s.w[c.k] || 0) + 1), c.x + c.w / 2, c.y + 105, 11, '#b197fc', 'center', 800); }
      }
    },
  });
})();
</script>
</body>
</html>
