<script>
// @cartas
(function () {
  const P = Arcade.paciencia;
  const V = {
    decks: 2,
    found: {"mode":"run"},
    tab: {"build":"any","move":"run","empty":"any"},
    stock: { to: 'tab' },
    planHint: true, demoBudget: 600,
    piles: (lv) => P.mk([['stock', 1], ['found', 8], ['tab', 10]]),
    deal: (st, D, deck) => P.dealStd(st, D, deck, {"ds":["DDDDDU","DDDDDU","DDDDDU","DDDDDU","DDDDU","DDDDU","DDDDU","DDDDU","DDDDU","DDDDU"],"suits":1}),
    place: (g, s, D, y0) => P.autoPlace(g, s, D, y0, {}),
    status: P.autoStatus,
    felt: ["#5f3dc4","#1d1052"], back: ["#1971c2","#0b3f73"], backEmoji: '🕷️',
  };
  Arcade.game({
    ...P(V),
    /*THEME*/ home: 'indexsolitarios.html', tag: 'La Araña más amable: solo picas', deco: ["🃏","🕷️","♠️","♥️","♦️","♣️"], font: 'serif', bg: ["#5f3dc4","#1d1052"],
    music: { mode: 'major', bpm: 79, wave: 'sine', style: 'chill', root: 58 }, voice: { wave: 'sine', mul: 1.2, echo: 0.4 },
    /*EN*/ en: { title: 'Spider One Suit', tag: 'The friendliest Spider: spades only', help: 'Two-deck Spider where every card is a spade: perfect for learning. Played with <b>two decks</b>. All the cards are the same suit. Make <b>complete runs from K down to A in the same suit</b>: each one you finish goes up to the foundations by itself. On the table, a card goes on another <b>one rank higher</b> of <b>any suit</b>. Only <b>same-suit runs</b> move together. Any card can go into an empty space. Tap the stock to deal one card to each column. <b>Tap</b> a card and it goes to the best place, or <b>drag</b> it. 💡 gives a hint and ↩️ undoes.', tvHelp: 'D-pad to a card · OK moves it.', dict: { 'Celdas libres: ': 'Free cells: ', 'Reserva: ': 'Reserve: ', 'Mazo: ': 'Stock: ', 'En la mesa: ': 'On the table: ', 'Base: ': 'Base: ' } },
    /*TV*/ tvHelp: 'Cruceta hasta una carta · OK la mueve.',
    id: 'aranaunpalo', title: 'Araña de un palo', emoji: '🕷️', color: '#9775fa', origin: 'Spider One Suit',
    help: 'La Araña con dos barajas en la que todas las cartas son de picas: perfecta para aprender. Se juega con <b>dos barajas</b>. Todas las cartas son del mismo palo. Forma <b>escaleras completas de la K al A del mismo palo</b>: cada una que termines sube sola a las bases. En la mesa, una carta va sobre otra de <b>un número más</b> de <b>cualquier palo</b>. Solo se mueven juntas las <b>escaleras del mismo palo</b>. Cualquier carta puede ir a un hueco vacío. Toca el mazo para repartir una carta a cada columna. <b>Toca</b> una carta y va sola a su mejor sitio, o <b>arrástrala</b>. 💡 te da una pista y ↩️ deshace.',
    lives: 0, levels: 0, cap: 20,
  });
})();
</script>
