<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Planetita · Arcade Perdido</title>
<meta name="theme-color" content="#0b0b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=6d7635e467">
</head>
<body class="game">
<script src="config.js?v=a32e41bd8d"></script>
<script src="common.js?v=f345c0b76c"></script>
<script>
(function () {
  const { ri, rand, clamp, pick } = Arcade;
  const PLANETS = [['#69db7c', '#2b8a3e'], ['#ffa94d', '#d9480f'], ['#74c0fc', '#1864ab'], ['#e599f7', '#862e9c'], ['#ffe066', '#e67700']];

  function geo(g) { const s = g.s; s.cx = g.W / 2; s.cy = (g.top + g.bot) / 2 + 20; s.R = Math.min(g.W, g.bot - g.top) * 0.27; }
  function placeObs(g) {
    const s = g.s, L = g.lv, n = clamp(2 + Math.floor(L / 2), 2, 9);
    s.obs = []; for (let i = 0; i < n; i++) { let a, k = 0; do { a = rand(0, Math.PI * 2); } while ((Math.abs(Math.atan2(Math.sin(a - s.a), Math.cos(a - s.a))) < 1.6 || s.obs.some((o) => Math.abs(Math.atan2(Math.sin(a - o.a), Math.cos(a - o.a))) < 0.45)) && k++ < 50); s.obs.push({ a, h: L >= 5 && Math.random() < 0.3 ? 2 : 1, e: pick(['🌵', '🪨', '🍄', '🗿']) }); }
    s.stars = []; for (let i = 0; i < 3; i++) s.stars.push({ a: rand(0, 6.28), up: rand(30, 60) });
  }
  function jump(g) { const s = g.s; if (s.h > 0 || s.dead) return; s.vh = 330; Arcade.tone(520, 0.05, 'triangle', 0.05, 300); }

  Arcade.game({
    /*THEME*/ home: 'indexpro.html', tag: 'Corre alrededor de un planeta diminuto', deco: ['🪐', '😀', '🌵', '⭐', '🌍', '🚀'], font: 'round', bg: ['#1b1b4a', '#0b0b2b'],
    music: { mode: 'lydian', bpm: 120, wave: 'triangle', style: 'arcade', root: 62 }, voice: { wave: 'triangle', mul: 1.1, echo: 0.3 },
    ambient: { e: ['✨'], n: 20, vy: 0, sway: 0, twinkle: 1, alpha: 0.5, size: [4, 10] },
    en: { title: 'Little Planet', tag: 'Run around a tiny planet', help: 'You run round and round a tiny planet. <b>Tap</b> to jump over the obstacles on its surface. Every lap the obstacles change place! Tall ones (two stacked) need a well-timed jump. Grab the ⭐ in the air and complete the laps each level asks for.', tvHelp: 'OK to jump.', dict: { 'Vueltas: ': 'Laps: ' } },
    tvHelp: 'OK para saltar.',
    id: 'planetita', title: 'Planetita', emoji: '🪐', color: '#9775fa', origin: 'Circular endless runner / Run Around / Globe',
    help: 'Corres sin parar alrededor de un planeta diminuto. <b>Toca</b> para saltar los obstáculos de su superficie. ¡En cada vuelta cambian de sitio! Los altos (dos apilados) necesitan un salto en el momento justo. Coge las ⭐ del aire y completa las vueltas que pide cada nivel.',
    lives: 3, levels: 0, cap: 25,
    setup(g) { const L = g.lv; g.s = { a: -Math.PI / 2, h: 0, vh: 0, laps: 0, need: 3 + Math.floor(Math.min(L, 25) / 3), sp: 1.5 + Math.min(L, 25) * 0.05, travel: 0, inv: 0, pal: PLANETS[(g.level - 1) % PLANETS.length] }; geo(g); placeObs(g); },
    layout(g) { if (g.s.obs) geo(g); },
    down(g) { jump(g); },
    key(g, k, d) { if (d && (k === ' ' || k === 'ArrowUp')) jump(g); },
    update(g, dt) {
      const s = g.s; if (s.done) return;
      s.inv = Math.max(0, s.inv - dt);
      s.vh -= 900 * dt; s.h = Math.max(0, s.h + s.vh * dt); if (s.h === 0) s.vh = 0;
      const da = s.sp * dt; s.a += da; s.travel += da;
      if (s.travel >= Math.PI * 2) { s.travel -= Math.PI * 2; s.laps++; Arcade.sfx.up(); g.addScore(50 * g.lv, s.cx, s.cy); if (s.laps >= s.need) { s.done = true; g.confetti(60); setTimeout(() => { if (g.state === 'play') g.win(); }, 500); return; } placeObs(g); g.ring(s.cx, s.cy, '#fff', s.R * 1.2); }
      const wrap = (x) => Math.atan2(Math.sin(x), Math.cos(x)), arcLen = s.R;
      for (const o of s.obs) if (!s.inv && Math.abs(wrap(o.a - s.a)) * arcLen < 16 && s.h < 26 * o.h) { s.inv = 1.4; Arcade.sfx.hit(); g.shake(0.25, 6); if (!g.die()) return; }
      for (const st of s.stars) if (!st.got && Math.abs(wrap(st.a - s.a)) * arcLen < 18 && Math.abs(st.up - s.h) < 24) { st.got = true; Arcade.sfx.coin(); g.addScore(20 * g.lv); }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      ctx.fillStyle = '#0b0b2b'; ctx.fillRect(0, 0, W, H);
      if (!s.obs) return;
      const { cx, cy, R } = s;
      const gr = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R); gr.addColorStop(0, s.pal[0]); gr.addColorStop(1, s.pal[1]);
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.3); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(cx + Math.cos(i * 2 + s.a * 0.2) * R * 0.5, cy + Math.sin(i * 2.3) * R * 0.5, R * 0.12, 0, 6.3); ctx.fill(); }
      const P = (a, h) => [cx + Math.cos(a) * (R + h), cy + Math.sin(a) * (R + h)];
      for (const o of s.obs) for (let k = 0; k < o.h; k++) { const [x, y] = P(o.a, 13 + k * 24); Arcade.emoji(ctx, o.e, x, y, 28, { rot: o.a + Math.PI / 2 }); }
      for (const st of s.stars) if (!st.got) { const [x, y] = P(st.a, st.up + 14); Arcade.emoji(ctx, '⭐', x, y, 20, { rot: g.rt * 2 }); }
      const [x, y] = P(s.a, s.h + 16);
      Arcade.emoji(ctx, g.face(), x, y, 30, { rot: s.a + Math.PI / 2, alpha: s.inv && Math.floor(g.rt * 12) % 2 ? 0.4 : 1 });
      Arcade.txt(ctx, 'Vueltas: ' + s.laps + '/' + s.need, cx, cy, 18, '#fff', 'center', 900, 'rgba(0,0,0,.3)');
      ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, R + 4, s.a - s.travel, s.a); ctx.globalAlpha = 0.3; ctx.stroke(); ctx.globalAlpha = 1;
    },
  });
})();
</script>
</body>
</html>
