<style>
/* Arcade Perdido · estilos comunes */
:root {
  --accent: #ffcc33;
  --bg: #120f26;
  --card: rgba(26, 22, 52, 0.92);
  --ink: #f4f1ff;
  --muted: #a9a3c9;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --tfont: var(--font);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
body.game { overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; position: fixed; inset: 0; }
#c { position: fixed; inset: 0; display: block; touch-action: none; }
.safe-probe { position: fixed; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); pointer-events: none; visibility: hidden; }

/* HUD */
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 8px) 6px calc(env(safe-area-inset-left, 0px) + 8px);
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hb {
  width: 40px; height: 40px; flex: none; border-radius: 12px; border: 0; cursor: pointer;
  background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  font-size: 20px; display: grid; place-items: center; text-decoration: none; color: #fff; font-family: var(--emoji);
}
.hb:active { transform: scale(0.92); }
.pill {
  height: 40px; padding: 0 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); min-width: 54px;
}
.pill .lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); line-height: 1; }
.pill b { font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; font-family: var(--tfont); font-weight: 400; display: inline-block; }
.pill b.bump { animation: bump 0.25s ease; }
@keyframes bump { 40% { transform: scale(1.35); color: var(--accent); } }
.pill { border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.pill.lives { flex-direction: row; font-size: 15px; letter-spacing: -2px; margin-left: auto; font-family: var(--emoji); }
.pill { border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.pill b { font-family: var(--tfont, inherit); }
.pill.bump { animation: bump .25s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* Overlays */
.ov {
  position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: radial-gradient(ellipse at 50% 30%, rgba(30, 24, 70, 0.55), rgba(8, 6, 20, 0.82));
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); overflow-y: auto;
}
.ov.on { display: flex; animation: fade 0.25s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(0.9) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.card {
  width: min(420px, 100%); background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--accent) 22%, #1a1634) 0%, rgba(22,18,44,.96) 60%); border-radius: 26px; padding: 22px 20px 18px; text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  animation: pop 0.3s cubic-bezier(0.2, 1.4, 0.4, 1); margin: auto;
}
.card .big { font-size: 64px; line-height: 1.1; font-family: var(--emoji); filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.4)); }
.card h1 { margin: 6px 0 2px; font-size: 42px; font-weight: 400; font-family: var(--tfont); letter-spacing: 0.01em; color: var(--accent); text-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 45%, #000), 0 8px 18px rgba(0,0,0,.5); line-height: 1.05; }
.card h2 { margin: 6px 0 4px; font-size: 30px; font-weight: 400; font-family: var(--tfont); text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.card .stars { font-size: 34px; letter-spacing: 4px; font-family: var(--emoji); margin: 2px 0; animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
.card .stars .off { filter: grayscale(1) brightness(.5); }
.big.bounce { animation: bob 1.6s ease-in-out infinite; display: inline-block; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg) scale(1); } 50% { transform: translateY(-8px) rotate(4deg) scale(1.06); } }
.card .origin { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.card .help { text-align: left; font-size: 15px; line-height: 1.45; background: rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; }
.card .help.small { font-size: 13px; margin-top: 12px; margin-bottom: 0; }
.card .help b { color: var(--accent); }
.card .sub { color: var(--muted); margin: 6px 0 12px; font-size: 14px; }
.card .sub b { color: var(--ink); }
.card .score { font-size: 58px; font-weight: 400; font-family: var(--tfont); color: var(--accent); line-height: 1; margin: 4px 0; font-variant-numeric: tabular-nums; }
.card .rec { font-weight: 800; color: #ffe066; margin: 6px 0 12px; }
.row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.b {
  appearance: none; border: 0; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 46px; padding: 0 18px; border-radius: 14px; font: 800 16px var(--font); color: var(--ink);
  background: rgba(255, 255, 255, 0.1); transition: transform 0.1s;
}
.b:active { transform: scale(0.95); }
.b.pri { background: var(--accent); color: #1b1530; box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.b.pri:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.b.wide { width: 100%; min-height: 54px; font-size: 21px; font-family: var(--tfont); font-weight: 400; letter-spacing: .02em; }
.b.sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
.b.ghost { background: transparent; color: var(--muted); }
.card .sub.small { font-size: 12px; margin: 10px 0 0; }
.lvs { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-top: 14px; }
.lv { aspect-ratio: 1; border: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.1); color: var(--ink); font: 800 16px var(--font); cursor: pointer; }
.lv.done { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.lv.lock { opacity: 0.4; cursor: default; font-family: var(--emoji); font-size: 14px; }

/* ---------- Identidad de cada juego ---------- */
.card.menu { background: linear-gradient(170deg, color-mix(in srgb, var(--bg1, #2a2050) 92%, #fff 8%), color-mix(in srgb, var(--bg2, #120f26) 96%, #000)); padding-top: 14px; }
.card.good { box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 3px #ffd43b88, 0 0 60px #ffd43b33; }
.card.bad { box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 3px #ff6b6b66; }
.logo { position: relative; height: 128px; margin: 0 auto 2px; width: 100%; max-width: 300px; }
.logo .halo { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent) 0, transparent 68%); animation: halo 3s ease-in-out infinite; }
@keyframes halo { 50% { transform: scale(1.18); opacity: .7; } }
.logo .mascot { position: absolute; left: 50%; top: 50%; font-size: 76px; line-height: 1; font-family: var(--emoji); transform: translate(-50%, -50%);
  animation: mascot 1.6s cubic-bezier(.4,0,.6,1) infinite; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
@keyframes mascot { 0%,100% { transform: translate(-50%, -50%) rotate(-4deg); } 50% { transform: translate(-50%, -62%) rotate(4deg) scale(1.06); } }
.logo .deco { position: absolute; font-size: 26px; font-family: var(--emoji); animation: deco 3.2s ease-in-out infinite; opacity: .95; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
.logo .d0 { left: 8%; top: 12%; } .logo .d1 { right: 8%; top: 8%; animation-delay: -.6s; font-size: 30px; }
.logo .d2 { left: 0; top: 58%; animation-delay: -1.2s; font-size: 22px; } .logo .d3 { right: 2%; top: 60%; animation-delay: -1.8s; }
.logo .d4 { left: 24%; top: 82%; animation-delay: -2.4s; font-size: 20px; } .logo .d5 { right: 24%; top: 84%; animation-delay: -.3s; font-size: 20px; }
@keyframes deco { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-10px) rotate(8deg); } }
.card h1.ttl { font-family: var(--tfont); font-size: clamp(34px, 10vw, 46px); line-height: 1; margin: 2px 0 6px; color: #fff; letter-spacing: -.01em;
  text-shadow: 0 2px 0 var(--accent), 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000), 0 7px 12px rgba(0,0,0,.5); }
.card .tag { font-family: var(--tfont); color: var(--accent); font-weight: 800; font-size: 15px; margin-bottom: 4px; }
.card .origin { font-size: 12px; margin-bottom: 10px; }
.howto { text-align: left; margin: 0 0 10px; }
.howto summary { cursor: pointer; font-weight: 800; font-size: 14px; color: var(--muted); padding: 6px 2px; list-style: none; text-align: center; }
.howto summary::-webkit-details-marker { display: none; }
.howto[open] summary { color: var(--accent); }
.howto .help { margin: 4px 0 0; }
.bests { display: flex; gap: 8px; justify-content: center; margin: 0 0 12px; flex-wrap: wrap; }
.bests span { background: rgba(0,0,0,.28); border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 14px; }
.lvhead { margin-top: 12px; font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.lvs { margin-top: 6px !important; }
.b.sm { min-height: 40px; font-size: 14px; padding: 0 14px; }
.b.ghost { background: transparent; border: 1.5px solid rgba(255,255,255,.15); }
.stars { font-size: 40px; font-family: var(--emoji); margin: 2px 0 6px; letter-spacing: 4px; }
.stars span { display: inline-block; filter: grayscale(1) brightness(.5); opacity: .5; }
.stars span.on { filter: none; opacity: 1; animation: star .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes star { from { transform: scale(0) rotate(-120deg); } to { transform: scale(1) rotate(0); } }
.card h2 { font-family: var(--tfont); }
.card .score { font-family: var(--tfont); }

/* ---------- Página de inicio ---------- */
body.home { min-height: 100%; background: radial-gradient(circle at 20% -10%, #3b2a7a 0, transparent 45%), radial-gradient(circle at 100% 20%, #6b1f5c 0, transparent 40%), var(--bg); background-attachment: fixed; }
.wrap { max-width: 1100px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .logo { height: auto; width: auto; margin: 0; max-width: none; font-size: 46px; font-family: var(--emoji); filter: drop-shadow(0 6px 16px rgba(255, 80, 180, 0.4)); }
.brand h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(90deg, #ffd166, #ff6b9d 55%, #9d7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tagline { color: var(--muted); margin: 6px 0 18px; font-size: 16px; max-width: 640px; line-height: 1.45; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
.chip { border: 0; background: rgba(255, 255, 255, 0.08); color: var(--ink); padding: 9px 14px; border-radius: 999px; font: 700 14px var(--font); cursor: pointer; }
.chip.on { background: #ffd166; color: #1b1530; }
#install { display: none; margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
.gc {
  position: relative; display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  border-radius: 22px; padding: 14px 14px 12px; min-height: 196px; overflow: hidden;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, #1d1840), #17132f 70%);
  border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); transition: transform 0.15s;
}
.gc:active { transform: scale(0.97); }
@media (hover: hover) { .gc:hover { transform: translateY(-3px); } }
.gc .em { font-size: 50px; font-family: var(--emoji); line-height: 1; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35)); }
.gc h3 { margin: 10px 0 2px; font-size: 20px; font-weight: 900; color: color-mix(in srgb, var(--c) 70%, #fff); }
.gc .or { font-size: 11.5px; color: var(--muted); }
.gc p { font-size: 13px; line-height: 1.35; margin: 8px 0 10px; color: #ddd8f5; flex: 1; }
.gc .ft { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.gc .ft span { background: rgba(0, 0, 0, 0.25); padding: 3px 8px; border-radius: 999px; }
.gc .new { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 800; background: #ff6b9d; color: #fff; padding: 3px 8px; border-radius: 999px; }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.5; }

/* ---------- Multijugador ---------- */
.pill.pl { border-width: 2.5px; }
.mptable { display: grid; gap: 6px; margin: 4px 0 14px; text-align: left; }
.mptable > div { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 12px; font-weight: 800; }

.pbtn.on { background: var(--accent); color: #1b1530; }

.tvhelp { background: rgba(0,0,0,.3); border: 1.5px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 15px; line-height: 1.5; margin: 6px 0 10px; text-align: left; }

<body class="game">
<script>
/* Arcade Perdido · configuración
   ─────────────────────────────────────────────────────────────────────────────
   modo:
     'modonormal'    → siempre modo táctil (móvil / tablet), aunque se abra en una tele.
     'modotv'        → siempre modo TV (se juega con el mando: cruceta + OK + Atrás).
     'seleccionable' → el jugador elige con el botón 📺 / 📱 y se recuerda en el dispositivo.
                       Hasta que elija, se usa la detección automática.
     'automatico'    → detecta la tele por el navegador (Fire TV, Android TV, Google TV,
                       Tizen, webOS, Bravia…).
   En 'seleccionable' y 'automatico' también se puede forzar con ?tv=1 o ?tv=0 en la URL
   (se recuerda durante la sesión).
   idioma:
     'auto' → detecta el idioma del navegador o la tele (español si es es/ca/gl/eu; si no, inglés)
              y muestra un botón 🇪🇸 / 🇬🇧 para cambiarlo (se recuerda en el dispositivo).
     'es'   → siempre en español (sin botón).
     'en'   → siempre en inglés (sin botón).
   También se puede forzar con ?lang=es o ?lang=en en la URL.
   jugadoresMax: máximo de jugadores por turnos en modo TV (1–4).
   rondasMultijugador: rondas (un nivel por turno) en los juegos con niveles. */
var ARCADE_CONFIG = {
  modo: 'automatico',
  idioma: 'auto',
  jugadoresMax: 4,
  rondasMultijugador: 5,
};

function arcadeTVDetectado() {
  return /AFT[A-Z0-9]|Android ?TV|GoogleTV|Google TV|SmartTV|SMART-TV|BRAVIA|Tizen|Web0S|webOS|NetCast|HbbTV|CrKey|AppleTV|Philips|Hisense|VIDAA|Roku|Opera TV|Silk.*AFT/i.test(navigator.userAgent || '');
}
function arcadeEsTV() {
  var m = ARCADE_CONFIG.modo;
  if (m === 'modotv') return true;
  if (m === 'modonormal') return false;
  var q = /[?&]tv=([01])/.exec(location.search || '');
  try {

    help: '<b>Arrastra</b> el dedo en cualquier sitio para mover al héroe; tus armas disparan <b>solas</b> al monstruo más cercano. Recoge las gemas 💎 que sueltan para subir de nivel y <b>elige una mejora</b>: cuchillos, aura de ajo, bolas de fuego, rayos, velocidad… Aguanta hasta que el reloj llegue a cero. En cada nivel las hordas son mayores.',
    lives: 3, levels: 0, cap: 25,
    setup(g) {
      const L = g.lv; g.s = { px: 0, py: 0, foes: [], gems: [], shots: [], fx: [], hp: 100, maxhp: 100, xp: 0, need: 4, lvl: 1, w: { knife: 1 }, t: 0, dur: 60 + Math.min(L, 25) * 4, spawnT: 0, kills: 0, cds: {}, face: 1 };
      geo(g);
    },
    layout(g) { if (g.s.foes) geo(g); },
    down(g, p) { const s = g.s; if (s.choice) { for (const c of s.choice) if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) return pickUp(g, c); return; } s.joy = { x: p.x, y: p.y, dx: 0, dy: 0 }; },
    move(g, p) { const s = g.s; if (!s.joy) return; let dx = p.x - s.joy.x, dy = p.y - s.joy.y; const d = Math.hypot(dx, dy); if (d > 50) { s.joy.x = p.x - dx / d * 50; s.joy.y = p.y - dy / d * 50; dx = dx / d * 50; dy = dy / d * 50; } s.joy.dx = dx / 50; s.joy.dy = dy / 50; },
    up(g) { g.s.joy = null; },
    tap(g, p) { const s = g.s; if (s.choice) for (const c of s.choice) if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) pickUp(g, c); },
    key(g, k, d) { const s = g.s; s.keys = s.keys || {}; s.keys[k] = d; },
    update(g, dt) {
      const s = g.s; if (s.choice || s.done) return;
      s.t += dt;
      let mx = 0, my = 0; if (s.joy) { mx = s.joy.dx; my = s.joy.dy; } if (s.keys) { if (s.keys.ArrowLeft) mx = -1; if (s.keys.ArrowRight) mx = 1; if (s.keys.ArrowUp) my = -1; if (s.keys.ArrowDown) my = 1; }
      const spd = 140 * (1 + (s.w.speed || 0) * 0.12); s.px += mx * spd * dt; s.py += my * spd * dt; if (mx) s.face = mx > 0 ? 1 : -1; s.moving = mx || my;
      // aparición
      s.spawnT -= dt; const rate = Math.max(0.12, 1 - s.t / 90 - g.lv * 0.025); if (s.spawnT <= 0) { s.spawnT = rate; spawn(g); if (s.t > 30 && Math.random() < 0.3) spawn(g); }
      if (Math.floor(s.t) % 60 === 59 && !s.bossT) { s.bossT = true; const F = FOES[4], m = 1 + g.lv * 0.15; s.foes.push({ ...F, x: s.px + 400, y: s.py, hpNow: F.hp * m * 3, max: F.hp * m * 3, hit: 0, boss: true }); g.message('👹', 1); } if (Math.floor(s.t) % 60 === 2) s.bossT = false;
      // enemigos
      for (const f of s.foes) {
        const dx = s.px - f.x, dy = s.py - f.y, d = Math.hypot(dx, dy) || 1; f.x += dx / d * f.sp * dt; f.y += dy / d * f.sp * dt; f.hit = Math.max(0, f.hit - dt);
        if (d < f.r + 14) { s.hp -= (f.boss ? 30 : 10) * dt; s.hurt = 0.1; }
      }
      // separación barata
      for (let i = 0; i < s.foes.length; i += 2) { const a = s.foes[i], b = s.foes[(i + 7) % s.foes.length]; if (a === b) continue; const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy); if (d < a.r + b.r && d > 0) { const k = (a.r + b.r - d) / 2; a.x += dx / d * k; a.y += dy / d * k; b.x -= dx / d * k; b.y -= dy / d * k; } }
      const near = (r) => { let best = null, bd = r * r; for (const f of s.foes) { const d = (f.x - s.px) ** 2 + (f.y - s.py) ** 2; if (d < bd) { bd = d; best = f; } } return best; };
      const cd = (k, t) => { s.cds[k] = (s.cds[k] || 0) - dt; if (s.cds[k] <= 0) { s.cds[k] = t; return true; } return false; };
      const W = s.w;
      if (W.knife && cd('knife', 0.9 / (1 + W.knife * 0.25))) { const f = near(420); if (f) for (let i = 0; i < Math.ceil(W.knife / 2); i++) { const a = Math.atan2(f.y - s.py, f.x - s.px) + (i - (Math.ceil(W.knife / 2) - 1) / 2) * 0.18; s.shots.push({ x: s.px, y: s.py, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, d: 10 + W.knife * 3, t: 1, e: '🔪', pierce: W.knife >= 4 ? 2 : 1 }); } }
      if (W.aura) { const r = 50 + W.aura * 12; if (cd('aura', 0.5)) for (const f of s.foes) if (Math.hypot(f.x - s.px, f.y - s.py) < r) hitFoe(g, f, 4 + W.aura * 3); }
      if (W.orb) { s.orbA = (s.orbA || 0) + dt * 3; const n = W.orb, r = 70; for (let i = 0; i < n; i++) { const a = s.orbA + i * 6.283 / n, ox = s.px + Math.cos(a) * r, oy = s.py + Math.sin(a) * r; for (const f of s.foes) if (Math.hypot(f.x - ox, f.y - oy) < f.r + 12 && f.hit <= 0) hitFoe(g, f, 8 + W.orb * 3); } }
      if (W.bolt && cd('bolt', 2.2 / (1 + W.bolt * 0.2))) { for (let i = 0; i < W.bolt; i++) { const f = s.foes[ri(0, s.foes.length - 1)]; if (f && Math.hypot(f.x - s.px, f.y - s.py) < 450) { hitFoe(g, f, 30 + W.bolt * 10); s.fx.push({ x: f.x, y: f.y, t: 0.25 }); Arcade.tone(1200, 0.05, 'sawtooth', 0.03, -900); } } }
      for (const sh of s.shots) { sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.t -= dt; for (const f of s.foes) if (!f.dead && Math.hypot(f.x - sh.x, f.y - sh.y) < f.r + 6) { hitFoe(g, f, sh.d); if (--sh.pierce <= 0) { sh.t = 0; break; } } }
      s.shots = s.shots.filter((x) => x.t > 0);
      const deadN = s.foes.filter((f) => f.dead).length; if (deadN) Arcade.tone(300 + Math.random() * 200, 0.03, 'square', 0.03);
      s.foes = s.foes.filter((f) => !f.dead && Math.hypot(f.x - s.px, f.y - s.py) < 1400);
      const mag = 95 + (W.magnet || 0) * 40;
      for (const gm of s.gems) { const dx = s.px - gm.x, dy = s.py - gm.y, d = Math.hypot(dx, dy); if (d < mag) { gm.x += dx / d * 300 * dt; gm.y += dy / d * 300 * dt; } if (d < 16) { gm.dead = true; if (gm.heal) s.hp = Math.min(s.maxhp, s.hp + 30); else { s.xp += gm.v; Arcade.tone(900 + s.xp * 5, 0.03, 'triangle', 0.03); } } }
      s.gems = s.gems.filter((x) => !x.dead); if (s.gems.length > 300) s.gems.splice(0, s.gems.length - 300);
      for (const f of s.fx) f.t -= dt; s.fx = s.fx.filter((f) => f.t > 0); s.hurt = Math.max(0, (s.hurt || 0) - dt);
      if (s.xp >= s.need) { s.xp -= s.need; levelUp(g); }
      if (s.hp <= 0) { s.hp = s.maxhp; s.foes = s.foes.filter((f) => Math.hypot(f.x - s.px, f.y - s.py) > 300); g.message('💔', 0.8); if (!g.die()) { s.done = true; return; } }
      if (s.t >= s.dur) { s.done = true; Arcade.sfx.win(); g.confetti(70); g.addScore(s.kills * g.lv, g.W / 2, g.H / 2); setTimeout(() => { if (g.state === 'play') g.win(); }, 700); }
    },
    draw(g, ctx) {
      const s = g.s, W = g.W, H = g.H;
      ctx.fillStyle = '#1a1226'; ctx.fillRect(0, 0, W, H);
      if (!s.foes) return;
      const ox = s.cx - s.px, oy = s.cy - s.py;
      // suelo de baldosas
      const T = 64; ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
      for (let x = ((ox % T) + T) % T; x < W; x += T) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = ((oy % T) + T) % T; y < H; y += T) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      for (let i = -6; i < 12; i++) for (let j = -6; j < 12; j++) { const wx = Math.floor((s.px - W) / 200) * 200 + i * 200, wy = Math.floor((s.py - H) / 200) * 200 + j * 200, hsh = Math.abs(Math.sin(wx * 12.9898 + wy * 78.233)) * 43758 % 1; if (hsh < 0.25) Arcade.emoji(ctx, hsh < 0.1 ? '🪦' : hsh < 0.18 ? '🌿' : '🕯️', wx + ox, wy + oy, 22, { alpha: 0.35 }); }
      if (s.w.aura) { const r = 50 + s.w.aura * 12; ctx.fillStyle = 'rgba(200,255,200,.08)'; ctx.beginPath(); ctx.arc(s.cx, s.cy, r, 0, 6.3); ctx.fill(); ctx.strokeStyle = 'rgba(200,255,200,.25)'; ctx.stroke(); }
      for (const gm of s.gems) Arcade.emoji(ctx, gm.heal ? '🍗' : gm.v >= 3 ? '💎' : '🔹', gm.x + ox, gm.y + oy, gm.heal ? 20 : 12);
      for (const f of s.foes) { Arcade.emojiTo(ctx, f.e, f.x + ox, f.y + oy, f.r * 2.2 * (f.boss ? 1.8 : 1), s.px - f.x, s.py - f.y, { mode: 'flip', alpha: f.hit > 0 ? 0.5 : 1 }); if (f.boss) { ctx.fillStyle = '#e03131'; ctx.fillRect(f.x + ox - 30, f.y + oy - 44, 60 * f.hpNow / f.max, 5); } }
      for (const sh of s.shots) Arcade.emoji(ctx, sh.e, sh.x + ox, sh.y + oy, 18, { rot: Math.atan2(sh.vy, sh.vx) + Math.PI * 0.75 });
      if (s.w.orb) for (let i = 0; i < s.w.orb; i++) { const a = (s.orbA || 0) + i * 6.283 / s.w.orb; Arcade.emoji(ctx, '🔥', s.cx + Math.cos(a) * 70, s.cy + Math.sin(a) * 70, 24); }
      for (const f of s.fx) { ctx.strokeStyle = `rgba(255,255,150,${f.t * 4})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(f.x + ox, 0); ctx.lineTo(f.x + ox + 10, (f.y + oy) / 2); ctx.lineTo(f.x + ox - 5, f.y + oy); ctx.stroke(); }
      Arcade.emojiTo(ctx, s.hurt ? '😱' : g.face(), s.cx, s.cy - (s.moving ? Math.abs(Math.sin(g.rt * 10)) * 3 : 0), 32, s.face > 0 ? 1 : -1, 0, { mode: 'flip', alpha: s.hurt ? 0.6 : 1 });
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(s.cx - 20, s.cy + 22, 40, 5); ctx.fillStyle = '#e03131'; ctx.fillRect(s.cx - 20, s.cy + 22, 40 * Math.max(0, s.hp / s.maxhp), 5);
      if (s.joy) { ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.joy.x, s.joy.y, 50, 0, 6.3); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(s.joy.x + s.joy.dx * 50, s.joy.y + s.joy.dy * 50, 18, 0, 6.3); ctx.fill(); }
      // HUD
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(0, g.top, W, 8); ctx.fillStyle = '#4dabf7'; ctx.fillRect(0, g.top, W * s.xp / s.need, 8);
      const left = Math.max(0, Math.ceil(s.dur - s.t)); Arcade.txt(ctx, '⏳ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + '   💀 ' + s.kills + '   ⭐ ' + s.lvl, W / 2, g.top + 24, 15, '#fff', 'center', 900, 'rgba(0,0,0,.5)');
      if (s.choice) {
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
        Arcade.txt(ctx, 'Elige mejora', W / 2, s.choice[0].y - 30, 24, '#ffd43b', 'center', 900);
        for (const c of s.choice) { ctx.fillStyle = '#2e1f42'; Arcade.rr(ctx, c.x, c.y, c.w, c.h, 14); ctx.fill(); ctx.strokeStyle = '#b197fc'; ctx.lineWidth = 2; ctx.stroke(); Arcade.emoji(ctx, c.e, c.x + c.w / 2, c.y + 42, 44); Arcade.txt(ctx, Arcade.T(c.es, c.en), c.x + c.w / 2, c.y + 86, Math.min(14, c.w / 7), '#fff', 'center', 800); Arcade.txt(ctx, 'Nv ' + ((s.w[c.k] || 0) + 1), c.x + c.w / 2, c.y + 105, 11, '#b197fc', 'center', 800); }
      }
    },
  });
})();
