<style>
/* Arcade Perdido · estilos comunes */
:root {
  --accent: #ffcc33;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
body.game { overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; position: fixed; inset: 0; }
#c { position: fixed; inset: 0; display: block; touch-action: none; }
.safe-probe { position: fixed; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); pointer-events: none; visibility: hidden; }

/* HUD */
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 8px) 6px calc(env(safe-area-inset-left, 0px) + 8px);
  pointer-events: none;
}

.hb {
  width: 40px; height: 40px; flex: none; border-radius: 12px; border: 0; cursor: pointer;
  background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  font-size: 20px; display: grid; place-items: center; text-decoration: none; color: #fff; font-family: var(--emoji);
}
.hb:active { transform: scale(0.92); }
.pill {
  height: 40px; padding: 0 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); min-width: 54px;
}
.pill .lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); line-height: 1; }
.pill b { font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; font-family: var(--tfont); font-weight: 400; display: inline-block; }

.pill { border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.pill.lives { flex-direction: row; font-size: 15px; letter-spacing: -2px; margin-left: auto; font-family: var(--emoji); }
.pill { border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.pill b { font-family: var(--tfont, inherit); }
.pill.bump { animation: bump .25s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* Overlays */
.ov {
  position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: radial-gradient(ellipse at 50% 30%, rgba(30, 24, 70, 0.55), rgba(8, 6, 20, 0.82));

}
.ov.on { display: flex; animation: fade 0.25s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(0.9) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.card {
  width: min(420px, 100%); background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--accent) 22%, #1a1634) 0%, rgba(22,18,44,.96) 60%); border-radius: 26px; padding: 22px 20px 18px; text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  animation: pop 0.3s cubic-bezier(0.2, 1.4, 0.4, 1); margin: auto;
}

.card h1 { margin: 6px 0 2px; font-size: 42px; font-weight: 400; font-family: var(--tfont); letter-spacing: 0.01em; color: var(--accent); text-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 45%, #000), 0 8px 18px rgba(0,0,0,.5); line-height: 1.05; }

.card .stars { font-size: 34px; letter-spacing: 4px; font-family: var(--emoji); margin: 2px 0; animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
.card .stars .off { filter: grayscale(1) brightness(.5); }
.big.bounce { animation: bob 1.6s ease-in-out infinite; display: inline-block; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg) scale(1); } 50% { transform: translateY(-8px) rotate(4deg) scale(1.06); } }

.row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }

/* ---------- Identidad de cada juego ---------- */

<script>
/* Arcade Perdido · configuración
   ─────────────────────────────────────────────────────────────────────────────
   modo:
     'modonormal'    → siempre modo táctil (móvil / tablet), aunque se abra en una tele.
     'modotv'        → siempre modo TV (se juega con el mando: cruceta + OK + Atrás).
     'seleccionable' → el jugador elige con el botón 📺 / 📱 y se recuerda en el dispositivo.
                       Hasta que elija, se usa la detección automática.
     'automatico'    → detecta la tele por el navegador (Fire TV, Android TV, Google TV,
                       Tizen, webOS, Bravia…).
   En 'seleccionable' y 'automatico' también se puede forzar con ?tv=1 o ?tv=0 en la URL
   (se recuerda durante la sesión).
   idioma:
     'auto' → detecta el idioma del navegador o la tele (español si es es/ca/gl/eu; si no, inglés)
              y muestra un botón 🇪🇸 / 🇬🇧 para cambiarlo (se recuerda en el dispositivo).
     'es'   → siempre en español (sin botón).
     'en'   → siempre en inglés (sin botón).
   También se puede forzar con ?lang=es o ?lang=en en la URL.
   jugadoresMax: máximo de jugadores por turnos en modo TV (1–4).
   rondasMultijugador: rondas (un nivel por turno) en los juegos con niveles. */
var ARCADE_CONFIG = {
  modo: 'automatico',
  idioma: 'auto',
  jugadoresMax: 4,
  rondasMultijugador: 5,
};

function arcadeTVDetectado() {
  return /AFT[A-Z0-9]|Android ?TV|GoogleTV|Google TV|SmartTV|SMART-TV|BRAVIA|Tizen|Web0S|webOS|NetCast|HbbTV|CrKey|AppleTV|Philips|Hisense|VIDAA|Roku|Opera TV|Silk.*AFT/i.test(navigator.userAgent || '');
}
function arcadeEsTV() {
  var m = ARCADE_CONFIG.modo;
  if (m === 'modotv') return true;
  if (m === 'modonormal') return false;
  var q = /[?&]tv=([01])/.exec(location.search || '');
  try {

  if (EN) { document.querySelectorAll('[data-i]').forEach(e => { if (TX[e.dataset.i]) e.textContent = TX[e.dataset.i]; }); document.title = 'Arcade Pro · Mobile hits with emojis'; }
  const loc = (g, k) => (EN && g.en && g.en[k]) || g[k];
  if ((ARCADE_CONFIG.idioma || 'auto') === 'auto') {
    const lb = document.getElementById('lang'); lb.style.display = 'inline-flex'; lb.textContent = EN ? '🇪🇸 Español' : '🇬🇧 English';
    lb.addEventListener('click', () => { const nl = EN ? 'es' : 'en'; arcadeElegirIdioma(nl); location.search = '?lang=' + nl; });
  }
  { const o = document.getElementById('other'); o.href = 'index.html?lang=' + (EN ? 'en' : 'es');
  }
  const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const hay = (g) => norm([g.title, g.tag, g.desc, g.origin, g.ctrl, g.en && g.en.title, g.en && g.en.tag, g.en && g.en.desc].join(' '));
  let curF = '', curQ = '';
  function card(g, other) {
    const best = get('best_' + g.id, 0), done = get('done_' + g.id, false);
    const a = document.createElement('a');
    a.className = 'gc'; a.href = g.file + '?lang=' + (EN ? 'en' : 'es'); a.style.setProperty('--c', g.color);
    a.innerHTML = `${other ? `<span class="new" style="background:#9775fa">${other}</span>` : best ? '' : `<span class="new">${EN ? 'NEW' : 'NUEVO'}</span>`}
      <div class="em">${g.emoji}</div><h3>${loc(g, 'title')}</h3><div class="or">${g.origin}</div>
      <p>${loc(g, 'desc')}</p>
      <div class="ft"><span>${loc(g, 'ctrl')}</span><span>${done ? '🏆 ' : '⭐ '}${best}</span></div>`;
    return a;
  }
  function render(filter) {
    if (filter !== undefined) curF = filter;
    const words = norm(curQ).split(/\s+/).filter(Boolean);
    const ok = (g) => (!curF || g.ctrl.indexOf(curF) === 0) && words.every((w) => hay(g).indexOf(w) >= 0);
    grid.innerHTML = '';
    const mine = GAMES_PRO.filter(ok);
    mine.forEach((g) => grid.appendChild(card(g)));
    // con búsqueda, también enseña los de la otra colección
    const others = words.length ? (window.GAMES || []).filter(ok) : [];
    others.forEach((g) => grid.appendChild(card(g, '🕹️ Arcade Perdido')));
    if (!mine.length && !others.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = EN ? 'No games found. Try another word (e.g. Tetris, Zuma, 2048).' : 'No hay juegos con eso. Prueba otra palabra (por ejemplo: Tetris, Zuma, 2048).'; grid.appendChild(p); }
  }
  const qi = document.getElementById('q');
  if (EN) { qi.placeholder = '🔎 Search games…'; qi.setAttribute('aria-label', 'Search'); }
  try { const u = new URLSearchParams(location.search).get('q'); if (u) { qi.value = u; curQ = u; } } catch (_) {}
  qi.addEventListener('input', () => { curQ = qi.value; render(); });
  qi.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const f = grid.querySelector('a.gc'); if (f && qi.value.trim()) location.href = f.href; } });
  render();
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
    render(b.dataset.f);
  });
  document.getElementById('foot').innerHTML = GAMES_PRO.length + (EN ? ' games · v' : ' juegos · v') + ARCADE_VERSION + (EN ? '<br>Works offline once loaded.' : '<br>Funciona sin conexión una vez cargado.');

  // Cambio a modo TV (solo si la configuración lo permite)
  if (ARCADE_CONFIG.modo === 'seleccionable') {
    const tb = document.getElementById('tvmode'); tb.style.display = 'inline-flex';
    tb.addEventListener('click', () => { arcadeElegirTV(true); location.href = 'indextv.html?sec=pro'; });
  }
  // Instalación como app
  let deferred = null;
  const ib = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; ib.style.display = 'inline-flex'; });
  ib.addEventListener('click', async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; ib.style.display = 'none'; }
    else alert(EN ? 'On iPhone: tap Share and then “Add to Home Screen”.' : 'En iPhone: pulsa Compartir y luego «Añadir a pantalla de inicio».');
  });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
  if (ios) ib.style.display = 'inline-flex';
  window.addEventListener('pageshow', () => render(document.querySelector('[data-f].on').dataset.f));
  try { /* PWA desactivada (v2.8.1): quita el service worker y las cachés viejas */ if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {}); if (window.caches) caches.keys().then((ks) => ks.filter((k) => /^arcade-perdido-/.test(k)).forEach((k) => caches.delete(k))).catch(() => {}); } catch (e) {}
})();
</script>
</body>
</html>
