<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE7A1">
<meta name="description" content="Juego para niños: monta frases en inglés pieza a pieza y aprende las palabras pequeñas (a, the, some, what, who…) con su significado y ejemplos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fábrica de Frases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
/* Layout: vertical primero — barra fina, reto + cinta, columnas apiladas como filas con scroll, botonera abajo. En horizontal: dos paneles (reto, cinta y botones | columnas). Mapa en rejilla que salta de línea. Look único de fábrica de juguetes soleada, sin tema oscuro. */
:root{
  color-scheme:light;
  --bg:#FFE7A1; --bg-dot:#FFD86A; --panel:#FFFFFF; --panel-soft:#FFF6D9; --edge:#D9CFA8;
  --ink:#26244A; --ink-soft:#6A6790; --belt:#34325E; --belt-2:#4A4782; --roller:#9C98D6;
  --c-subj:#7A4DFF; --c-aux:#F2405F; --c-neg:#F07F00; --c-verb:#D6262C; --c-end:#D9409F; --c-obj:#0B9B9B;
  --ok:#17A35A; --bad:#F2405F; --warn:#F2A900; --gold:#FFB800; --pip:#45C4EE;
  --f-display:'Sniglet','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Andika','Trebuchet MS',system-ui,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body,#app{height:100%}
body{margin:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 2px,transparent 2.5px);background-size:26px 26px;color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c-subj);outline-offset:2px}
.screen{height:100%;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:8px}

.toy{--c:var(--ink);font-family:var(--f-display);font-size:1.05rem;border:0;border-radius:14px;padding:.4rem .85rem;min-height:44px;background:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 62%,#000);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.toy:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 62%,#000)}
.toy.white{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--edge)}
.toy.white:active{box-shadow:0 1px 0 var(--edge)}
.toy.go{--c:var(--ok);font-size:1.25rem}
.toy[disabled]{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.round{width:42px;height:42px;min-height:42px;padding:0;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;padding:.2rem .65rem;font-family:var(--f-display);font-size:1.05rem;box-shadow:0 3px 0 var(--edge);font-variant-numeric:tabular-nums;min-height:34px;white-space:nowrap}
.star{width:20px;height:20px;fill:var(--gold);flex:none}

/* ---------- MAPA ---------- */
#map{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:10px 28px;overscroll-behavior:contain}
.maptop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .pip{width:clamp(46px,12vw,66px)}
.logo h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,7vw,2.5rem);line-height:1;text-shadow:0 3px 0 #fff;text-wrap:balance}
.logo p{margin:3px 0 0;color:var(--ink-soft);font-size:.92rem}
.maptop .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 10px;background:rgba(255,255,255,.45);border-radius:24px;padding:16px 10px}
.node{display:grid;justify-items:center;align-content:start;gap:4px;border:0;background:none;padding:0}
.disc{width:clamp(66px,19vw,90px);height:clamp(66px,19vw,90px);border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:clamp(1.9rem,8vw,2.6rem);box-shadow:0 6px 0 var(--edge), inset 0 0 0 5px var(--c,#fff);position:relative}
.node .num{position:absolute;top:-6px;left:-6px;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-size:.95rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.node .nm{font-family:var(--f-display);font-size:.95rem;max-width:7.5rem;text-align:center;line-height:1.05}
.node .st{display:flex;gap:1px}
.node .st svg{width:18px;height:18px;fill:#E4D8AE}
.node .st svg.on{fill:var(--gold)}
.node.locked .disc{filter:grayscale(1);opacity:.5}
.node.locked .disc::after{content:'🔒';position:absolute;font-size:1.4rem;bottom:-4px;right:-4px}
.node.current .disc{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.04)}}

/* ---------- JUEGO ---------- */
#play{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "board" "acts";gap:8px}
.topbar{grid-area:top;display:flex;align-items:center;gap:8px;min-width:0}
.lvlname{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:40%}
.dots{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}
.dots i{flex:1;max-width:26px;height:10px;border-radius:5px;background:rgba(38,36,74,.15)}
.dots i.done{background:var(--ok)}
.dots i.now{background:var(--gold)}
.stage{grid-area:stage;display:grid;gap:8px;align-content:start;min-height:0;min-width:0}
.say{display:flex;align-items:center;gap:8px;min-width:0}
.say .pip{width:44px;flex:none}
.bubble{position:relative;background:var(--panel);border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 var(--edge);min-width:0;flex:1}
.bubble::before{content:'';position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--panel);border-left:0}
.prompt{display:flex;align-items:center;gap:8px;min-width:0}
.emo{font-size:1.45rem;line-height:1;letter-spacing:.04em;flex:none}
.es{font-family:var(--f-display);font-size:clamp(1.05rem,4.4vw,1.35rem);line-height:1.15;min-width:0}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:.72rem;font-weight:700;background:var(--panel-soft);border-radius:999px;padding:.05rem .45rem;color:var(--ink-soft)}
.tag.rev{background:var(--c-subj);color:#fff}
.seg{display:inline-flex;background:var(--panel-soft);border-radius:999px;padding:3px;gap:2px;margin-top:4px}
.seg button{border:0;background:none;border-radius:999px;padding:.25rem .75rem;min-height:34px;font-family:var(--f-display)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.belt{position:relative;background:var(--belt);border-radius:16px;padding:8px 10px 18px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;gap:7px;min-height:66px}
.belt::after{content:'';position:absolute;left:10px;right:10px;bottom:6px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--belt-2) 0 10px,var(--roller) 10px 14px);animation:roll 1.4s linear infinite}
@keyframes roll{to{background-position:28px 0}}
.blk{--c:var(--ink);background:var(--c);color:#fff;font-weight:700;font-size:clamp(1.15rem,5.6vw,1.75rem);line-height:1.1;padding:.15em .42em;border-radius:11px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000)}
.blk .tl{background:var(--tc);border-radius:7px;padding:0 .16em;margin-left:.05em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.blk.ph{background:transparent;border:3px dashed color-mix(in srgb,var(--c) 70%,#fff);color:color-mix(in srgb,var(--c) 45%,#fff);box-shadow:none;font-size:.85rem;font-family:var(--f-body);padding:.45em .65em}
.blk.drop{animation:drop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-22px) scale(.7);opacity:0}}
.pu{color:#fff;font-weight:700;font-size:clamp(1.3rem,6vw,1.9rem);margin-left:-4px}

.board{grid-area:board;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;overscroll-behavior:contain;padding:2px 2px 6px}
.col{--c:var(--ink);display:grid;grid-template-columns:4.2rem minmax(0,1fr);align-items:center;gap:8px;background:rgba(255,255,255,.62);border-radius:14px;padding:6px 8px;border:3px solid transparent;flex:none}
.col.next{border-color:var(--c);background:rgba(255,255,255,.9)}
.col.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.col h3{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-family:var(--f-display);font-weight:400;font-size:.88rem;line-height:1;color:var(--c)}
.col h3 svg{width:16px;height:16px;fill:currentColor}
.new{font-family:var(--f-body);font-weight:700;font-size:.6rem;background:var(--gold);color:var(--ink);border-radius:6px;padding:1px 5px;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{--c:var(--ink);position:relative;min-height:44px;padding:.2rem .6rem;border-radius:12px;border:3px solid color-mix(in srgb,var(--c) 35%,#fff);background:#fff;color:var(--ink);font:700 clamp(.98rem,4.2vw,1.15rem)/1.05 var(--f-body);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 35%,#fff);display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .08s}
.chip .e{font-size:1.15em}
.chip.none{font-weight:400;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.chip:active{transform:translateY(3px)}
.chip.fresh::after{content:'';position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff}
.chip.hint{animation:glow .9s 2}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--gold)}}
.actions{grid-area:acts;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}

/* Horizontal: dos paneles */
@media (orientation:landscape) and (min-width:560px){
  #play{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage board" "acts board"}
  .stage{overflow-y:auto}
  .lvlname{max-width:none}
  .dots{justify-content:flex-start}
}
@media (orientation:landscape) and (max-height:480px){
  .say .pip{width:36px}
  .blk{font-size:clamp(1rem,5.4vh,1.5rem)}
  .chip{min-height:40px}
}


/* ---------- PALABRAS PEQUEÑAS ---------- */
.trackhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.trackhead h2{margin:0;font-family:var(--f-display);font-size:clamp(1.3rem,5.5vw,1.8rem);text-shadow:0 2px 0 #fff}
.trackhead p{margin:2px 0 0;color:var(--ink-soft);font-size:.92rem}
.node .wl{font-weight:700;font-size:.78rem;color:var(--c);text-align:center;max-width:7.5rem}
.wbox{background:var(--panel);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--edge);display:grid;place-items:center;min-height:76px}
.sent{font-family:var(--f-display);font-size:clamp(1.35rem,6.4vw,2rem);line-height:1.3;text-align:center;text-wrap:balance}
.gap{display:inline-block;min-width:2.6em;margin:0 .15em;padding:0 .2em;border-bottom:4px dashed var(--c-subj);color:var(--c-subj);text-align:center}
.gap.ok{border-bottom-style:solid;color:var(--ok)}
.wbig{display:flex;align-items:center;justify-content:center;gap:12px}
.bigw{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,12vw,3.6rem);color:var(--c-subj);line-height:1}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.opt{min-height:58px;border:0;border-radius:16px;background:#fff;color:var(--ink);font:800 clamp(1.2rem,5.4vw,1.6rem)/1.1 var(--f-display);box-shadow:0 5px 0 var(--edge);padding:.3rem .5rem;transition:transform .08s}
.opt.es-opt{font-size:clamp(1rem,4.4vw,1.25rem)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.opt.no{opacity:.35;text-decoration:line-through;pointer-events:none}
.opt.small{min-height:48px;display:grid;gap:2px;font-size:1.15rem;box-shadow:0 3px 0 var(--edge);background:var(--panel-soft)}
.opt.small small{font:400 .78rem var(--f-body);color:var(--ink-soft)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}
.tiles,.tiles-line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.tile{border:0;border-radius:12px;background:#fff;color:var(--ink);font:700 clamp(1.1rem,5vw,1.45rem) var(--f-body);padding:.35rem .7rem;min-height:48px;box-shadow:0 4px 0 var(--edge)}
.tile.on{background:var(--c-subj);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c-subj) 60%,#000)}
.tile.ghost{opacity:.25;box-shadow:none}
.pu2{font-family:var(--f-display);font-size:1.6rem}
.wacts{grid-template-columns:repeat(auto-fit,minmax(0,1fr));padding-left:58px}
.card .mean{font-size:1.15rem}
.exs{list-style:none;padding:0!important;display:grid;gap:6px}
.exs li{display:flex;align-items:center;gap:8px;background:var(--panel-soft);border-radius:12px;padding:6px 8px}
.exs .round{width:36px;height:36px;min-height:36px;flex:none;font-size:.95rem}
.exe{font-size:1.2em}
.tip{background:#FFF3C4;border-radius:12px;padding:6px 10px}
.exline{background:var(--panel-soft);border-radius:12px;padding:8px 12px;font-size:1.2rem;line-height:1.35}
mark{background:#FFE066;color:inherit;border-radius:5px;padding:0 .12em}

/* ---------- OVERLAYS ---------- */
.ov{position:fixed;inset:0;z-index:20;background:rgba(38,36,74,.45);display:grid;place-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border-radius:24px;padding:16px 18px;width:min(620px,100%);max-height:calc(100% - 8px);overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.15);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;animation:popin .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes popin{from{transform:scale(.8);opacity:0}}
.card .pip{width:clamp(56px,16vw,100px);align-self:start}
.card h2{margin:0;font-family:var(--f-display);font-size:clamp(1.35rem,6vw,1.9rem);line-height:1.05;text-wrap:balance}
.card .txt{grid-column:1/-1;font-size:clamp(1rem,4vw,1.12rem);line-height:1.35}
.card .txt p{margin:.25rem 0}
.card ul{margin:.2rem 0;padding-left:1.1rem}
.card .exbelt{background:var(--belt);border-radius:14px;padding:8px 10px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:.35rem 0}
.card .exbelt .blk{font-size:clamp(1rem,5vw,1.4rem)}
.card .row{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.card.good{box-shadow:0 8px 0 var(--ok)} .card.good h2{color:var(--ok)}
.card.bad{box-shadow:0 8px 0 var(--bad)} .card.bad h2{color:var(--bad)}
.card.meh{box-shadow:0 8px 0 var(--warn)} .card.meh h2{color:#B27A00}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:.35rem 0}
.words span{--c:var(--ink);background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);border-radius:10px;padding:.15rem .55rem;font-weight:700}
.bigstars{display:flex;gap:8px;margin:.3rem 0}
.bigstars svg{width:clamp(48px,15vw,70px);height:clamp(48px,15vw,70px);fill:#E8E1C6}
.bigstars svg.on{fill:var(--gold);animation:spinpop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes spinpop{from{transform:scale(0) rotate(-120deg)}}
.trad{color:var(--ink-soft)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* Pip */
.pip .e-happy,.pip .e-sad{display:none}
.pip.happy .e-idle,.pip.sad .e-idle{display:none}
.pip.happy .e-happy{display:inline}
.pip.sad .e-sad{display:inline}
.pip.happy{animation:jump .5s 2}
@keyframes jump{50%{transform:translateY(-8px)}}
.pip .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pip .ant{animation:wob 2.4s ease-in-out infinite;transform-origin:50px 22px}
@keyframes wob{50%{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <section class="screen" id="map"></section>
  <section class="screen" id="play" hidden></section>
</div>
<div class="ov" id="ov" hidden></div>
<canvas id="fx"></canvas>

<script>
(()=>{
/* ================= DATOS ================= */
const SUBJ=[
 {id:'I',en:'I',p:'1s',es:'yo',i:0,gus:'',e:'🙋'},
 {id:'you',en:'you',p:'2',es:'tú',i:1,gus:'',e:'👉'},
 {id:'he',en:'he',p:'3s',es:'él',i:2,gus:'a él ',e:'👦'},
 {id:'she',en:'she',p:'3s',es:'ella',i:2,gus:'a ella ',e:'👧'},
 {id:'it',en:'it',p:'3s',es:'',i:2,gus:'',e:'🐶'},
 {id:'we',en:'we',p:'pl',es:'nosotros',i:3,gus:'',e:'👫'},
 {id:'they',en:'they',p:'pl',es:'ellos',i:4,gus:'a ellos ',e:'👥'}
];
const AUX=[
 {id:'do',fam:['do','does'],form:'base',t:'pres',nt:"don't",ok:p=>p!=='3s'},
 {id:'does',fam:['do','does'],form:'base',t:'pres',nt:"doesn't",ok:p=>p==='3s'},
 {id:'did',fam:['did'],form:'base',t:'past',nt:"didn't",ok:()=>true},
 {id:'will',fam:['will'],form:'base',t:'fut',nt:"won't",ok:()=>true},
 {id:'can',fam:['can','could'],form:'base',t:'can',nt:"can't",ok:()=>true},
 {id:'could',fam:['can','could'],form:'base',t:'could',nt:"couldn't",ok:()=>true},
 {id:'am',fam:['am','is','are'],form:'ing',t:'prog',nt:null,ok:p=>p==='1s'},
 {id:'is',fam:['am','is','are'],form:'ing',t:'prog',nt:"isn't",ok:p=>p==='3s'},
 {id:'are',fam:['am','is','are'],form:'ing',t:'prog',nt:"aren't",ok:p=>p==='2'||p==='pl'},
 {id:'was',fam:['was','were'],form:'ing',t:'pprog',nt:"wasn't",ok:p=>p==='1s'||p==='3s'},
 {id:'were',fam:['was','were'],form:'ing',t:'pprog',nt:"weren't",ok:p=>p==='2'||p==='pl'},
 {id:'have',fam:['have','has'],form:'part',t:'perf',nt:"haven't",ok:p=>p!=='3s'},
 {id:'has',fam:['have','has'],form:'part',t:'perf',nt:"hasn't",ok:p=>p==='3s'}
];
const VERBS=[
 {id:'like',e:'😍',base:'like',s:'likes',ing:'liking',past:'liked',part:'liked',stative:true},
 {id:'play',e:'🤸',base:'play',s:'plays',ing:'playing',past:'played',part:'played',es:{inf:'jugar',pres:['juego','juegas','juega','jugamos','juegan'],past:['jugué','jugaste','jugó','jugamos','jugaron'],ger:'jugando',part:'jugado'}},

const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const capEs=s=>s.replace(/^(¿?)(\S)/,(m,a,b)=>a+b.toUpperCase());
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function prefixLen(a,b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i}

function buildTokens(mode,s,A,S,V,O){

    else{T.push({col:'aux',stem:A.id});if(s.neg==='not')T.push({col:'neg',stem:'not'})}
  };
  const subjTok=()=>T.push(S?{col:'subj',stem:S.en}:{col:'subj',ph:true});
  const verbTok=()=>{if(!V){T.push({col:'verb',ph:true});return}const w=verbWord(V,s.end,A),p=prefixLen(V.base,w);T.push({col:'verb',stem:w.slice(0,p),tail:w.slice(p),tc:'end'})};
  const objTok=()=>T.push(O?{col:'obj',stem:O.en}:{col:'obj',ph:true});
  if(mode==='q'){auxTok();subjTok();verbTok();objTok()}else{subjTok();if(A||s.neg)auxTok();verbTok();objTok()}
  if(T[0]&&!T[0].ph)T[0]={...T[0],stem:cap(T[0].stem)};

}
const plain=(T,mode)=>T.map(t=>t.ph?'':(t.stem||'')+(t.tail||'')).filter(Boolean).join(' ')+(mode==='q'?'?':'.');
function esVerb(V,t,i){const E=V.es;switch(t){
  case 'pres':return E.pres[i];case 'past':return E.past[i];
  case 'fut':return(E.fut||E.inf)+['é','ás','á','emos','án'][i];
  case 'can':return['puedo','puedes','puede','podemos','pueden'][i]+' '+E.inf;
  case 'could':return['podría','podrías','podría','podríamos','podrían'][i]+' '+E.inf;
  case 'prog':return['estoy','estás','está','estamos','están'][i]+' '+E.ger;
  case 'pprog':return['estaba','estabas','estaba','estábamos','estaban'][i]+' '+E.ger;
  case 'perf':return['he','has','ha','hemos','han'][i]+' '+E.part}}
function toSpanish(mode,s,A,S,V,O){
  const i=S.i,neg=!!s.neg,t=A?A.t:(s.end==='ed'?'past':'pres');let body;
  if(V.id==='like'){

    const f={pres:['gusta','gustan'],past:['gustó','gustaron'],fut:['gustará','gustarán'],can:['puede gustar','pueden gustar'],could:['podría gustar','podrían gustar'],perf:['ha gustado','han gustado'],prog:['está gustando','están gustando'],pprog:['estaba gustando','estaban gustando']}[t][n];
    body=S.gus+(neg?'no ':'')+pron+' '+f+' '+(O.gus||O.def);
  }else{
    const obj=V.id==='play'?O.jugar:(['eat','drink','want'].includes(V.id)?(O.bare||O.def):O.def);

function analyze(mode,s){
  const A=s.aux?AUXM[s.aux]:null,S=SUBJM[s.subj],V=VERBM[s.verb],O=OBJM[s.obj];
  const T=buildTokens(mode,s,A,S,V,O),en=plain(T,mode),missing=[];
  if(mode==='q'&&!A)missing.push('aux');if(!S)missing.push('subj');if(!V)missing.push('verb');if(!O)missing.push('obj');
  if(missing.length)return{ok:false,missing,errs:[],T,en};
  const E=[],b=x=>'<b>'+x+'</b>',SE=S.en;
  if(A&&!A.ok(S.p)){const r=A.fam.find(id=>AUXM[id].ok(S.p));E.push(`Con ${b(SE)} se usa ${b(r)}, no ${b(A.id)}.`)}
  if(V.stative&&(s.end==='ing'||(A&&A.form==='ing')))E.push(`${b(V.base)} casi nunca se usa con ${b('-ing')}. Prueba con ${b('do')}, ${b('does')} o ${b('did')}.`);

    if(A.form==='base')E.push(`Después de ${b(A.id)} el verbo va sin nada al final: ${b(V.base)}.`);

    else E.push(`Con ${b(A.id)} el verbo va con ${b('-ed')} (participio): ${b(V.part)}.`)}}
  else{
    if(s.neg)E.push(`Para decir que ${b('no')} hace falta un auxiliar: ${b("don't")}, ${b("doesn't")} o ${b("didn't")}.`);
    if(s.end==='ing')E.push(`Para usar ${b('-ing')} hace falta ${b('am')}, ${b('is')}, ${b('are')}, ${b('was')} o ${b('were')}.`);
    else if(s.end===''&&S.p==='3s'&&!s.neg)E.push(`Con ${b('he')}, ${b('she')} o ${b('it')} el verbo lleva ${b('-s')}: ${b(SE+' '+V.s)}.`);
    else if(s.end==='s'&&S.p!=='3s')E.push(`La ${b('-s')} solo va con ${b('he')}, ${b('she')} o ${b('it')}. Con ${b(SE)} se dice ${b(V.base)}.`);
  }
  if(A&&s.neg){
    if(A.id==='am'&&s.neg==="n't")E.push(`${b("amn't")} no existe. Usa ${b('am not')}.`);
    else if(mode==='q'&&s.neg==='not')E.push(A.nt?`En las preguntas el "no" va pegado: ${b(cap(A.nt)+' '+SE+'…?')}`:`Con ${b('am')} mejor pregunta sin negación.`);
  }
  if(!O.verbs.includes(V.id))E.push(`${b(V.base+' '+O.en)} no tiene sentido. Prueba con ${O.verbs.map(v=>b(v+' '+O.en)).join(' o ')}.`);
  if(E.length)return{ok:false,missing:[],errs:E,T,en};

function vocab(li){
  const set={subj:new Set(),verb:new Set(),obj:new Set(),aux:new Set(),neg:new Set(),end:new Set(['']),cols:new Set()};let q=false;
  for(let k=0;k<=li;k++){const L=LEVELS[k];for(const c in L.add)L.add[c].forEach(x=>set[c].add(x));(L.cols||[]).forEach(c=>set.cols.add(c));if(L.q)q=true}
  return{subj:SUBJ.map(x=>x.id).filter(x=>set.subj.has(x)),verb:VERBS.map(x=>x.id).filter(x=>set.verb.has(x)),obj:OBJS.map(x=>x.id).filter(x=>set.obj.has(x)),
    aux:['',...AUX.map(x=>x.id)].filter(x=>set.aux.has(x)),neg:NEGS.map(x=>x.id).filter(x=>set.neg.has(x)),end:ENDS.map(x=>x.id).filter(x=>set.end.has(x)),
    cols:[...set.cols],modes:q?['s','q']:['s']};
}
function gen(pk,V){
  const P=PAT[pk];
  for(let k=0;k<250;k++){
    const mode=P.mode==='*'?pick(V.modes):P.mode;
    const subs=V.subj.map(id=>SUBJM[id]).filter(s=>(!P.sf||P.sf(s.p))&&!(mode==='q'&&s.id==='I'));if(!subs.length)return null;
    const S=pick(subs);let A=null;
    if(P.aux[0]!==null){const as=P.aux.filter(a=>V.aux.includes(a)&&AUXM[a].ok(S.p));if(!as.length)continue;A=AUXM[pick(as)]}
    if(mode==='q'&&!A)continue;
    const vs=V.verb.map(id=>VERBM[id]).filter(v=>!(A&&v.stative&&!['pres','past'].includes(A.t))),Vb=pick(vs);
    const os=V.obj.map(id=>OBJM[id]).filter(o=>o.verbs.includes(Vb.id));if(!os.length)continue;
    const O=pick(os),end=A?{base:'',ing:'ing',part:'ed'}[A.form]:(P.end||(S.p==='3s'?'s':''));
    let neg='';
    if(A&&(P.neg===true||(P.neg==='maybe'&&Math.random()<.3))){if(mode==='q'){if(!A.nt)continue;neg="n't"}else neg=A.id==='am'?'not':pick(["n't",'not'])}
    const sel={aux:A?A.id:(mode==='s'?'':null),neg,subj:S.id,verb:Vb.id,end,obj:O.id},r=analyze(mode,sel);
    if(r.ok)return{mode,sel,es:r.es,en:r.en,t:A?A.t:(end==='ed'?'past':'pres'),neg:!!neg};
  }
  return null;
}
function buildRounds(li){
  const L=LEVELS[li],n=L.rounds||6,V=vocab(li),out=[],seen=new Set();
  const prev=[...new Set(LEVELS.slice(0,li).flatMap(x=>x.pat))];
  let g=0;
  while(out.length<n&&g++<600){
    const rev=li>0&&!L.all&&out.length===3;
    const t=gen(rev?pick(prev):pick(L.pat),V);
    if(t&&!seen.has(t.es)){seen.add(t.es);t.review=rev;out.push(t)}
  }
  return out;
}
function roundOptions(li,target){
  const V=vocab(li),o={};
  for(const col of ['subj','verb','obj','aux','neg','end']){
    let pool=V[col].slice();if(col==='aux'&&target.mode==='q')pool=pool.filter(x=>x!=='');
    const correct=target.sel[col]??'',ch=new Set([correct]);
    if(col==='aux'&&correct)AUXM[correct].fam.forEach(f=>pool.includes(f)&&ch.size<CAP.aux&&ch.add(f));
    for(const x of shuffle(pool)){if(ch.size>=CAP[col])break;ch.add(x)}
    o[col]=pool.filter(x=>ch.has(x));
  }
  return o;
}
function optLabel(col,id){
  if(col==='subj'){const s=SUBJM[id];return{e:s.e,t:s.en}}
  if(col==='verb'){const v=VERBM[id];return{e:v.e,t:v.base}}
  if(col==='obj'){const x=OBJM[id];return{e:x.e,t:x.en}}
  if(col==='end')return{t:ENDS.find(x=>x.id===id).label,none:id===''};
  if(col==='neg')return{t:NEGS.find(x=>x.id===id).label,none:id===''};
  return id===''?{t:'nada',none:true}:{t:id};
}

    fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=t0+i*gap;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.03)})}catch(e){}
}

const fx=$('fx'),cx=fx.getContext('2d');let parts=[],raf=0;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}
function confetti(n=80){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#7A4DFF','#F2405F','#F07F00','#0B9B9B','#FFB800','#D9409F'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4,life:120});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  const d=devicePixelRatio;cx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+20);
  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r*d/2,-p.r*d/4,p.r*d,p.r*d/2);cx.restore()}
  raf=parts.length?requestAnimationFrame(tick):0;
}

lm", "el final de la peli", "🎬"]], "tip": "Ojo: «el perro de Ana» no es «the dog of Ana», se dice <b>Ana's dog</b>.", "r": "<b>of</b> = de: un vaso de agua, un trozo de tarta.", "S": [["A glass _ water, please.", "Un vaso de agua, por favor.", "🥛"], ["I want a piece _ cake.", "Quiero un trozo de tarta.", "🍰"], ["A box _ chocolates.", "Una caja de bombones.", "🍫"], ["It is the end _ the story.", "Es el final del cuento.", "📖"], ["A lot _ people.", "Mucha gente.", "👥", "<b>a lot of</b> = mucho, muchos."], ["One _ my friends.", "Uno de mis amigos.", "👫"], ["A picture _ my family.", "Una foto de mi familia.", "🖼️"]]}, "what": {"g": "q", "es": "qué, cuál", "use": "Para preguntar por COSAS: qué es, qué quieres, qué haces.", "ex": [["What is this?", "¿Qué es esto?", "❓"], ["What do you want?", "¿Qué quieres?", "🤔"], ["What is your name?", "¿Cómo te llamas?", "📛"]], "tip": "Las preguntas en inglés empiezan por la palabra de pregunta: <b>What…? Who…? Where…?</b>", "r": "<b>what</b> = qué: pregunta por cosas.", "S": [["_ is this?", "¿Qué es esto?", "❓📦"], ["_ do you want?", "¿Qué quieres?", "🤔"], ["_ is your name?", "¿Cómo te llamas?", "📛"], ["_ colour is it?", "¿De qué color es?", "🎨"], ["_ are you eating?", "¿Qué estás comiendo?", "😋"], ["_ time is it?", "¿Qué hora es?", "🕐"], ["_ a beautiful day!", "¡Qué día tan bonito!", "🌞", "<b>What a…!</b> sirve para exclamar: ¡qué…!"]]}, "who": {"g": "q", "es": "quién, quiénes", "use": "Para preguntar por PERSONAS.", "ex": [["Who is she?", "¿Quién es ella?", "👧"], ["Who wants pizza?", "¿Quién quiere pizza?", "🍕"], ["Who are they?", "¿Quiénes son?", "👥"]], "tip": "<b>what</b> → cosas · <b>who</b> → personas.", "r": "<b>who</b> = quién: pregunta por personas.", "S": [["_ is that girl?", "¿Quién es esa niña?", "👧"], ["_ wants ice cream?", "¿Quién quiere helado?", "🍦"], ["_ is your teacher?", "¿Quién es tu profe?", "👩‍🏫"], ["_ are they?", "¿Quiénes son?", "👥"], ["_ is at the door?", "¿Quién está en la puerta?", "🚪"], ["_ is your best friend?", "¿Quién es tu mejor amigo?", "🤝"], ["_ broke the window?", "¿Quién rompió la ventana?", "🪟💥"]]}, "where": {"g": "q", "es": "dónde, adónde", "use": "Para preguntar por el LUGAR.", "ex": [["Where is my bag?", "¿Dónde está mi mochila?", "🎒"], ["Where do you live?", "¿Dónde vives?", "🏠"], ["Where are you going?", "¿Adónde vas?", "🚶"]], "tip": "Se suele responder con in, on, at…: in the box, at home.", "r": "<b>where</b> = dónde: pregunta por el lugar.", "S": [["_ is the cat?", "¿Dónde está el gato?", "🐱❓"], ["_ do you live?", "¿Dónde vives?", "🏠"], ["_ are my shoes?", "¿Dónde están mis zapatos?", "👟"], ["_ are you going?", "¿Adónde vas?", "🚶"], ["_ is the toilet, please?", "¿Dónde está el baño, por favor?", "🚻"], ["_ are you from?", "¿De dónde eres?", "🌍"], ["_ is the bathroom?", "¿Dónde está el baño?", "🚿"]]}, "when": {"g": "q", "es": "cuándo", "use": "Para preguntar por el MOMENTO: qué día, a qué hora…", "ex": [["When is your birthday?", "¿Cuándo es tu cumple?", "🎂"], ["When do we eat?", "¿Cuándo comemos?", "🍽️"], ["When can I play?", "¿Cuándo puedo jugar?", "🎮"]], "tip": "Se suele responder con today, tomorrow, at 5, on Monday…", "r": "<b>when</b> = cuándo: pregunta por el momento.", "S": [["_ is your birthday?", "¿Cuándo es tu cumple?", "🎂"], ["_ do we eat?", "¿Cuándo comemos?", "🍽️"], ["_ does the film start?", "¿Cuándo empieza la peli?", "🎬"], ["_ can I play?", "¿Cuándo puedo jugar?", "🎮"], ["_ is the party?", "¿Cuándo es la fiesta?", "🎉"], ["_ do you get up?", "¿Cuándo te levantas?", "⏰"], ["I am happy _ I play.", "Estoy contento cuando juego.", "😊", "<b>when</b> también une frases: cuando."]]}, "why": {"g": "q", "es": "por qué", "use": "Para preguntar la RAZÓN de algo.", "ex": [["Why are you sad?", "¿Por qué estás triste?", "😢"], ["Why is the sky blue?", "¿Por qué el cielo es azul?", "🌤️"], ["Why not?", "¿Por qué no?", "🤷"]], "tip": "A <b>why</b> se responde con <b>because</b> (porque).", "r": "<b>why</b> = por qué: pregunta la razón.", "S": [["_ are you sad?", "¿Por qué estás triste?", "😢"], ["_ is the sky blue?", "¿Por qué el cielo es azul?", "🌤️"], ["_ do you like cats?", "¿Por qué te gustan los gatos?", "🐱"], ["_ are you late?", "¿Por qué llegas tarde?", "⏰"], ["_ not?", "¿Por qué no?", "🤷"], ["_ is the baby crying?", "¿Por qué llora el bebé?", "👶"]]}, "because": {"g": "conj", "es": "porque", "use": "Para dar la RAZÓN de algo. Es la respuesta a <b>why</b>.", "ex": [["I am happy because it is sunny.", "Estoy contento porque hace sol.", "☀️"], ["Why? Because I like it.", "¿Por qué? Porque me gusta.", "😍"], ["I eat because I am hungry.", "Como porque tengo hambre.", "🍔"]], "tip": "¿Por qué? (pregunta) = <b>why</b> · porque (respuesta) = <b>because</b>.", "r": "<b>because</b> = porque: da la razón.", "S": [["I am happy _ it is sunny.", "Estoy contento porque hace sol.", "😊☀️"], ["I eat _ I am hungry.", "Como porque tengo hambre.", "🍔"], ["She is in bed _ she is ill.", "Está en la cama porque está enferma.", "🤒"], ["I like dogs _ they are funny.", "Me gustan los perros porque son graciosos.", "🐶"], ["I wear a coat _ it is cold.", "Llevo abrigo porque hace frío.", "🧥"], ["We stay home _ it is raining.", "Nos quedamos en casa porque llueve.", "🌧️"]]}, "how": {"g": "q", "es": "cómo", "use": "Para preguntar de qué MANERA se hace algo o cómo está algo o alguien.", "ex": [["How are you?", "¿Cómo estás?", "🙂"], ["How do you say \"gato\"?", "¿Cómo se dice «gato»?", "🐱"], ["How old are you?", "¿Cuántos años tienes?", "🎂"]], "tip": "<b>How old…?</b> = ¿cuántos años…? · <b>How many…?</b> = ¿cuántos…?", "r": "<b>how</b> = cómo: pregunta de qué manera o cómo está algo.", "S": [["_ are you?", "¿Cómo estás?", "🙂"], ["_ old are you?", "¿Cuántos años tienes?", "🎂", "<b>How old are you?</b> = ¿cuántos años tienes? (literalmente: ¿cómo de viejo eres?)"], ["_ do you say \"perro\"?", "¿Cómo se dice «perro»?", "🐶"], ["_ do you go to school?", "¿Cómo vas al colegio?", "🚌"], ["_ is your grandma?", "¿Cómo está tu abuela?", "👵"], ["_ many apples do you have?", "¿Cuántas manzanas tienes?", "🍎", "<b>How many</b> = cuántos (cosas que se cuentan)."], ["_ much is this?", "¿Cuánto cuesta esto?", "💶"], ["_ do you spell it?", "¿Cómo se deletrea?", "🔤"]]}, "some": {"g": "qty", "es": "algo de, unos, unas", "use": "Para una cantidad que no decimos exacta, en frases AFIRMATIVAS. También para OFRECER o pedir algo.", "ex": [["I have some apples.", "Tengo unas manzanas.", "🍎"], ["I want some water.", "Quiero algo de agua.", "💧"], ["Would you like some cake?", "¿Quieres un poco de tarta?", "🎂"]], "tip": "<b>some</b> → frases normales (sin not). Y al ofrecer algo: Would you like some tea?", "r": "<b>some</b> = algo de, unos: en frases afirmativas y al ofrecer algo.", "S": [["I have _ apples.", "Tengo unas manzanas.", "🍎"], ["I want _ water.", "Quiero algo de agua.", "💧"], ["She has _ friends here.", "Ella tiene algunos amigos aquí.", "👫"], ["Would you like _ cake?", "¿Quieres un poco de tarta?", "🎂", "Para OFRECER algo se usa <b>some</b>, aunque sea una pregunta."], ["We need _ eggs.", "Necesitamos unos huevos.", "🥚"], ["Can I have _ water, please?", "¿Me das agua, por favor?", "💧", "Para PEDIR algo también se usa <b>some</b>."], ["There are _ birds in the tree.", "Hay unos pájaros en el árbol.", "🐦🌳"]]}, "any": {"g": "qty", "es": "algo de, ningún (con «no» y en preguntas)", "use": "Lo mismo que <b>some</b>, pero en frases NEGATIVAS (no hay ninguno) y en PREGUNTAS.", "ex": [["I don't have any money.", "No tengo nada de dinero.", "💸"], ["Do you have any pets?", "¿Tienes mascotas?", "🐶"], ["There aren't any cookies.", "No hay galletas.", "🍪"]], "tip": "Con <b>not / don't</b> → any. En preguntas → any (menos al ofrecer algo: some).", "r": "<b>any</b> = en frases con not (ninguno) y en preguntas.", "S": [["I don't have _ money.", "No tengo nada de dinero.", "💸"], ["Do you have _ pets?", "¿Tienes mascotas?", "🐶❓"], ["There isn't _ milk.", "No hay leche.", "🥛🚫"], ["Are there _ cookies?", "¿Hay galletas?", "🍪❓"], ["He doesn't have _ brothers.", "Él no tiene hermanos.", "👦"], ["We don't have _ bread.", "No tenemos pan.", "🍞"], ["Have you got _ brothers?", "¿Tienes hermanos?", "👦❓"]]}, "much": {"g": "qty", "es": "mucho, mucha", "use": "Para cosas que NO se pueden contar una a una (agua, dinero, tiempo), sobre todo con not y en preguntas.", "ex": [["I don't have much time.", "No tengo mucho tiempo.", "⏰"], ["How much water?", "¿Cuánta agua?", "💧"], ["How much is it?", "¿Cuánto cuesta?", "💶"]], "tip": "<b>How much…?</b> = ¿cuánto…? Y para preguntar precios: How much is it?", "r": "<b>much</b> = mucho, mucha con cosas que no se cuentan: water, money, time.", "S": [["I don't have _ time.", "No tengo mucho tiempo.", "⏰"], ["How _ water do you drink?", "¿Cuánta agua bebes?", "💧"], ["How _ is it?", "¿Cuánto cuesta?", "💶"], ["There isn't _ milk.", "No hay mucha leche.", "🥛"], ["Thank you very _!", "¡Muchas gracias!", "🙏", "<b>Thank you very much</b> = muchísimas gracias. Es una frase fija."], ["Is there _ sugar?", "¿Hay mucho azúcar?", "🍬"], ["I don't eat _ meat.", "No como mucha carne.", "🥩"]]}, "many": {"g": "qty", "es": "muchos, muchas", "use": "Para cosas que SÍ se pueden contar (1, 2, 3…): libros, amigos, perros.", "ex": [["many books", "muchos libros", "📚"], ["How many cats?", "¿Cuántos gatos?", "🐱"], ["I have many friends.", "Tengo muchos amigos.", "👫"]], "tip": "Si lo puedes contar y va en plural, usa <b>many</b>: many cars. Si no, <b>much</b>: much milk.", "r": "<b>many</b> = muchos, muchas con cosas que se cuentan: books, cats.", "S": [["I have _ friends.", "Tengo muchos amigos.", "👫"], ["How _ cats do you have?", "¿Cuántos gatos tienes?", "🐱"], ["There are _ stars.", "Hay muchas estrellas.", "✨"], ["She reads _ books.", "Ella lee muchos libros.", "📚"], ["How _ people are there?", "¿Cuánta gente hay?", "👥", "<b>people</b> (gente) se cuenta: one person, two people. Por eso many."], ["There are _ cars in the street.", "Hay muchos coches en la calle.", "🚗🚗"], ["How _ legs does a spider have?", "¿Cuántas patas tiene una araña?", "🕷️"]]}, "I": {"g": "pron", "es": "yo", "use": "Para hablar de ti mismo cuando haces algo. Se escribe SIEMPRE en mayúscula, aunque vaya en mitad de la frase.", "ex": [["I am happy.", "Estoy contento.", "😊"], ["I like pizza.", "Me gusta la pizza.", "🍕"], ["Tom and I play.", "Tom y yo jugamos.", "⚽"]], "tip": "En español muchas veces no decimos «yo», pero en inglés <b>I</b> tiene que estar: «Tengo hambre» = <b>I</b> am hungry.", "r": "<b>I</b> = yo. Siempre en mayúscula.", "S": [["_ am seven.", "Tengo siete años.", "7️⃣", "En inglés la edad se dice con <b>am</b>: I am seven = tengo siete años."], ["_ have a dog.", "Tengo un perro.", "🐶"], ["_ like ice cream.", "Me gusta el helado.", "🍦"], ["_ can swim.", "Sé nadar.", "🏊"], ["Can _ play?", "¿Puedo jugar?", "🎮"], ["Mum and _ go to the park.", "Mamá y yo vamos al parque.", "👩🌳"], ["_ am hungry.", "Tengo hambre.", "🍔"]]}, "you": {"g": "pron", "es": "tú, vosotros (y usted)", "use": "Para hablarle a otra persona, o a varias. La misma palabra vale para «tú», «vosotros» y «usted».", "ex": [["You are my friend.", "Eres mi amigo.", "🤝"], ["Do you like cats?", "¿Te gustan los gatos?", "🐱"], ["Thank you!", "¡Gracias!", "🙏"]], "tip": "<b>you</b> no cambia: tú, vosotros, usted… siempre <b>you</b>.", "r": "<b>you</b> = tú, vosotros: la persona con la que hablas.", "S": [["_ are my best friend.", "Eres mi mejor amigo.", "🤝"], ["Are _ OK?", "¿Estás bien?", "🙂"], ["_ are very funny.", "Eres muy gracioso.", "😂"], ["Do _ want water?", "¿Quieres agua?", "💧"], ["I love _, Mum!", "¡Te quiero, mamá!", "❤️"], ["Can _ help me?", "¿Me ayudas?", "🙋"], ["_ are all my friends.", "Todos vosotros sois mis amigos.", "👫", "<b>you</b> también es «vosotros»."]]}, "he": {"g": "pron", "es": "él", "use": "Para hablar de un chico o un hombre (sin decir su nombre).", "ex": [["He is my brother.", "Él es mi hermano.", "👦"], ["He plays football.", "Él juega al fútbol.", "⚽"], ["Where is he?", "¿Dónde está él?", "❓"]], "tip": "<b>he</b> = un chico 👦 · <b>she</b> = una chica 👧.", "r": "<b>he</b> = él (un chico o un hombre).", "S": [["_ is my dad.", "Él es mi padre.", "👨"], ["_ is tall.", "Él es alto.", "👦📏"], ["_ likes cars.", "A él le gustan los coches.", "👦🚗"], ["Is _ your brother?", "¿Es tu hermano?", "👦"], ["Tom is late. _ is on the bus.", "Tom llega tarde. Está en el autobús.", "👦🚌"], ["_ can run fast.", "Él corre muy rápido.", "👦🏃"]]}, "she": {"g": "pron", "es": "ella", "use": "Para hablar de una chica o una mujer (sin decir su nombre).", "ex": [["She is my sister.", "Ella es mi hermana.", "👧"], ["She likes music.", "A ella le gusta la música.", "🎵"], ["Is she your mum?", "¿Es tu madre?", "👩"]], "tip": "<b>she</b> = una chica 👧 · <b>he</b> = un chico 👦.", "r": "<b>she</b> = ella (una chica o una mujer).", "S": [["_ is my mum.", "Ella es mi madre.", "👩"], ["_ sings very well.", "Ella canta muy bien.", "👧🎤"], ["_ has a cat.", "Ella tiene un gato.", "👧🐱"], ["Is _ your teacher?", "¿Es ella tu profe?", "👩‍🏫"], ["Ana is sad. _ is crying.", "Ana está triste. Está llorando.", "👧😢"], ["_ is a doctor.", "Ella es médica.", "👩‍⚕️"]]}, "it": {"g": "pron", "es": "ello (una cosa o un animal)", "use": "Para hablar de UNA cosa o de un animal. En español no se dice, pero en inglés hace falta: «Es rojo» = <b>It</b> is red.", "ex": [["It is red.", "Es rojo.", "🔴"], ["It is raining.", "Está lloviendo.", "🌧️"], ["I love it!", "¡Me encanta!", "😍"]], "tip": "El tiempo y la hora también usan <b>it</b>: It is cold (hace frío), It is 5 o'clock (son las 5).", "r": "<b>it</b> = una cosa o un animal. También para el tiempo: it is hot.", "S": [["_ is a ball.", "Es una pelota.", "⚽"], ["_ is cold today.", "Hoy hace frío.", "🥶"], ["_ is raining.", "Está lloviendo.", "🌧️"], ["Where is my bag? _ is on the chair.", "¿Dónde está mi mochila? Está en la silla.", "🎒🪑"], ["_ is 5 o'clock.", "Son las 5.", "🕔"], ["I like this game. _ is fun.", "Me gusta este juego. Es divertido.", "🎮"]]}, "we": {"g": "pron", "es": "nosotros, nosotras", "use": "Para hablar de ti y de otras personas juntos.", "ex": [["We are friends.", "Somos amigos.", "👫"], ["We play together.", "Jugamos juntos.", "🤸"], ["We like pizza.", "Nos gusta la pizza.", "🍕"]], "tip": "<b>we</b> = yo + otros. Tom and I = <b>we</b>.", "r": "<b>we</b> = nosotros (yo y otras personas).", "S": [["_ are a team.", "Somos un equipo.", "🏆"], ["_ go to school by bus.", "Vamos al colegio en autobús.", "🚌"], ["_ love our dog.", "Queremos a nuestro perro.", "🐶"], ["Can _ play now?", "¿Podemos jugar ya?", "🎮"], ["Tom and I are friends. _ play every day.", "Tom y yo somos amigos. Jugamos todos los días.", "👫"], ["_ are at home.", "Estamos en casa.", "🏠"]]}, "they": {"g": "pron", "es": "ellos, ellas", "use": "Para hablar de varias personas, animales o cosas.", "ex": [["They are my friends.", "Son mis amigos.", "👥"], ["They play football.", "Juegan al fútbol.", "⚽"], ["Where are they?", "¿Dónde están?", "❓"]], "tip": "<b>they</b> vale para chicos, chicas, animales y cosas: varios = <b>they</b>.", "r": "<b>they</b> = ellos, ellas (varias personas, animales o cosas).", "S": [["_ are my cousins.", "Son mis primos.", "👥"], ["_ are very big.", "Son muy grandes.", "🐘🐘"], ["_ live in London.", "Viven en Londres.", "🇬🇧"], ["Are _ your shoes?", "¿Son tus zapatos?", "👟"], ["I have two cats. _ are black.", "Tengo dos gatos. Son negros.", "🐈‍⬛🐈‍⬛"], ["_ like to dance.", "Les gusta bailar.", "💃🕺"]]}, "am": {"g": "be", "es": "soy, estoy (con I)", "use": "Es el verbo «ser / estar» cuando hablas de ti: <b>I am</b>. Se usa también para la edad y para cómo te sientes.", "ex": [["I am Leo.", "Soy Leo.", "👦"], ["I am happy.", "Estoy contento.", "😊"], ["I am eight.", "Tengo ocho años.", "8️⃣"]], "tip": "<b>am</b> solo va con <b>I</b>. Muchas veces se junta: I am = <b>I'm</b>.", "r": "<b>am</b> = soy, estoy. Solo con I.", "S": [["I _ a girl.", "Soy una niña.", "👧"], ["I _ tired.", "Estoy cansado.", "😴"], ["I _ ten years old.", "Tengo diez años.", "🔟"], ["I _ at school.", "Estoy en el colegio.", "🏫"], ["I _ not sad.", "No estoy triste.", "🙂"], ["I _ ready!", "¡Estoy listo!", "🏁"]]}, "is": {"g": "be", "es": "es, está (con he, she, it)", "use": "Es «ser / estar» para UNA persona, animal o cosa: he, she, it, Tom, the cat…", "ex": [["She is my friend.", "Ella es mi amiga.", "👧"], ["The cat is black.", "El gato es negro.", "🐈‍⬛"], ["It is cold.", "Hace frío.", "🥶"]], "tip": "Una cosa → <b>is</b> · varias → <b>are</b>. Se junta: he is = <b>he's</b>.", "r": "<b>is</b> = es, está: con he, she, it o una sola cosa.", "S": [["He _ my brother.", "Él es mi hermano.", "👦"], ["The dog _ hungry.", "El perro tiene hambre.", "🐶"], ["It _ hot today.", "Hoy hace calor.", "🥵"], ["Where _ my book?", "¿Dónde está mi libro?", "📕"], ["My mum _ a nurse.", "Mi madre es enfermera.", "👩‍⚕️"], ["_ it your bike?", "¿Es tu bici?", "🚲"]]}, "are": {"g": "be", "es": "eres, somos, son, estáis…", "use": "Es «ser / estar» con <b>you, we, they</b> y con VARIAS cosas.", "ex": [["You are funny.", "Eres gracioso.", "😂"], ["We are friends.", "Somos amigos.", "👫"], ["The apples are red.", "Las manzanas son rojas.", "🍎🍎"]], "tip": "I → am · he/she/it → is · you/we/they → <b>are</b>.", "r": "<b>are</b> = con you, we, they o varias cosas.", "S": [["You _ my friend.", "Eres mi amigo.", "🤝"], ["We _ at the park.", "Estamos en el parque.", "🌳"], ["They _ my cousins.", "Son mis primos.", "👥"], ["The cats _ asleep.", "Los gatos están dormidos.", "🐱💤"], ["_ you OK?", "¿Estás bien?", "🙂"], ["My shoes _ new.", "Mis zapatos son nuevos.", "👟"]]}, "was": {"g": "be", "es": "era, estaba, fue (con I, he, she, it)", "use": "Es el pasado de <b>am</b> y de <b>is</b>: lo que era o estaba antes.", "ex": [["I was tired.", "Estaba cansado.", "😴"], ["It was fun!", "¡Fue divertido!", "🎉"], ["She was at home.", "Ella estaba en casa.", "🏠"]], "tip": "am / is → <b>was</b> · are → <b>were</b>.", "r": "<b>was</b> = era, estaba: pasado de am / is.", "S": [["I _ sick yesterday.", "Ayer estaba malo.", "🤒"], ["The film _ great.", "La peli fue genial.", "🎬"], ["He _ at school.", "Él estaba en el colegio.", "🏫"], ["It _ very cold last night.", "Anoche hacía mucho frío.", "🥶"], ["She _ my teacher.", "Ella era mi profe.", "👩‍🏫"], ["_ it good?", "¿Estuvo bien?", "👍"]]}, "were": {"g": "be", "es": "eras, éramos, eran, estaban…", "use": "Es el pasado de <b>are</b>: con you, we, they y con varias cosas.", "ex": [["We were happy.", "Estábamos contentos.", "😊"], ["They were at the zoo.", "Estaban en el zoo.", "🦁"], ["You were right.", "Tenías razón.", "👍"]], "tip": "are → <b>were</b>. was → con una persona o cosa.", "r": "<b>were</b> = pasado de are: con you, we, they o varias cosas.", "S": [["We _ at the beach.", "Estábamos en la playa.", "🏖️"], ["They _ very tired.", "Estaban muy cansados.", "😴"], ["You _ late!", "¡Llegaste tarde!", "⏰"], ["The cakes _ yummy.", "Las tartas estaban riquísimas.", "🎂"], ["Where _ you?", "¿Dónde estabas?", "❓"], ["My friends _ there.", "Mis amigos estaban allí.", "👫"]]}, "have": {"g": "have", "es": "tengo, tienes, tenemos, tienen", "use": "Para decir lo que alguien TIENE, con I, you, we, they.", "ex": [["I have a dog.", "Tengo un perro.", "🐶"], ["We have two cats.", "Tenemos dos gatos.", "🐱🐱"], ["They have a big house.", "Tienen una casa grande.", "🏠"]], "tip": "Con he, she, it no se dice have, se dice <b>has</b>.", "r": "<b>have</b> = tener, con I, you, we, they.", "S": [["I _ a red bike.", "Tengo una bici roja.", "🚲"], ["We _ a new teacher.", "Tenemos una profe nueva.", "👩‍🏫"], ["You _ nice eyes.", "Tienes unos ojos bonitos.", "👀"], ["They _ a garden.", "Tienen un jardín.", "🌻"], ["I _ two brothers.", "Tengo dos hermanos.", "👦👦"], ["We _ breakfast at eight.", "Desayunamos a las ocho.", "🥣", "<b>have breakfast</b> = desayunar (literalmente «tener el desayuno»)."]]}, "has": {"g": "have", "es": "tiene", "use": "Es <b>have</b> con he, she, it y con una sola persona o cosa.", "ex": [["She has a cat.", "Ella tiene un gato.", "🐱"], ["He has a ball.", "Él tiene una pelota.", "⚽"], ["The dog has a bone.", "El perro tiene un hueso.", "🦴"]], "tip": "he, she, it → <b>has</b> (igual que el verbo con -s: he plays, he <b>has</b>).", "r": "<b>has</b> = tiene, con he, she, it.", "S": [["She _ long hair.", "Ella tiene el pelo largo.", "👧"], ["He _ a new phone.", "Él tiene un móvil nuevo.", "📱"], ["My house _ a garden.", "Mi casa tiene jardín.", "🏡"], ["The cat _ green eyes.", "El gato tiene los ojos verdes.", "🐱"], ["Tom _ a cold.", "Tom está resfriado.", "🤧", "Para estar resfriado se dice <b>have a cold</b>: «tener un resfriado»."], ["It _ four legs.", "Tiene cuatro patas.", "🐕"]]}, "do": {"g": "do", "es": "auxiliar para preguntar (con I, you, we, they)", "use": "Va al principio de las preguntas: <b>Do you…?</b> No se traduce, solo avisa de que es una pregunta.", "ex": [["Do you like cats?", "¿Te gustan los gatos?", "🐱"], ["Do they play?", "¿Juegan?", "⚽"], ["What do you want?", "¿Qué quieres?", "🤔"]], "tip": "Con he, she, it la pregunta empieza por <b>does</b>.", "r": "<b>do</b> = para preguntar con I, you, we, they.", "S": [["_ you like pizza?", "¿Te gusta la pizza?", "🍕"], ["_ they live here?", "¿Viven aquí?", "🏠"], ["_ we have homework?", "¿Tenemos deberes?", "📒"], ["What _ you eat for lunch?", "¿Qué comes a mediodía?", "🍽️"], ["_ you speak English?", "¿Hablas inglés?", "🇬🇧"], ["Where _ you live?", "¿Dónde vives?", "🏠"]]}, "does": {"g": "do", "es": "auxiliar para preguntar (con he, she, it)", "use": "Como <b>do</b>, pero con he, she, it. El verbo de después va SIN -s.", "ex": [["Does she like dogs?", "¿A ella le gustan los perros?", "🐶"], ["Does he play tennis?", "¿Juega al tenis?", "🎾"], ["What does it eat?", "¿Qué come?", "🐹"]], "tip": "Con <b>does</b>, la -s se va del verbo: Does she <b>play</b>? (no «plays»).", "r": "<b>does</b> = para preguntar con he, she, it.", "S": [["_ he like football?", "¿A él le gusta el fútbol?", "⚽"], ["_ she have a sister?", "¿Ella tiene una hermana?", "👧"], ["_ it bite?", "¿Muerde?", "🐊"], ["Where _ your dad work?", "¿Dónde trabaja tu padre?", "👨‍💼"], ["_ the bus stop here?", "¿Para aquí el autobús?", "🚌"], ["What _ she want?", "¿Qué quiere ella?", "👧"]]}, "don't": {"g": "do", "es": "no (con I, you, we, they)", "use": "Para decir que NO haces algo, con I, you, we, they. Es la forma corta de «do not».", "ex": [["I don't like milk.", "No me gusta la leche.", "🥛"], ["We don't have a car.", "No tenemos coche.", "🚗"], ["Don't run!", "¡No corras!", "🏃"]], "tip": "Con he, she, it se dice <b>doesn't</b>. Y para mandar que no se haga algo: <b>Don't</b> touch!", "r": "<b>don't</b> = no, con I, you, we, they.", "S": [["I _ like spiders.", "No me gustan las arañas.", "🕷️"], ["We _ have school today.", "Hoy no tenemos cole.", "🏫"], ["They _ live here.", "No viven aquí.", "🏠"], ["_ touch that!", "¡No toques eso!", "✋"], ["You _ know my dog.", "No conoces a mi perro.", "🐶"], ["I _ want to sleep.", "No quiero dormir.", "😫"]]}, "doesn't": {"g": "do", "es": "no (con he, she, it)", "use": "Para decir que NO, con he, she, it. El verbo de después va SIN -s.", "ex": [["She doesn't like fish.", "A ella no le gusta el pescado.", "🐟"], ["He doesn't play tennis.", "Él no juega al tenis.", "🎾"], ["It doesn't work.", "No funciona.", "🔧"]], "tip": "Con <b>doesn't</b> la -s se va: he doesn't <b>play</b>.", "r": "<b>doesn't</b> = no, con he, she, it.", "S": [["He _ like carrots.", "A él no le gustan las zanahorias.", "🥕"], ["She _ have a pet.", "Ella no tiene mascota.", "👧"], ["It _ fly.", "No vuela.", "🐧"], ["My dad _ drink coffee.", "Mi padre no bebe café.", "☕"], ["The TV _ work.", "La tele no funciona.", "📺"], ["Ana _ eat meat.", "Ana no come carne.", "🥩"]]}, "did": {"g": "do", "es": "auxiliar para preguntar en pasado", "use": "Va al principio de las preguntas sobre el PASADO, con todas las personas. El verbo de después va normal, sin -ed.", "ex": [["Did you like it?", "¿Te gustó?", "😍"], ["Did she win?", "¿Ganó ella?", "🏆"], ["What did you eat?", "¿Qué comiste?", "🍽️"]], "tip": "Con <b>did</b>, el verbo no cambia: Did you <b>go</b>? (no «went»).", "r": "<b>did</b> = para preguntar en pasado (con todos).", "S": [["_ you see the film?", "¿Viste la peli?", "🎬"], ["_ he go to school?", "¿Fue al colegio?", "🏫"], ["What _ you do yesterday?", "¿Qué hiciste ayer?", "📅"], ["_ they win the game?", "¿Ganaron el partido?", "🏆"], ["Where _ you go?", "¿Adónde fuiste?", "🚶"], ["_ it rain?", "¿Llovió?", "🌧️"]]}, "didn't": {"g": "do", "es": "no (en pasado)", "use": "Para decir que algo NO pasó en el pasado, con todas las personas. El verbo de después va normal.", "ex": [["I didn't see it.", "No lo vi.", "🙈"], ["She didn't come.", "Ella no vino.", "🚫"], ["We didn't win.", "No ganamos.", "😞"]], "tip": "Con <b>didn't</b> el verbo no lleva -ed: I didn't <b>play</b>.", "r": "<b>didn't</b> = no, en pasado.", "S": [["I _ sleep well.", "No dormí bien.", "😴"], ["He _ do his homework.", "No hizo los deberes.", "📒"], ["We _ go to the park.", "No fuimos al parque.", "🌳"], ["It _ rain yesterday.", "Ayer no llovió.", "☀️"], ["They _ like the film.", "No les gustó la peli.", "🎬"], ["You _ call me!", "¡No me llamaste!", "📞"]]}, "can": {"g": "mod", "es": "puedo, sé (hacer algo)", "use": "Para decir que eres CAPAZ de hacer algo o que tienes PERMISO. El verbo de después va sin to y sin -s.", "ex": [["I can swim.", "Sé nadar.", "🏊"], ["Can I go?", "¿Puedo ir?", "🚶"], ["She can sing.", "Ella sabe cantar.", "🎤"]], "tip": "<b>can</b> no cambia nunca: I can, she can, they can.", "r": "<b>can</b> = poder, saber hacer algo.", "S": [["I _ ride a bike.", "Sé montar en bici.", "🚲"], ["_ I have a cookie?", "¿Me das una galleta?", "🍪", "Para pedir algo: <b>Can I have…?</b> = ¿me das…?"], ["Birds _ fly.", "Los pájaros pueden volar.", "🐦"], ["_ you help me?", "¿Me puedes ayudar?", "🙋"], ["He _ run very fast.", "Él corre muy rápido.", "🏃"], ["We _ play later.", "Podemos jugar luego.", "🎮"]]}, "can't": {"g": "mod", "es": "no puedo, no sé", "use": "Lo contrario de <b>can</b>: no ere const wLearned=pi=>WPH.slice(0,pi+1).flatMap(p=>p.words);
const wCount=it=>wFull(it).split(' ').length;
function hl(en,w){return esc(en).replace(new RegExp('(^|[^A-Za-z\'])('+w+')(?![A-Za-z\'])','gi'),'$1<mark>$2</mark>')}
function wDistract(it,learned){
  const g=WORDS[it.w].g;let peers=learned.filter(x=>x!==it.w&&WORDS[x].g===g&&!it.no.includes(x));
  if(!peers.length)peers=learned.filter(x=>x!==it.w&&!it.no.includes(x));
  return shuffle(peers).slice(0,3);
}
function wGap(it,learned){return{type:'gap',it,opts:shuffle([it.w,...wDistract(it,learned)])}}
function wOrder(it){const words=wFull(it).replace(/[.?!]$/,'').split(' ');let tiles;do{tiles=shuffle(words.map((t,i)=>({t,i})))}while(words.length>1&&tiles.every((x,k)=>x.i===k));return{type:'order',it,words,tiles,end:/[?!]$/.test(it.en)?it.en.slice(-1):'.'}}
function wMean(w,learned){const seen=new Set([WORDS[w].es]),others=[];for(const x of shuffle(learned))if(x!==w&&!seen.has(WORDS[x].es)&&others.length<3){seen.add(WORDS[x].es);others.push(WORDS[x].es)}
  if(others.length<2)for(const x of shuffle(Object.keys(WORDS)))if(!seen.has(WORDS[x].es)&&others.length<2){seen.add(WORDS[x].es);others.push(WORDS[x].es)}
  return{type:'mean',w,opts:shuffle([WORDS[w].es,...others])}}
function buildWRounds(pi){
  const P=WPH[pi],learned=wLearned(pi),out=[],used=new Set();
  const take=(w,pred)=>{const c=shuffle(wItems(w)).filter(it=>!used.has(it.en)&&(!pred||pred(it)));const it=c[0];if(it)used.add(it.en);return it};
  if(P.final||P.review){   // repaso: palabras de las fases anteriores, más peso a las de las últimas
    const all=P.final?Object.keys(WORDS):learned,recent=learned.slice(-12),n=P.final?14:10;
    for(let k=0;k<n*3&&out.length<n;k++){const w=Math.random()<.5?pick(recent):pick(all),ord=out.length%3===2,it=take(w,ord?x=>wCount(x)<=7:null);if(it)out.push(ord?wOrder(it):wGap(it,all))}
    return out;
  }
  const body=[];
  const per=P.words.length===1?4:P.words.length===2?3:2;
  P.words.forEach(w=>{for(let k=0;k<per;k++){const it=take(w);if(it)body.push(wGap(it,learned))}});
  shuffle(P.words).slice(0,2).forEach(ow=>{const oi=take(ow,x=>wCount(x)<=7);if(oi)body.push(wOrder(oi))});
  shuffle(learned.filter(w=>!P.words.includes(w))).slice(0,2).forEach(w=>{const it=take(w);if(it)body.push({...wGap(it,learned),review:true})});
  return[...P.words.map(w=>wMean(w,learned)),...shuffle(body)];
}

/* tarjeta de palabra: qué significa, para qué sirve, ejemplos y truco */
function wordCardHTML(w,title,buttons){
  const W=WORDS[w];
  return `${pipSvg('happy')}<h2>${title}</h2><div class="txt">
    <div class="wbig"><span class="bigw">${w}</span><button class="toy white round" data-act="hear" data-say="${w}" aria-label="Escuchar">🔊</button></div>
    <p class="mean">Significa: <b>${W.es}</b></p>
    <p><b>¿Para qué sirve?</b> ${W.use}</p>
    <p><b>Ejemplos:</b></p><ul class="exs">${W.ex.map(([en,es,e])=>`<li><button class="toy white round" data-act="hear" data-say="${esc(en)}" aria-label="Escuchar">🔊</button><span><span class="exe">${e}</span> <b>${hl(en,w)}</b><br><span class="trad">${es}</span></span></li>`).join('')}</ul>
    <p class="tip">💡 ${W.tip}</p></div>
    <div class="row">${buttons}</div>`;
}
function introW(pi){
  const P=WPH[pi];st.wp=pi;st.wci=0;
  if(P.final||P.review){const ws=P.final?Object.keys(WORDS):wLearned(pi);overlay(`${pipSvg('happy')}<h2>${P.icon} ${P.name}</h2><div class="txt"><p>${P.final?'¡Todas las palabras mezcladas! 14 retos para ser <b>Maestro de las palabras pequeñas</b>.':'¡Repaso! 10 retos con las palabras que ya sabes. Si dudas de alguna, mira 📖 Mis palabras.'}</p><div class="words">${ws.map(w=>`<span>${w}</span>`).join('')}</div></div>
    <div class="row"><button class="toy white" data-act="map">🗺️ Mapa</button><button class="toy go" data-act="wstart">¡A jugar! ▶</button></div>`);return}
  wIntroCard();
}
function wIntroCard(){
  const P=WPH[st.wp],i=st.wci,n=P.words.length,w=P.words[i];
  const title=`✨ Palabra nueva${n>1?` ${i+1}/${n}`:''}`;
  const btn=(i>0?'<button class="toy white" data-act="wprev">◀ Anterior</button>':'<button class="toy white" data-act="map">🗺️ Mapa</button>')+(i<n-1?'<button class="toy go" data-act="wnext">Siguiente palabra ▶</button>':'<button class="toy go" data-act="wstart">¡A practicar! ▶</button>');
  overlay(wordCardHTML(w,title,btn));setTimeout(()=>speak(w),250);
}
function startW(pi){st.free=false;st.wp=pi;st.wr=buildWRounds(pi);st.wi=0;st.wmis=0;st.wstreak=0;wSetup();st.screen='wplay';$('map').hidden=true;$('play').hidden=false;renderW()}
function wSetup(){const r=st.wr[st.wi];st.wpick=[];st.wbad=[];st.wtries=0;st.pipMood='';if(r.type==='mean')setTimeout(()=>speak(r.w),300)}
function renderW(){
  const P=WPH[st.wp],r=st.wr[st.wi],dots=st.wr.map((_,k)=>`<i class="${k<st.wi?'done':k===st.wi?'now':''}"></i>`).join('');
  let ask,box,board,acts;
  const cardBtn=()=>`<button class="toy white" data-act="wgloss">📖 Mis palabras</button>`;
  if(r.type==='mean'){
    ask=`<div class="es">¿Qué significa esta palabra?</div>`;
    box=`<div class="wbig"><span class="bigw">${r.w}</span><button class="toy white round" data-act="hear" data-say="${r.w}" aria-label="Escuchar">🔊</button></div>`;
    board=`<div class="opts">${r.opts.map(o=>`<button class="opt es-opt${st.wbad.includes(o)?' no':''}" data-opt="${esc(o)}">${o}</button>`).join('')}</div>`;
    acts=`<span></span>`;
  }else if(r.type==='gap'){
    const [a,b]=r.it.en.split('_');
    ask=`<div class="prompt"><span class="emo">${r.it.e}</span><span class="es">${r.it.es}</span></div><div class="tags"><span class="tag">🧩 Completa la frase</span>${r.review?'<span class="tag rev">Repaso</span>':''}</div>`;
    box=`<div class="sent">${esc(a)}<span class="gap">?</span>${esc(b)}</div>`;
    board=`<div class="opts">${r.opts.map(o=>`<button class="opt${st.wbad.includes(o)?' no':''}" data-opt="${o}">${wCapG(r.it)?cap(o):o}</button>`).join('')}</div>`;
    acts=cardBtn(r.it.w);
  }else{
    ask=`<div class="prompt"><span class="emo">${r.it.e}</span><span class="es">${r.it.es}</span></div><div class="tags"><span class="tag">🔀 Ordena las palabras</span></div>`;
    box=`<div class="sent tiles-line">${st.wpick.map((ti,k)=>`<button class="tile on" data-unpick="${k}">${esc(r.tiles[ti].t)}</button>`).join('')||'<span class="trad">Toca las palabras en orden…</span>'}<span class="pu2">${st.wpick.length===r.words.length?r.end:''}</span></div>`;
    board=`<div class="tiles">${r.tiles.map((x,ti)=>st.wpick.includes(ti)?`<span class="tile ghost">${esc(x.t)}</span>`:`<button class="tile" data-pick="${ti}">${esc(x.t)}</button>`).join('')}</div>`;
    acts=`${cardBtn(r.it.w)}<button class="toy white" data-act="wclear">🧹 Borrar</button><button class="toy go" data-act="wcheck" ${st.wpick.length===r.words.length?'':'disabled'}>¡Listo! ✔</button>`;
  }
  $('play').innerHTML=`<div class="topbar">
      <button class="toy white round" id="backBtn" aria-label="Volver al mapa">🗺️</button>
      <span class="lvlname">${P.icon} ${st.wp+1}. ${P.name}</span>
      <div class="dots">${dots}</div>
      <span class="pill streak" title="Racha">🔥 ${st.wstreak}</span>
      <button class="toy white round" id="sndBtn" aria-label="Sonido">${soundIcon()}</button>
    </div>
    <div class="stage"><div class="say">${pipSvg(st.pipMood)}<div class="bubble">${ask}</div></div><div class="wbox">${box}</div></div>
    <div class="board" id="board">${board}</div>
    <div class="actions wacts">${acts}</div>`;
}
function wGood(){
  const r=st.wr[st.wi];st.wstreak++;SFX.good();confetti(st.wstreak>=3?90:50);st.pipMood='happy';renderW();
  const last=st.wi+1>=st.wr.length,next=`<button class="toy go" data-act="wnextRound">${last?'Terminar 🏁':'Siguiente ▶'}</button>`;
  if(r.type==='mean'){const W=WORDS[r.w],ex=W.ex[W.ex.length-1];speak(ex[0]);
    overlay(`${pipSvg('happy')}<h2>${pick(['¡Genial!','¡Muy bien!','¡Eso es!'])}</h2><div class="txt"><p><b>${r.w}</b> = ${W.es}</p><div class="exline">${ex[2]} <b>${hl(ex[0],r.w)}</b><br><span class="trad">${ex[1]}</span></div></div>
      <div class="row"><button class="toy white" data-act="hear" data-say="${esc(ex[0])}">🔊 Otra vez</button>${next}</div>`,'good');return}
  const full=wFull(r.it);setTimeout(()=>speak(full),350);
  overlay(`${pipSvg('happy')}<h2>${pick(['¡Genial!','¡Muy bien!','¡Bravo!','¡Lo has clavado!','¡Fantástico!'])}${st.wstreak>=3?' 🔥'+st.wstreak:''}</h2>
    <div class="txt"><div class="exline">${r.it.e} <b>${hl(full,r.it.w)}</b><br><span class="trad">${r.it.es}</span></div>${r.it.why?`<p>💡 ${r.it.why}</p>`:''}</div>
    <div class="row"><button class="toy white" data-act="hear" data-say="${esc(full)}">🔊 Otra vez</button>${next}</div>`,'good');
}
function wBad(chosen){
  const r=st.wr[st.wi];st.wmis++;st.wstreak=0;st.wtries++;SFX.bad();st.pipMood='sad';
  if(chosen!=null&&!st.wbad.includes(chosen))st.wbad.push(chosen);
  renderW();
  const reveal=st.wtries>=2||(r.type!=='order'&&r.opts.length-st.wbad.length<=1);
  if(r.type==='mean'){
    const W=WORDS[r.w];
    if(!reveal){overlay(`${pipSvg('sad')}<h2>¡Casi!</h2><div class="txt"><p>Pista: ${W.r}</p></div><div class="row"><button class="toy go" data-act="close2">Otra vez 🔧</button></div>`,'bad');return}
    overlay(`${pipSvg('sad')}<h2>Era «${W.es}»</h2><div class="txt"><p><b>${r.w}</b> = ${W.es}</p><p>${W.use}</p></div><div class="row"><button class="toy go" data-act="wnextRound">Seguir ▶</button></div>`,'bad');return;
  }
  const W=WORDS[r.it.w],full=wFull(r.it);
  if(!reveal){
    const tip=r.type==='gap'&&WORDS[chosen]?`<p>Recuerda: ${WORDS[chosen].r}</p><p>Mira bien lo que dice Pip: <b>${r.it.es}</b></p>`:`<p>Las palabras no van en ese orden. ${/^[¿]/.test(r.it.es)?'En las preguntas, la palabra de pregunta va primero.':'En inglés suele ir: ¿quién? + verbo + lo demás.'}</p>`;
    overlay(`${pipSvg('sad')}<h2>¡Casi!</h2><div class="txt">${tip}</div><div class="row"><button class="toy go" data-act="close2">Lo intento otra vez 🔧</button></div>`,'bad');return;
  }
  overlay(`${pipSvg('sad')}<h2>Así se dice:</h2><div class="txt"><div class="exline">${r.it.e} <b>${hl(full,r.it.w)}</b><br><span class="trad">${r.it.es}</span></div><p>${r.it.why||W.r}</p></div>
    <div class="row"><button class="toy white" data-act="hear" data-say="${esc(full)}">🔊 Escuchar</button><button class="toy go" data-act="wnextRound">Seguir ▶</button></div>`,'meh');
}
function wAnswer(val){
  const r=st.wr[st.wi];if(st.wbad.includes(val))return;
  const ok=r.type==='mean'?val===WORDS[r.w].es:val===r.it.w;
  if(ok){if(r.type==='gap'){const g=document.querySelector('.gap');if(g){g.textContent=wCapG(r.it)?cap(val):val;g.classList.add('ok')}}wGood()}else wBad(val);
}
function finishW(){
  const s=st.wmis<=1?3:st.wmis<=3?2:1,pi=st.wp;
  prog.ws2[pi]=Math.max(prog.ws2[pi]||0,s);prog.wu2=Math.max(prog.wu2,Math.min(pi+2,WPH.length));save();
  SFX.win();confetti(160);
  const last=pi===WPH.length-1,P=WPH[pi];
  overlay(`${pipSvg('happy')}<h2>${last?'¡Maestro de las palabras!':'¡Fase completada!'}</h2>
    <div class="txt"><div class="bigstars">${[0,1,2].map(k=>starSvg(k<s,.25+k*.3)).join('')}</div>
    ${P.words.length?`<p>Ya sabes usar: ${P.words.map(w=>`<b>${w}</b>`).join(', ')}. Las tienes en 📖 Mis palabras.</p>`:''}
    <p>${s===3?'¡Perfecto!':s===2?'¡Muy bien! Repite la fase para las 3 estrellas.':'¡Conseguido! Practica un poco más para ganar más estrellas.'}</p>
    ${!last?`<p>Siguiente: <b>${WPH[pi+1].icon} ${WPH[pi+1].name}</b>${WPH[pi+1].words.length?' ('+WPH[pi+1].words.join(', ')+')':''}</p>`:''}</div>
    <div class="row"><button class="toy white" data-act="map">🗺️ Mapa</button>${last?'':'<button class="toy go" data-act="wnextPhase">Siguiente fase ▶</button>'}</div>`,'good');
}
function glossary(){
  const learned=[];WPH.forEach((p,i)=>{if(prog.ws2[i]||(st.screen==='wplay'&&i===st.wp))learned.push(...p.words)});
  overlay(`${pipSvg('happy')}<h2>📖 Mis palabras</h2><div class="txt">${learned.length?`<p>Toca una palabra para ver qué significa, para qué sirve y sus ejemplos.</p>
    <div class="gloss">${learned.map(w=>`<button class="opt small" data-act="wcard" data-w="${w}" data-from="gloss"><b>${w}</b><small>${WORDS[w].es}</small></button>`).join('')}</div>`:'<p>Todavía no tienes palabras. ¡Empieza por la fase 1 de <b>Palabras pequeñas</b>!</p>'}</div>
    <div class="row"><button class="toy go" data-act="closeMap">Cerrar</button></div>`);
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(st.screen==='wplay'&&$('ov').hidden){
    const o=t.closest('[data-opt]');if(o){SFX.tap();wAnswer(o.dataset.opt);return}
    const pk=t.closest('[data-pick]');if(pk){const r=st.wr[st.wi],i=+pk.dataset.pick;st.wpick.push(i);SFX.tap();speak(r.tiles[i].t.replace(/[,]/g,''));renderW();return}
    const up=t.closest('[data-unpick]');if(up){st.wpick.splice(+up.dataset.unpick,1);SFX.tap();renderW();return}
  }
  const wn=t.closest('[data-wlvl]');
  if(wn){const i=+wn.dataset.wlvl;if(i>=prog.wu2){SFX.bad();return}SFX.pop();introW(i);return}
  const chip=t.closest('.chip');
  if(chip){
    const col=chip.dataset.col,id=chip.dataset.id;
    const def=(col==='aux'&&st.mode==='q')||['subj','verb','obj'].includes(col)?null:'';
    st.sel[col]=(st.sel[col]===id&&id!=='')?def:id;st.pipMood='';
    SFX.tap();if(id&&!['end'].includes(col)){const w=col==='subj'?SUBJM[id].en:col==='verb'?VERBM[id].base:col==='obj'?OBJM[id].en:id;speak(w)}
    renderPlay();
    const r=analyze(st.mode,st.sel),nm=r.missing.find(c=>visibleCols().includes(c));
    if(nm){const el=$('col-'+nm);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}
    return;
  }
  const node=t.closest('[data-lvl]');
  if(node){const i=+node.dataset.lvl;if(i>=prog.unlocked){SFX.bad();return}SFX.pop();introLevel(i);return}
  const act=t.closest('[data-act]')?.dataset.act;
  if(act){
    if(act==='hear')speak(t.closest('[data-act]').dataset.say);
    if(act==='start'){closeOv();startLevel(st.li)}
    if(act==='close'){closeOv();st.pipMood='';renderPlay(false)}
    if(act==='nextRound'){closeOv();st.round++;if(st.round>=st.rounds.length){finishLevel();return}setupRound();renderPlay(false)}
    if(act==='map'){closeOv();show('map')}
    if(act==='nextLvl'){closeOv();introLevel(st.li+1)}
    if(act==='wnext'){st.wci++;SFX.pop();wIntroCard()}
    if(act==='wprev'){st.wci=Math.max(0,st.wci-1);wIntroCard()}
    if(act==='wstart'){closeOv();startW(st.wp)}
    if(act==='wcard'){const el=t.closest('[data-act]'),w=el.dataset.w,g=el.dataset.from==='gloss';SFX.pop();overlay(wordCardHTML(w,'📖 '+w,g?'<button class="toy white" data-act="wgloss">◀ Mis palabras</button><button class="toy go" data-act="closeMap">Cerrar</button>':'<button class="toy go" data-act="close2">Seguir ▶</button>'));speak(w)}
    if(act==='wgloss')glossary();
    if(act==='closeMap')closeOv();
    if(act==='close2'){closeOv();st.pipMood='';renderW()}
    if(act==='wclear'){st.wpick=[];SFX.tap();renderW()}
    if(act==='wcheck'){const r=st.wr[st.wi];if(st.wpick.map(i=>r.tiles[i].t).join(' ')===r.words.join(' ')){st.wpick=r.tiles.map((_,ti)=>ti).sort((a,b)=>r.tiles[a].i-r.tiles[b].i);wGood()}else wBad(null)}
    if(act==='wnextRound'){closeOv();st.wi++;if(st.wi>=st.wr.length){finishW();return}wSetup();renderW()}
    if(act==='wnextPhase'){closeOv();introW(st.wp+1)}
    return;
  }
  const jump=t.closest('[data-jump]');if(jump){$('col-'+jump.dataset.jump)?.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  const mb=t.closest('[data-mode]');
  if(mb&&st.free){const m=mb.dataset.mode;if(m!==st.mode){st.mode=m;if(m==='q'&&st.sel.aux==='')st.sel.aux=null;if(m==='s'&&st.sel.aux===null)st.sel.aux='';if(m==='q'&&st.sel.neg==='not')st.sel.neg="n't";renderPlay()}return}
  const id=t.closest('button')?.id;
  if(id==='sndBtn'){st.sound=!st.sound;try{speechSynthesis.cancel()}catch(_){};st.screen==='map'?renderMap():st.screen==='wplay'?renderW():renderPlay(false)}
  if(id==='glossBtn'){SFX.pop();glossary()}
  if(id==='backBtn'){SFX.tap();show('map')}
  if(id==='freeBtn'){st.free=true;st.mode='s';st.sel=blank('s');st.pipMood='';prevKeys=new Set();SFX.pop();show('play')}
  if(id==='checkBtn')check();
  if(id==='clearBtn'){st.sel=blank(st.mode);st.pipMood='';SFX.tap();renderPlay()}
  if(id==='hintBtn')hint();
  if(id==='randBtn')randomFree();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').hidden&&$('ov').querySelector('[data-act="close"]')){closeOv();renderPlay(false)}});
addEventListener('resize',sizeFx);
sizeFx();
show(st.screen);
})();
