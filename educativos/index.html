<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juegos educativos · Arcade Perdido</title>
<meta name="description" content="Juegos educativos gratis para niños de 3 a 16 años: mates, lengua, lógica e inglés. Sin anuncios y para jugar en el navegador.">
<meta name="theme-color" content="#120f26">
<link rel="icon" href="../pwa/icons/icon-192.png">
<style>
  :root { --bg1: #1f3a5f; --bg2: #101a2c; --card: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); --text: #f1f5ff; --muted: #b3c0dd; --ac: #ffd43b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(120% 80% at 50% 0%, var(--bg1), var(--bg2)) fixed, var(--bg2); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .top a, .top button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; text-decoration: none; }
  header { text-align: center; margin: 14px 0 22px; }
  .logo { font-size: 58px; line-height: 1; }
  h1 { font-family: "Arial Rounded MT Bold", ui-rounded, "Nunito", system-ui, sans-serif; font-size: clamp(30px, 6.5vw, 48px); margin: 8px 0 6px; }
  .tag { color: var(--muted); font-size: 17px; margin: 0 auto; max-width: 620px; line-height: 1.45; }
  .search input { width: 100%; background: rgba(0,0,0,.25); border: 1.5px solid var(--line); color: var(--text); border-radius: 999px; padding: 13px 20px; font-size: 17px; outline: none; }
  .search input:focus { border-color: var(--ac); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .chips b { color: var(--muted); font-weight: 600; font-size: 14px; align-self: center; margin-right: 2px; }
  .chip { background: var(--card); color: var(--text); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 15px; cursor: pointer; }
  .chip.on { border-color: var(--c, var(--ac)); background: color-mix(in srgb, var(--c, var(--ac)) 25%, transparent); }
  h2 { font-size: 24px; margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2 small { color: var(--muted); font-size: 15px; font-weight: 500; }
  .grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .grid a { display: flex; gap: 12px; align-items: center; text-decoration: none; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; height: 100%; transition: transform .12s, border-color .12s; }
  .grid a:hover, .grid a:focus-visible { transform: translateY(-2px); border-color: var(--c); outline: none; }
  .ic { flex: none; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; background: color-mix(in srgb, var(--c) 30%, rgba(0,0,0,.2)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .tx { display: flex; flex-direction: column; min-width: 0; }
  .tx b { font-size: 16.5px; }
  .tx small { color: var(--muted); font-size: 13.5px; line-height: 1.35; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; font-size: 12px; }
  .meta span { background: rgba(255,255,255,.09); border-radius: 999px; padding: 1px 8px; }
  .apps a { align-items: flex-start; }
  .none { color: var(--muted); text-align: center; padding: 20px; }
  footer { margin-top: 36px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../index.html" id="back"></a><button id="lang"></button></div>
  <header>
    <div class="logo">🎓</div>
    <h1 data-es="Juegos educativos" data-en="Educational games"></h1>
    <p class="tag" data-es="Mates, lengua, lógica e inglés para aprender jugando, de 3 a 16 años. Gratis, sin anuncios y en el navegador." data-en="Maths, language, logic and English to learn through play, ages 3 to 16. Free, no ads, in your browser."></p>
  </header>

  <div class="search"><input type="search" id="q" autocomplete="off" enterkeyhint="search"></div>
  <div class="chips" id="subj"></div>
  <div class="chips" id="band"></div>

  <div id="list"></div>

  <h2 id="appsH"></h2>
  <ul class="grid apps" id="apps"></ul>

  <footer id="foot"></footer>
</div>
<script src="juegos.js"></script>
<script>
(function () {
  var E = window.EDU, q = /[?&]lang=(es|en)/.exec(location.search), saved = null;
  try { saved = localStorage.getItem('arc_lang'); } catch (e) {}
  var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'es';
  var lang = q ? q[1] : saved === 'es' || saved === 'en' ? saved : /^(es|ca|gl|eu)\b/i.test(nav) ? 'es' : 'en';
  var P = new URLSearchParams(location.search), subj = P.get('materia') || 'all', band = P.get('edad') || 'all';
  var SUBJ = {}; E.subjects.forEach(function (s) { SUBJ[s.id] = s; });
  var qi = document.getElementById('q');
  if (P.get('q')) qi.value = P.get('q');
  function tr(o) { return (o && (o[lang] || o.es)) || ''; }
  function norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rel(u) { return u.replace(/^educativos\//, ''); }
  function link(g) {
    var u = rel(g.url);
    if (g.brainAges) {  // Brain Academy: edad según el filtro elegido
      var a = band === '3-6' && g.brainAges.indexOf(3) >= 0 ? 3 : band === '7-12' ? (g.brainAges.indexOf(9) >= 0 ? 9 : 6) : null;
      if (a) u = u.replace(/edad=\d+/, 'edad=' + a);
      u += '&lang=' + lang;
    }
    return u;
  }
  function ages(g) { return g.ages[0] + '–' + g.ages[1] + (lang === 'en' ? ' yrs' : ' años'); }
  function chips(box, items, cur, set) {
    box.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.className = 'chip' + (it.id === cur ? ' on' : ''); b.textContent = it.label;
      if (it.color) b.style.setProperty('--c', it.color);
      b.setAttribute('aria-pressed', it.id === cur);
      b.onclick = function () { set(it.id); render(); };
      box.appendChild(b);
    });
  }
  function render() {
    var EN = lang === 'en';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-es]').forEach(function (el) { el.textContent = el.getAttribute(EN ? 'data-en' : 'data-es'); });
    document.title = (EN ? 'Educational games' : 'Juegos educativos') + ' · Arcade Perdido';
    document.getElementById('lang').textContent = EN ? '🇪🇸 Español' : '🇬🇧 English';
    document.getElementById('back').textContent = '← Arcade Perdido';
    document.getElementById('back').href = '../index.html?lang=' + lang;
    qi.placeholder = EN ? '🔎 Search educational games…' : '🔎 Buscar juegos educativos…';
    qi.setAttribute('aria-label', EN ? 'Search' : 'Buscar');
    chips(document.getElementById('subj'), [{ id: 'all', label: EN ? '⭐ All' : '⭐ Todas' }].concat(E.subjects.map(function (s) { return { id: s.id, label: s.emoji + ' ' + tr(s.name), color: s.color }; })), subj, function (v) { subj = v; });
    chips(document.getElementById('band'), [{ id: 'all', label: EN ? 'All ages' : 'Todas las edades' }].concat(E.bands.map(function (b) { return { id: b.id, label: b.emoji + ' ' + tr(b.name) }; })), band, function (v) { band = v; });
    var words = norm(qi.value).split(/\s+/).filter(Boolean);
    var hits = E.games.filter(function (g) {
      if (subj !== 'all' && g.subject !== subj) return false;
      if (band !== 'all' && g.bands.indexOf(band) < 0) return false;
      var h = norm([g.title.es, g.title.en, g.desc.es, g.desc.en, tr(SUBJ[g.subject].name), g.abn ? 'abn' : ''].join(' '));
      return words.every(function (w) { return h.indexOf(w) >= 0; });
    });
    var out = '';
    E.subjects.forEach(function (s) {
      var gs = hits.filter(function (g) { return g.subject === s.id; });
      if (!gs.length) return;
      out += '<h2>' + s.emoji + ' ' + esc(tr(s.name)) + ' <small>' + gs.length + '</small></h2><ul class="grid">' + gs.map(function (g) {
        var only = g.langs.indexOf(lang) < 0 ? '<span>' + (EN ? 'In Spanish' : 'En ' + g.langs.join(', ')) + '</span>' : '';
        return '<li><a href="' + esc(link(g)) + '" style="--c:' + s.color + '"><span class="ic">' + g.emoji + '</span><span class="tx"><b>' + esc(tr(g.title)) + '</b><small>' + esc(tr(g.desc)) + '</small>'
          + '<span class="meta"><span>' + ages(g) + '</span>' + (g.abn ? '<span>ABN</span>' : '') + only + '</span></span></a></li>';
      }).join('') + '</ul>';
    });
    document.getElementById('list').innerHTML = out || '<p class="none">' + (EN ? 'No games match. Try another subject or age.' : 'No hay juegos con esos filtros. Prueba otra asignatura o edad.') + '</p>';
    document.getElementById('appsH').textContent = EN ? '📱 Full apps' : '📱 Apps completas';
    document.getElementById('apps').innerHTML = E.apps.map(function (a) {
      return '<li><a href="' + esc(rel(a.url)) + (a.langs.indexOf(lang) >= 0 && a.langs.length > 1 ? '?lang=' + lang : '') + '" style="--c:#4dabf7"><span class="ic">' + a.emoji + '</span><span class="tx"><b>' + esc(a.name) + '</b><small>' + esc(tr(a.desc)) + '</small></span></a></li>';
    }).join('');
    document.getElementById('foot').textContent = E.games.length + (EN ? ' educational games' : ' juegos educativos') + (window.ARCADE_VERSION ? ' · v' + ARCADE_VERSION : '');
  }
  qi.addEventListener('input', render);
  qi.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var a = document.querySelector('#list a'); if (a) location.href = a.href; } });
  document.getElementById('lang').addEventListener('click', function () { lang = lang === 'en' ? 'es' : 'en'; try { localStorage.setItem('arc_lang', lang); } catch (e) {} render(); });
  render();
})();
</script>
</body>
</html>
