<html lang="es">
<head>

<style>
/* Layout: una columna de cuento — barra de estado, escenario con emojis, tarjeta de papel con el texto y la acción. */
:root {
  color-scheme: dark;
  --noche: #161338;
  --noche-2: #251f5e;
  --noche-3: #352c80;
  --papel: #fbf9ff;
  --papel-2: #efeaff;
  --tinta: #24204e;
  --tinta-suave: #5f5a92;
  --oro: #ffc53d;
  --oro-osc: #c98a00;
  --chispa: #36c96a;
  --chispa-osc: #1f8e47;
  --portal: #9b6bff;
  --portal-osc: #6a3fd1;
  --rojo: #ff5d6c;
  --rojo-osc: #c43345;
  --cielo: #5ab4ff;
  --linea: #d9d2f5;
  --brillo: #fff6d6;
  --f-titulo: "Grandstander", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --f-texto: "Andika", "Verdana", "Segoe UI", system-ui, sans-serif;
  --t-base: clamp(19px, 1.2rem + 0.4vw, 23px);
  --radio: 22px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--noche);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,246,214,.55) 0 1.5px, transparent 2px),
    radial-gradient(circle at 78% 9%, rgba(255,246,214,.45) 0 1.2px, transparent 2px),
    radial-gradient(circle at 55% 40%, rgba(255,246,214,.35) 0 1px, transparent 2px),
    radial-gradient(circle at 90% 64%, rgba(255,246,214,.4) 0 1.3px, transparent 2px),
    radial-gradient(circle at 30% 80%, rgba(255,246,214,.35) 0 1px, transparent 2px),
    linear-gradient(180deg, var(--noche) 0%, var(--noche-2) 100%);
  background-attachment: fixed;
  color: var(--papel);
  font-family: var(--f-texto);
  font-size: var(--t-base);
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 84px;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-titulo); text-wrap: balance; margin: 0; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--cielo); outline-offset: 3px; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  border: 0; border-radius: 18px; padding: .7em 1.2em;
  font-family: var(--f-titulo); font-weight: 700; font-size: 1.05em;
  background: var(--oro); color: var(--tinta);
  box-shadow: 0 5px 0 var(--oro-osc);
  transition: transform .08s, box-shadow .08s, filter .15s;
  touch-action: manipulation; min-height: 54px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--oro-osc); }
.btn:disabled { filter: grayscale(.8) opacity(.55); cursor: not-allowed; }
.btn.verde { background: var(--chispa); color: #08321a; box-shadow: 0 5px 0 var(--chispa-osc); }
.btn.morado { background: var(--portal); color: #fff; box-shadow: 0 5px 0 var(--portal-osc); }
.btn.claro { background: var(--papel-2); color: var(--tinta); box-shadow: 0 5px 0 var(--linea); }
.btn.peq { min-height: 42px; padding: .4em .8em; font-size: .85em; border-radius: 14px; }
.btn.ancho { width: 100%; }
.fila-btn { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* ---------- Barra de estado ---------- */
#hud {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px; padding: 8px 12px; font-family: var(--f-titulo); font-weight: 700;
  font-size: .9em;
}
#hud .quien { display: flex; align-items: center; gap: 6px; min-width: 0; }
#hud .quien b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 9em; }
#hud .stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
#hud .corazones { letter-spacing: -2px; }
#hud .corazones .off { filter: grayscale(1) opacity(.35); }
#hud .esp { flex: 1; }
#hud .ico { background: rgba(255,255,255,.1); border: 0; border-radius: 12px; width: 40px; height: 40px; font-size: 1.15em; }
#hud .ico.off { opacity: .45; }
.pop { animation: pop .45s; }
@keyframes pop { 40% { transform: scale(1.45); } }

/* ---------- Escenario ---------- */
.escenario {
  position: relative; border-radius: var(--radio); overflow: hidden;
  min-height: clamp(150px, 27vh, 230px);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 18px 12px 14px;
  box-shadow: inset 0 -30px 40px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
}
.escenario.mini { min-height: 92px; padding: 10px; align-items: center; }
.escenario .suelo { position: absolute; inset: auto 0 0 0; height: 26%; background: rgba(0,0,0,.18); border-top-left-radius: 50% 30%; border-top-right-radius: 50% 30%; }
.escenario .deco { position: absolute; font-size: 1.6em; opacity: .55; filter: saturate(.8); pointer-events: none; }
.escenario .deco.d0 { top: 10px; left: 14px; }
.escenario .deco.d1 { top: 14px; right: 16px; font-size: 2em; }
.escenario .deco.d2 { top: 38%; left: 50%; transform: translateX(-50%); font-size: 1.1em; opacity: .35; }
.actores { position: relative; display: flex; gap: clamp(6px, 3vw, 22px); align-items: flex-end; z-index: 1; }
.actor { font-size: clamp(52px, 13vw, 84px); line-height: 1; animation: flota 3.2s ease-in-out infinite; filter: drop-shadow(0 8px 6px rgba(0,0,0,.35)); transition: transform .25s; }
.escenario.mini .actor { font-size: 44px; }
.actor:nth-child(2) { animation-delay: -.8s; }
.actor:nth-child(3) { animation-delay: -1.6s; }
.actor:nth-child(4) { animation-delay: -2.2s; }
.actor.habla { animation: salta .6s ease-in-out infinite; }
@keyframes flota { 50% { transform: translateY(-8px); } }
@keyframes salta { 50% { transform: translateY(-16px) scale(1.08); } }

/* ---------- Tarjeta de papel ---------- */
.tarjeta {
  background: var(--papel); color: var(--tinta);
  border-radius: var(--radio); padding: clamp(18px, 4vw, 30px);
  box-shadow: 0 12px 0 rgba(0,0,0,.18), 0 18px 40px rgba(0,0,0,.35);
  display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
.tarjeta .cab { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
.tarjeta .cab .t { min-width: 0; }
.etiq { font-family: var(--f-titulo); font-weight: 700; font-size: .72em; letter-spacing: .08em; text-transform: uppercase; color: var(--portal-osc); }
.tarjeta h2 { font-size: 1.45em; color: var(--tinta); }
.leer { flex: none; border: 0; background: var(--papel-2); border-radius: 14px; width: 48px; height: 48px; font-size: 1.3em; }
.narracion { margin: 0; animation: entra .35s ease-out; }
@keyframes entra { from { opacity: .2; transform: translateY(8px); } }
.dialogo { display: flex; gap: 12px; align-items: flex-start; animation: entra .35s ease-out; }
.dialogo .av { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; background: var(--papel-2); border: 3px solid var(--c, var(--portal)); }
.dialogo .bocadillo { position: relative; background: var(--papel-2); border-radius: 18px; padding: 10px 16px; min-width: 0; }
.dialogo .bocadillo::before { content: ""; position: absolute; left: -9px; top: 18px; border: 9px solid transparent; border-left: 0; border-right-color: var(--papel-2); }
.dialogo .nom { display: block; font-family: var(--f-titulo); font-weight: 700; font-size: .78em; color: var(--c, var(--portal-osc)); }
.lineas { display: flex; flex-direction: column; gap: 14px; }
.toca { font-size: .8em; color: var(--tinta-suave); text-align: center; }

/* ---------- Problemas ---------- */
.enunciado { margin: 0; font-size: 1.04em; }
.pregunta { font-family: var(--f-titulo); font-weight: 700; font-size: 1.12em; color: var(--tinta); margin: 0; }
.zona-preg { display: flex; flex-direction: column; gap: 14px; border-top: 3px dashed var(--linea); padding-top: 16px; }
.paso { font-family: var(--f-titulo); font-size: .75em; font-weight: 700; color: var(--tinta-suave); letter-spacing: .06em; text-transform: uppercase; }
.opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.opc {
  border: 3px solid var(--linea); background: #fff; border-radius: 18px; color: var(--tinta);
  font-family: var(--f-titulo); font-weight: 900; font-size: 1.7em; min-height: 76px; padding: 8px;
  box-shadow: 0 5px 0 var(--linea); transition: transform .08s;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.opc small { font-family: var(--f-texto); font-weight: 400; font-size: .48em; color: var(--tinta-suave); line-height: 1.25; text-align: center; }
.opc.txt { font-size: 1.05em; font-weight: 700; }
.opc .em { font-size: 1.6em; line-height: 1.1; }
.opc:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--linea); }
.opc.mal { border-color: var(--rojo); background: #ffe9ec; opacity: .55; animation: tiembla .4s; }
.opc.bien { border-color: var(--chispa); background: #e3fbe9; }
.opc.marca { border-color: var(--oro); box-shadow: 0 0 0 5px rgba(255,197,61,.45); }
@keyframes tiembla { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 380px; width: 100%; margin: 0 auto; }
.teclado button { min-height: 60px; border: 0; border-radius: 16px; background: var(--papel-2); color: var(--tinta); font-family: var(--f-titulo); font-weight: 900; font-size: 1.5em; box-shadow: 0 4px 0 var(--linea); }
.teclado button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--linea); }
.teclado .ok { background: var(--chispa); color: #08321a; box-shadow: 0 4px 0 var(--chispa-osc); }
.pantallita { max-width: 380px; width: 100%; margin: 0 auto; display: flex; align-items: baseline; justify-content: center; gap: 10px; min-height: 72px; border-radius: 18px; background: var(--tinta); color: var(--oro); font-family: var(--f-titulo); font-weight: 900; font-size: 2.3em; padding: 6px 14px; font-variant-numeric: tabular-nums; }
.pantallita small { font-size: .38em; color: var(--papel-2); font-weight: 500; }
.pantallita.mal { animation: tiembla .4s; background: var(--rojo-osc); }
.aviso-preg { border-radius: 16px; padding: 12px 16px; font-size: .95em; animation: entra .3s; }
.aviso-preg.pista { background: #fff4d1; border: 2px solid var(--oro); }
.aviso-preg.bien { background: #e3fbe9; border: 2px solid var(--chispa); font-family: var(--f-titulo); font-weight: 700; }
.aviso-preg.ayuda { background: #efe7ff; border: 2px solid var(--portal); }
.ops { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.ops .opc { font-size: 1.05em; flex-direction: row; justify-content: flex-start; gap: 12px; text-align: left; padding: 10px 14px; }
.ops .opc .em { font-size: 1.7em; }
.ops .opc span { display: flex; flex-direction: column; line-height: 1.2; }
.explica { background: var(--papel-2); border-radius: 18px; padding: 4px 18px; }
.explica summary { font-family: var(--f-titulo); font-weight: 700; cursor: pointer; padding: 10px 0; list-style: none; }
.explica summary::-webkit-details-marker { display: none; }
.explica p { margin: 0 0 10px; }
.estrellas { text-align: center; font-size: 3.2em; letter-spacing: 6px; }
.estrellas span { display: inline-block; animation: estrella .5s backwards; }
.estrellas span:nth-child(2) { animation-delay: .15s; } .estrellas span:nth-child(3) { animation-delay: .3s; }
.estrellas .off { filter: grayscale(1) opacity(.25); }
@keyframes estrella { from { transform: scale(0) rotate(-90deg); } }
.resultado { text-align: center; font-family: var(--f-titulo); font-weight: 900; font-size: 1.5em; color: var(--chispa-osc); }

/* ---------- Visuales ---------- */
.visual { background: #f4f0ff; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.visual .ayudita { font-size: .78em; color: var(--tinta-suave); text-align: center; }
.contador { text-align: center; font-family: var(--f-titulo); font-weight: 700; color: var(--portal-osc); font-variant-numeric: tabular-nums; }
.grupos { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.grupos.filas { flex-direction: column; align-items: center; }
.grupo { border: 3px dashed var(--linea); background: #fff; border-radius: 16px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 100%; color: var(--tinta); }
.grupo.contado { border-style: solid; border-color: var(--chispa); background: #e9fbef; }
.grupo .ems { display: flex; flex-wrap: wrap; justify-content: center; font-size: 1.35em; line-height: 1.25; max-width: 11em; }
.grupos.filas .grupo { flex-direction: row; gap: 10px; }
.grupos.filas .grupo .ems { max-width: none; }
.grupo small { font-size: .62em; color: var(--tinta-suave); }
.items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.item { font-size: 1.6em; min-width: 1.75em; height: 1.75em; display: grid; place-items: center; border-radius: 12px; border: 2px solid transparent; background: transparent; padding: 0; line-height: 1; }
.item.marcable { background: #fff; border-color: var(--linea); }
.item.marcado { border-color: var(--chispa); background: #dff8e7; box-shadow: 0 0 0 3px rgba(54,201,106,.35); }
.item.robado { opacity: .25; position: relative; }
.item.robado::after { content: "✕"; position: absolute; color: var(--rojo); font-size: .9em; font-weight: 900; }
.leyenda { text-align: center; font-size: .8em; color: var(--tinta-suave); }
.compacto { text-align: center; font-family: var(--f-titulo); font-size: 1.6em; font-weight: 700; color: var(--tinta); }

.reparto .monton { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 2em; padding: 8px; border-radius: 14px; background: #fff; border: 2px solid var(--linea); }
.reparto .monton .item { width: 1.6em; height: 1.6em; font-size: 1.4em; }
.reparto .monton .item.sobra { opacity: .5; outline: 2px dashed var(--rojo); border-radius: 10px; }
.receptores { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.receptor { background: #fff; border-radius: 14px; border: 2px solid var(--linea); padding: 6px; text-align: center; color: var(--tinta); }
.receptor .quien { font-size: 1.8em; line-height: 1.1; }
.receptor .recibido { font-size: 1em; min-height: 1.4em; line-height: 1.2; word-break: break-all; }
.receptor b { font-family: var(--f-titulo); color: var(--portal-osc); }

.camino { display: flex; align-items: center; gap: 6px; }
.camino .pista-c { position: relative; flex: 1; display: flex; gap: 3px; min-width: 0; padding-bottom: 26px; }
.casilla { flex: 1; min-width: 0; aspect-ratio: 1 / 1.3; max-height: 46px; border-radius: 6px; background: #fff; border: 2px solid var(--linea); padding: 0; display: grid; place-items: center; font-size: clamp(9px, 2.6vw, 18px); }
.casilla.hecha { background: #ffe7a6; border-color: var(--oro); }
.casilla.contada { background: #d9f7e2; border-color: var(--chispa); }
.camino .mitad { position: absolute; left: 50%; top: -6px; bottom: 0; width: 0; border-left: 3px dashed var(--portal); }
.camino .mitad span { position: absolute; bottom: 0; left: 0; transform: translateX(-50%); font-size: .62em; font-family: var(--f-titulo); font-weight: 700; color: var(--portal-osc); white-space: nowrap; }
.camino .punta { font-size: 1.6em; flex: none; }

.combate { display: flex; flex-direction: column; gap: 10px; }
.enemigos { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.enemigo { position: relative; background: #fff; border: 3px solid var(--linea); border-radius: 16px; padding: 6px 8px; width: clamp(92px, 26vw, 140px); text-align: center; color: var(--tinta); transition: transform .15s, opacity .4s; }
.enemigos.muchos .enemigo { width: clamp(70px, 20vw, 100px); }
.enemigo .em { font-size: 2.6em; line-height: 1.1; display: block; }
.enemigos.muchos .enemigo .em { font-size: 1.9em; }
.enemigo .nom { font-size: .62em; font-family: var(--f-titulo); font-weight: 700; color: var(--tinta-suave); display: block; }
.enemigo.atacable { cursor: crosshair; border-color: var(--rojo); box-shadow: 0 0 0 4px rgba(255,93,108,.25); }
.enemigo.golpe { animation: tiembla .3s; }
.enemigo.vencido { opacity: .25; filter: grayscale(1); transform: scale(.9); }
.vida { position: relative; height: 16px; border-radius: 8px; background: #ececf5; overflow: hidden; border: 2px solid var(--tinta); }
.vida .relleno { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--rojo), #ff8a5c); transition: width .3s; }
.vida.heroe .relleno { background: linear-gradient(90deg, var(--chispa), #8ae06a); }
.vida .cortes { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(var(--seg) - 2px), rgba(36,32,78,.75) calc(var(--seg) - 2px) var(--seg)); pointer-events: none; }
.vida-num { font-size: .7em; font-family: var(--f-titulo); font-weight: 700; font-variant-numeric: tabular-nums; }
.insignias { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.insignia { background: var(--tinta); color: var(--papel); border-radius: 999px; padding: 3px 12px; font-size: .78em; font-family: var(--f-titulo); font-weight: 700; }
.insignia.oro { background: var(--oro); color: var(--tinta); }
.heroe-c { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; border: 3px solid var(--chispa); padding: 6px 10px; color: var(--tinta); }
.heroe-c .em { font-size: 2em; }
.heroe-c .vida { flex: 1; }
.heroe-c.golpe { animation: tiembla .35s; border-color: var(--rojo); }
.flotante { position: fixed; pointer-events: none; z-index: 60; font-family: var(--f-titulo); font-weight: 900; font-size: 1.6em; color: var(--rojo); text-shadow: 0 2px 0 #fff; animation: sube .9s ease-out forwards; }
@keyframes sube { to { transform: translateY(-60px); opacity: 0; } }

.patron { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: stretch; }
.caja-p { background: #fff; border: 3px solid var(--linea); border-radius: 14px; padding: 6px; width: clamp(64px, 17vw, 110px); display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px; color: var(--tinta); }
.caja-p .ems { display: flex; flex-wrap: wrap; justify-content: center; font-size: .95em; line-height: 1.1; }
.caja-p b { font-family: var(--f-titulo); font-size: 1.35em; }
.caja-p small { font-size: .58em; color: var(--tinta-suave); }
.caja-p.misterio { border-color: var(--portal); border-style: dashed; animation: late 1.4s ease-in-out infinite; }
.caja-p.misterio b { font-size: 2em; color: var(--portal); }
@keyframes late { 50% { transform: scale(1.06); } }

.reloj-c { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.reloj-c svg { width: min(230px, 62vw); height: auto; }
.reloj-ctrl { display: flex; align-items: center; gap: 10px; }
.reloj-ctrl .btn { white-space: nowrap; }
.reloj-ctrl .hora { font-family: var(--f-titulo); font-weight: 900; font-size: 1.4em; min-width: 4.2em; text-align: center; color: var(--tinta); }
.aguja { transition: transform .35s cubic-bezier(.3,1.5,.6,1); }

.perim svg { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
.perim .lado { cursor: pointer; }

.combinar .col { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.combinar .opc { font-size: 1em; min-height: 58px; padding: 6px 10px; flex-direction: row; gap: 6px; }
.combinar .opc .em { font-size: 1.5em; }

<script>
"use strict";

let H = null;          // historia

const CLAVE = "mati_portales_v1";

const $ = (s, el = document) => el.querySelector(s);

/* ---------- expresiones y plantillas ---------- */
const MCD = (a, b) => b ? MCD(b, a % b) : Math.abs(a);

    A[id] = { id, nombre: a.nombre, emoji: a.emoji, D, G: a.golpes, T: D * a.golpes };

}
function nivelVal(obj, n) {

  const mejor = Object.values(A).sort((x, y) => y.T - x.T)[0].id;
  return {
    NIVEL: S.nivel, NOMBRE: S.nombre, AVATAR: S.avatar, VIAJERO: S.viajero,
    MONEDAS: S.monedas, FRAGMENTOS: S.fragmentos, A, ARMA, MEJORARMA: mejor, MCM, MCD, HORA, Math

    const vs = nivelVal(P.vars, S.nivel) || {};

    for (const [k, v] of Object.entries(P.calc || {})) sc[k] = ev(v, sc);

const COLORES = [
  { id: "rojo", nombre: "rojo", c: "#e5484d" }, { id: "azul", nombre: "azul", c: "#3b82f6" },
  { id: "verde", nombre: "verde", c: "#22a35a" }, { id: "amarillo", nombre: "amarillo", c: "#d99a00" },
  { id: "morado", nombre: "morado", c: "#8b5cf6" }

    pistas.push(`No está ni en el ${otros[0].nombre} ni en el ${otros[1].nombre}.`);

/* ---------- sonido y voz ---------- */

function cargaManual(error) {
  const input = el("input", { type: "file", id: "archivo", accept: ".json,application/json", class: "campo" });
  input.addEventListener("change", () => {
    const f = input.files[0]; if (!f) return;

    r.readAsText(f);

    el("h2", null, "📂 Falta la historia"),
    el("p", { style: "margin:0" }, "No he podido abrir historia.json. Esto pasa al abrir index.html con doble clic, porque el navegador no deja leer archivos sueltos."),

    el("label", { for: "archivo", class: "paso" }, "Elegir historia.json"),

async function arrancar() {
  const incrustada = document.getElementById("historia-json");
  if (incrustada) {
    try { H = JSON.parse(incrustada.textContent); return pantallaInicio(); }
    catch (e) { console.warn("La historia incrustada tiene un error:", e); }
  }
  try {
    const r = await fetch("historia.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    H = await r.json();
    pantallaInicio();
  } catch (e) { cargaManual(e); }
}
/* ---------- emojis nuevos: sustituto antiguo si el sistema no los pinta (igual que Arcade.FALLBACK) ---------- */
const FALLBACK = { "🪨": "🌑", "🪄": "✨", "🪵": "🏏", "🧌": "👹", "🪢": "➰", "🫘": "🌱", "🪙": "💰", "🤍": "💖",
  "❤️‍🔥": "🔴", "🟥": "❤️", "🟦": "💙", "🟩": "💚", "🟨": "💛", "🟪": "💜" };
const CLAVES_FB = Object.keys(FALLBACK);
const eok = new Map(); let etc = null;
function emojiOK(ch) {
  let v = eok.get(ch); if (v !== undefined) return v; v = true;
  try {
    if (!etc) { const c = document.createElement("canvas"); c.width = c.height = 64; etc = c.getContext("2d", { willReadFrequently: true }); }
    const x = etc; x.clearRect(0, 0, 64, 64); x.font = '40px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.textBaseline = "top";
    if (x.measureText(ch).width > x.measureText("😀").width * 1.35) v = false;
    else {
      x.fillStyle = "#f00"; x.fillText(ch, 4, 4);
      const d = x.getImageData(0, 0, 64, 64).data; let col = false, ink = false;
      for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40) { ink = true; if (d[i + 1] > 30 || d[i + 2] > 30) { col = true; break; } }
      v = ink && col;
    }
  } catch (_) { v = true; }
  eok.set(ch, v); return v;
}
function fx(t) {
  if (!t) return t;
  for (const k of CLAVES_FB) if (t.indexOf(k) >= 0 && !emojiOK(k)) t = t.split(k).join(FALLBACK[k]);
  return t;
}
function arreglarEmojis(raiz) {
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) { const t = fx(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; }
}
new MutationObserver(ms => { for (const m of ms) { if (m.type === "characterData") { const t = fx(m.target.nodeValue); if (t !== m.target.nodeValue) m.target.nodeValue = t; } else m.addedNodes.forEach(x => arreglarEmojis(x.nodeType === 3 ? x.parentNode || x : x)); } })
  .observe(document.body, { childList: true, subtree: true, characterData: true });

/* ---------- favorito y tiempo de juego → web PHP (../../api/…). Sin la web PHP falla en silencio. ---------- */
const GAME_ID = "mati-y-los-portales";
const web = /^https?:/.test(location.protocol);
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const uid = () => { let u = null; try { u = localStorage.getItem('arc_uid'); } catch (e) {} if (!/^[a-f0-9]{24}$/.test(u || '')) { u = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem('arc_uid', u); } catch (e) {} } document.cookie = 'arc_uid=' + u + ';path=/;max-age=63072000;SameSite=Lax'; return u; };
const favs = () => { const v = lsGet('arc_favs', []); return Array.isArray(v) ? v : []; };
function botonFav(cls) {
  const b = el("button", { class: cls, title: "Favorito", "aria-label": "Favorito" });
  const pintar = () => b.textContent = favs().includes(GAME_ID) ? "❤️" : "🤍";
  b.addEventListener("click", () => {
    const on = !favs().includes(GAME_ID), l = favs().filter(x => x !== GAME_ID);
    if (on) { l.unshift(GAME_ID); sfx.ok(); toast("❤️ Guardado en favoritos"); }
    lsSet('arc_favs', l); pintar();
    if (web) try { fetch('../../api/fav', { method: 'POST', body: JSON.stringify({ g: GAME_ID, on: on ? 1 : 0, u: uid() }), keepalive: true, headers: { 'Content-Type': 'application/json' } }).catch(() => {}); } catch (e) {}
  });
  pintar(); return b;
}
const STAT = { s: 0, p: 0 };
const flush = () => { if (!web || (STAT.s < 1 && !STAT.p)) return; const body = JSON.stringify({ g: GAME_ID, s: Math.round(STAT.s), p: STAT.p, u: uid() }); STAT.s = 0; STAT.p = 0; try { navigator.sendBeacon && navigator.sendBeacon('../../api/play', new Blob([body], { type: 'application/json' })); } catch (e) {} };
setInterval(() => { if (S && !$("#hud").hidden && !document.hidden) STAT.s++; }, 1000);
setInterval(flush, 60000); window.addEventListener('pagehide', flush); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }
arrancar();
