<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secuencias lógicas · vídeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1d1147}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script>
/* Vídeos de «Secuencias lógicas» para ArcadeRecorder (herramientas/grabador, modo retos con --pagina).
   Usa el MISMO generador que el juego (games/secuencias.html, bloque GEN_START…GEN_END): la pregunta N sale siempre igual.
   URL: video-secuencias.html?rec=1&quiz=N&lang=es|en&fps=30
     set=1 (una pregunta: «¿Qué va después?») · set=5 (cinco preguntas de fácil a genio)
     wait=10 (segundos para pensar; con set=5, por defecto 6) · site / url (dirección que se anuncia)
     hook / cta / extra (textos opcionales de la entrada y del cierre)
   Todo se pinta en función del tiempo t: window.arcadeRec.step(n) avanza n fotogramas (el grabador hace una captura de cada uno). */
(async function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  const num = (k, d) => (Q.has(k) && Q.get(k) !== '' && isFinite(+Q.get(k)) ? +Q.get(k) : d);
  const EN = (Q.get('lang') || (/\/en(\/|$)/.test(location.pathname) ? 'en' : 'es')) === 'en';
  const T = (es, en) => (EN ? en : es);
  const N = Math.max(1, Math.round(num('quiz', 1))), SET = num('set', 1) >= 5 ? 5 : 1, FPS = num('fps', 30);
  const WAIT = Math.max(3, num('wait', SET === 5 ? 6 : 10));
  const host = Q.get('site') || location.host;
  const URLT = Q.get('url') || host + '/secuencias-logicas';
  const HOOK = Q.get('hook') || (SET === 5 ? T('5 SECUENCIAS · ¿HASTA DÓNDE LLEGAS?', '5 SEQUENCES · HOW FAR CAN YOU GO?') : T('SOLO EL 3 % LO ACIERTA', 'ONLY 3% GET THIS RIGHT'));
  const CTA = Q.get('cta') || T('Miles de retos como este, gratis', 'Thousands of puzzles like this, free');
  const EXTRA = Q.has('extra') ? Q.get('extra') : T('Juegos de lógica para todas las edades', 'Logic games for all ages');

  /* ---------- el generador del juego ---------- */
  const src = await (await fetch('games/secuencias.html', { cache: 'no-store' })).text();
  const code = src.slice(src.indexOf('/*GEN_START*/'), src.indexOf('/*GEN_END*/'));
  let DV = 0;
  const GEN = new Function('H', code + '\nreturn { genQuestion, key, mkRand, hashSeed, shuf };')({ D: () => DV });
  const { genQuestion, key, mkRand, hashSeed, shuf } = GEN;

  // Una pregunta de vídeo: se corta la secuencia justo después del primer hueco («¿qué va después?») y se dan 4 opciones.
  function makeQ(level, D, salt) {
    for (let q = 0; q < 40; q++) {
      DV = D; const G = genQuestion(9, level, q + salt * 41);
      const b = G.blanks[0], seq = G.seq.slice(0, b + 1);
      if (seq.length > 14 || seq.length < 3) continue;
      const ans = G.seq[b], others = G.choices.filter((t) => key(t) !== key(ans));
      if (!others.length) continue;
      const r = mkRand(hashSeed(level, q, 31337, salt));
      const opts = shuf(r, [ans].concat(shuf(r, others).slice(0, 3)));
      return { type: G.type, seq, b, ans, opts, ok: opts.findIndex((t) => key(t) === key(ans)), meta: G.meta || {}, D };
    }
    return null;
  }
  const LEVELS = SET === 5 ? [[1.0, T('FÁCIL', 'EASY'), '#51cf66'], [3.0, T('NORMAL', 'MEDIUM'), '#4dabf7'], [5.0, T('DIFÍCIL', 'HARD'), '#fcc419'], [7.0, T('EXPERTO', 'EXPERT'), '#ff922b'], [9.0, T('GENIO 🧠', 'GENIUS 🧠'), '#ff6b6b']]
    : [[1.6 + ((N - 1) * 0.37) % 7.6, '', '#ffd43b']];
  const QS = LEVELS.map(([D, lab, col], i) => Object.assign(makeQ(N * 7 + i, D, i) || makeQ(N * 7 + i + 100, D, i + 9), { label: lab, color: col }));

  /* ---------- la regla explicada ---------- */
  const sgn = (v) => (v >= 0 ? '+' + v : '−' + Math.abs(v));
  function rule(P) {
    const m = P.meta, t = P.type, v = m.v, i = P.b;
    if (t.startsWith('rep')) return { text: T('Este bloque se repite una y otra vez:', 'This block repeats again and again:'), toks: P.seq.slice(0, m.p) };
    switch (t) {
      case 'groups': { const d = m.arith[1] - m.arith[0]; return { text: T('Cada grupo tiene ' + Math.abs(d) + (d > 0 ? ' más' : ' menos') + ' que el anterior.', 'Each group has ' + Math.abs(d) + (d > 0 ? ' more' : ' fewer') + ' than the one before.'), eq: m.arith[i - 1] + ' ' + sgn(d) + ' = ' + m.arith[i] }; }
      case 'countNum': { const d = v[1] - v[0]; return { text: T('Cada número es el anterior ' + sgn(d) + '.', 'Each number is the one before ' + sgn(d) + '.'), eq: v[i - 1] + ' ' + sgn(d) + ' = ' + v[i] }; }
      case 'letters': { const d = Math.abs(v[1] - v[0]); return { text: d === 1 ? T('Las letras siguen el abecedario, una detrás de otra.', 'The letters follow the alphabet, one after another.') : T('Las letras van saltando de ' + d + ' en ' + d + ' en el abecedario.', 'The letters jump ' + d + ' places along the alphabet.') }; }
      case 'diffPat': { const a = v[1] - v[0], c = v[2] - v[1]; return { text: T('Los saltos se alternan: ' + sgn(a) + ' y ' + sgn(c) + '.', 'The jumps take turns: ' + sgn(a) + ' then ' + sgn(c) + '.'), eq: v[i - 1] + ' ' + sgn(v[i] - v[i - 1]) + ' = ' + v[i] }; }
      case 'secondDiff': { const ds = []; for (let k = 1; k <= Math.min(i, 5); k++) ds.push(sgn(v[k] - v[k - 1])); return { text: T('Los saltos crecen cada vez: ' + ds.join(', ') + '…', 'The jumps keep growing: ' + ds.join(', ') + '…'), eq: v[i - 1] + ' ' + sgn(v[i] - v[i - 1]) + ' = ' + v[i] }; }
      case 'geometric': { const r = v[1] / v[0]; return { text: T('Cada número se multiplica por ' + r + '.', 'Each number is multiplied by ' + r + '.'), eq: v[i - 1] + ' × ' + r + ' = ' + v[i] }; }
      case 'interleave': { const s1 = v[2] - v[0], s2 = v[3] - v[1]; return { text: T('Dos filas se turnan: una va ' + sgn(s1) + ' y la otra ' + sgn(s2) + '.', 'Two rows take turns: one goes ' + sgn(s1) + ', the other ' + sgn(s2) + '.'), eq: v[i - 2] + ' ' + sgn(v[i] - v[i - 2]) + ' = ' + v[i] }; }
      case 'squares': { const n = Math.round(Math.sqrt(v[i])); return { text: T('Son números al cuadrado: 1×1, 2×2, 3×3…', 'They are square numbers: 1×1, 2×2, 3×3…'), eq: n + ' × ' + n + ' = ' + v[i] }; }
      case 'fibo': return { text: T('Cada número es la suma de los dos anteriores.', 'Each number is the sum of the two before it.'), eq: v[i - 2] + ' + ' + v[i - 1] + ' = ' + v[i] };
      case 'cycle': return { text: T('Gira ' + m.k + (m.k === 1 ? ' paso' : ' pasos') + ' cada vez' + (m.dir < 0 ? ', hacia atrás.' : '.'), 'It turns ' + m.k + (m.k === 1 ? ' step' : ' steps') + ' each time' + (m.dir < 0 ? ', backwards.' : '.')) };
      case 'mirror': return { text: T('Es un espejo: la segunda mitad es la primera al revés.', 'It\'s a mirror: the second half is the first one reversed.') };
      case 'mixed': return { text: T('Se alternan dos patrones: los dibujos se repiten y los números van ' + sgn(m.step) + '.', 'Two patterns take turns: the pictures repeat and the numbers go ' + sgn(m.step) + '.') };
    }
    return { text: '' };
  }

  /* ---------- línea de tiempo ---------- */
  const ITEM = 0.11, REVEAL = SET === 5 ? 3.4 : 5.2, TU = 1.2;
  const segs = []; let t = SET === 5 ? 2.6 : 2.4;
  QS.forEach((P, i) => {
    const s = { P, i, t0: t }; s.tOpt = t + 0.5 + P.seq.length * ITEM + 0.2; s.tQ = s.tOpt + 0.6; s.tUp = s.tQ + WAIT; s.tR = s.tUp + TU; s.t1 = s.tR + REVEAL; s.rule = rule(P);
    segs.push(s); t = s.t1 + (SET === 5 ? 0.3 : 0);
  });
  const TO = t, OUT = 5, DUR = TO + OUT;
  const cues = [{ t: 0.05, s: 'boom' }];
  segs.forEach((s) => {
    s.P.seq.forEach((_, k) => { if (k % 2 === 0) cues.push({ t: s.t0 + 0.5 + k * ITEM, s: 'pop' }); });
    cues.push({ t: s.tOpt, s: 'whoosh' });
    for (let x = s.tQ; x < s.tUp - 0.01; x += 0.5) cues.push({ t: x, s: Math.round((x - s.tQ) * 2) % 2 ? 'hat' : 'kick' });
    for (let k = 1; k <= Math.min(5, WAIT); k++) cues.push({ t: s.tUp - k, s: k <= 3 ? 'tock' : 'tick' });
    cues.push({ t: s.tUp, s: 'boom' }, { t: s.tR, s: 'drum' }, { t: s.tR + 0.8, s: 'ding' }, { t: s.tR + 1.1, s: 'pop' });
  });
  cues.push({ t: TO + 0.2, s: 'whoosh' }, { t: TO + 0.8, s: 'ding' });

  /* ---------- dibujo ---------- */
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 540, H = 960, dpr = 1;
  function resize() { dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  resize(); addEventListener('resize', resize);
  const FF = '"Fredoka","Nunito",system-ui,sans-serif', EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), ease = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
  const back = (k) => { k = clamp(k, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function txt(s, x, y, size, color, o = {}) {
    ctx.save(); ctx.font = (o.w || 700) + ' ' + Math.round(size) + 'px ' + (o.f || FF); ctx.textAlign = o.a || 'center'; ctx.textBaseline = 'middle';
    if (o.mw) { const w = ctx.measureText(s).width; if (w > o.mw) { ctx.translate(x, y); ctx.scale(o.mw / w, o.mw / w); x = 0; y = 0; } }
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * 0.2; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
    ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
  }
  function emo(e, x, y, size) { ctx.save(); ctx.shadowColor = 'rgba(40,20,90,.35)'; ctx.shadowBlur = Math.max(2, size * 0.08); ctx.shadowOffsetY = size * 0.03; ctx.font = Math.round(size) + 'px ' + EF; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y + size * 0.06); ctx.restore(); }   // con sombra: así se ven ⚪ y los emojis claros
  // una ficha de la secuencia (las mismas clases de token que el juego: emoji, número, letra, tamaño, grupo)
  function tok(tk, cx, cy, s) {
    if (tk.t === 'e') emo(tk.v, cx, cy, s * 0.62);
    else if (tk.t === 'n' || tk.t === 'l') { const d = String(tk.v).length, nf = d <= 2 ? 0.52 : d === 3 ? 0.42 : d === 4 ? 0.34 : d === 5 ? 0.28 : 0.24; txt(String(tk.v), cx, cy + s * 0.02, s * nf, tk.t === 'n' ? '#5b3fd1' : '#e2457e'); }
    else if (tk.t === 's') emo(tk.e, cx, cy, s * [0.28, 0.5, 0.8][tk.s]);
    else if (tk.t === 'g') { const n = tk.n, gc = n <= 3 ? n : n === 4 ? 2 : n <= 9 ? 3 : 4, rows = Math.ceil(n / gc), f = Math.min(0.55, 0.86 / Math.max(gc, rows)) * s, st = f * 1.05;
      for (let k = 0; k < n; k++) { const r = Math.floor(k / gc), c = k % gc, inRow = Math.min(gc, n - r * gc); emo(tk.e, cx + (c - (inRow - 1) / 2) * st, cy + (r - (rows - 1) / 2) * st, f); } }
  }
  function tile(x, y, s, o = {}) {
    ctx.save();
    if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = s * 0.16; ctx.shadowOffsetY = s * 0.05; }
    const g = ctx.createLinearGradient(x, y, x + s, y + s); g.addColorStop(0, o.c1 || '#f6f2ff'); g.addColorStop(1, o.c2 || '#d9ccff');   // lila: así se ven también ⚪ y los emojis blancos
    ctx.fillStyle = g; rr(x, y, s, s, s * 0.24); ctx.fill(); ctx.restore();
    if (o.ring) { ctx.save(); ctx.lineWidth = Math.max(3, s * 0.06); ctx.strokeStyle = o.ring; rr(x, y, s, s, s * 0.24); ctx.stroke(); ctx.restore(); }
  }
  function layoutSeq(P) {   // filas de fichas centradas
    const n = P.seq.length, land = W > H, per = land ? Math.min(n, 9) : Math.min(n, n <= 5 ? 5 : n <= 8 ? 4 : 5);
    const rows = Math.ceil(n / per), gap = Math.min(W, H) * 0.022, s = Math.min(land ? H * 0.2 : W * 0.17, (W * 0.92 - gap * (per - 1)) / per, (land ? H * 0.42 : H * 0.36) / rows - gap);
    const top = land ? H * 0.26 : H * 0.24, pos = [];
    for (let k = 0; k < n; k++) { const r = Math.floor(k / per), inRow = Math.min(per, n - r * per), c = k % per; pos.push([W / 2 + (c - (inRow - 1) / 2) * (s + gap) - s / 2, top + r * (s + gap)]); }
    return { pos, s, bottom: top + rows * (s + gap) };
  }
  function caption(words, x, y, size, t0, tt, o = {}) {   // subtítulo palabra a palabra con contorno
    ctx.save(); ctx.font = '700 ' + size + 'px ' + FF; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const sp = size * 0.28, ws = words.map((w) => ctx.measureText(w).width), maxW = W * 0.9, lines = [[]]; let lw = 0;
    words.forEach((w, i) => { if (lw + ws[i] > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(i); lw += ws[i] + sp; });
    const per = o.per || 0.16, shown = Math.floor((tt - t0) / per) + 1;
    lines.forEach((ln, li) => {
      const tw = ln.reduce((a, i) => a + ws[i] + sp, -sp); let cx = x - tw / 2; const cy = y + (li - (lines.length - 1) / 2) * size * 1.18;
      for (const i of ln) {
        if (i < shown) { const k = clamp((tt - t0 - i * per) / 0.16, 0, 1), sc = 0.6 + 0.4 * back(k);
          ctx.save(); ctx.translate(cx + ws[i] / 2, cy); ctx.scale(sc, sc); ctx.lineWidth = size * 0.2; ctx.strokeStyle = '#000'; ctx.strokeText(words[i], -ws[i] / 2, 0);
          ctx.fillStyle = o.color ? o.color(i) : '#fff'; ctx.fillText(words[i], -ws[i] / 2, 0); ctx.restore(); }
        cx += ws[i] + sp;
      }
    });
    ctx.restore();
  }
  function pill(s, x, y, size, bg, fg) { ctx.save(); ctx.font = '700 ' + size + 'px ' + FF; const w = Math.min(W * 0.94, ctx.measureText(s).width + size * 1.3); ctx.fillStyle = bg; rr(x - w / 2, y - size * 0.82, w, size * 1.64, size * 0.82); ctx.fill(); ctx.restore(); txt(s, x, y + 1, size, fg, { mw: W * 0.9 }); }
  function wrap(s, maxW, size) { ctx.font = '600 ' + size + 'px ' + FF; const out = []; let cur = ''; for (const w of s.split(' ')) { const t2 = cur ? cur + ' ' + w : w; if (ctx.measureText(t2).width > maxW && cur) { out.push(cur); cur = w; } else cur = t2; } if (cur) out.push(cur); return out; }

  // fondo: degradado que se mueve despacio y emojis que flotan
  const FLOAT = ['🧠', '🤔', '💡', '❓', '🔢', '✨', '🧩', '⭐'];
  function background(tt, hot) {
    const g = ctx.createLinearGradient(0, 0, W * 0.3, H); g.addColorStop(0, hot ? '#5c1030' : '#3b1d8f'); g.addColorStop(0.55, hot ? '#2a0b2a' : '#24125e'); g.addColorStop(1, '#120a33');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = 0.07; ctx.translate(W / 2, H * 0.45); ctx.rotate(tt * 0.08);
    for (let k = 0; k < 12; k++) { ctx.rotate(Math.PI / 6); ctx.fillStyle = k % 2 ? '#b197fc' : '#748ffc'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-W * 0.14, H); ctx.lineTo(W * 0.14, H); ctx.fill(); }
    ctx.restore();
    for (let k = 0; k < 12; k++) { const y = ((k * 0.137 + 1 - tt * (0.02 + (k % 4) * 0.008)) % 1 + 1) % 1, x = (k * 0.293 + Math.sin(tt * 0.6 + k) * 0.02) % 1; ctx.globalAlpha = 0.1; emo(FLOAT[k % FLOAT.length], x * W, y * H, Math.min(W, H) * 0.06); }
    ctx.globalAlpha = 1;
  }
  function timer(cx, cy, r, left, frac) {
    if (left <= 3) { const k = 1 - (left % 1 || 1), sc = 1.7 - 0.7 * ease(k * 3); ctx.save(); ctx.globalAlpha = clamp((left % 1 || 1) * 3, 0, 1); ctx.translate(cx, cy); ctx.scale(sc, sc); txt(String(Math.ceil(left)), 0, 0, r * 1.5, '#ff6b6b', { stroke: '#000', sw: r * 0.16 }); ctx.restore(); return; }
    ctx.save(); ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(0, 0, r * 1.18, 0, 6.3); ctx.fill();
    ctx.lineCap = 'round'; ctx.lineWidth = r * 0.18; ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3); ctx.stroke();
    ctx.strokeStyle = left <= 5 ? '#ff6b6b' : '#ffd43b'; ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
    ctx.restore(); txt(String(Math.ceil(left)), cx, cy + 2, r * 0.95, '#fff', { stroke: '#000', sw: 7 });
  }

  function drawSeg(S, tt) {
    const P = S.P, L = layoutSeq(P), s = L.s, land = W > H;
    // cabecera: nivel (serie de 5) o gancho
    if (SET === 5) { const k = back((tt - S.t0) / 0.35); ctx.save(); ctx.translate(W / 2, H * 0.085); ctx.scale(k, k); pill(T('NIVEL ', 'LEVEL ') + (S.i + 1) + '/5 · ' + P.label, 0, 0, Math.min(W, H) * 0.045, P.color, '#1b1033'); ctx.restore();
      for (let k2 = 0; k2 < 5; k2++) { ctx.fillStyle = k2 < S.i ? 'rgba(255,255,255,.85)' : k2 === S.i ? P.color : 'rgba(255,255,255,.2)'; rr(W / 2 - 80 + k2 * 33, H * 0.135, 28, 7, 3.5); ctx.fill(); } }
    const qy = SET === 5 ? H * 0.19 : H * 0.165, last = true;
    if (tt < S.tUp) caption((P.seq.length > 0 && last ? T('¿QUÉ VA DESPUÉS? 🤔', 'WHAT COMES NEXT? 🤔') : '').split(' '), W / 2, qy, Math.min(W, H) * 0.075, S.t0 + 0.15, tt, { per: 0.14 });
    else if (tt < S.tR) { const k = back((tt - S.tUp) / 0.3); ctx.save(); ctx.translate(W / 2, qy); ctx.scale(k, k); ctx.rotate(-0.05); pill(T('⏰ ¡TIEMPO!', "⏰ TIME'S UP!"), 0, 0, Math.min(W, H) * 0.07, '#e03131', '#fff'); ctx.restore(); }
    else caption(T('¡LA RESPUESTA! 👇', "HERE'S THE ANSWER 👇").split(' '), W / 2, qy, Math.min(W, H) * 0.07, S.tR, tt, { per: 0.12 });
    // la secuencia
    const fly = clamp((tt - S.tR - 0.6) / 0.6, 0, 1), solved = tt >= S.tR + 0.6;
    P.seq.forEach((tk, k) => {
      const [x, y] = L.pos[k], a = clamp((tt - S.t0 - 0.5 - k * ITEM) / 0.25, 0, 1); if (a <= 0) return;
      const sc = back(a); ctx.save(); ctx.translate(x + s / 2, y + s / 2); ctx.scale(sc, sc); ctx.translate(-s / 2, -s / 2);
      if (tk.t === 'sep') { ctx.fillStyle = '#b197fc'; rr(s * 0.44, s * 0.05, s * 0.12, s * 0.9, s * 0.06); ctx.fill(); ctx.restore(); return; }
      if (k === P.b) {
        if (fly >= 1) { tile(0, 0, s, { c1: '#e9fff1', c2: '#c3f5d3', ring: '#40c057' }); tok(P.ans, s / 2, s / 2, s); }
        else { const pulse = 1 + 0.06 * Math.sin(tt * 7); ctx.translate(s / 2, s / 2); ctx.scale(pulse, pulse); ctx.translate(-s / 2, -s / 2);
          ctx.fillStyle = 'rgba(255,255,255,.12)'; rr(0, 0, s, s, s * 0.24); ctx.fill(); ctx.setLineDash([s * 0.12, s * 0.08]); ctx.lineWidth = Math.max(3, s * 0.05); ctx.strokeStyle = '#ffd43b'; rr(0, 0, s, s, s * 0.24); ctx.stroke(); ctx.setLineDash([]);
          txt('?', s / 2, s / 2 + 2, s * 0.6, '#ffd43b'); }
      } else { tile(0, 0, s); tok(tk, s / 2, s / 2, s); }
      ctx.restore();
    });
    // opciones A-D
    const n = P.opts.length, TR = Math.min(W, H) * (SET === 5 ? 0.07 : 0.08);
    let cols = land ? n : n <= 2 ? n : 2;
    if (!land && n > 2 && Math.min(W * 0.25, (H * 0.9 - (L.bottom + TR * 2.4 + 34)) / Math.ceil(n / 2) - 30) < W * 0.18) cols = n;   // poco sitio: las opciones en una fila
    const rowsO = Math.ceil(n / cols);
    const oy0 = land ? Math.min(H - H * 0.2 - 30, L.bottom + 28) : L.bottom + TR * 2.4 + 34;
    const os = Math.min(land ? H * 0.2 : W * 0.25, (W * 0.84 - (cols - 1) * 18) / cols, land ? 999 : (H * 0.9 - oy0) / rowsO - 30), opos = [];
    for (let k = 0; k < n; k++) { const r = Math.floor(k / cols), c = k % cols, inRow = Math.min(cols, n - r * cols); opos.push([W / 2 + (c - (inRow - 1) / 2) * (os + 18 + (cols > 2 ? 0 : os * 0.25)) - os / 2, oy0 + r * (os + 30)]); }
    const ao = clamp((tt - S.tOpt) / 0.35, 0, 1), ofade = 1 - clamp((tt - S.tR - 1.3) / 0.35, 0, 1);   // al explicar la regla, las opciones se van
    if (ao > 0 && ofade > 0) P.opts.forEach((tk, k) => {
      const [x, y] = opos[k], ok = k === P.ok, rev = tt >= S.tR;
      if (rev && ok && fly > 0) { const [bx, by] = L.pos[P.b], e = ease(fly); if (fly < 1) { const fx = x + (bx - x) * e, fy = y + (by - y) * e - Math.sin(fly * Math.PI) * os * 0.6, fs = os + (s - os) * e; tile(fx, fy, fs, { ring: '#40c057' }); tok(tk, fx + fs / 2, fy + fs / 2, fs); } }
      const sc = back(clamp(ao * 1.4 - k * 0.12, 0, 1)) * (rev && ok ? 1 + 0.08 * Math.sin((tt - S.tR) * 12) * Math.max(0, 1 - (tt - S.tR)) : 1);
      ctx.save(); ctx.globalAlpha = (rev && !ok ? 0.28 : 1) * ofade; ctx.translate(x + os / 2, y + os / 2); ctx.scale(sc, sc); ctx.translate(-os / 2, -os / 2);
      tile(0, 0, os, rev && ok ? { c1: '#e9fff1', c2: '#b2f2bb', ring: '#40c057' } : {}); if (!(rev && ok && fly > 0 && fly < 1)) tok(tk, os / 2, os / 2, os);
      ctx.fillStyle = rev && ok ? '#2f9e44' : '#7048e8'; ctx.beginPath(); ctx.arc(os * 0.08, os * 0.08, os * 0.15, 0, 6.3); ctx.fill(); txt('ABCD'[k], os * 0.08, os * 0.09, os * 0.17, '#fff');
      if (rev && !ok) { ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = os * 0.06; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(os * 0.25, os * 0.25); ctx.lineTo(os * 0.75, os * 0.75); ctx.moveTo(os * 0.75, os * 0.25); ctx.lineTo(os * 0.25, os * 0.75); ctx.stroke(); }
      ctx.restore();
    });
    const optBottom = oy0 + rowsO * (os + 30);
    // cuenta atrás
    if (tt >= S.tQ && tt < S.tUp) { const left = S.tUp - tt; timer(land ? W * 0.9 : W / 2, land ? H * 0.16 : L.bottom + TR * 1.2 + 14, TR, left, left / WAIT);
      if (SET === 1 && !land) { const msgs = [T('COMENTA TU RESPUESTA 👇', 'COMMENT YOUR ANSWER 👇'), T('¿A, B, C O D? 🤔', 'A, B, C OR D? 🤔'), T('ETIQUETA A UN GENIO 🧠', 'TAG A GENIUS 🧠')], idx = Math.floor((tt - S.tQ) / 3.4) % 3; caption(msgs[idx].split(' '), W / 2, H * 0.94, Math.min(W, H) * 0.05, S.tQ + idx * 3.4 + Math.floor((tt - S.tQ) / 10.2) * 10.2, tt, { per: 0.1 }); } }
    // la regla
    if (tt >= S.tR + 1.4) {
      const R = S.rule, k = back((tt - S.tR - 1.4) / 0.4), bw = Math.min(W * 0.9, 640), fz = Math.min(W, H) * (SET === 5 ? 0.05 : 0.056), lines = wrap('💡 ' + R.text, bw - 40, fz);
      const th = (R.toks ? Math.min(W, H) * 0.12 + 14 : 0) + (R.eq ? fz * 1.6 : 0), bh = 28 + lines.length * fz * 1.3 + th;
      const y = land ? Math.max(L.bottom + 16, H - bh - 16) : Math.max(L.bottom + 40, Math.min(H - bh - 40, L.bottom + 60));
      ctx.save(); ctx.translate(W / 2, y + bh / 2); ctx.scale(k, k); ctx.translate(-W / 2, -(y + bh / 2));
      ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 24; ctx.fillStyle = '#fffdf5'; rr(W / 2 - bw / 2, y, bw, bh, 20); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#40c057'; rr(W / 2 - bw / 2, y, 9, bh, 4); ctx.fill();
      lines.forEach((ln, i) => txt(ln, W / 2 - bw / 2 + 24, y + 16 + fz * 0.65 + i * fz * 1.3, fz, '#212529', { a: 'left', w: 600 }));
      let yy = y + 16 + lines.length * fz * 1.3 + 6;
      if (R.toks) { const ts = Math.min(Math.min(W, H) * 0.12, (bw - 50) / R.toks.length - 6); R.toks.forEach((tk, i) => { const x = W / 2 - (R.toks.length * (ts + 6) - 6) / 2 + i * (ts + 6); tile(x, yy, ts, { shadow: false, ring: '#d0bfff' }); tok(tk, x + ts / 2, yy + ts / 2, ts); }); yy += ts + 14; }
      if (R.eq) txt(R.eq, W / 2, yy + fz * 0.7, fz * 1.15, '#5b3fd1', { w: 700 });
      ctx.restore();
    }
  }

  function outro(tt) {
    const k = clamp(tt / 0.4, 0, 1), m = Math.min(W, H);
    ctx.save(); ctx.globalAlpha = 0.93 * k; ctx.fillStyle = '#140b38'; ctx.fillRect(0, 0, W, H); ctx.restore();
    const e = back((tt - 0.1) / 0.5); ctx.save(); ctx.globalAlpha = k; ctx.translate(W / 2, H * 0.27); ctx.scale(e, e); ctx.rotate(Math.sin(tt * 3) * 0.08); emo('🧠', 0, 0, m * 0.24); ctx.restore();
    if (SET === 5) caption(T('¿CUÁNTAS HAS ACERTADO? COMENTA TU NOTA /5 👇', 'HOW MANY DID YOU GET? COMMENT YOUR SCORE /5 👇').split(' '), W / 2, H * 0.43, m * 0.06, 0.3, tt, { per: 0.11, color: (i) => (i >= 4 ? '#ffd43b' : '#fff') });
    else caption(T('¿LO HAS ACERTADO? 😎', 'DID YOU GET IT? 😎').split(' '), W / 2, H * 0.43, m * 0.075, 0.3, tt, { per: 0.14 });
    if (tt > 1.2) { const a = clamp((tt - 1.2) * 3, 0, 1); ctx.save(); ctx.globalAlpha = a; txt(CTA, W / 2, H * 0.55, m * 0.045, '#e5dbff', { w: 600, mw: W * 0.9 }); ctx.restore(); }
    if (tt > 1.6) { const e3 = back((tt - 1.6) / 0.4), bob = 1 + 0.04 * Math.sin(tt * 6); ctx.save(); ctx.translate(W / 2, H * 0.65); ctx.scale(e3 * bob, e3 * bob);
      ctx.font = '700 ' + Math.round(m * 0.052) + 'px ' + FF; const w = Math.min(W * 0.94, ctx.measureText(URLT).width + m * 0.12); ctx.fillStyle = '#ffd43b'; rr(-w / 2, -m * 0.065, w, m * 0.13, m * 0.065); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(W / 2, H * 0.65); ctx.scale(e3 * bob, e3 * bob); txt(URLT, 0, 2, m * 0.052, '#1b1033', { mw: W * 0.86 }); ctx.restore(); }
    if (tt > 2.3 && EXTRA) { ctx.save(); ctx.globalAlpha = clamp((tt - 2.3) * 3, 0, 1); txt(EXTRA, W / 2, H * 0.76, m * 0.04, 'rgba(255,255,255,.8)', { w: 600, mw: W * 0.9 }); ctx.restore(); }
  }

  function frame(tt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const S = segs.find((s) => tt >= s.t0 && tt < s.t1) || (tt < segs[0].t0 ? null : segs[segs.length - 1]);
    background(tt, S && tt >= S.tUp && tt < S.tR);
    if (tt < (segs[0] ? segs[0].t0 : 2) + 0.3) {   // entrada: gancho
      const k = 1 - clamp((tt - (segs[0].t0 - 0.2)) / 0.4, 0, 1);
      ctx.save(); ctx.globalAlpha = k; caption(HOOK.split(' '), W / 2, H * 0.4, Math.min(W, H) * 0.08, 0.15, tt, { per: 0.14, color: (i) => (/\d/.test(HOOK.split(' ')[i]) ? '#ffd43b' : '#fff') }); ctx.restore();
    }
    if (S && tt < TO) drawSeg(S, tt);
    // transición entre preguntas de la serie
    if (SET === 5) for (const s2 of segs) { const d = tt - s2.t0; if (s2.i > 0 && d >= -0.3 && d < 0.3) { ctx.fillStyle = 'rgba(255,255,255,' + (0.5 - Math.abs(d) * 1.6) + ')'; ctx.fillRect(0, 0, W, H); } }
    if (S && tt >= S.tUp && tt < S.tUp + 0.35) { ctx.fillStyle = 'rgba(255,80,80,' + (0.5 - (tt - S.tUp) * 1.4) + ')'; ctx.fillRect(0, 0, W, H); }
    if (tt >= TO) outro(tt - TO);
  }

  /* ---------- interfaz de grabación ---------- */
  const total = Math.round(DUR * FPS); let f = 0;
  const P0 = QS[0], answers = QS.map((P) => (P.ans.t === 'e' || P.ans.t === 's' ? P.ans.v || P.ans.e : P.ans.t === 'g' ? P.ans.n : P.ans.v));
  const URLFULL = /^https?:/.test(URLT) ? URLT : 'https://' + URLT;
  const caption_ = SET === 5
    ? T('🧠 5 secuencias de lógica, de fácil a genio. ¿Hasta dónde llegas? Comenta tu nota /5 👇\nMiles de retos como estos, gratis: ' + URLFULL + '\n\n#logica #acertijos #retomental #testdeinteligencia #secuencias #fyp\n',
        '🧠 5 logic sequences, from easy to genius. How far can you go? Comment your score /5 👇\nThousands of puzzles like these, free: ' + URLFULL + '\n\n#logic #puzzle #brainteaser #iqtest #riddle #fyp\n')
    : T('🤔 ¿Qué va después? Reto de lógica #' + N + '. La respuesta, al final 👀 ¡Comenta la tuya antes!\nMiles de retos como este, gratis: ' + URLFULL + '\n\n#logica #acertijo #retomental #testdeinteligencia #secuencias #fyp\n',
        '🤔 What comes next? Logic puzzle #' + N + '. Answer at the end 👀 Comment yours first!\nThousands of puzzles like this, free: ' + URLFULL + '\n\n#logic #puzzle #brainteaser #iqtest #riddle #fyp\n');
  window.arcadeRec = {
    ready: false, fps: FPS, frames: total, quizCount: 999, scene: 'quiz', cues,
    info: { id: 'secuencias', title: T('Secuencias lógicas', 'Logic sequences'), puzzle: N, set: SET, total: 999, url: URLFULL, lang: EN ? 'en' : 'es', types: QS.map((P) => P.type), answers, caption: caption_ },
    step(n = 1) { for (let i = 0; i < n && f < total; i++) f++; frame(f / FPS); return { frame: f, done: f >= total, state: 'scene' }; },
  };
  try { await document.fonts.ready; } catch (_) {}
  frame(0);
  window.arcadeRec.ready = true; document.title = 'REC_READY';
  // sin el grabador (abriendo la página a mano): se reproduce sola
  if (!Q.has('rec')) { const t0 = performance.now(); (function loop(now) { const tt = ((now - t0) / 1000) % DUR; frame(tt); requestAnimationFrame(loop); })(t0); }
})();
</script></body></html>
