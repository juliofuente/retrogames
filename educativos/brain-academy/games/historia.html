<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Story Order</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {pick,shuf}=H.U;
const TXT={en:'🎞️ Put the story in order: what happens first?',es:'🎞️ Ordena la historia: ¿qué pasa primero?',fr:"🎞️ Remets l'histoire dans l'ordre : que se passe-t-il d'abord ?"};
const EXTRA={en:'One picture does not belong to the story!',es:'¡Un dibujo no es de esta historia!',fr:"Une image n'appartient pas à l'histoire !"};
const css=`
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.slot{width:clamp(62px,19vw,92px);aspect-ratio:1;border-radius:18px;border:3px dashed var(--lilac);background:#faf6ff;display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,9vw,3rem);position:relative}
.slot i{position:absolute;top:4px;left:7px;font-style:normal;font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:.8rem;color:var(--lilac)}
.slot.now{border-style:solid;border-color:var(--purple);animation:kbeat 1.3s infinite}
.slot.full{border:3px solid var(--green);background:#ecfff3;animation:kpop .35s}
.arrow{color:#ccc;align-self:center;font-weight:900}
.k-choice{aspect-ratio:1;font-size:min(3.2rem,42cqw)}
@media (orientation:landscape) and (max-height:540px){.slot{width:clamp(52px,16vh,80px);font-size:2rem}.k-choice{aspect-ratio:1.3}}
.k-choice.used{visibility:hidden}
.note{text-align:center;font-weight:800;color:var(--orange);font-size:.9rem}
`;
H.start(window,{id:'historia',mode:'rounds',css,
  timer:D=>D<2?null:Math.max(15,Math.round(50*Math.pow(.9,D))),
  async round(g){
    const data=await g.data('stories'),r=g.r,D=g.D;
    const n=D<1?3:4;
    const story=pick(r,data.stories.filter(s=>s.length>=n));
    const steps=story.length===n?story.slice():Array.from({length:n},(_,i)=>story[Math.round(i*(story.length-1)/(n-1))]);
    let intr=null;
    if(D>=2.5){const others=shuf(r,data.stories.flat().filter(e=>!story.includes(e)));intr=others[0];}
    g.prompt(g.t(TXT));
    if(intr)g.el('div','note',g.t(EXTRA),g.stage);
    const slots=g.el('div','slots',null,g.stage);
    const sl=steps.map((_,i)=>g.el('div','slot'+(i===0?' now':''),`<i>${i+1}</i>`,slots));
    let ptr=0;
    const cards=shuf(r,steps.concat(intr?[intr]:[]));
    g.choices(cards,(e,b)=>{b.textContent=e;},(e,b)=>{
      if(e!==steps[ptr]){g.bad(b);return;}
      sl[ptr].classList.remove('now');sl[ptr].classList.add('full');sl[ptr].insertAdjacentText('beforeend',e);b.classList.add('used');b.disabled=true;
      ptr++;g.unlockChoices();g.stage.querySelectorAll('.used').forEach(x=>x.disabled=true);
      if(ptr>=steps.length){g.fx.stars(sl[ptr-1]);g.solved();}else{g.good(b);sl[ptr].classList.add('now');}
    },Math.min(cards.length,5));
  }
});
}
</script></body></html>
