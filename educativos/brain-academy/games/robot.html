<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Robot Path</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {ri,pick,shuf}=H.U;
const DIR={'⬆️':[0,-1],'⬇️':[0,1],'⬅️':[-1,0],'➡️':[1,0]},AR=Object.keys(DIR);
const TX={es:{where:'🤖 El robot sigue las flechas. Toca la casilla donde termina.',which:'🤖 ¿Qué camino lleva al robot hasta la batería 🔋 sin chocar con las rocas?'},
          en:{where:'🤖 The robot follows the arrows. Tap the square where it ends.',which:'🤖 Which path takes the robot to the battery 🔋 without hitting rocks?'},
          fr:{where:'🤖 Le robot suit les flèches. Touche la case où il s\'arrête.',which:'🤖 Quel chemin mène le robot à la batterie 🔋 sans toucher les rochers ?'}};
// Simulate a program; null if it leaves the board or hits a rock.
function run(n,rocks,start,prog){let [x,y]=start;for(const a of prog){x+=DIR[a][0];y+=DIR[a][1];if(x<0||y<0||x>=n||y>=n||rocks.has(y*n+x))return null;}return y*n+x;}
function gen(r,D){
  const n=D<1?3:D<3?4:D<6?5:6,len=D<1?2:D<3?3:D<6?ri(r,4,5):ri(r,5,7),nRock=D<1?0:Math.floor(n*n*(D<3?.12:.18));
  const mode=D<2?'where':pick(r,['where','which','which']);
  for(let t=0;t<400;t++){
    const rocks=new Set(shuf(r,[...Array(n*n).keys()]).slice(0,nRock)),free=[...Array(n*n).keys()].filter(i=>!rocks.has(i));
    const s=pick(r,free),start=[s%n,Math.floor(s/n)],prog=[];let pos=start.slice(),seen=new Set([s]);
    for(let k=0;k<len;k++){const opts=AR.filter(a=>{const x=pos[0]+DIR[a][0],y=pos[1]+DIR[a][1],i=y*n+x;return x>=0&&y>=0&&x<n&&y<n&&!rocks.has(i)&&!seen.has(i);});
      if(!opts.length)break;const a=pick(r,opts);prog.push(a);pos=[pos[0]+DIR[a][0],pos[1]+DIR[a][1]];seen.add(pos[1]*n+pos[0]);}
    if(prog.length<len)continue;
    const end=run(n,rocks,start,prog);if(end===null||end===s)continue;
    if(mode==='where')return{mode,n,rocks,s,start,prog,end};
    // wrong programs: small changes that do NOT reach the battery
    const wr=new Map();
    for(let k=0;k<200&&wr.size<3;k++){const p=prog.slice(),m=ri(r,0,2);
      if(m===0){const i=ri(r,0,p.length-1);p[i]=pick(r,AR.filter(a=>a!==p[i]));}
      else if(m===1&&p.length>1){const i=ri(r,0,p.length-2);[p[i],p[i+1]]=[p[i+1],p[i]];}
      else p.reverse();
      const key=p.join('');if(key===prog.join('')||run(n,rocks,start,p)===end)continue;wr.set(key,p);}
    if(wr.size<3)continue;
    return{mode,n,rocks,s,start,prog,end,choices:shuf(r,[prog,...wr.values()])};
  }
}
const fmt=(p,D)=>{if(D<6)return p.join('');const out=[];for(let i=0;i<p.length;){let j=i;while(j<p.length&&p[j]===p[i])j++;out.push((j-i>1?(j-i)+'×':'')+p[i]);i=j;}return out.join(' ');};
const css=`
.board{display:grid;gap:3px;margin:0 auto;width:fit-content;background:#cfe8ff;padding:6px;border-radius:14px}
.sq{width:var(--s);height:var(--s);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.62)}
.sq.rock{background:#d9d4e6}button.sq{cursor:pointer;border:2px solid transparent}button.sq:hover{border-color:var(--purple)}
.prog{text-align:center;font-size:clamp(1.3rem,6vmin,1.9rem);letter-spacing:2px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 3px 10px rgba(45,42,74,.08)}
.k-choices{--cols:1}.k-choice{font-size:clamp(1.1rem,5vmin,1.6rem);letter-spacing:2px;min-height:50px}
`;
H.start(window,{id:'robot',mode:'rounds',css,
  timer:D=>D<2?null:Math.max(15,Math.round(60*Math.pow(.9,D))),
  round(g){
    const P=gen(g.r,g.D),L=TX[g.lang]||TX.es,n=P.n;g.prompt(L[P.mode]);
    if(P.mode==='where')g.el('div','prog',fmt(P.prog,g.D),g.stage);
    const land=g.win.innerWidth>g.win.innerHeight,avH=(g.card.clientHeight||400)-(land?60:200),avW=(g.stage.clientWidth||320)*(land?.55:1)-20;
    const s=Math.max(24,Math.min(56,Math.floor(Math.min(avW,avH)/n)-3));
    const bd=g.el('div','board'+(P.mode==='where'?' k-ans':''),null,g.stage);bd.style.gridTemplateColumns=`repeat(${n},${s}px)`;bd.style.setProperty('--s',s+'px');
    for(let i=0;i<n*n;i++){
      if(P.rocks.has(i)){g.el('div','sq rock','🪨',bd);continue;}
      if(i===P.s){g.el('div','sq','🤖',bd);continue;}
      if(P.mode==='which'){g.el('div','sq',i===P.end?'🔋':'',bd);continue;}
      const b=g.el('button','sq','',bd);b.onclick=()=>{if(g.solvedFlag||g.paused)return;if(i===P.end){b.textContent='🏁';g.fx.stars(b);g.solved();}else{g.bad(b);setTimeout(()=>{b.classList.remove('k-wrong');b.disabled=false;},450);}};
    }
    if(P.mode==='which')g.choices(P.choices,(p,b)=>{b.textContent=fmt(p,g.D);},(p,b)=>{if(p===P.prog){b.classList.add('k-right');g.fx.stars(b);g.solved();}else g.bad(b);},1);
  }
});
}
</script></body></html>
