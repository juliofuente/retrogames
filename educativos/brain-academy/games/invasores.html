<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Number Invaders</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {shuf}=H.U;
const INTRO={en:'Solve the problem at the top and tap the ship with the right answer before it lands!',es:'¡Resuelve la operación de arriba y toca la nave con el resultado antes de que aterrice!',fr:"Résous l'opération en haut et touche le vaisseau avec la bonne réponse avant qu'il n'atterrisse !"};
const css=`
.sky{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3a2f7a,#120f33 70%)}
.sky:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:38px 38px;opacity:.35}
.prob{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:4;font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:clamp(1.5rem,7vw,2.2rem);color:#fff;background:rgba(155,92,255,.85);padding:4px 18px;border-radius:16px;white-space:nowrap;box-shadow:0 0 18px rgba(155,92,255,.6)}
.prob.dots{color:#ffd93d;letter-spacing:-1px}
.ship{position:absolute;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:3;padding:4px}
.ship .e{font-size:clamp(2.2rem,9vw,3rem);filter:drop-shadow(0 0 8px #4fb8ff);animation:hov 1s ease-in-out infinite alternate}
@keyframes hov{to{transform:translateY(-4px)}}
.ship .n{font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:clamp(1.05rem,4.6vw,1.4rem);color:#2d2a4a;background:#ffd93d;border-radius:10px;padding:1px 10px;margin-top:-4px}
.ship.bad .n{background:#ff6b9d;color:#fff}
.cannon{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:2.6rem;z-index:4}
.ground{position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(#5b4bb0,#2d2470);border-top:3px solid #9b5cff}
`;
H.start(window,{id:'invasores',mode:'arcade',css,intro:g=>g.t(INTRO),
  wave(g){
    const r=g.r,D=g.D,win=g.win;g.stage.innerHTML='';
    const sky=g.el('div','sky',null,g.stage);g.el('div','ground',null,sky);const cannon=g.el('div','cannon','🚀',sky);
    const prob=g.el('div','prob','',sky);
    const total=5+Math.min(7,Math.floor(g.level/3)),nShips=D<3?3:D<6?4:5,fall=Math.max(4,12-D*.8);
    let qn=0,ships=[],y=0,cur=null,last=null,raf=0,lock=false;
    function newQ(){
      ships.forEach(s=>s.el.remove());ships=[];if(qn>=total){g.waveDone();return;}
      cur=H.M.problem(r,D);prob.textContent=cur.txt;prob.className='prob'+(cur.dots?' dots':'');
      const vals=shuf(r,[cur.ans,...H.M.near(r,cur.ans,nShips-1,0)]);y=0;lock=false;
      vals.forEach((v,i)=>{const el=g.el('div','ship',`<div class="e">🛸</div><div class="n">${v}</div>`,sky);el.style.left=((i+.5)*100/vals.length)+'%';
        const s={el,v};ships.push(s);
        el.onclick=()=>{if(!g.running||g.paused||lock||s.dead)return;
          if(v!==cur.ans){s.dead=true;el.classList.add('bad');g.loseHeart();return;}
          lock=true;const cr=cannon.getBoundingClientRect(),sr=el.getBoundingClientRect();
          g.fx.laser(cr.left+cr.width/2,cr.top,sr.left+sr.width/2,sr.top+sr.height/2,'#4fb8ff');H.SFX.laser();
          setTimeout(()=>{H.SFX.boom();g.fx.boom(sr.left+sr.width/2,sr.top+sr.height/2);},110);
          g.addScore(10+Math.floor(D*3)+Math.floor((1-y)*10));qn++;g.setProg(qn/total);setTimeout(()=>{if(g.running)newQ();},350);};});
    }
    function loop(ts){if(!g.running)return;if(g.paused){last=ts;raf=win.requestAnimationFrame(loop);return;}
      const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;
      if(!lock){y+=dt/fall;ships.forEach(s=>s.el.style.top=(14+y*62)+'%');
        if(y>=1){lock=true;H.SFX.boom();g.loseHeart();if(!g.running)return;qn++;g.setProg(qn/total);setTimeout(()=>{if(g.running)newQ();},300);}}
      raf=win.requestAnimationFrame(loop);}
    newQ();raf=win.requestAnimationFrame(loop);
    return()=>win.cancelAnimationFrame(raf);
  }
});
}
</script></body></html>
