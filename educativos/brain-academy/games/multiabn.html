<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ABN Multiplication</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {ri,intChoices}=H.U;
const TX={es:{title:(a,b)=>`✖️ Multiplica ${a} × ${b} por partes: rompemos el ${a} en trozos fáciles`,part:(p,b)=>`¿Cuánto es ${p} × ${b}?`,acc:'¿Cuánto llevamos sumando todo?',h:['Parte','× ','Resultado','Llevamos']},
          en:{title:(a,b)=>`✖️ Multiply ${a} × ${b} in parts: we break ${a} into easy pieces`,part:(p,b)=>`What is ${p} × ${b}?`,acc:'What is the running total?',h:['Part','× ','Result','Total']},
          fr:{title:(a,b)=>`✖️ Multiplie ${a} × ${b} par morceaux : on casse ${a} en parties faciles`,part:(p,b)=>`Combien font ${p} × ${b} ?`,acc:'Combien a-t-on en tout pour l\'instant ?',h:['Partie','× ','Résultat','Total']}};
// ABN multiplication: decompose the first factor into hundreds/tens/units, multiply each part, accumulate.
function gen(r,D){
  let a,b;if(D<4){a=ri(r,11,29);b=ri(r,2,4);}else if(D<6){a=ri(r,21,99);b=ri(r,3,9);}else if(D<8){a=ri(r,101,499);b=ri(r,3,9);}else{a=ri(r,201,999);b=ri(r,4,9);}
  const parts=[];const s=String(a);for(let i=0;i<s.length;i++){const v=+s[i]*Math.pow(10,s.length-1-i);if(v)parts.push(v);}
  let acc=0;const rows=parts.map((p,i)=>{const prod=p*b;acc+=prod;return{p,prod,acc,first:i===0};});
  return{a,b,rows,ans:a*b};
}
const css=`
.abn{width:100%;max-width:460px;margin:0 auto;border-collapse:separate;border-spacing:0;font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:clamp(1rem,4.4vmin,1.3rem);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(45,42,74,.08)}
.abn th{background:#FF9F43;color:#fff;font-size:.78rem;padding:6px;font-family:'Nunito',sans-serif;font-weight:900}
.abn td{text-align:center;padding:5px;border-top:2px solid #eee}.abn td.q{color:var(--purple);background:#f3edff}
.ask{text-align:center;font-weight:900;font-size:clamp(1rem,4.3vmin,1.2rem)}
.k-choice{font-size:clamp(1.2rem,5.2vmin,1.8rem)}
`;
H.start(window,{id:'multiabn',mode:'rounds',css,
  timer:D=>Math.max(30,Math.round(90*Math.pow(.92,D))),
  round(g){
    const P=gen(g.r,g.D),L=TX[g.lang]||TX.es;g.prompt(L.title(P.a,P.b));
    const tb=g.el('table','abn',`<tr><th>${L.h[0]}</th><th>${L.h[2]}</th><th>${L.h[3]}</th></tr>`,g.stage);
    const ask=g.el('div','ask','',g.stage),box=g.el('div','k-ans',null,g.stage);
    // steps: product of each part, and (from the 2nd part on) the running total
    const steps=[];P.rows.forEach((R,i)=>{steps.push({k:'p',i,ans:R.prod});if(!R.first)steps.push({k:'a',i,ans:R.acc});});
    const trs=P.rows.map(R=>g.el('tr','',`<td>${R.p} × ${P.b}</td><td></td><td></td>`,tb));let si=0;
    const next=()=>{box.innerHTML='';if(si>=steps.length){g.solved();return;}const S=steps[si],R=P.rows[S.i],cell=trs[S.i].children[S.k==='p'?1:2];
      cell.textContent='?';cell.classList.add('q');ask.textContent=S.k==='p'?L.part(R.p,P.b):L.acc;
      const dis=S.k==='p'?[S.ans*10,Math.round(S.ans/10),S.ans+P.b,S.ans-P.b,R.p+P.b]:[S.ans+10,S.ans-10,S.ans+100,S.ans-100,S.ans+1];
      g.choices(intChoices(g.r,[S.ans],dis,4,1),(n,b)=>{b.textContent=n;},(n,b)=>{
        if(n!==S.ans){g.bad(b);return;}box.querySelectorAll('button').forEach(x=>x.disabled=true);cell.textContent=n;cell.classList.remove('q');
        if(S.k==='p'&&R.first)trs[S.i].children[2].textContent=n;si++;
        if(si>=steps.length){g.fx.stars(b);g.solved();}else{g.good(b);setTimeout(next,300);}},4,box);};
    next();
  }
});
}
</script></body></html>
