<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Double Line: Adding</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../');}
</script><script src="abnkit.js?v=5b4ce1457b"></script><script>
if(H){
// Doble recta numérica para SUMAR: lo que gana un sumando lo pierde el otro (la suma no cambia).
const {ri}=ABN;
const TX={es:{p:(a,b)=>`➕ ${a} + ${b} con la doble recta: lo que gana uno, lo pierde el otro`,give:(A,R)=>`¿Cuánto le pasamos al <b>${A}</b> para llegar a <b>${R}</b>?`,fin:(A,B)=>`Ahora es fácil: ¿cuánto es <b>${A} + ${B}</b>?`,done:(a,b,s)=>`✅ ${a} + ${b} = ${s}`},
          en:{p:(a,b)=>`➕ ${a} + ${b} on the double number line: what one gains, the other loses`,give:(A,R)=>`How much do we move to <b>${A}</b> to reach <b>${R}</b>?`,fin:(A,B)=>`Now it's easy: what is <b>${A} + ${B}</b>?`,done:(a,b,s)=>`✅ ${a} + ${b} = ${s}`}};
function gen(r,D){
  for(let t=0;t<300;t++){let a,b;
    if(D<3){a=ri(r,6,18);b=ri(r,3,9);}else if(D<5){a=ri(r,11,79);b=ri(r,5,39);}else if(D<7){a=ri(r,21,89);b=ri(r,12,89);}else{a=ri(r,105,880);b=ri(r,25,400);}
    if(a%10===0)continue;const st=[];let A=a,B=b;const k=10-A%10;if(k>=B)continue;st.push({A,B,k,R:A+k});A+=k;B-=k;
    if(D>=7&&A%100){const k2=100-A%100;if(k2<B){st.push({A,B,k:k2,R:A+k2});A+=k2;B-=k2;}}
    return{a,b,st,A,B};}
  return{a:8,b:5,st:[{A:8,B:5,k:2,R:10}],A:10,B:3};
}
H.start(window,{id:'doblerecta',mode:'rounds',css:ABN.CSS,
  timer:D=>Math.max(30,Math.round(90*Math.pow(.93,D))),
  round(g){
    const P=gen(g.r,g.D),L=ABN.L(g,TX);g.prompt(L.p(P.a,P.b));
    const wrap=g.el('div',null,null,g.stage),ask=g.el('div','ask','',g.stage),box=g.el('div','k-ans',null,g.stage);
    const hist=[];let i=0;
    const draw=()=>{wrap.innerHTML='';
      const T=ABN.line(g,Object.assign({h:140},ABN.scale(P.a,P.A)),wrap),B=ABN.line(g,Object.assign({h:140},ABN.scale(P.B,P.b)),wrap);
      let cA=P.a,cB=P.b;hist.forEach(s=>{T.jump(cA,cA+s.k,'+'+s.k,'#3CC36E');B.jump(cB,cB-s.k,'−'+s.k,'#FF6B9D');cA+=s.k;cB-=s.k;});
      T.mark(cA,'#9B5CFF',cA);B.mark(cB,'#FF9F43',cB);};
    const go=()=>{draw();box.innerHTML='';
      if(i<P.st.length){const s=P.st[i];ask.innerHTML=L.give(s.A,s.R);
        g.choices(ABN.opts(g.r,s.k,[s.k+1,s.k-1,s.k+10,10-s.k,s.k+2],4,1),(v,b)=>{b.textContent=v;},(v,b)=>{
          if(v!==s.k){g.bad(b);return;}box.querySelectorAll('button').forEach(x=>x.disabled=true);hist.push(s);i++;g.good(b);setTimeout(go,420);},4,box);}
      else{const s=P.A+P.B;ask.innerHTML=L.fin(P.A,P.B);
        g.choices(ABN.opts(g.r,s,[s+10,s-10,s+1,s-1,s+100],4,0),(v,b)=>{b.textContent=v;},(v,b)=>{
          if(v!==s){g.bad(b);return;}ask.innerHTML=L.done(P.a,P.b,s);b.classList.add('k-right');g.fx.stars(b);g.solved();},4,box);}
      if(g.refit)g.refit();};
    go();
  }
});
}
</script></body></html>
