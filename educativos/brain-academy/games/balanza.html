<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Emoji Balance</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {ri,pick,shuf,intChoices}=H.U;
const POOLS=[['🍎','🍌','🍉','🍍'],['🍓','🍐','🥥','🎃'],['🐭','🐱','🐶','🐻'],['🪙','💎','👑','🏆'],['🍪','🧁','🍰','🎂'],['🐣','🐔','🦃','🦢'],['🔵','🟦','🔷','💠']];
// A side is a list of [emojiIndex,count]. Values: unit=1 and every other object is defined by earlier clues,
// so the answer is a single integer (no ambiguity).
function gen(r,D){
  const pool=pick(r,POOLS),val=[1,0,0,0];const clues=[];let q;
  const tier=D<3.5?1:D<5.5?2:D<7.5?3:4;
  if(tier===1){const k=ri(r,2,Math.min(5,2+Math.floor(D)));val[1]=k;clues.push([[[1,1]],[[0,k]]]);
    const m=ri(r,2,D<2.5?2:3);q=[[1,m]];}
  else if(tier===2){const k1=ri(r,2,3),k2=ri(r,2,3);val[1]=k1;val[2]=k1*k2;clues.push([[[1,1]],[[0,k1]]],[[[2,1]],[[1,k2]]]);
    q=D<4.5?[[2,1]]:[[2,ri(r,1,2)]];}
  else if(tier===3){const k1=ri(r,2,4),k2=ri(r,1,4);val[1]=k1;val[2]=k1+k2;clues.push([[[1,1]],[[0,k1]]],[[[2,1]],[[1,1],[0,k2]]]);
    q=r()<.5?[[1,1],[2,1]]:[[2,2]];}
  else{const k1=ri(r,2,3),k3=ri(r,1,3);val[1]=k1;val[2]=2*k1;val[3]=2*k1+k3;
    clues.push([[[1,1]],[[0,k1]]],[[[2,1]],[[1,2]]],[[[3,1]],[[2,1],[0,k3]]]);q=r()<.5?[[3,1],[1,1]]:[[3,1],[2,1]];}
  const ans=q.reduce((s,[i,c])=>s+val[i]*c,0);
  const dis=[ans+1,ans-1,ans+val[1],ans-val[1],ans+2,q.reduce((s,[,c])=>s+c,0)];
  return{pool,clues:shuf(r,clues),q,ans,choices:intChoices(r,[ans],dis,4,1)};
}
const TXT={en:u=>`⚖️ The scales are balanced. How many ${u} balance the last one?`,es:u=>`⚖️ Las balanzas están equilibradas. ¿Cuántos ${u} equilibran la última?`,fr:u=>`⚖️ Les balances sont équilibrées. Combien de ${u} pour la dernière ?`};
const css=`
.bals{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px 10px}
@media (max-height:640px){.bal{padding:2px 0 12px}.pan{min-height:38px;padding:3px 6px 5px}.pan span{font-size:1.15rem}.mid .post{height:18px}.beam{bottom:12px}.k-choice{min-height:48px}}
@media (orientation:landscape) and (max-height:540px){.bal{padding:2px 0 12px}.pan{min-height:38px;padding:3px 6px 5px}.pan span{font-size:1.15rem}.mid .post{height:18px}.beam{bottom:12px}}
.bal{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:0;padding:6px 0 18px;animation:kpop .4s backwards}
.pan{min-width:96px;max-width:44%;min-height:54px;display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-content:flex-end;padding:6px 8px 8px;border-bottom:6px solid #a77c52;border-radius:0 0 30px 30px;background:linear-gradient(#fff0,#fff7e6)}
.pan span{font-size:clamp(1.15rem,5vw,1.6rem);line-height:1.05}
.mid{width:38px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.mid b{font-size:1.4rem;color:#a77c52}
.mid .post{width:8px;height:30px;background:#a77c52;border-radius:4px}
.beam{position:absolute;bottom:18px;left:10%;right:10%;height:5px;background:#a77c52;border-radius:4px;z-index:-1}
.bal.q .pan.right{border-bottom-color:var(--purple)}
.qm{font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:1.6rem;color:var(--purple)}
.k-choice{font-size:clamp(1.3rem,5.5vw,1.8rem)}
`;
H.start(window,{id:'balanza',mode:'rounds',css,noSplit:true,
  timer:D=>Math.max(15,Math.round(70*Math.pow(.9,D))),
  round(g){
    const P=gen(g.r,g.D),E=P.pool;g.prompt(g.t(TXT)(E[0]));
    const side=(arr,cls)=>{const p=g.el('div','pan '+cls);arr.forEach(([i,c])=>{for(let k=0;k<c;k++)g.el('span','',E[i],p);});return p;};
    const bals=g.el('div','bals',null,g.stage);
    const bal=(L,R,q)=>{const b=g.el('div','bal'+(q?' q':''),null,bals);b.appendChild(side(L,'left'));g.el('div','mid','<b>=</b><div class="post"></div>',b);
      if(R)b.appendChild(side(R,'right'));else g.el('div','pan right',`<span class="qm">? × ${E[0]}</span>`,b);g.el('div','beam',null,b);return b;};
    P.clues.forEach(([L,R],i)=>{bal(L,R).style.animationDelay=(i*.12)+'s';});
    const qb=bal(P.q,null,true);
    g.choices(P.choices,(n,b)=>{b.innerHTML=`${n}<small style="font-size:.6em;margin-left:3px">${E[0]}</small>`;},(n,b)=>{
      if(n===P.ans){qb.querySelector('.right').replaceWith(side([[0,n]],'right'));g.fx.stars(b);g.solved();}else g.bad(b);
    },4);
  }
});
}
</script></body></html>
