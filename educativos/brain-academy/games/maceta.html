<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Water the Plant</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
</script><script src="abnkit.js"></script><script>
if(H){
// Riega la maceta: estima dónde está un número en una recta de lo a hi. Se coloca la maceta, cae el agua en el sitio exacto
// y, si cae dentro, la planta florece. Cada nivel la maceta es más estrecha (más precisión). Marcas fijas: ¼ ½ ¾ y ⅓ ⅔.
const {ri,pick}=ABN;
const TX={es:{p:n=>`🪴 Pon la maceta donde está el <b>${n}</b> y riégala`,sub:'Arrastra la maceta por la recta y pulsa «Regar»',btn:'💧 ¡Regar!',hit:['¡Justo en la maceta! 🌸','¡Bien apuntado! 🌻','¡Ha florecido! 🌷'],miss:n=>`El ${n} estaba aquí 💦 ¡Prueba con otro!`},
          en:{p:n=>`🪴 Put the pot where <b>${n}</b> is and water it`,sub:'Drag the pot along the line and press “Water”',btn:'💧 Water!',hit:['Right in the pot! 🌸','Nice aim! 🌻','It bloomed! 🌷'],miss:n=>`${n} was here 💦 Try another one!`}};
function range(r,D){
  if(D<1)return{lo:0,hi:10,st:1};
  if(D<2)return{lo:0,hi:20,st:1};
  if(D<3.5)return{lo:0,hi:100,st:5};
  if(D<5)return pick(r,[{lo:0,hi:100,st:1},{lo:0,hi:1000,st:50}]);
  if(D<7)return pick(r,[{lo:0,hi:1000,st:10},{lo:0,hi:200,st:2},{lo:0,hi:500,st:5}]);
  return pick(r,[{lo:0,hi:1000,st:1},{lo:100,hi:600,st:5},{lo:1000,hi:2000,st:10},{lo:0,hi:10000,st:100},{lo:200,hi:700,st:1}]);
}
function target(r,R,D){
  const span=R.hi-R.lo;
  if(D<4&&r()<.3){const f=pick(r,[.25,.5,.75]);return R.lo+Math.round(span*f/R.st)*R.st;}
  for(;;){const v=R.lo+Math.round((span*(.06+r()*.88))/R.st)*R.st;if(v>R.lo&&v<R.hi)return v;}
}
const css=ABN.CSS+`
.pot{width:100%;max-width:680px;margin:0 auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:visible}
.pot text{font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;text-anchor:middle;fill:#2d2a4a}
.pot .fr{font-size:52px;fill:#9B5CFF}.pot .fr2{font-size:44px;fill:#b9a7e6}.pot .ends{font-size:58px}
.water{display:flex;justify-content:center}.water .k-btn{font-size:1.25rem}
.sub{text-align:center;color:var(--mid);font-weight:800;font-size:.9rem}
`;
H.start(window,{id:'maceta',mode:'rounds',css,noSplit:true,
  round(g){
    const L=ABN.L(g,TX),R=range(g.r,g.D),NS='http://www.w3.org/2000/svg',doc=g.doc,span=R.hi-R.lo;
    const W=Math.max(.035,.22*Math.pow(.86,g.D))*1000;   // ancho de la maceta (unidades SVG sobre 1000)
    let T=target(g.r,R,g.D),busy=false;
    g.el('div','sub',L.sub,g.stage);
    const svg=doc.createElementNS(NS,'svg');svg.setAttribute('viewBox','-60 0 1120 470');svg.setAttribute('class','pot');g.stage.appendChild(svg);
    const mk=(t,a,p)=>{const e=doc.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
    const X=v=>(v-R.lo)/span*1000,Y=330;
    mk('line',{x1:0,y1:Y,x2:1000,y2:Y,stroke:'#2d2a4a','stroke-width':9,'stroke-linecap':'round'});
    [[0,R.lo],[1000,R.hi]].forEach(([x,v])=>{mk('line',{x1:x,y1:Y-30,x2:x,y2:Y+30,stroke:'#2d2a4a','stroke-width':8});const t=mk('text',{x,y:Y+90,class:'ends'});t.textContent=v;});
    [[.25,'¼'],[.5,'½'],[.75,'¾']].forEach(([f,s])=>{mk('line',{x1:f*1000,y1:Y-24,x2:f*1000,y2:Y+24,stroke:'#9B5CFF','stroke-width':7});const t=mk('text',{x:f*1000,y:Y+82,class:'fr'});t.textContent=s;});
    [[1/3,'⅓'],[2/3,'⅔']].forEach(([f,s])=>{mk('line',{x1:f*1000,y1:Y-18,x2:f*1000,y2:Y+18,stroke:'#b9a7e6','stroke-width':6,'stroke-dasharray':'6 4'});const t=mk('text',{x:f*1000,y:Y+82,class:'fr2'});t.textContent=s;});
    const cloud=mk('text',{x:500,y:95,'font-size':110});cloud.textContent='☁️';
    const rain=mk('rect',{x:491,y:100,width:18,height:0,rx:6,fill:'#4FB8FF',opacity:.85});
    const mark=mk('g',{});
    const pot=mk('g',{});let px=g.r()<.5?150+g.r()*200:650+g.r()*200;
    const body=mk('path',{fill:'#d9774a',stroke:'#a8502b','stroke-width':4},pot),rim=mk('rect',{height:20,rx:5,fill:'#e88a5c',stroke:'#a8502b','stroke-width':4},pot);
    const plant=mk('text',{'font-size':84},pot);plant.textContent='🌱';
    const place=x=>{px=Math.max(0,Math.min(1000,x));const h=W/2;
      body.setAttribute('d',`M${px-h} ${Y-80} L${px+h} ${Y-80} L${px+h*.78} ${Y-8} L${px-h*.78} ${Y-8} Z`);
      rim.setAttribute('x',px-h-8);rim.setAttribute('y',Y-94);rim.setAttribute('width',W+16);plant.setAttribute('x',px);plant.setAttribute('y',Y-100);};
    place(px);
    const toX=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse()).x;};
    let drag=false;
    svg.addEventListener('pointerdown',e=>{if(busy||g.solvedFlag||g.paused)return;drag=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}place(toX(e));});
    svg.addEventListener('pointermove',e=>{if(drag&&!busy)place(toX(e));});
    const up=()=>{drag=false;};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
    if(g.win.__potKey)g.win.removeEventListener('keydown',g.win.__potKey);
    g.win.__potKey=e=>{if(busy||g.solvedFlag)return;if(e.key==='ArrowLeft')place(px-10);if(e.key==='ArrowRight')place(px+10);if(e.key===' '){e.preventDefault();btn.click();}};
    g.win.addEventListener('keydown',g.win.__potKey);
    const wb=g.el('div','water',null,g.stage),btn=g.el('button','k-btn',L.btn,wb);
    const anim=(ms,f)=>new Promise(res=>{const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/ms);f(k);if(k<1)g.win.requestAnimationFrame(step);else res();};g.win.requestAnimationFrame(step);});
    const ask=()=>{g.prompt(L.p(T));mark.innerHTML='';rain.setAttribute('height',0);};
    btn.onclick=async()=>{
      if(busy||g.solvedFlag||g.paused)return;busy=true;btn.disabled=true;g.sfx.whoosh&&g.sfx.whoosh();
      const tx=X(T),cx0=+cloud.getAttribute('x');
      await anim(450,k=>{cloud.setAttribute('x',cx0+(tx-cx0)*k);rain.setAttribute('x',cx0+(tx-cx0)*k-9);});
      await anim(450,k=>{rain.setAttribute('height',(Y-100)*k);});
      const hit=Math.abs(px-tx)<=W/2;
      mk('line',{x1:tx,y1:Y-30,x2:tx,y2:Y+30,stroke:hit?'#3CC36E':'#e2345f','stroke-width':6},mark);
      const lb=mk('text',{x:tx,y:Y-130,'font-size':56,fill:hit?'#3CC36E':'#e2345f'},mark);lb.textContent=T;
      if(hit){plant.textContent=pick(g.r,['🌸','🌻','🌷','🌼']);g.fb(pick(g.r,L.hit),'ok');g.fx.stars(btn);g.solved();}
      else{const pd=mk('text',{x:tx,y:Y-6,'font-size':64},mark);pd.textContent='💦';g.bad(btn);if(g.hearts>0)g.fb(L.miss(T),'bad');
        setTimeout(()=>{if(g.solvedFlag||g.hearts<=0)return;T=target(g.r,R,g.D);ask();btn.disabled=false;btn.classList.remove('k-wrong');busy=false;},1500);}
      await anim(300,k=>{rain.setAttribute('opacity',.85*(1-k));});rain.setAttribute('opacity',.85);rain.setAttribute('height',0);
    };
    ask();
  }
});
}
</script></body></html>
