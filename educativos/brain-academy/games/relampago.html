<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Flash Reading</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {pick,shuf}=H.U;
const TXT={en:'⚡ A word will flash. Which picture was it?',es:'⚡ Una palabra aparecerá un instante. ¿Qué dibujo era?',fr:'⚡ Un mot va apparaître un instant. Quelle image était-ce ?'};
const AGAIN={en:'👀 Show again',es:'👀 Ver otra vez',fr:'👀 Revoir'};
const css=`
.screen{height:min(150px,max(90px,26vw),26vh);border-radius:22px;background:#2d2a4a;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 4px #4a4570}
.word{font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;color:#fff;font-size:clamp(2rem,10vw,3.4rem);letter-spacing:1px}
.cd{font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;color:#ffd93d;font-size:3rem;animation:kpop .3s}
.mask{color:#6f6a99;font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:2.4rem;letter-spacing:4px}
.again{align-self:center;background:#f1ebff;color:var(--purple);font-weight:900;border-radius:12px;padding:8px 14px}
.again:disabled{opacity:.35}
.prog{text-align:center;font-weight:900;color:var(--mid)}
.k-choice{aspect-ratio:1;font-size:clamp(2.4rem,11vw,3.4rem)}
`;
H.start(window,{id:'relampago',mode:'rounds',css,
  async round(g){
    const data=(await g.data('words'))[g.lang],r=g.r,D=g.D;
    const maxLen=D<3?5:D<5?7:99,minLen=D<5?1:5;
    let pool=data.words.filter(w=>w.w.length<=maxLen&&w.w.length>=minLen);if(pool.length<8)pool=data.words;
    const k=D<3?2:D<6?3:4,flash=Math.max(220,1600-D*130),nCh=D<4?3:4;
    const items=shuf(r,pool).slice(0,k).map(w=>{
      // similar-looking distractors first: same first letter or same length
      const sim=shuf(r,data.words.filter(x=>x!==w&&(x.w[0]===w.w[0]||x.w.length===w.w.length)));
      const rest=shuf(r,data.words.filter(x=>x!==w&&!sim.includes(x)));
      return{w,choices:shuf(r,[w,...sim.concat(rest).slice(0,nCh-1)])};
    });
    g.prompt(g.t(TXT));
    const prog=g.el('div','prog','',g.stage),scr=g.el('div','screen',null,g.stage);
    const again=g.el('button','again',g.t(AGAIN),g.stage);
    const box=g.el('div','k-ans',null,g.stage);
    let i=0,used=false;
    const show=(after)=>{scr.innerHTML='';let c=3;const step=()=>{if(c>0){scr.innerHTML=`<span class="cd">${c}</span>`;H.SFX.tick();c--;setTimeout(step,330);}
      else{scr.innerHTML=`<span class="word"></span>`;scr.firstChild.textContent=items[i].w.w;setTimeout(()=>{scr.innerHTML='<span class="mask">#####</span>';if(after)after();},flash);}};step();};
    const next=()=>{
      prog.textContent=`${i+1} / ${k}`;box.innerHTML='';used=false;again.disabled=true;
      show(()=>{again.disabled=false;
        g.choices(items[i].choices,(w,b)=>{b.textContent=w.e;},(w,b)=>{
          if(w!==items[i].w){g.bad(b);return;}box.querySelectorAll('button').forEach(x=>x.disabled=true);
          scr.innerHTML=`<span class="word"></span>`;scr.firstChild.textContent=items[i].w.w;b.classList.add('k-right');i++;
          if(i>=k){again.disabled=true;g.fx.stars(b);g.solved();}else{g.good(b);setTimeout(next,700);}
        },nCh,box);});
    };
    again.onclick=()=>{if(used||g.solvedFlag)return;used=true;again.disabled=true;show(null);};
    next();
  }
});
}
</script></body></html>
