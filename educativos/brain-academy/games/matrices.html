<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dot Arrays</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {ri,pick,shuf,intChoices}=H.U;
const EM=['🍓','⭐','🐞','🍪','🌸','🍬','🔵','🐥'];
const TX={es:{total:'🔳 ¿Cuántos hay en total? Mira las filas y las columnas.',which:'🔳 ¿Qué multiplicación cuenta todos?',lid:'🔳 Una tapa esconde una parte, pero las filas y columnas siguen igual. ¿Cuántos hay en total?'},
          en:{total:'🔳 How many altogether? Look at the rows and columns.',which:'🔳 Which multiplication counts them all?',lid:'🔳 A lid hides part of it, but the rows and columns stay the same. How many altogether?'},
          fr:{total:'🔳 Combien en tout ? Regarde les lignes et les colonnes.',which:'🔳 Quelle multiplication les compte tous ?',lid:'🔳 Un couvercle cache une partie, mais les lignes et colonnes restent pareilles. Combien en tout ?'}};
function gen(r,D){
  const R=D<1?2:ri(r,2,D<3?4:D<6?6:9),C=D<1?ri(r,2,3):ri(r,2,D<3?5:D<6?7:10),e=pick(r,EM),ans=R*C;
  const q=D<2.5?'total':D<5?pick(r,['total','which']):pick(r,['which','lid','lid']);
  if(q==='which'){const opts=new Map([[`${R} × ${C}`,true]]);
    for(const o of shuf(r,[`${R} + ${C}`,`${R} × ${C+1}`,`${R+1} × ${C}`,`${R} × ${C-1}`,`${R-1} × ${C}`]))if(opts.size<4&&!o.includes(' 0')&&!o.startsWith('0'))opts.set(o,false);
    return{R,C,e,q,choices:shuf(r,[...opts.keys()]),ans:`${R} × ${C}`};}
  return{R,C,e,q,ans,choices:intChoices(r,[ans],[ans+R,ans-R,ans+C,ans-C,R+C],D<1?3:4,1)};
}
const css=`
.arr{display:grid;gap:4px;margin:0 auto;width:fit-content;position:relative;padding:8px;background:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(45,42,74,.08)}
.arr span{width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.8);line-height:1}
.lid{position:absolute;background:repeating-linear-gradient(45deg,#c9a777,#c9a777 8px,#b8935f 8px,#b8935f 16px);border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.k-choice{font-size:clamp(1.3rem,5.5vmin,1.9rem)}
`;
H.start(window,{id:'matrices',mode:'rounds',css,
  timer:D=>D<2?null:Math.max(12,Math.round(45*Math.pow(.92,D))),
  round(g){
    const P=gen(g.r,g.D),L=TX[g.lang]||TX.es;g.prompt(L[P.q]);
    const land=g.win.innerWidth>g.win.innerHeight,avW=(g.stage.clientWidth||320)*(land?.5:1)-30,avH=(g.card.clientHeight||400)-(land?80:230);
    const s=Math.max(16,Math.min(40,Math.floor(Math.min(avW/P.C,avH/P.R))-4));
    const a=g.el('div','arr',null,g.stage);a.style.gridTemplateColumns=`repeat(${P.C},${s}px)`;a.style.setProperty('--s',s+'px');
    for(let i=0;i<P.R*P.C;i++)g.el('span','',P.e,a);
    if(P.q==='lid'){const lid=g.el('div','lid','📦',a),cw=s+4;lid.style.left=(8+cw)+'px';lid.style.top=(8+cw)+'px';lid.style.right='4px';lid.style.bottom='4px';}  // first row & column stay visible
    g.choices(P.choices,(x,b)=>{b.textContent=x;},(x,b)=>{if(x===P.ans){b.classList.add('k-right');const l=a.querySelector('.lid');if(l)l.remove();g.fx.stars(b);g.solved();}else g.bad(b);},P.choices.length);
  }
});
}
</script></body></html>
