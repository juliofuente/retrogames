<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lucky Bag</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {ri,pick,shuf}=H.U;
const COL=[{e:'🔴',es:'rojo',en:'red',fr:'rouge'},{e:'🔵',es:'azul',en:'blue',fr:'bleu'},{e:'🟢',es:'verde',en:'green',fr:'vert'},{e:'🟡',es:'amarillo',en:'yellow',fr:'jaune'},{e:'🟣',es:'morado',en:'purple',fr:'violet'}];
const TX={es:{most:'🎲 Sacamos una bola sin mirar. ¿De qué color es MÁS fácil que salga?',least:'🎲 Sacamos una bola sin mirar. ¿De qué color es MÁS DIFÍCIL que salga?',imp:'🎲 ¿Qué color es IMPOSIBLE sacar de esta bolsa?',
           spi:c=>`🎲 Sacar una bola de color ${c} es…`,w:['seguro','posible','imposible'],cmp:c=>`🎲 ¿En qué bolsa es más fácil sacar una bola de color ${c}?`,bag:'Bolsa'},
          en:{most:'🎲 We pick a ball without looking. Which colour is MOST likely?',least:'🎲 We pick a ball without looking. Which colour is LEAST likely?',imp:'🎲 Which colour is IMPOSSIBLE to pick from this bag?',
           spi:c=>`🎲 Picking a ${c} ball is…`,w:['certain','possible','impossible'],cmp:c=>`🎲 In which bag is it easier to pick a ${c} ball?`,bag:'Bag'},
          fr:{most:'🎲 On tire une boule sans regarder. Quelle couleur est la PLUS probable ?',least:'🎲 On tire une boule sans regarder. Quelle couleur est la MOINS probable ?',imp:'🎲 Quelle couleur est IMPOSSIBLE à tirer de ce sac ?',
           spi:c=>`🎲 Tirer une boule ${c}, c'est…`,w:['certain','possible','impossible'],cmp:c=>`🎲 Dans quel sac est-il plus facile de tirer une boule ${c} ?`,bag:'Sac'}};
function distinct(r,k,lo,hi){for(let t=0;t<100;t++){const a=Array.from({length:k},()=>ri(r,lo,hi));if(new Set(a).size===k)return a;}return Array.from({length:k},(_,i)=>lo+i);}
function gen(r,D){
  const types=['most'];if(D>=3)types.push('least');if(D>=4)types.push('imp','spi');if(D>=6)types.push('cmp','cmp');
  const t=pick(r,types),cols=shuf(r,COL);
  if(t==='most'||t==='least'){const k=D<4?2:D<6?3:4,cnt=distinct(r,k,1,D<4?6:9);
    const idx=cnt.indexOf(t==='most'?Math.max(...cnt):Math.min(...cnt));
    return{t,bags:[cols.slice(0,k).map((c,i)=>[c,cnt[i]])],choices:cols.slice(0,k),ans:cols[idx]};}
  if(t==='imp'){const k=ri(r,2,3),bag=cols.slice(0,k).map(c=>[c,ri(r,1,5)]);return{t,bags:[bag],choices:shuf(r,cols.slice(0,k+1)),ans:cols[k]};}
  if(t==='spi'){const s=ri(r,0,2),bag=s===0?[[cols[0],ri(r,3,7)]]:[[cols[0],ri(r,1,4)],[cols[1],ri(r,1,4)]];
    return{t,s,target:s===2?cols[2]:cols[0],bags:[bag],choices:[0,1,2],ans:s};}
  for(let k=0;k<200;k++){const a=[ri(r,1,6),ri(r,1,6)],b=[ri(r,1,6),ri(r,1,6)],pa=a[0]/(a[0]+a[1]),pb=b[0]/(b[0]+b[1]);
    if(Math.abs(pa-pb)<.15)continue;  // clearly different chances
    return{t:'cmp',bags:[[[cols[0],a[0]],[cols[1],a[1]]],[[cols[0],b[0]],[cols[1],b[1]]]],target:cols[0],choices:[0,1],ans:pa>pb?0:1};}
}
const css=`
.bags{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bag{position:relative;width:min(44vw,210px);aspect-ratio:1.15;border-radius:40% 40% 46% 46%/30% 30% 70% 70%;background:linear-gradient(#e9d5b0,#cfae7c);box-shadow:inset 0 -8px 0 rgba(0,0,0,.1);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:24px 14px 10px}
.bag:before{content:'';position:absolute;top:6px;left:30%;right:30%;height:12px;border-radius:8px;background:#a9824c}
.bag span{font-size:clamp(1.05rem,4.6vmin,1.5rem);line-height:1}
.bag b{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:#2d2a4a;color:#fff;border-radius:10px;padding:1px 10px;font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:.9rem}
.k-choice{font-size:clamp(1.2rem,5vmin,1.6rem);gap:6px}
`;
H.start(window,{id:'bolsa',mode:'rounds',css,
  timer:D=>Math.max(12,Math.round(45*Math.pow(.9,D))),
  round(g){
    const P=gen(g.r,g.D),L=TX[g.lang]||TX.es,nm=c=>c[g.lang]||c.es;
    g.prompt(P.t==='spi'?L.spi(nm(P.target)):P.t==='cmp'?L.cmp(nm(P.target)):L[P.t]);
    const wrap=g.el('div','bags',null,g.stage);
    P.bags.forEach((bag,bi)=>{const d=g.el('div','bag',null,wrap);const balls=shuf(g.r,bag.flatMap(([c,n])=>Array(n).fill(c.e)));balls.forEach(e=>g.el('span','',e,d));if(P.bags.length>1)g.el('b','',`${L.bag} ${'AB'[bi]}`,d);});
    const label=x=>P.t==='spi'?L.w[x]:P.t==='cmp'?`${L.bag} ${'AB'[x]}`:`${x.e} ${nm(x)}`;
    g.choices(P.choices,(x,b)=>{b.textContent=label(x);},(x,b)=>{if(x===P.ans){b.classList.add('k-right');g.fx.stars(b);g.solved();}else g.bad(b);},Math.min(P.choices.length,P.t==='spi'?3:4));
  }
});
}
</script></body></html>
