// ════════════════ DETERMINISTIC RNG ════════════════
function mkRand(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));

// ════════════════ TOKENS ════════════════
const E=v=>({t:'e',v}),N=v=>({t:'n',v}),G=(e,n)=>({t:'g',e,n}),Sz=(e,s)=>({t:'s',e,s}),Lt=v=>({t:'l',v}),SEP={t:'sep'};

];
const COLORS=['🔴','🟠','🟡','🟢','🔵','🟣','🟤','⚫'];

// ════════════════ DIFFICULTY (continuous, gradual) ════════════════
// D grows 0.1 per level. Ages 3–5 start at 0, 6–8 at 2, 9–12 at 4.
// So every 20 levels a child naturally reaches the next age range.
function getD(age,level){return H.D(age,level);}
function bandOf(D){return D<2?0:D<4?1:D<6?2:D<8?3:4;}
function levelTime(D){return Math.max(12,Math.round(48*Math.pow(0.88,D)));}
function numBlanks(D){return D<4?1:D<7?2:3;}
function maxLen(D){return D<10?Math.max(5,6+Math.floor(D*1.4)):Math.min(26,20+Math.floor((D-10)*1.5));}
function extraChoices(D){return D<2?0:D<5?1:2;}
function numTotal(D){return D<2?3:D<5?4:D<8?5:6;}
function forceLast(D){return D<1.5;}
function lenFor(ctx,nb,D,cap){const need=ctx+Math.max(1,2*nb-1);const want=ctx+2*nb+Math.floor(D/2);return Math.max(need,Math.min(cap===undefined?maxLen(D):cap,want));}

// Blanks are only placed AFTER the "context" (enough visible items to discover the rule).
function placeBlanks(r,seq,lo,nb,last){
  const L=seq.length,ok=i=>seq[i].t!=='sep';
  if(last){let i=L-1;while(!ok(i))i--;return[i];}
  const c=[];for(let i=lo;i<L;i++)if(ok(i))c.push(i);
  const out=[];for(const x of shuf(r,c)){if(out.length>=nb)break;if(out.every(b=>Math.abs(b-x)>=2))out.push(x);}
  if(!out.length)out.push(c[c.length-1]);
  return out.sort((a,b)=>a-b);
}
function intChoices(r,ans,dis,total,min,max){
  const s=[];const add=v=>{if(Number.isInteger(v)&&v>=min&&v<=max&&!s.includes(v))s.push(v);};
  ans.forEach(add);
  for(const d of shuf(r,dis)){if(s.length>=total)break;add(d);}
  for(let k=1;s.length<total&&k<300;k++){add(ans[0]+k);if(s.length<total)add(ans[0]-k);}
  return shuf(r,s);
}
function symChoices(r,seq,extraPool,D){
  const m=new Map();seq.forEach(t=>{if(t.t!=='sep')m.set(key(t),t);}); // every symbol that appears in the question
  const want=Math.min(8,m.size+Math.max(extraChoices(D),3-m.size));
  for(const t of extraPool){if(m.size>=want)break;if(!m.has(key(t)))m.set(key(t),t);}
  return shuf(r,[...m.values()]);
}

// ════════════════ REPEATING PATTERNS ════════════════
const T_EASY=[[0,1],[0,0,1],[0,1,1]];
const T_MID=[[0,1,2],[0,0,1,1],[0,1,1,0],[0,0,0,1],[0,1,0,2],[0,0,1,2],[0,1,2,2],[0,1,2,1],[0,1,1,2]];
function canon(t){const m={};let k=0;return t.map(x=>(x in m)?m[x]:(m[x]=k++));}
function isPrim(t){const p=t.length;for(let d=1;d<p;d++){if(p%d)continue;let same=true;for(let i=0;i<p;i++)if(t[i]!==t[i%d]){same=false;break;}if(same)return false;}return true;}
function genTemplate(r,D,sCap,pLim){
  const fit=a=>a.filter(t=>Math.max(...t)<sCap&&t.length<=pLim);
  if(D<1)return pick(r,fit(T_EASY));
  if(D<3){const l=fit(T_EASY.concat(T_MID.slice(0,D<2?4:T_MID.length)));return pick(r,l);}
  const pMax=Math.min(10,pLim,4+Math.floor((D-3)/1.3));
  const sMax=Math.min(sCap,7,3+Math.floor((D-3)/2));
  for(let k=0;k<400;k++){
    const p=ri(r,Math.max(3,pMax-3),pMax),s=ri(r,2,Math.min(sMax,p));
    const t=[];for(let i=0;i<p;i++)t.push(ri(r,0,s-1));
    const c=canon(t);if(new Set(c).size===s&&isPrim(c))return c;
  }
  return [0,1,2];
}
function genRepeat(r,D,alphabet,sCap,keepOrder){
  const last=forceLast(D),nb=last?1:numBlanks(D);
  const pLim=Math.max(2,Math.floor((maxLen(D)-(2*nb-1))/2));
  const t=genTemplate(r,D,Math.min(sCap,alphabet.length),pLim);
  const p=t.length,s=Math.max(...t)+1,ctx=2*p;          // two full periods always visible first
  const al=keepOrder?shuf(r,alphabet.slice(0,s)).concat(alphabet.slice(s)):shuf(r,alphabet);
  const sym=al.slice(0,s),L=lenFor(ctx,nb,D);
  const seq=[];for(let i=0;i<L;i++)seq.push(sym[t[i%p]]);
  const blanks=placeBlanks(r,seq,ctx,nb,last);
  return{seq,blanks,ctx,choices:symChoices(r,seq,al.slice(s),D),meta:{t,p}};
}

// ════════════════ COUNTING GROUPS ════════════════
function genGroups(r,D){
  const e=pick(r,pick(r,POOLS)),maxC=D<1?5:D<2?6:D<4?8:10;
  const last=forceLast(D),nb=last?1:Math.min(2,numBlanks(D));
  let step=D<2?1:pick(r,[1,1,2]);const desc=D>=1.5&&r()<0.35,ctx=3;
  let L=Math.min(7,lenFor(ctx,nb,D,7));
  while(L>ctx+1&&(L-1)*step>maxC-1)L--;
  if((L-1)*step>maxC-1)step=1;
  const start=D<1?1:ri(r,1,maxC-(L-1)*step);
  let c=[];for(let i=0;i<L;i++)c.push(start+i*step);if(desc)c.reverse();
  const seq=c.map(n=>G(e,n)),blanks=placeBlanks(r,seq,ctx,nb,last),ans=blanks.map(i=>c[i]);
  const dis=[];ans.forEach(a=>dis.push(a+1,a-1,a+2,a-2));
  const ch=intChoices(r,ans,dis,Math.max(ans.length+2,D<2?3:4),1,maxC+2).map(n=>G(e,n));
  return{seq,blanks,ctx,choices:ch,meta:{arith:c}};
}

// ════════════════ NUMBER RULES ════════════════
function numResult(r,v,ctx,D,blanks,disFn){
  const ans=blanks.map(i=>v[i]);const dis=[];blanks.forEach(i=>dis.push(...disFn(i)));
  return{seq:v.map(N),blanks,ctx,choices:intChoices(r,ans,dis,Math.max(numTotal(D),ans.length+2),1,1e6).map(N),meta:{v}};
}
function genCountNum(r,D){
  const last=forceLast(D),nb=last?1:numBlanks(D);let step,start,desc=false;
  if(D<1){step=1;start=1;}
  else if(D<2){step=1;start=ri(r,1,10);}
  else if(D<3.5){step=pick(r,[1,2,2,5,10]);start=step===1?ri(r,1,15):step*ri(r,1,4);desc=r()<0.3;}
  else{step=ri(r,2,Math.min(15,2+Math.floor(D)));start=ri(r,1,Math.min(99,5*Math.ceil(D)));desc=r()<0.4;}
  const ctx=3,L=lenFor(ctx,nb,D);let v=[];for(let i=0;i<L;i++)v.push(start+i*step);if(desc)v.reverse();
  const seq=v.map(N),blanks=placeBlanks(r,seq,ctx,nb,last);
  return numResult(r,v,ctx,D,blanks,i=>[v[i]+1,v[i]-1,v[i]+step,v[i]-step,v[i]+2*step]);
}
function genLetters(r,D){
  const nb=numBlanks(D),step=D<4.5?pick(r,[1,2]):pick(r,[1,2,3,4]),ctx=3;
  const L=Math.min(lenFor(ctx,nb,D),Math.floor(25/step)+1);
  const st=ri(r,0,25-(L-1)*step),desc=D>=5&&r()<0.3;
  let v=[];for(let i=0;i<L;i++)v.push(st+i*step);if(desc)v.reverse();
  const seq=v.map(i=>Lt(ABC[i])),blanks=placeBlanks(r,seq,ctx,nb,false),ans=blanks.map(i=>v[i]);
  const dis=[];ans.forEach(a=>dis.push(a+1,a-1,a+step,a-step,a+step+1));
  const ch=intChoices(r,ans,dis,Math.max(numTotal(D),ans.length+2),0,25).map(i=>Lt(ABC[i]));
  return{seq,blanks,ctx,choices:ch,meta:{v,letters:true}};
}
function genDiffPat(r,D){
  const nb=numBlanks(D),a=ri(r,2,3+Math.floor(D/3));let b=ri(r,1,a-1);if(r()<0.5)b=-b;
  const d=r()<0.5?[a,b]:[b,a],ctx=5,L=lenFor(ctx,nb,D);
  let v=[0];for(let i=1;i<L;i++)v.push(v[i-1]+d[(i-1)%2]);
  const mn=Math.min(...v),sh=ri(r,1,10)-mn;v=v.map(x=>x+sh);
  const blanks=placeBlanks(r,v.map(N),ctx,nb,false);
  return numResult(r,v,ctx,D,blanks,i=>[v[i-1]+d[i%2],v[i]+1,v[i]-1,v[i-1]+d[0]+d[1]]);
}
function genSecondDiff(r,D){
  const nb=numBlanks(D),c=D<8?pick(r,[1,2]):pick(r,[1,2,3]),d0=ri(r,1,3),ctx=4,L=lenFor(ctx,nb,D);
  const v=[ri(r,1,6)];for(let i=1;i<L;i++)v.push(v[i-1]+d0+c*(i-1));
  const blanks=placeBlanks(r,v.map(N),ctx,nb,false);
  return numResult(r,v,ctx,D,blanks,i=>[v[i-1]+(v[i-1]-v[i-2]),v[i]+1,v[i]-1,v[i]+c]);
}
function genGeometric(r,D){
  const nb=numBlanks(D),ratio=D<7?2:pick(r,[2,3]),a0=ratio===2?ri(r,1,5):ri(r,1,3),ctx=4;
  let L=lenFor(ctx,nb,D);while(L>ctx+1&&a0*Math.pow(ratio,L-1)>100000)L--;
  const v=[];for(let i=0;i<L;i++)v.push(a0*Math.pow(ratio,i));
  const blanks=placeBlanks(r,v.map(N),ctx,nb,false);
  return numResult(r,v,ctx,D,blanks,i=>[v[i-1]+(v[i-1]-v[i-2]),v[i]-1,v[i]+ratio,v[i-1]*(ratio+1),v[i]+v[i-1]]);
}
function genInterleave(r,D){
  const nb=numBlanks(D),ctx=6,L=lenFor(ctx,nb,D);
  const a0=ri(r,1,9),s1=ri(r,1,3),s2=pick(r,[2,5,10,-1,-2]);
  const b0=Math.max(ri(r,10,40),Math.ceil(L/2)*Math.abs(s2)+5);
  const v=[];for(let i=0;i<L;i++)v.push(i%2===0?a0+(i/2)*s1:b0+((i-1)/2)*s2);
  const blanks=placeBlanks(r,v.map(N),ctx,nb,false);
  return numResult(r,v,ctx,D,blanks,i=>[v[i]+1,v[i]-1,v[i]+s1,v[i]-s1,v[i]+s2,v[i-1]]);
}
function genSquares(r,D){
  const nb=numBlanks(D),n0=ri(r,1,3+Math.floor(D/3)),ctx=4,L=Math.min(lenFor(ctx,nb,D),16);
  const v=[];for(let i=0;i<L;i++)v.push((n0+i)*(n0+i));
  const blanks=placeBlanks(r,v.map(N),ctx,nb,false);
  return numResult(r,v,ctx,D,blanks,i=>[v[i-1]+(v[i-1]-v[i-2]),v[i]+1,v[i]-1,(n0+i)*2,v[i]+2*(n0+i)]);
}
function genFibo(r,D){
  const nb=numBlanks(D),st=pick(r,[[1,1],[1,2],[2,2],[1,3],[2,3],[3,4],[2,5],[3,3]]),ctx=5;
  let L=lenFor(ctx,nb,D);const v=st.slice();while(v.length<L)v.push(v[v.length-1]+v[v.length-2]);
  while(v.length>ctx+1&&v[v.length-1]>100000)v.pop();
  const blanks=placeBlanks(r,v.map(N),ctx,nb,false);
  return numResult(r,v,ctx,D,blanks,i=>[v[i-1]*2,v[i]+1,v[i]-1,v[i-1]+(v[i-1]-v[i-2])]);
}

// ════════════════ CYCLES / MIRROR / MIXED ════════════════
function genCycle(r,D){
  const cy=pick(r,CYCLES),n=cy.length,last=D<2.5,nb=last?1:Math.min(2,numBlanks(D));
  let k=D<3?1:pick(r,D<5?[1,1,2]:[1,2,3]);if(n===8&&k===4)k=3;
  const dir=D<3?1:(r()<0.3?-1:1),ctx=3,L=Math.min(8,lenFor(ctx,nb,D,8)),st=ri(r,0,n-1);
  const idx=i=>((st+dir*k*i)%n+n)%n,seq=[];for(let i=0;i<L;i++)seq.push(E(cy[idx(i)]));
  const blanks=placeBlanks(r,seq,ctx,nb,last);
  const m=new Map();seq.forEach(t=>m.set(key(t),t));
  const tot=Math.min(8,Math.max(m.size,numTotal(D)+1)),nb2=[];
  blanks.forEach(b=>{const j=idx(b);nb2.push(cy[(j+1)%n],cy[(j-1+n)%n],cy[(j+2)%n]);});
  for(const e of shuf(r,nb2)){if(m.size>=tot)break;m.set(key(E(e)),E(e));}
  return{seq,blanks,ctx,choices:shuf(r,[...m.values()]),meta:{cy,k,dir,st}};
}
function genMirror(r,D){
  const pool=shuf(r,pick(r,POOLS)),n=Math.min(8,3+Math.floor(Math.max(0,D-2)/1.5));
  const s=Math.min(n,6,3+Math.floor(Math.max(0,D-2)/2)),sym=pool.slice(0,s);
  let left=sym.slice();while(left.length<n)left.push(pick(r,sym));left=shuf(r,left);
  const seq=left.map(E).concat([SEP],left.slice().reverse().map(E));
  const blanks=placeBlanks(r,seq,n+1,Math.min(numBlanks(D),Math.ceil(n/2)),false);
  return{seq,blanks,ctx:n+1,choices:symChoices(r,seq,pool.slice(s).map(E),D),meta:{n}};
}
function genMixed(r,D){
  const pool=shuf(r,pick(r,POOLS)),t=D<5?[0,1]:pick(r,[[0,1],[0,0,1],[0,1,1],[0,1,2]]);
  const p=t.length,s=Math.max(...t)+1,sym=pool.slice(0,s),st=ri(r,1,9),step=D<6?pick(r,[1,2]):pick(r,[1,2,3,5]);
  const ctx=2*Math.max(2*p,3),nb=Math.min(numBlanks(D),2),L=lenFor(ctx,nb,D,maxLen(D)+2);
  const seq=[];for(let i=0;i<L;i++)seq.push(i%2===0?E(sym[t[(i/2)%p]]):N(st+((i-1)/2)*step));
  const blanks=placeBlanks(r,seq,ctx,nb,false);
  const m=new Map();sym.forEach(e=>m.set(key(E(e)),E(e)));
  const numAns=blanks.filter(i=>i%2===1).map(i=>seq[i].v);
  const lastNum=seq.filter(x=>x.t==='n').pop().v;
  const ns=new Set(numAns),dis=shuf(r,numAns.length?numAns.flatMap(a=>[a+1,a-1,a+step,a-step]):[lastNum+step,lastNum+step+1,lastNum+1]);
  for(const d of dis){if(ns.size>=numAns.length+2)break;if(d>0)ns.add(d);}
  [...ns].forEach(v=>m.set(key(N(v)),N(v)));
  return{seq,blanks,ctx,choices:shuf(r,[...m.values()]),meta:{t,p,st,step}};
}

// ════════════════ PUZZLE TYPES ════════════════
const TYPES=[
  {id:'repEmoji',min:0,max:99,g:(r,D)=>genRepeat(r,D,pick(r,POOLS).map(E),8)},
  {id:'repColor',min:0,max:6,g:(r,D)=>genRepeat(r,D,COLORS.map(E),8)},
  {id:'repSize',min:0,max:4,g:(r,D)=>{const e=pick(r,SIZE_EMOJI);return genRepeat(r,D,[Sz(e,0),Sz(e,2),Sz(e,1)],3,true);}},
  {id:'groups',min:0,max:7,g:genGroups},
  {id:'countNum',min:0.5,max:99,g:genCountNum},
  {id:'repShape',min:0.8,max:99,g:(r,D)=>genRepeat(r,D,SHAPES.map(E),8)},
  {id:'cycle',min:1.5,max:99,g:genCycle},
  {id:'repNum',min:1.5,max:99,g:(r,D)=>genRepeat(r,D,[1,2,3,4,5,6,7,8,9].map(N),9)},
  {id:'mirror',min:2,max:99,g:genMirror},
  {id:'letters',min:3,max:99,g:genLetters},
  {id:'mixed',min:3.5,max:99,g:genMixed},
  {id:'diffPat',min:4.5,max:99,g:genDiffPat},
  {id:'secondDiff',min:5,max:99,g:genSecondDiff},
  {id:'geometric',min:5,max:99,g:genGeometric},
  {id:'interleave',min:5.5,max:99,g:genInterleave},
  {id:'squares',min:6,max:99,g:genSquares},
  {id:'fibo',min:6.5,max:99,g:genFibo}
];
const Q_PER_LEVEL=5;
// Each level has a fixed, deterministic list of puzzle types (no repeats inside a level when possible).
function levelTypes(age,level){
  const D=getD(age,level),el=TYPES.filter(t=>D>=t.min&&D<t.max).map(t=>t.id);
  const order=shuf(mkRand(hashSeed(age,level,777)),el);
  const fresh=order.filter(id=>{const t=TYPES.find(x=>x.id===id);return t.min>0&&t.min>D-0.5;}); // newly unlocked → shown first
  return fresh.concat(order.filter(id=>!fresh.includes(id)));
}
function genQuestion(age,level,q){
  const D=getD(age,level),order=levelTypes(age,level),type=order[q%order.length];
  const r=mkRand(hashSeed(age,level,q,4242));
  const Q=TYPES.find(t=>t.id===type).g(r,D);
  Q.type=type;Q.D=D;Q.answers=Q.blanks.map(i=>Q.seq[i]);
  return Q;
}

const PROMPTS={
 en:{rep:'🔁 Find the repeating pattern',groups:'🔢 Count them! What comes next?',countNum:'➕ Find the number rule',cycle:'🔄 Watch how it turns',mirror:"🪞 It's a mirror!",letters:'🔤 Follow the alphabet',mixed:'🔀 Two patterns mixed together',diffPat:'↕️ Look at the jumps',secondDiff:'📈 The jumps keep growing',geometric:'✖️ Each number multiplies',interleave:'👯 Two number rows take turns',squares:'⬛ Special numbers: n × n',fibo:'🌀 Add the two before'},
 es:{rep:'🔁 Encuentra el patrón que se repite',groups:'🔢 ¡Cuenta! ¿Qué viene después?',countNum:'➕ Descubre la regla de los números',cycle:'🔄 Mira cómo va girando',mirror:'🪞 ¡Es un espejo!',letters:'🔤 Sigue el abecedario',mixed:'🔀 Dos patrones mezclados',diffPat:'↕️ Fíjate en los saltos',secondDiff:'📈 Los saltos van creciendo',geometric:'✖️ Cada número se multiplica',interleave:'👯 Dos filas de números se turnan',squares:'⬛ Números especiales: n × n',fibo:'🌀 Suma los dos anteriores'},
 fr:{rep:'🔁 Trouve le motif qui se répète',groups:'🔢 Compte ! Et ensuite ?',countNum:'➕ Trouve la règle des nombres',cycle:'🔄 Regarde comment ça tourne',mirror:"🪞 C'est un miroir !",letters:"🔤 Suis l'alphabet",mixed:'🔀 Deux motifs mélangés',diffPat:'↕️ Regarde les sauts',secondDiff:'📈 Les sauts grandissent',geometric:'✖️ Chaque nombre se multiplie',interleave:'👯 Deux suites à tour de rôle',squares:'⬛ Nombres spéciaux : n × n',fibo:'🌀 Additionne les deux précédents'}};
const PICK={en:'Tap the missing piece',es:'Toca la pieza que falta',fr:'Touche la pièce manquante'};
function tokEl(doc,tok){
  const el=doc.createElement('div');el.className='tok';
  if(tok.t==='e'){el.textContent=tok.v;}
  else if(tok.t==='n'||tok.t==='l'){el.classList.add(tok.t==='n'?'num':'let');const d=String(tok.v).length;el.style.setProperty('--nf',d<=2?.5:d===3?.42:d===4?.34:d===5?.28:.24);el.textContent=tok.v;}
  else if(tok.t==='s'){const sp=doc.createElement('span');sp.className='sz'+tok.s;sp.textContent=tok.e;el.appendChild(sp);}
  else if(tok.t==='g'){el.classList.add('grp');const n=tok.n,gc=n<=3?n:n===4?2:n<=9?3:4,rows=Math.ceil(n/gc);const gi=doc.createElement('div');gi.className='gin';
    gi.style.setProperty('--gc',gc);gi.style.setProperty('--gf',Math.min(.55,.86/Math.max(gc,rows)));for(let i=0;i<n;i++){const s=doc.createElement('span');s.textContent=tok.e;gi.appendChild(s);}el.appendChild(gi);}
  return el;
}
let cur=null,seqBox=null,chBox=null;
function layout(){
  if(!cur||!seqBox)return;const w=seqBox.clientWidth||320;
  const items=cur.seq.filter(t=>t.t!=='sep').length+(cur.seq.some(t=>t.t==='sep')?.5:0);
  const wide=cur.seq.some(t=>(t.t==='g'&&t.n>4)||(t.t==='n'&&String(t.v).length>3));
  const per=Math.min(Math.ceil(items),Math.max(4,Math.floor(w/(wide?62:46))));
  seqBox.style.setProperty('--ts',Math.max(30,Math.min(64,Math.floor((w-6*(per-1))/per/(wide?1.25:1))))+'px');
  const cols=parseInt(chBox.style.getPropertyValue('--cols'))||4,cw=(chBox.clientWidth-10*(cols-1))/cols;
  const ls=innerWidth>innerHeight&&innerHeight<540;
  chBox.style.setProperty('--ts',Math.max(30,Math.min(92,Math.floor(cw*.8),Math.floor(cw/(ls?1.4:1)*.78)))+'px');
}
window.addEventListener('resize',layout);
H.start(window,{id:'secuencias',mode:'rounds',css:`
.seq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;--ts:56px;padding:4px 0}
.tok{width:var(--ts);height:var(--ts);flex-shrink:0;border-radius:calc(var(--ts)*.28);display:flex;align-items:center;justify-content:center;font-size:calc(var(--ts)*.6);line-height:1;background:linear-gradient(145deg,#fff,#f4eeff);box-shadow:0 3px 10px rgba(45,42,74,.1),inset 0 1px 0 #fff;animation:tokIn .35s backwards cubic-bezier(.34,1.56,.64,1)}
@keyframes tokIn{from{transform:scale(.4);opacity:0}}
.tok.num,.tok.let{font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;color:#5b3fd1;font-size:calc(var(--ts)*var(--nf,.5));width:auto;min-width:var(--ts);padding:0 calc(var(--ts)*.14)}
.tok.let{color:#e2457e}
.tok.grp{width:auto;min-width:var(--ts);padding:calc(var(--ts)*.08)}
.gin{display:grid;grid-template-columns:repeat(var(--gc),auto);gap:1px;font-size:calc(var(--ts)*var(--gf));line-height:1;justify-content:center}
.sz0{font-size:calc(var(--ts)*.28)}.sz1{font-size:calc(var(--ts)*.5)}.sz2{font-size:calc(var(--ts)*.8)}
.tok.blank{background:repeating-linear-gradient(45deg,#f6efff,#f6efff 6px,#fdf4ff 6px,#fdf4ff 12px);border:2.5px dashed var(--lilac);box-shadow:none;color:var(--lilac);font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:calc(var(--ts)*.45)}
.tok.blank.active{border:3px solid var(--purple);color:var(--purple);animation:glow 1.3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(155,92,255,.45);transform:scale(1)}50%{box-shadow:0 0 0 7px rgba(155,92,255,0);transform:scale(1.07)}}
.tok.filled{background:linear-gradient(145deg,#e9fff1,#cdf7dd);box-shadow:0 0 0 2.5px var(--green);animation:fillPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes fillPop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:none}}
.sep{width:6px;height:calc(var(--ts)*1.1);border-radius:6px;background:linear-gradient(var(--lilac),var(--sky));box-shadow:0 0 12px rgba(155,92,255,.5);flex-shrink:0;margin:0 4px}
.chl{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:#aaa;font-weight:900;text-align:center}
.k-choices{--ts:60px}.k-choice{aspect-ratio:1;padding:4px}
@media (orientation:landscape) and (max-height:540px){.k-choice{aspect-ratio:1.4}}.k-choice .tok{background:none;box-shadow:none;animation:none}
`,
  timer:D=>levelTime(D),
  round(g){
    const Q=cur=genQuestion(g.age,g.level,g.q);let ptr=0;
    const k=Q.type.startsWith('rep')?'rep':Q.type;g.prompt(g.t(PROMPTS)[k]);
    seqBox=g.el('div','seq',null,g.stage);
    Q.seq.forEach((tok,i)=>{
      if(tok.t==='sep'){g.el('div','sep',null,seqBox);return;}
      const bi=Q.blanks.indexOf(i);let el;
      if(bi>=0){el=g.el('div','tok blank'+(bi===0?' active':''),'?');}else el=tokEl(g.doc,tok);
      el.dataset.i=i;el.style.animationDelay=(i*.03)+'s';seqBox.appendChild(el);
    });
    g.el('div','chl',g.t(PICK),g.stage);
    const n=Q.choices.length;
    chBox=g.choices(Q.choices,(tok,b)=>b.appendChild(tokEl(g.doc,tok)),(tok,b)=>{
      const want=Q.answers[ptr];
      if(key(tok)!==key(want)){g.bad(b);return;}
      const idx=Q.blanks[ptr],old=seqBox.querySelector(`[data-i="${idx}"]`),el=tokEl(g.doc,want);
      el.classList.add('filled');el.dataset.i=idx;old.replaceWith(el);ptr++;g.unlockChoices(chBox);
      b.classList.add('k-right');setTimeout(()=>b.classList.remove('k-right'),350);
      if(ptr>=Q.answers.length){g.fx.stars(b);g.solved();}
      else{g.good(b);const nx=seqBox.querySelector(`[data-i="${Q.blanks[ptr]}"]`);if(nx)nx.classList.add('active');}
    },n<=4?n:n<=6?3:4);
    g.win.requestAnimationFrame(layout);
  }
});
}
</script></body></html>
