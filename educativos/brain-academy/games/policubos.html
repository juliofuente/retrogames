<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cube Towers</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {ri,pick,intChoices}=H.U;
const TX={es:{q:'🧊 ¿Cuántos cubos hay en la construcción?',tip:'Los cubos no flotan: si ves uno arriba, tiene cubos debajo.'},en:{q:'🧊 How many cubes are in the building?',tip:"Cubes don't float: if you see one on top, there are cubes under it."},fr:{q:'🧊 Combien de cubes y a-t-il dans la construction ?',tip:'Les cubes ne flottent pas : si tu en vois un en haut, il y en a dessous.'}};
const COL=['#ff6b9d','#4fb8ff','#3cc36e','#ffd93d','#9b5cff','#ff9f43'];
// Heights grid h[row][col]; row 0 is the front. Each row behind is STRICTLY taller in every column,
// so every stack shows its top: the total is fully determined (hidden cubes are under visible ones).
function gen(r,D){
  const rows=D<4?1:D<6.5?2:3,cols=D<1?2:D<2.5?3:D<5?ri(r,3,4):ri(r,3,5),maxF=D<1?2:D<2.5?3:4;
  const h=[];for(let y=0;y<rows;y++){h.push([]);for(let x=0;x<cols;x++){const below=y?h[y-1][x]:0;h[y].push(below+ri(r,1,y?2:maxF));}}
  const ans=h.flat().reduce((a,b)=>a+b,0),front=h[0].reduce((a,b)=>a+b,0);
  return{h,rows,cols,ans,color:pick(r,COL),choices:intChoices(r,[ans],[ans+1,ans-1,ans+2,front,h.flat().length],D<1?3:4,1)};
}
function draw(g,P){
  const doc=g.doc,NS='http://www.w3.org/2000/svg',s=40,dx=s*.5,dy=s*.5;
  const maxH=Math.max(...P.h.flat()),W=P.cols*s+P.rows*dx+20,Hh=maxH*s+P.rows*dy+20;
  const svg=doc.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${Hh}`);svg.style.cssText='display:block;margin:0 auto;width:min(100%,360px);max-height:46vh';
  const poly=(pts,fill)=>{const p=doc.createElementNS(NS,'polygon');p.setAttribute('points',pts.map(q=>q.join(',')).join(' '));p.setAttribute('fill',fill);p.setAttribute('stroke','#2d2a4a');p.setAttribute('stroke-width','1.6');p.setAttribute('stroke-linejoin','round');svg.appendChild(p);};
  const light=hex=>{const n=parseInt(hex.slice(1),16);return`rgb(${[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(255-v)*.45))})`;};
  const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.round(v*f));return`rgb(${c})`;};
  // back rows first, left to right, bottom to top (cabinet projection: depth goes up-right)
  for(let y=P.rows-1;y>=0;y--)for(let x=0;x<P.cols;x++)for(let z=0;z<P.h[y][x];z++){
    const X=10+x*s+y*dx,Y=Hh-10-(z+1)*s-y*dy;
    poly([[X,Y],[X+s,Y],[X+s,Y+s],[X,Y+s]],P.color);
    poly([[X,Y],[X+dx,Y-dy],[X+s+dx,Y-dy],[X+s,Y]],light(P.color));
    poly([[X+s,Y],[X+s+dx,Y-dy],[X+s+dx,Y+s-dy],[X+s,Y+s]],shade(P.color,.72));
  }
  return svg;
}
const css=`.tip{text-align:center;font-weight:800;color:var(--mid);font-size:.85rem}.k-choice{font-size:clamp(1.4rem,6vmin,2rem)}`;
H.start(window,{id:'policubos',mode:'rounds',css,
  timer:D=>D<2?null:Math.max(15,Math.round(55*Math.pow(.92,D))),
  round(g){
    const P=gen(g.r,g.D),L=TX[g.lang]||TX.es;g.prompt(L.q);g.stage.appendChild(draw(g,P));if(P.rows>1)g.el('div','tip',L.tip,g.stage);
    g.choices(P.choices,(n,b)=>{b.textContent=n;},(n,b)=>{if(n===P.ans){b.classList.add('k-right');g.fx.stars(b);g.solved();}else g.bad(b);},P.choices.length);
  }
});
}
</script></body></html>
