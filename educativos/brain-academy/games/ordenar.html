<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Order Numbers</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {ri,pick,shuf}=H.U;
const TX={es:{up:'📶 Toca los números de MENOR a MAYOR',down:'📶 Toca los números de MAYOR a MENOR'},en:{up:'📶 Tap the numbers from SMALLEST to BIGGEST',down:'📶 Tap the numbers from BIGGEST to SMALLEST'},fr:{up:'📶 Touche les nombres du PLUS PETIT au PLUS GRAND',down:'📶 Touche les nombres du PLUS GRAND au PLUS PETIT'}};
// Harder levels use "look-alike" numbers (same digits, same tens…) so the child must compare place values.
function gen(r,D){
  const k=D<1?3:D<3?4:D<7?5:6,dir=D>=3&&r()<.4?-1:1,s=new Set();
  let guard=0;while(s.size<k&&guard++<500){let v;
    if(D<1)v=ri(r,1,10);else if(D<3)v=ri(r,1,50);
    else if(D<5){const t=ri(r,1,9);v=r()<.6?t*10+ri(r,0,9):ri(r,1,99);}
    else if(D<7){const h=ri(r,1,9);v=h*100+ri(r,0,99);if(r()<.5)v=Number(String(v).split('').reverse().join(''))||v;}
    else{const base=ri(r,1,9)*1000+ri(r,0,9)*100;const d=shuf(r,[ri(r,0,9),ri(r,0,9)]);v=r()<.5?base+d[0]*10+d[1]:base+d[1]*10+d[0];}
    if(v>0)s.add(v);}
  const nums=[...s],sorted=nums.slice().sort((a,b)=>dir*(a-b));
  return{dir,nums:shuf(r,nums),sorted};
}
const css=`
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sl{min-width:62px;height:50px;border-radius:12px;border:3px dashed var(--lilac);display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:1.3rem;color:var(--lilac);padding:0 8px;position:relative}
.sl+.sl:before{content:attr(data-s);position:absolute;left:-10px;color:#bbb;font-size:.9rem}
.sl.ok{border:3px solid var(--green);background:#e9fff1;color:#1e8a4a;animation:kpop .3s}
.pile{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.nb{min-width:76px;height:64px;padding:0 12px;border-radius:16px;background:linear-gradient(145deg,#fff,#fff0f7);box-shadow:0 4px 12px rgba(45,42,74,.12);font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:clamp(1.25rem,5.5vmin,1.7rem)}
.nb.gone{visibility:hidden}
`;
H.start(window,{id:'ordenar',mode:'rounds',css,
  timer:D=>D<2?null:Math.max(12,Math.round(50*Math.pow(.92,D))),
  round(g){
    const P=gen(g.r,g.D),L=TX[g.lang]||TX.es;g.prompt(P.dir>0?L.up:L.down);
    const sl=g.el('div','slots',null,g.stage),slots=P.sorted.map(()=>{const e=g.el('div','sl','?',sl);e.dataset.s=P.dir>0?'<':'>';return e;});let p=0;
    const pile=g.el('div','pile k-ans',null,g.stage);
    P.nums.forEach(v=>{const b=g.el('button','nb',String(v),pile);b.onclick=()=>{if(g.solvedFlag||g.paused||b.classList.contains('gone'))return;
      if(v!==P.sorted[p]){g.bad(b);setTimeout(()=>{b.classList.remove('k-wrong');b.disabled=false;},450);return;}
      H.SFX.pop();b.classList.add('gone');slots[p].textContent=v;slots[p].classList.add('ok');p++;if(p>=P.sorted.length){g.fx.stars(slots[p-1]);g.solved();}};});
  }
});
}
</script></body></html>
