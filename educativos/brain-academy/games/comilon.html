<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Feed the Muncher</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
</script><script src="abnkit.js?v=5b4ce1457b"></script><script>
if(H){
// Dale de comer: estima dónde está un número en una recta de lo a hi. Se coloca al comilón, cae la comida en el sitio exacto
// y, si cae en su zona, se la come. Cada nivel la zona de la boca es más estrecha (más precisión). Marcas fijas: ¼ ½ ¾ y ⅓ ⅔.
const {ri,pick}=ABN;
const TX={es:{p:n=>`😋 Pon al comilón donde está el <b>${n}</b> y dale de comer`,sub:'Arrástralo por la recta y pulsa «¡A comer!»',btn:'🍽️ ¡A comer!',hit:['¡Ñam, qué rico! 😋','¡Justo en la boca! 🤩','¡Bien apuntado! 😍'],miss:n=>`El ${n} estaba aquí ¡Prueba con otro!`},
          en:{p:n=>`😋 Put the muncher where <b>${n}</b> is and feed it`,sub:'Drag it along the line and press “Feed!”',btn:'🍽️ Feed!',hit:['Yum! 😋','Right in the mouth! 🤩','Nice aim! 😍'],miss:n=>`${n} was here. Try another one!`}};
const FOOD=['🍎','🍌','🍕','🍩','🍪','🍓','🧁','🍉','🥕','🍔','🍇','🥐'];
function range(r,D){
  if(D<1)return{lo:0,hi:10,st:1};
  if(D<2)return{lo:0,hi:20,st:1};
  if(D<3.5)return{lo:0,hi:100,st:5};
  if(D<5)return pick(r,[{lo:0,hi:100,st:1},{lo:0,hi:1000,st:50}]);
  if(D<7)return pick(r,[{lo:0,hi:1000,st:10},{lo:0,hi:200,st:2},{lo:0,hi:500,st:5}]);
  return pick(r,[{lo:0,hi:1000,st:1},{lo:100,hi:600,st:5},{lo:1000,hi:2000,st:10},{lo:0,hi:10000,st:100},{lo:200,hi:700,st:1}]);
}
function target(r,R,D){
  const span=R.hi-R.lo;
  if(D<4&&r()<.3){const f=pick(r,[.25,.5,.75]);return R.lo+Math.round(span*f/R.st)*R.st;}
  for(;;){const v=R.lo+Math.round((span*(.06+r()*.88))/R.st)*R.st;if(v>R.lo&&v<R.hi)return v;}
}
const css=ABN.CSS+`
.feed{width:100%;max-width:680px;max-height:58vh;margin:0 auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:visible}
.feed text{font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;text-anchor:middle;fill:#2d2a4a}
.feed .fr{font-size:52px;fill:#9B5CFF}.feed .fr2{font-size:44px;fill:#b9a7e6}.feed .ends{font-size:58px}
.btnrow{display:flex;justify-content:center}.btnrow .k-btn{font-size:1.25rem}
.sub{text-align:center;color:var(--mid);font-weight:800;font-size:.9rem}
`;
H.start(window,{id:'comilon',mode:'rounds',css,noSplit:true,
  round(g){
    const L=ABN.L(g,TX),R=range(g.r,g.D),NS='http://www.w3.org/2000/svg',doc=g.doc,span=R.hi-R.lo;
    const W=Math.max(.035,.22*Math.pow(.86,g.D))*1000;   // ancho de la zona de la boca (unidades SVG sobre 1000)
    let T=target(g.r,R,g.D),busy=false;
    g.el('div','sub',L.sub,g.stage);
    const svg=doc.createElementNS(NS,'svg');svg.setAttribute('viewBox','-60 0 1120 1100');svg.setAttribute('class','feed');g.stage.appendChild(svg);
    const mk=(t,a,p)=>{const e=doc.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
    const X=v=>(v-R.lo)/span*1000,Y=960;
    mk('line',{x1:0,y1:Y,x2:1000,y2:Y,stroke:'#2d2a4a','stroke-width':9,'stroke-linecap':'round'});
    [[0,R.lo],[1000,R.hi]].forEach(([x,v])=>{mk('line',{x1:x,y1:Y-30,x2:x,y2:Y+30,stroke:'#2d2a4a','stroke-width':8});const t=mk('text',{x,y:Y+90,class:'ends'});t.textContent=v;});
    [[.25,'¼'],[.5,'½'],[.75,'¾']].forEach(([f,s])=>{mk('line',{x1:f*1000,y1:Y-24,x2:f*1000,y2:Y+24,stroke:'#9B5CFF','stroke-width':7});const t=mk('text',{x:f*1000,y:Y+82,class:'fr'});t.textContent=s;});
    [[1/3,'⅓'],[2/3,'⅔']].forEach(([f,s])=>{mk('line',{x1:f*1000,y1:Y-18,x2:f*1000,y2:Y+18,stroke:'#b9a7e6','stroke-width':6,'stroke-dasharray':'6 4'});const t=mk('text',{x:f*1000,y:Y+82,class:'fr2'});t.textContent=s;});
    const mark=mk('g',{});
    const zone=mk('rect',{height:30,rx:15,fill:'#FFD93D','fill-opacity':.55,stroke:'#f0b400','stroke-width':4,'stroke-dasharray':'10 6'});
    const kid=mk('text',{'font-size':110});kid.textContent='😋';
    const shadow=mk('ellipse',{cy:Y-6,rx:0,ry:0,fill:'#2d2a4a',opacity:.18});
    const food=mk('text',{'font-size':90,opacity:0,'dominant-baseline':'central'});
    let px=g.r()<.5?150+g.r()*200:650+g.r()*200;
    const place=x=>{px=Math.max(0,Math.min(1000,x));zone.setAttribute('x',px-W/2);zone.setAttribute('y',Y-36);zone.setAttribute('width',W);
      kid.setAttribute('x',px);kid.setAttribute('y',Y-48);};
    place(px);
    const toX=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse()).x;};
    let drag=false;
    svg.addEventListener('pointerdown',e=>{if(busy||g.solvedFlag||g.paused)return;drag=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}place(toX(e));});
    svg.addEventListener('pointermove',e=>{if(drag&&!busy)place(toX(e));});
    const up=()=>{drag=false;};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
    if(g.win.__feedKey)g.win.removeEventListener('keydown',g.win.__feedKey);
    g.win.__feedKey=e=>{if(busy||g.solvedFlag)return;if(e.key==='ArrowLeft')place(px-10);if(e.key==='ArrowRight')place(px+10);if(e.key===' '){e.preventDefault();btn.click();}};
    g.win.addEventListener('keydown',g.win.__feedKey);
    const wb=g.el('div','btnrow',null,g.stage),btn=g.el('button','k-btn',L.btn,wb);
    const anim=(ms,f)=>new Promise(res=>{const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/ms);f(k);if(k<1)g.win.requestAnimationFrame(step);else res();};g.win.requestAnimationFrame(step);});
    const ask=()=>{g.prompt(L.p(T));mark.innerHTML='';kid.textContent='😋';food.setAttribute('opacity',0);shadow.setAttribute('rx',0);shadow.setAttribute('ry',0);};
    btn.onclick=async()=>{
      if(busy||g.solvedFlag||g.paused)return;busy=true;btn.disabled=true;g.sfx.whoosh&&g.sfx.whoosh();
      const tx=X(T);food.textContent=pick(g.r,FOOD);food.setAttribute('x',tx);food.setAttribute('opacity',1);kid.textContent='😮';
      shadow.setAttribute('cx',tx);if(g.sfx.fall)g.sfx.fall(1.6);
      await anim(1600,k=>{const y=80+(Y-180)*k*k;food.setAttribute('y',y);food.setAttribute('transform',`rotate(${k*900} ${tx} ${y})`);
        shadow.setAttribute('rx',10+45*k);shadow.setAttribute('ry',4+10*k);if(k>.82&&kid.textContent!=='😱'&&Math.abs(px-tx)>W/2)kid.textContent='😱';});
      const hit=Math.abs(px-tx)<=W/2;
      mk('line',{x1:tx,y1:Y-30,x2:tx,y2:Y+30,stroke:hit?'#3CC36E':'#e2345f','stroke-width':6},mark);
      const lb=mk('text',{x:tx,y:Y-170,'font-size':56,fill:hit?'#3CC36E':'#e2345f'},mark);lb.textContent=T;
      if(hit){food.setAttribute('opacity',0);shadow.setAttribute('rx',0);g.sfx.pop&&g.sfx.pop();kid.textContent=pick(g.r,['😍','🤩','😋','🥰']);g.fb(pick(g.r,L.hit),'ok');g.fx.stars(btn);g.solved();}
      else{await anim(220,k=>{const y=Y-100+55*k;food.setAttribute('y',y);food.setAttribute('transform',`rotate(${900+k*60} ${tx} ${y})`);});g.sfx.boom&&g.sfx.boom();shadow.setAttribute('rx',0);kid.textContent=pick(g.r,['😢','🥺','😭']);g.bad(btn);if(g.hearts>0)g.fb(L.miss(T),'bad');
        setTimeout(()=>{if(g.solvedFlag||g.hearts<=0)return;T=target(g.r,R,g.D);ask();btn.disabled=false;btn.classList.remove('k-wrong');busy=false;},1500);}
    };
    ask();
  }
});
}
</script></body></html>
