<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Part of an Amount</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../');}
</script><script src="abnkit.js?v=5b4ce1457b"></script><script>
if(H){
// La parte de una cantidad: la mitad, un tercio, un cuarto, dos tercios, tres cuartos… de N (con los objetos agrupados).
const {ri,pick}=ABN;
const FR=[[1,2],[1,3],[1,4],[1,5],[2,3],[3,4],[2,5],[3,5],[1,10],[3,10]];
const TX={es:{name:(a,b)=>({'1/2':'la mitad','1/3':'un tercio','1/4':'un cuarto','1/5':'un quinto','2/3':'dos tercios','3/4':'tres cuartos','2/5':'dos quintos','3/5':'tres quintos','1/10':'un décimo','3/10':'tres décimos'})[a+'/'+b],
            q:(f,n)=>`🍕 ¿Cuánto es <b>${f}</b> de <b>${n}</b>?`,tip:(b)=>`Haz ${b} grupos iguales`},
          en:{name:(a,b)=>({'1/2':'half','1/3':'a third','1/4':'a quarter','1/5':'a fifth','2/3':'two thirds','3/4':'three quarters','2/5':'two fifths','3/5':'three fifths','1/10':'a tenth','3/10':'three tenths'})[a+'/'+b],
            q:(f,n)=>`🍕 What is <b>${f}</b> of <b>${n}</b>?`,tip:(b)=>`Make ${b} equal groups`}};
const css=ABN.CSS+`.groups{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:540px;margin:0 auto}.groups span{background:#fff;border-radius:12px;padding:4px 7px;font-size:clamp(1.3rem,6vmin,1.9rem);box-shadow:0 2px 6px rgba(45,42,74,.08)}
.groups span.on{background:#c9f7d5}.hint{text-align:center;color:var(--mid);font-weight:800}`;
H.start(window,{id:'fraccion',mode:'rounds',css,
  timer:D=>Math.max(20,Math.round(55*Math.pow(.93,D))),
  round(g){
    const L=ABN.L(g,TX),r=g.r,D=g.D,[a,b]=pick(r,D<3?[[1,2]]:D<5?FR.slice(0,3):D<7?FR.slice(0,8):FR),
      unit=D<3?ri(r,1,10):D<5?ri(r,2,10):D<7?ri(r,3,20):ri(r,5,120),n=b*unit,ans=a*unit,e=pick(r,['🍎','🍬','⭐','🐟','🍓','🎈']);
    g.prompt(L.q(L.name(a,b),n));g.el('div','hint',L.tip(b),g.stage);
    let gs=null;if(n<=40){gs=g.el('div','groups',null,g.stage);for(let i=0;i<b;i++)g.el('span',null,e.repeat(unit),gs);}
    ABN.ask(g,ans,[unit,n-ans,ans+unit,ans+1,ans-1,Math.floor(n/a),n/2|0],()=>{if(gs)[...gs.children].slice(0,a).forEach(x=>x.classList.add('on'));});
  }
});
}
</script></body></html>
