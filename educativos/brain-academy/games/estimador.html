<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quick Estimator</title></head>
<body><script>
const H=window.parent&&window.parent!==window?window.parent.Hub:null;
if(!H){location.replace('../index.html');}
else{
const {ri,pick,shuf,intChoices}=H.U;
const EMO=['🐜','🐞','⭐','🍓','🐟','🎈','🍬','🐥','🌸','🍪','🦋','🫐'];
const TX={es:{look:'👀 ¡Mira rápido! ¿Cuántos hay?',exact:'¿Cuántos había?',est:'¿Más o menos cuántos había?',ready:'Prepárate…',was:n=>`Había ${n}`},
          en:{look:'👀 Look fast! How many are there?',exact:'How many were there?',est:'About how many were there?',ready:'Get ready…',was:n=>`There were ${n}`},
          fr:{look:'👀 Regarde vite ! Combien y en a-t-il ?',exact:"Combien y en avait-il ?",est:"Environ combien y en avait-il ?",ready:'Prépare-toi…',was:n=>`Il y en avait ${n}`}};
// Exact counting for the youngest, true estimation later: the options are spaced far apart and the
// real amount is always exactly one of them, so there is a single right answer.
function gen(r,D){
  const e=pick(r,EMO);
  if(D<1){const n=ri(r,1,5);return{e,n,exact:true,ms:2600,choices:intChoices(r,[n],[n+1,n-1,n+2],3,1)};}
  if(D<2.5){const n=ri(r,3,10);return{e,n,exact:true,ms:Math.round(2300-D*200),choices:intChoices(r,[n],[n+1,n-1,n+2,n-2],3,1)};}
  const sets=D<4?[[5,10,20,40],[4,8,16,32],[6,12,24,48]]:D<6?[[10,20,40,80],[15,30,60,120],[12,25,50,100]]:[[20,30,45,70],[25,40,60,90],[30,45,70,105],[40,60,90,135]];
  const S=pick(r,sets),n=pick(r,S);
  return{e,n,exact:false,ms:Math.max(700,Math.round(1700-D*90)),choices:shuf(r,S)};
}
function layout(r,n){ // non-overlapping jittered grid positions in %
  const cols=Math.ceil(Math.sqrt(n*1.6)),rows=Math.ceil(n/cols),cells=shuf(r,[...Array(cols*rows).keys()]).slice(0,n);
  return cells.map(i=>({x:((i%cols)+.5+(r()-.5)*.55)*100/cols,y:(Math.floor(i/cols)+.5+(r()-.5)*.55)*100/rows,rot:ri(r,-25,25)}));
}
const css=`
.field{position:relative;height:min(46vh,300px);min-height:150px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#fff,#eef6ff);box-shadow:inset 0 0 0 3px #dbe9ff;overflow:hidden}
.it{position:absolute;transform:translate(-50%,-50%);line-height:1}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',ui-rounded,'Nunito',system-ui,sans-serif;font-size:2.6rem;color:var(--purple);background:#f6f2ff}
.k-choice{font-size:clamp(1.4rem,6vmin,2rem)}
`;
H.start(window,{id:'estimador',mode:'rounds',css,
  round(g){
    const P=gen(g.r,g.D),L=TX[g.lang]||TX.es;g.prompt(L.look);
    const f=g.el('div','field',null,g.stage),size=P.n<=10?2.4:P.n<=25?1.7:P.n<=50?1.3:P.n<=90?1.05:.85;
    const cover=g.el('div','cover',L.ready,f);let c=3;
    const box=g.el('div','k-ans',null,g.stage);
    const tick=()=>{if(c>0){cover.textContent=c;H.SFX.tick();c--;setTimeout(tick,400);return;}
      cover.remove();layout(g.r,P.n).forEach(p=>{const s=g.el('span','it',P.e,f);s.style.cssText=`left:${p.x}%;top:${p.y}%;font-size:${size}rem;transform:translate(-50%,-50%) rotate(${p.rot}deg)`;});
      setTimeout(()=>{f.innerHTML='';const cv=g.el('div','cover','🙈',f);g.prompt(P.exact?L.exact:L.est);
        g.choices(P.choices,(n,b)=>{b.textContent=(P.exact?'':'~')+n;},(n,b)=>{
          if(n===P.n){cv.textContent=L.was(P.n);b.classList.add('k-right');g.fx.stars(b);g.solved();}else g.bad(b);},P.choices.length,box);},P.ms);};
    setTimeout(tick,300);
  }
});
}
</script></body></html>
