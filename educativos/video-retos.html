<script>
/* Vídeos de retos educativos para ArcadeRecorder (herramientas/grabador --puzles <pack>): pregunta, cuenta atrás,
   respuesta y explicación, en vertical u horizontal. Todo se pinta en función del tiempo t (determinista: el reto N
   de un pack siempre sale igual) y window.arcadeRec.step(n) avanza n fotogramas.
   URL: video-retos.html?pack=<pack>&rec=1&quiz=N&lang=es|en&fps=30
     pack: secuencias · policubos · quienfue · escondido · alien · intrusa · relampago · problemas (solo es) · emojimates · calculo · balanza · ortografia (es) · spelling (en) · ingles (es)
     set=1 (una pregunta) · set=5 (cinco, de fácil a genio) · wait (segundos para pensar; cada pack trae los suyos)
     site / url (dirección que se anuncia) · textos: hook (entrada), ask (la pregunta), end (titular del cierre),
     cta (frase del cierre), extra (línea final; vacía = ninguna)
   Los packs reutilizan el contenido de los juegos: el generador de Secuencias lógicas (brain-academy), el banco de
   Problemas de Primaria, las 588 frases de la Fábrica de Frases (vía emoji-quest/palabras.js) y video-retos-datos.js. */
(async function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  const num = (k, d) => (Q.has(k) && Q.get(k) !== '' && isFinite(+Q.get(k)) ? +Q.get(k) : d);
  const LANG = (Q.get('lang') || (/\/en(\/|$)/.test(location.pathname) ? 'en' : 'es')) === 'en' ? 'en' : 'es', EN = LANG === 'en';
  const T = (es, en) => (EN ? en : es);
  const N = Math.max(1, Math.round(num('quiz', 1))), SET = num('set', 1) >= 5 ? 5 : 1, FPS = num('fps', 30);
  const host = Q.get('site') || location.host;

  /* ---------- azar con semilla ---------- */
  const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1)), pick = (r, a) => a[Math.floor(r() * a.length)];
  const shuffle = (r, a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const LV5 = [[T('FÁCIL', 'EASY'), '#51cf66'], [T('NORMAL', 'MEDIUM'), '#4dabf7'], [T('DIFÍCIL', 'HARD'), '#fcc419'], [T('EXPERTO', 'EXPERT'), '#ff922b'], [T('GENIO 🧠', 'GENIUS 🧠'), '#ff6b6b']];
  // opciones: la buena y 3 distractores distintos, en orden fijo por semilla
  function options(r, ans, cands, fmt = String) {
    const seen = new Set([fmt(ans)]), out = [];
    for (const c of cands) { const s = fmt(c); if (c == null || seen.has(s) || out.length >= 3) continue; seen.add(s); out.push(s); }
    const opts = shuffle(r, [fmt(ans)].concat(out));
    return { opts, ok: opts.indexOf(fmt(ans)) };
  }
  // operación con prioridad (× y ÷ antes que + y −): pasos explicados y el resultado «de izquierda a derecha» (el fallo típico)
  function calc(tk) {
    const steps = [], v = tk.slice();
    for (let i = 1; i < v.length; i += 2) if (v[i] === '×' || v[i] === '÷') { const a = v[i - 1], b = v[i + 1], c = v[i] === '×' ? a * b : a / b; steps.push(a + ' ' + v[i] + ' ' + b + ' = ' + c); v.splice(i - 1, 3, c); i -= 2; }
    let acc = v[0]; for (let i = 1; i < v.length; i += 2) { const b = v[i + 1], c = v[i] === '+' ? acc + b : acc - b; steps.push(acc + ' ' + v[i] + ' ' + b + ' = ' + c); acc = c; }
    let lr = tk[0]; for (let i = 1; i < tk.length; i += 2) { const b = tk[i + 1]; lr = tk[i] === '+' ? lr + b : tk[i] === '−' ? lr - b : tk[i] === '×' ? lr * b : lr / b; }
    return { val: acc, steps, lr, prio: tk.some((x, i) => i % 2 && (x === '×' || x === '÷')) && tk.some((x, i) => i % 2 && (x === '+' || x === '−')) };
  }
  const nearby = (r, a) => shuffle(r, [a + 1, a - 1, a + 2, a - 2, a + 10, a - 10, a + 5, a - 5, a * 2, Math.round(a / 2)]).filter((x) => x >= 0 && x !== a);

  /* ---------- packs ---------- */
  const PACKS = {};

  // Secuencias lógicas: el MISMO generador que el juego (games/secuencias.html, bloque GEN_START…GEN_END)
  PACKS.secuencias = {
    langs: ['es', 'en'], url: 'secuencias-logicas', icon: '🧠', title: T('Secuencias lógicas', 'Logic sequences'), wait: [10, 6], count: 999,
    hook: [T('SOLO EL 3 % LO ACIERTA', 'ONLY 3% GET THIS RIGHT'), T('5 SECUENCIAS · ¿HASTA DÓNDE LLEGAS?', '5 SEQUENCES · HOW FAR CAN YOU GO?')],
    ask: T('¿QUÉ VA DESPUÉS? 🤔', 'WHAT COMES NEXT? 🤔'), extra: T('Juegos de lógica para todas las edades', 'Logic games for all ages'),
    tags: T('#logica #acertijo #retomental #testdeinteligencia #secuencias #fyp', '#logic #puzzle #brainteaser #iqtest #riddle #fyp'),
    teaser: T('¿Qué va después?', 'What comes next?'),
    async init() {
      const src = await (await fetch('brain-academy/games/secuencias.html', { cache: 'no-store' })).text();
      const code = src.slice(src.indexOf('/*GEN_START*/'), src.indexOf('/*GEN_END*/'));
      const box = { D: 0 };
      this.G = new Function('H', code + '\nreturn { genQuestion, key, mkRand, hashSeed, shuf };')({ D: () => box.D }); this.box = box;
    },
    levels: () => (SET === 5 ? [1, 3, 5, 7, 9].map((D, i) => ({ p: D, label: LV5[i][0], color: LV5[i][1] })) : [{ p: 1.6 + ((N - 1) * 0.37) % 7.6 }]),
    gen(r, D, i, salt) {
      const { genQuestion, key, mkRand, hashSeed, shuf } = this.G, level = N * 7 + i + salt * 100;
      for (let q = 0; q < 40; q++) {
        this.box.D = D; const G = genQuestion(9, level, q + i * 41);
        const b = G.blanks[0], seq = G.seq.slice(0, b + 1);
        if (seq.length > 14 || seq.length < 3) continue;
        const ans = G.seq[b], others = G.choices.filter((t) => key(t) !== key(ans));
        if (!others.length) continue;
        const rr2 = mkRand(hashSeed(level, q, 31337, i));
        const opts = shuf(rr2, [ans].concat(shuf(rr2, others).slice(0, 3)));
        const P = { kind: 'seq', type: G.type, seq, b, ans, opts, ok: opts.findIndex((t) => key(t) === key(ans)), meta: G.meta || {} };
        P.rule = seqRule(P); P.answer = ans.t === 'e' || ans.t === 's' ? ans.v || ans.e : ans.t === 'g' ? ans.n : ans.v;
        return P;
      }
      return null;
    },
  };
  const sgn = (v) => (v >= 0 ? '+' + v : '−' + Math.abs(v));
  function seqRule(P) {
    const m = P.meta, t = P.type, v = m.v, i = P.b;
    if (t.startsWith('rep')) return { text: T('Este bloque se repite una y otra vez:', 'This block repeats again and again:'), toks: P.seq.slice(0, m.p) };
    switch (t) {
      case 'groups': { const d = m.arith[1] - m.arith[0]; return { text: T('Cada grupo tiene ' + Math.abs(d) + (d > 0 ? ' más' : ' menos') + ' que el anterior.', 'Each group has ' + Math.abs(d) + (d > 0 ? ' more' : ' fewer') + ' than the one before.'), lines: [m.arith[i - 1] + ' ' + sgn(d) + ' = ' + m.arith[i]] }; }
      case 'countNum': { const d = v[1] - v[0]; return { text: T('Cada número es el anterior ' + sgn(d) + '.', 'Each number is the one before ' + sgn(d) + '.'), lines: [v[i - 1] + ' ' + sgn(d) + ' = ' + v[i]] }; }
      case 'letters': { const d = Math.abs(v[1] - v[0]); return { text: d === 1 ? T('Las letras siguen el abecedario, una detrás de otra.', 'The letters follow the alphabet, one after another.') : T('Las letras van saltando de ' + d + ' en ' + d + ' en el abecedario.', 'The letters jump ' + d + ' places along the alphabet.') }; }
      case 'diffPat': { const a = v[1] - v[0], c = v[2] - v[1]; return { text: T('Los saltos se alternan: ' + sgn(a) + ' y ' + sgn(c) + '.', 'The jumps take turns: ' + sgn(a) + ' then ' + sgn(c) + '.'), lines: [v[i - 1] + ' ' + sgn(v[i] - v[i - 1]) + ' = ' + v[i]] }; }
      case 'secondDiff': { const ds = []; for (let k = 1; k <= Math.min(i, 5); k++) ds.push(sgn(v[k] - v[k - 1])); return { text: T('Los saltos crecen cada vez: ' + ds.join(', ') + '…', 'The jumps keep growing: ' + ds.join(', ') + '…'), lines: [v[i - 1] + ' ' + sgn(v[i] - v[i - 1]) + ' = ' + v[i]] }; }
      case 'geometric': { const r = v[1] / v[0]; return { text: T('Cada número se multiplica por ' + r + '.', 'Each number is multiplied by ' + r + '.'), lines: [v[i - 1] + ' × ' + r + ' = ' + v[i]] }; }
      case 'interleave': { const s1 = v[2] - v[0], s2 = v[3] - v[1]; return { text: T('Dos filas se turnan: una va ' + sgn(s1) + ' y la otra ' + sgn(s2) + '.', 'Two rows take turns: one goes ' + sgn(s1) + ', the other ' + sgn(s2) + '.'), lines: [v[i - 2] + ' ' + sgn(v[i] - v[i - 2]) + ' = ' + v[i]] }; }
      case 'squares': { const n = Math.round(Math.sqrt(v[i])); return { text: T('Son números al cuadrado: 1×1, 2×2, 3×3…', 'They are square numbers: 1×1, 2×2, 3×3…'), lines: [n + ' × ' + n + ' = ' + v[i]] }; }
      case 'fibo': return { text: T('Cada número es la suma de los dos anteriores.', 'Each number is the sum of the two before it.'), lines: [v[i - 2] + ' + ' + v[i - 1] + ' = ' + v[i]] };
      case 'cycle': return { text: T('Gira ' + m.k + (m.k === 1 ? ' paso' : ' pasos') + ' cada vez' + (m.dir < 0 ? ', hacia atrás.' : '.'), 'It turns ' + m.k + (m.k === 1 ? ' step' : ' steps') + ' each time' + (m.dir < 0 ? ', backwards.' : '.')) };
      case 'mirror': return { text: T('Es un espejo: la segunda mitad es la primera al revés.', 'It\'s a mirror: the second half is the first one reversed.') };
      case 'mixed': return { text: T('Se alternan dos patrones: los dibujos se repiten y los números van ' + sgn(m.step) + '.', 'Two patterns take turns: the pictures repeat and the numbers go ' + sgn(m.step) + '.') };
    }
    return { text: '' };
  }

  // Policubos: «¿cuántos cubos hay?», también los escondidos (mismo generador que games/policubos.html)
  const CUBECOL = ['#ff6b9d', '#4fb8ff', '#3cc36e', '#ffd93d', '#9b5cff', '#ff9f43'];
  PACKS.policubos = {
    langs: ['es', 'en'], url: 'policubos', icon: '🧊', title: T('Policubos', 'Cube count'), wait: [10, 7], count: 999,
    hook: [T('SOLO EL 5 % CUENTA BIEN LOS CUBOS 🧊', 'ONLY 5% COUNT THE CUBES RIGHT 🧊'), T('5 TORRES DE CUBOS · ¿HASTA DÓNDE LLEGAS?', '5 CUBE TOWERS · HOW FAR CAN YOU GO?')],
    ask: T('¿CUÁNTOS CUBOS HAY? 🤔', 'HOW MANY CUBES? 🤔'), extra: T('Juegos de lógica y mates para todas las edades', 'Logic and maths games for all ages'),
    tags: T('#acertijo #retomental #cubos #visual #logica #testdeinteligencia #fyp', '#puzzle #brainteaser #cubes #iqtest #riddle #visualpuzzle #fyp'),
    teaser: T('¿Cuántos cubos hay? Cuenta también los que no se ven.', 'How many cubes? Count the hidden ones too.'),
    question: T('¿Cuántos cubos hay?', 'How many cubes are there?'),
    titles: [T('¿Cuántos cubos hay? 🧊🤔', 'How many cubes are there? 🧊🤔'), T('Solo el 5 % cuenta bien los cubos 🧊', 'Only 5% count these cubes right 🧊'),
      T('🧊 Cuenta los cubos… ¡también los escondidos! 👀', '🧊 Count the cubes… hidden ones too! 👀'), T('¿Cuántos cubos ves? 🤯 La mayoría falla', 'How many cubes do you see? 🤯 Most people fail'),
      T('Test visual 🧠 ¿Cuántos cubos hay? #shorts', 'Visual test 🧠 How many cubes? #shorts'), T('🧊 ¿Cuántos cubos? Comenta tu número 👇', '🧊 How many cubes? Comment your number 👇')],
    levels: () => (SET === 5 ? [1.5, 3, 5, 7, 9].map((D, i) => ({ p: D, label: LV5[i][0], color: LV5[i][1] })) : [{ p: 2.5 + ((N - 1) * 0.37) % 3 }]),
    gen(r, D) {
      const rows = D < 3 ? 1 : D < 6 ? 2 : 3, cols = D < 1.5 ? 3 : D < 4 ? ri(r, 3, 4) : ri(r, 3, 5), maxF = D < 2 ? 3 : 4;
      const h = []; for (let y = 0; y < rows; y++) { h.push([]); for (let x = 0; x < cols; x++) { const below = y ? h[y - 1][x] : 0; h[y].push(below + ri(r, 1, y ? 2 : maxF)); } }
      const ans = h.flat().reduce((a, b) => a + b, 0), front = h[0].reduce((a, b) => a + b, 0);
      // los que se ven (alguna cara a la vista): el fallo típico es contar solo esos
      let vis = 0; for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) for (let z = 0; z < h[y][x]; z++) { const top = z === h[y][x] - 1, fr = y === 0 || h[y - 1][x] <= z, rt = x === cols - 1 || h[y][x + 1] <= z; if (top || fr || rt) vis++; }
      if (rows > 1 && vis === ans && D > 4) return null;   // queremos alguno escondido
      const o = options(r, ans, [vis, front, ans + 1, ans - 1, ans + 2, ans - 2, h.flat().length]);
      const lines = [h.flat().join(' + ') + ' = ' + ans];
      return { kind: 'card', cubes: { h, rows, cols, color: pick(r, CUBECOL) }, opts: o.opts, ok: o.ok, answer: String(ans),
        rule: { text: rows > 1 ? T('Los cubos no flotan: hay cubos escondidos debajo. Suma cada columna:', "Cubes don't float: there are hidden ones underneath. Add up each column:") : T('Suma cada columna:', 'Add up each column:'), lines } };
    },
  };

  // Datos de palabras de Brain Academy (palabra intrusa, lectura relámpago)
  let WORDS = null; const loadWords = async () => { if (!WORDS) WORDS = await (await fetch('brain-academy/data/words.json', { cache: 'no-store' })).json(); return WORDS[LANG] || WORDS.es; };

  // ¿Quién fue?: solo uno miente (o solo uno dice la verdad); el mismo generador que games/quienfue.html
  const SUS = [['🦊', 'el zorro', 'the fox'], ['🐱', 'el gato', 'the cat'], ['🐻', 'el oso', 'the bear'], ['🐰', 'el conejo', 'the rabbit'], ['🐵', 'el mono', 'the monkey'], ['🐷', 'el cerdo', 'the pig']].map(([e, es, en]) => ({ e, n: T(es, en) }));
  const MYS = [['🎂', '¡Alguien se comió la tarta!', 'Someone ate the cake!'], ['🏺', '¡Alguien rompió el jarrón!', 'Someone broke the vase!'], ['🍪', '¡Alguien cogió las galletas!', 'Someone took the cookies!'], ['🎈', '¡Alguien explotó el globo!', 'Someone popped the balloon!'], ['🎨', '¡Alguien pintó la pared!', 'Someone painted the wall!']].map(([e, es, en]) => ({ e, t: T(es, en) }));
  const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
  const SAYQ = { me: () => T('Fui yo.', 'It was me.'), notme: () => T('Yo no fui.', "It wasn't me."), acc: (x) => T('Fue ' + x + '.', 'It was ' + x + '.'), clr: (x) => T('No fue ' + x + '.', "It wasn't " + x + '.') };
  const isTrueQ = (st, i, c) => (st.t === 'me' ? c === i : st.t === 'notme' ? c !== i : st.t === 'acc' ? c === st.x : c !== st.x);
  PACKS.quienfue = {
    langs: ['es', 'en'], url: 'quien-fue', icon: '🕵️', title: T('¿Quién fue?', 'Who did it?'), wait: [15, 12], count: 999,
    hook: [T('SOLO EL 2 % PILLA AL CULPABLE 🕵️', 'ONLY 2% CATCH THE CULPRIT 🕵️'), T('5 MISTERIOS · ¿HASTA DÓNDE LLEGAS?', '5 MYSTERIES · HOW FAR CAN YOU GO?')],
    ask: T('¿QUIÉN FUE? 🕵️', 'WHO DID IT? 🕵️'), extra: T('Juegos de lógica para todas las edades', 'Logic games for all ages'),
    tags: T('#acertijo #logica #misterio #quienfue #retomental #detective #fyp', '#riddle #logic #mystery #whodunit #brainteaser #detective #fyp'),
    teaser: T('Solo uno miente. ¿Quién fue?', 'Only one is lying. Who did it?'), question: T('¿Quién fue?', 'Who did it?'),
    titles: [T('🕵️ Solo uno miente… ¿quién fue?', '🕵️ Only one is lying… who did it?'), T('¿Quién se comió la tarta? 🎂 Solo uno miente', 'Who ate the cake? 🎂 Only one is lying'), T('Acertijo de lógica 🕵️ ¿Pillas al culpable?', 'Logic riddle 🕵️ Can you catch the culprit?'),
      T('El 98 % se equivoca de culpable 🤯', '98% pick the wrong culprit 🤯'), T('¿Quién fue? 🤔 Comenta tu sospechoso 👇', 'Who did it? 🤔 Comment your suspect 👇'), T('Misterio rápido 🔎 ¿Quién miente?', 'Quick mystery 🔎 Who is lying?')],
    levels: () => (SET === 5 ? [2, 4, 6, 7, 9].map((D, i) => ({ p: D, label: LV5[i][0], color: LV5[i][1] })) : [{ p: 2 + ((N - 1) * 0.37) % 6 }]),
    gen(r, D) {
      const n = D < 6 ? 3 : 4, mode = D < 4 ? 'oneLie' : pick(r, ['oneLie', 'oneTruth']);
      for (let k = 0; k < 800; k++) {
        const sus = shuffle(r, SUS).slice(0, n);
        const st = sus.map((_, i) => { const t = pick(r, ['me', 'notme', 'acc', 'clr', 'acc', 'clr']); let x = i; if (t === 'acc' || t === 'clr') { do { x = ri(r, 0, n - 1); } while (x === i); } return { t, x }; });
        const valid = []; for (let c = 0; c < n; c++) { const tr = st.filter((q, i) => isTrueQ(q, i, c)).length; if (mode === 'oneLie' ? n - tr === 1 : tr === 1) valid.push(c); }
        if (valid.length !== 1) continue;
        const c = valid[0], mys = pick(r, MYS), say = (i) => SAYQ[st[i].t](sus[st[i].x] ? sus[st[i].x].n : '');
        const opts = sus.map((q) => q.e + ' ' + cap(q.n)), lines = st.map((q, i) => (isTrueQ(q, i, c) ? '✅ ' : '❌ ') + sus[i].e + ' ' + say(i));
        return { kind: 'card', text: mys.e + ' ' + mys.t, note: mode === 'oneLie' ? T('🤥 Solo UNO miente', '🤥 Only ONE is lying') : T('😇 Solo UNO dice la verdad', '😇 Only ONE tells the truth'),
          says: sus.map((q, i) => [q.e, say(i)]), opts, ok: c, answer: opts[c],
          rule: { text: T('Fue ' + sus[c].n + ' ' + sus[c].e, 'It was ' + sus[c].n + ' ' + sus[c].e), lines } };
      }
      return null;
    },
  };

  // El número escondido: «8 × ? − 5 = 27» (de sumas sencillas a dos pasos)
  PACKS.escondido = {
    langs: ['es', 'en'], url: 'el-numero-escondido', icon: '🙈', title: T('El número escondido', 'The hidden number'), wait: [10, 7], count: 999,
    hook: [T('EL 90 % NO DA CON EL NÚMERO 🙈', '90% CAN\'T FIND THE NUMBER 🙈'), T('5 NÚMEROS ESCONDIDOS · ¿HASTA DÓNDE LLEGAS?', '5 HIDDEN NUMBERS · HOW FAR CAN YOU GO?')],
    ask: T('¿QUÉ NÚMERO FALTA? 🤔', 'WHAT\'S THE MISSING NUMBER? 🤔'), extra: T('Cálculo mental para todas las edades', 'Mental maths for all ages'),
    tags: T('#matematicas #calculomental #acertijo #retomental #numeros #fyp', '#math #mentalmath #puzzle #brainteaser #numbers #fyp'),
    teaser: T('¿Qué número se ha escondido?', 'Which number is hiding?'), question: T('¿Qué número falta?', 'What is the missing number?'),
    titles: (P) => [T('🙈 ¿Qué número falta? ', '🙈 What is the missing number? ') + P.expr, T('Cálculo mental 🧠 ', 'Mental maths 🧠 ') + P.expr, T('El 90 % falla este número escondido 🤯 ', '90% get this hidden number wrong 🤯 ') + P.expr,
      T('¿Lo sacas de cabeza? 🙈 ', 'Can you do it in your head? 🙈 ') + P.expr, T('Reto de mates 🔢 ', 'Maths challenge 🔢 ') + P.expr + T(' ¿Qué número es?', ' Which number is it?'), T('Sin calculadora 😏 ', 'No calculator 😏 ') + P.expr],
    levels: () => (SET === 5 ? [1, 3, 5, 7, 9].map((D, i) => ({ p: D, label: LV5[i][0], color: LV5[i][1] })) : [{ p: 3 + ((N - 1) * 0.37) % 6 }]),
    gen(r, D) {
      let expr, ans, steps, dis;

    const dx = u * 0.5, dy = u * 0.5, Wd = C.cols * u + C.rows * dx, x0 = cx - Wd / 2;
    const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }, c0 = rgb(C.color);
    const light = 'rgb(' + c0.map((v) => Math.round(v + (255 - v) * 0.45)) + ')', dark = 'rgb(' + c0.map((v) => Math.round(v * 0.72)) + ')';
    let k = 0;
    for (let y = C.rows - 1; y >= 0; y--) for (let x = 0; x < C.cols; x++) for (let z = 0; z < C.h[y][x]; z++) {
      const a = clamp((tt - S.t0 - 0.4 - k++ * 0.035) / 0.18, 0, 1); if (a <= 0) continue;
      const X = x0 + x * u + y * dx, Y = by - (z + 1) * u - y * dy - (1 - back(a)) * u * 0.8;
      ctx.save(); ctx.globalAlpha = a; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1.5, u * 0.045); ctx.strokeStyle = '#2d2a4a';
      const poly = (pts, fill) => { ctx.beginPath(); pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py))); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
      poly([[X, Y], [X + u, Y], [X + u, Y + u], [X, Y + u]], C.color);
      poly([[X, Y], [X + dx, Y - dy], [X + u + dx, Y - dy], [X + u, Y]], light);
      poly([[X + u, Y], [X + u + dx, Y - dy], [X + u + dx, Y + u - dy], [X + u, Y + u]], dark);
      ctx.restore();
    }
    if (solved) { const a = clamp((tt - S.tR - 0.6) / 0.3, 0, 1); ctx.save(); ctx.globalAlpha = a;
      for (let y = C.rows - 1; y >= 0; y--) for (let x = 0; x < C.cols; x++) { const hh = C.h[y][x], X = x0 + x * u + y * dx + u / 2 + dx / 2, Y = by - hh * u - y * dy - dy / 2;
        ctx.fillStyle = '#1b1033'; ctx.beginPath(); ctx.arc(X, Y, u * 0.24, 0, 6.3); ctx.fill(); txt(String(hh), X, Y + 1, u * 0.3, '#ffd43b'); }
      ctx.restore(); }
  }
  // dirección del juego arriba, siempre a la vista, con latido y brillo
  function urlPill(tt) {
    const m = Math.min(W, H), fz = m * 0.034, label = '🎮 ' + URLT.replace(/^https?:\/\//, '');
    ctx.save(); ctx.font = '700 ' + Math.round(fz) + 'px ' + FF + ',' + EF; const w = Math.min(W * 0.9, ctx.measureText(label).width + fz * 1.6), h = fz * 1.75, y = H * 0.036 + h / 2;
    const ph = (tt % 1.6) / 1.6, beat = ph < 0.1 ? Math.sin(ph / 0.1 * Math.PI) : ph > 0.16 && ph < 0.26 ? 0.6 * Math.sin((ph - 0.16) / 0.1 * Math.PI) : 0;
    ctx.translate(W / 2, y); ctx.scale(1 + 0.06 * beat, 1 + 0.06 * beat);
    ctx.shadowColor = 'rgba(255,212,59,' + (0.35 + 0.4 * beat) + ')'; ctx.shadowBlur = fz * (0.6 + beat);
    const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, '#ffe066'); g.addColorStop(1, '#fab005'); ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.shadowBlur = 0;
    // brillo que cruza la pastilla cada 2,4 s
    const sp = ((tt % 2.4) / 2.4) * 2.2 - 0.6; if (sp > -0.4 && sp < 1.4) { ctx.save(); rr(-w / 2, -h / 2, w, h, h / 2); ctx.clip(); const sx = -w / 2 + sp * w, sg = ctx.createLinearGradient(sx - h, 0, sx + h, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,.75)'); sg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = sg; ctx.transform(1, 0, -0.4, 1, 0, 0); ctx.fillRect(sx - h, -h, h * 2, h * 2); ctx.restore(); }
    ctx.restore();
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(1 + 0.06 * beat, 1 + 0.06 * beat); txt(label, 0, 1, fz, '#1b1033', { mw: w - fz, f: FF + ',' + EF }); ctx.restore();
  }
  function drawCard(S, tt) {
    const P = S.P, land = W > H, m = Math.min(W, H), qy = SET === 5 ? H * 0.19 : H * 0.165;
    header(S, tt, qy);
    const bw = land ? Math.min(W * 0.62, 760) : Math.min(W * 0.92, 700), M = measureCard(P, bw), x0 = W / 2 - bw / 2, y0 = land ? H * 0.25 : (SET === 5 ? H * 0.245 : H * 0.225);
    const solved = tt >= S.tR + 0.6, a = back((tt - S.t0 - 0.25) / 0.35);
    if (a > 0) { ctx.save(); ctx.translate(W / 2, y0 + M.h / 2); ctx.scale(a, a); ctx.translate(-W / 2, -(y0 + M.h / 2));
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 6; const g = ctx.createLinearGradient(0, y0, 0, y0 + M.h); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#efe9ff'); ctx.fillStyle = g; rr(x0, y0, bw, M.h, 26); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      if (solved) { ctx.lineWidth = 5; ctx.strokeStyle = '#40c057'; rr(x0, y0, bw, M.h, 26); ctx.stroke(); }
      drawCardBody(P, M, x0, y0, bw, tt, S, solved); ctx.restore(); }
    const cardB = y0 + M.h, TR = m * (SET === 5 ? 0.065 : 0.072);
    // opciones: 2 × 2 en vertical, en fila en horizontal
    const n = P.opts.length, cols = land ? n : 2, rowsO = Math.ceil(n / cols), gap = m * 0.035;
    const ow = Math.min(land ? (W * 0.9 - gap * (cols - 1)) / cols : (W * 0.9 - gap) / 2, 340), oh = m * (land ? 0.11 : 0.14);
    const oy0 = land ? Math.min(H - oh - 20, cardB + 24) : Math.min(H * 0.86 - rowsO * (oh + gap), cardB + TR * 2.6 + 24);
    const ao = clamp((tt - S.tOpt) / 0.35, 0, 1), ofade = 1 - clamp((tt - S.tR - 1.3) / 0.35, 0, 1);
    if (ao > 0 && ofade > 0) P.opts.forEach((o, k) => {
      const r2 = Math.floor(k / cols), c2 = k % cols, x = W / 2 + (c2 - (cols - 1) / 2) * (ow + gap) - ow / 2, y = oy0 + r2 * (oh + gap), ok = k === P.ok, rev = tt >= S.tR;
      const sc = back(clamp(ao * 1.4 - k * 0.12, 0, 1)) * (rev && ok ? 1 + 0.08 * Math.sin((tt - S.tR) * 12) * Math.max(0, 1 - (tt - S.tR)) : 1);
      ctx.save(); ctx.globalAlpha = (rev && !ok ? 0.3 : 1) * ofade; ctx.translate(x + ow / 2, y + oh / 2); ctx.scale(sc, sc); ctx.translate(-ow / 2, -oh / 2);
      tile(0, 0, oh, Object.assign({ w: ow }, rev && ok ? { c1: '#e9fff1', c2: '#b2f2bb', ring: '#40c057' } : {}));
      ctx.fillStyle = rev && ok ? '#2f9e44' : '#7048e8'; ctx.beginPath(); ctx.arc(oh * 0.42, oh / 2, oh * 0.26, 0, 6.3); ctx.fill(); txt('ABCD'[k], oh * 0.42, oh / 2 + 1, oh * 0.3, '#fff');
      const isE = /\p{Extended_Pictographic}/u.test(o), fz = oh * (o.length > 12 ? 0.36 : 0.44);
      txt(o, oh * 0.78 + (ow - oh * 0.78) / 2, oh / 2 + 2, fz, rev && ok ? '#2b8a3e' : '#3b2a7a', { mw: ow - oh * 0.95, f: isE ? FF + ',' + EF : FF });
      if (rev && !ok) { ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = oh * 0.07; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ow * 0.2, oh / 2); ctx.lineTo(ow * 0.92, oh / 2); ctx.stroke(); }
      ctx.restore();
    });
    if (tt >= S.tQ && tt < S.tUp) { const left = S.tUp - tt, tight = !land && oy0 - cardB < TR * 2.4;   // si no cabe entre la tarjeta y las opciones, en la esquina de la tarjeta
      timer(land ? W * 0.9 : tight ? x0 + bw - TR * 0.7 : W / 2, land ? H * 0.16 : tight ? y0 + TR * 0.25 : Math.min(cardB + TR * 1.3 + 12, oy0 - TR * 1.3), tight ? TR * 0.85 : TR, left, left / WAIT); }
    commentsLine(S, tt, land);
    ruleBox(P.rule, cardB + (land ? 14 : 26), tt, S.tR + 1.4, land);
  }

  function outro(tt) {
    const k = clamp(tt / 0.4, 0, 1), m = Math.min(W, H);
    ctx.save(); ctx.globalAlpha = 0.93 * k; ctx.fillStyle = '#140b38'; ctx.fillRect(0, 0, W, H); ctx.restore();
    const e = back((tt - 0.1) / 0.5); ctx.save(); ctx.globalAlpha = k; ctx.translate(W / 2, H * 0.27); ctx.scale(e, e); ctx.rotate(Math.sin(tt * 3) * 0.08); emo(PACK.icon, 0, 0, m * 0.24); ctx.restore();
    caption(words(END), W / 2, H * 0.43, m * (END.length > 26 ? 0.06 : 0.075), 0.3, tt, { per: 0.12, color: (i) => (/\/5|\d/.test(words(END)[i]) ? '#ffd43b' : '#fff') });
    if (tt > 1.2 && CTA) { const a = clamp((tt - 1.2) * 3, 0, 1); ctx.save(); ctx.globalAlpha = a; txt(CTA, W / 2, H * 0.55, m * 0.045, '#e5dbff', { w: 600, mw: W * 0.9 }); ctx.restore(); }
    if (tt > 1.6) { const e3 = back((tt - 1.6) / 0.4), bob = 1 + 0.04 * Math.sin(tt * 6); ctx.save(); ctx.translate(W / 2, H * 0.65); ctx.scale(e3 * bob, e3 * bob);
      ctx.font = '700 ' + Math.round(m * 0.052) + 'px ' + FF; const w = Math.min(W * 0.94, ctx.measureText(URLT).width + m * 0.12); ctx.fillStyle = '#ffd43b'; rr(-w / 2, -m * 0.065, w, m * 0.13, m * 0.065); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(W / 2, H * 0.65); ctx.scale(e3 * bob, e3 * bob); txt(URLT, 0, 2, m * 0.052, '#1b1033', { mw: W * 0.86 }); ctx.restore(); }
    if (tt > 2.3 && EXTRA) { ctx.save(); ctx.globalAlpha = clamp((tt - 2.3) * 3, 0, 1); txt(EXTRA, W / 2, H * 0.76, m * 0.04, 'rgba(255,255,255,.8)', { w: 600, mw: W * 0.9 }); ctx.restore(); }
  }

  function frame(tt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const S = segs.find((s) => tt >= s.t0 && tt < s.t1) || (tt < segs[0].t0 ? null : segs[segs.length - 1]);
    background(tt, S && tt >= S.tUp && tt < S.tR);
    if (tt < segs[0].t0 + 0.3) {   // entrada: gancho
      const k = 1 - clamp((tt - (segs[0].t0 - 0.2)) / 0.4, 0, 1), hw = words(HOOK);
      ctx.save(); ctx.globalAlpha = k; emo(PACK.icon, W / 2, H * 0.27, Math.min(W, H) * 0.18 * back((tt - 0.05) / 0.4)); caption(hw, W / 2, H * 0.43, Math.min(W, H) * 0.08, 0.15, tt, { per: 0.14, color: (i) => (/\d/.test(hw[i]) ? '#ffd43b' : '#fff') }); ctx.restore();
    }
    if (S && tt < TO) (S.P.kind === 'seq' ? drawSeq : drawCard)(S, tt);
    if (tt < TO) urlPill(tt);
    if (SET === 5) for (const s2 of segs) { const d = tt - s2.t0; if (s2.i > 0 && d >= -0.3 && d < 0.3) { ctx.fillStyle = 'rgba(255,255,255,' + (0.5 - Math.abs(d) * 1.6) + ')'; ctx.fillRect(0, 0, W, H); } }
    if (S && tt >= S.tUp && tt < S.tUp + 0.35) { ctx.fillStyle = 'rgba(255,80,80,' + (0.5 - (tt - S.tUp) * 1.4) + ')'; ctx.fillRect(0, 0, W, H); }
    if (tt >= TO) outro(tt - TO);
  }

  /* ---------- interfaz de grabación ---------- */
  const total = Math.round(DUR * FPS); let f = 0;
  const URLFULL = /^https?:/.test(URLT) ? URLT : 'https://' + URLT;
  const capText = SET === 5
    ? PACK.icon + ' ' + T('5 retos de ' + PACK.title.toLowerCase() + ', de fácil a genio. ¿Hasta dónde llegas? Comenta tu nota /5 👇', '5 ' + PACK.title.toLowerCase() + ' puzzles, from easy to genius. How far can you go? Comment your score /5 👇')
    : PACK.icon + ' ' + PACK.teaser + ' ' + T('La respuesta, al final 👀 ¡Comenta la tuya antes!', 'Answer at the end 👀 Comment yours first!');
  /* ---------- textos para publicar: .title (con emojis) y .descrip (pregunta, opciones, respuesta abajo y tags) ---------- */
  const SZ = T(['pequeño', 'mediano', 'grande'], ['small', 'medium', 'big']);
  const tokTxt = (tk) => (!tk ? '' : tk.t === 'e' ? tk.v : tk.t === 'n' || tk.t === 'l' ? String(tk.v) : tk.t === 's' ? tk.e + ' ' + SZ[tk.s] : tk.t === 'g' ? (tk.n <= 6 ? tk.e.repeat(tk.n) : tk.n + '×' + tk.e) : tk.t === 'sep' ? ' | ' : '');
  const isPic = (tk) => tk.t === 'e' || tk.t === 'sep' || (tk.t === 'g' && tk.n <= 3);
  const seqLine = (P) => { const toks = P.seq.slice(0, P.b), pic = toks.every(isPic); return toks.map(tokTxt).join(pic ? '' : ', ') + (pic ? '' : ',') + ' ❓'; };
  const pickT = (arr) => arr[hash(PK + '|title|' + N + '|' + SET) % arr.length];
  function cardTexts() {
    const L5 = ['A', 'B', 'C', 'D'], strip = (x) => String(x).replace(/\s*[👇🤔]+\s*$/u, '');
    // el enunciado en texto: lo que sale en la tarjeta (frase, operación, declaraciones, ejemplos…)
    const body = (P) => [P.text, P.note, ...(P.says || []).map(([e, x]) => e + ' «' + x + '»'), ...(P.alien || []).map(([ph, pic]) => '👽 ' + ph + ' = ' + (pic || '❓')), P.expr].filter(Boolean).join('\n');
    const qBlock = (P, i) => (SET === 5 ? (i + 1) + '. ' : '') + (body(P) ? body(P) + '\n' : '') + (PACK.question || strip(ASK)) + '\n' + P.opts.map((o, k) => L5[k] + ') ' + o).join('   ');
    const aBlock = (P, i) => (SET === 5 ? (i + 1) + '. ' : '') + '✅ ' + L5[P.ok] + ') ' + P.answer + (P.rule && P.rule.text ? ' — ' + P.rule.text + (P.rule.lines && P.rule.lines.length ? '\n' + P.rule.lines.join('\n') : '') : '');
    const title = SET === 5 ? pickT([PACK.icon + ' ' + strip(PACK.hook[1]) + ' 🔥', T('¿Cuántas aciertas? 5 retos de fácil a genio 🤯', 'How many can you get? 5 puzzles from easy to genius 🤯')]) : pickT(typeof PACK.titles === 'function' ? PACK.titles(QS[0]) : PACK.titles);
    const desc = PACK.icon + ' ' + (SET === 5 ? T('5 retos, de fácil a genio. ¿Cuántos aciertas?', '5 puzzles, from easy to genius. How many can you get?') : PACK.teaser) + '\n\n' + QS.map(qBlock).join('\n\n') + '\n\n' +
      T('👇 Comenta tu respuesta antes de mirar 👇', '👇 Comment your answer before you look 👇') + '\n' + '.\n'.repeat(8) + T('RESPUESTA', 'ANSWER') + (SET === 5 ? 'S' : '') + ':\n' + QS.map(aBlock).join('\n\n') +
      '\n\n' + CTA + ': ' + URLFULL + '\n\n' + PACK.tags + ' #shorts\n';
    return { postTitle: title, postDesc: desc };
  }
  function postTexts() {
    if (PK !== 'secuencias') return PACK.titles ? cardTexts() : {};
    const L5 = ['A', 'B', 'C', 'D'];
    const qBlock = (P, i) => (SET === 5 ? (i + 1) + '. ' : '') + T('¿Qué va después? ', 'What comes next? ') + seqLine(P) + '\n' + P.opts.map((o, k) => L5[k] + ') ' + tokTxt(o)).join('   ');
    const aBlock = (P, i) => (SET === 5 ? (i + 1) + '. ' : '') + '✅ ' + L5[P.ok] + ') ' + tokTxt(P.ans) + (P.rule && P.rule.text ? ' — ' + P.rule.text.replace(/:$/, '') + (P.rule.toks ? ': ' + P.rule.toks.map(tokTxt).join(P.rule.toks.every(isPic) ? '' : ', ') : P.rule.lines && P.rule.lines[0] ? ' (' + P.rule.lines[0] + ')' : '') : '');
    const s = seqLine(QS[0]);
    const title = SET === 5
      ? pickT(T(['🧠 5 secuencias de fácil a genio: ¿hasta dónde llegas? 🔥', '¿Cuántas aciertas? 5 secuencias lógicas 🤯 #shorts', 'Test de lógica: 5 secuencias, ¿sacas un 5/5? 🧠', 'Del 1 al 5: ¿hasta qué secuencia llegas? 👀'],
        ['🧠 5 sequences from easy to genius: how far can you go? 🔥', 'How many can you get? 5 logic sequences 🤯 #shorts', 'Logic test: 5 sequences, can you score 5/5? 🧠', '1 to 5: how far do you get? 👀']))
      : pickT(T(['Completa la secuencia: ' + s + ' 🤔', '¿Qué va después? ' + s, '🧠 Solo el 3 % lo acierta: ' + s, 'Test de lógica 🧩 ' + s + ' ¿Lo sabes?', '¿Lo ves? 👀 ' + s + ' #shorts', '🔥 Reto de lógica: ' + s],
        ['Complete the sequence: ' + s + ' 🤔', 'What comes next? ' + s, '🧠 Only 3% get this: ' + s, 'Logic test 🧩 ' + s + ' Do you know it?', 'Can you see it? 👀 ' + s + ' #shorts', '🔥 Logic challenge: ' + s]));
    const desc = (SET === 5 ? T('🧠 5 secuencias lógicas, de fácil a genio. ¿Cuántas aciertas?', '🧠 5 logic sequences, from easy to genius. How many can you get?') : '🧠 ' + T('Completa la secuencia. ¿Qué va después?', 'Complete the sequence. What comes next?')) + '\n\n' +
      QS.map(qBlock).join('\n\n') + '\n\n' + T('👇 Comenta tu respuesta antes de mirar 👇', '👇 Comment your answer before you look 👇') + '\n' + '.\n'.repeat(8) +
      T('RESPUESTA', 'ANSWER') + (SET === 5 ? T('S', 'S') : '') + ':\n' + QS.map(aBlock).join('\n') + '\n\n' + CTA + ': ' + URLFULL + '\n\n' + PACK.tags + ' #shorts\n';
    return { postTitle: title, postDesc: desc };
  }

  window.arcadeRec = {
    ready: false, fps: FPS, frames: total, quizCount: PACK.count || 999, scene: 'quiz', cues, unsupported: !SUPPORTED, langs: PACK.langs,
    info: Object.assign({ id: PK, title: PACK.title, puzzle: N, set: SET, total: PACK.count || 999, url: URLFULL, lang: LANG, langs: PACK.langs, answers: QS.map((P) => P.answer),
      caption: capText + '\n' + CTA + ': ' + URLFULL + '\n\n' + PACK.tags + '\n' }, postTexts()),
    step(n = 1) { for (let i = 0; i < n && f < total; i++) f++; frame(f / FPS); return { frame: f, done: f >= total, state: 'scene' }; },
  };
  try { await Promise.all([500, 600, 700].map((w) => document.fonts.load(w + ' 40px Fredoka'))); await document.fonts.ready; } catch (_) {}
  frame(0);
  window.arcadeRec.ready = true; document.title = 'REC_READY';
  if (!Q.has('rec')) { const t0 = performance.now(); (function loop(now) { const tt = ((now - t0) / 1000) % DUR; frame(tt); requestAnimationFrame(loop); })(t0); }
})().catch((e) => { document.title = 'ERROR'; console.error(e); });
</script></body></html>
